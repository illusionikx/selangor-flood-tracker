<!doctype html>
<meta charset="utf-8">
<title>Coverage area and map limits check</title>
<!-- Eighth runnable check in this repo. It guards the four things border.json pays for: the coverage
     box, the zoom floor, the pan limit, and which tiles the map asks for.

     **THE SHADING IS GONE SINCE 2026-09-23, AND HALF OF THIS PAGE GUARDS ITS ABSENCE.** Everything
     outside a circle used to be shaded with diagonal stripes. The repository owner replaced the
     circle with a rectangle and deleted the shading. A partial revert draws a shaded ring with no
     stripes in it, or a striped ring the ground now reaches past, and neither throws.

     Every fault here is SILENT. A box built from the whole outline holds 44 km of the Strait of
     Malacca and still draws a map. A zoom floor the pan box refuses still answers its own number to
     `getMinZoom()`. A tile level with no clip draws ground past the box on a zoom out alone. None of
     them throws, and none of them is visible in a diff.

     Run it headless. It prints its own verdict into the output box below, so there is nothing to
     look at. docs/VERIFY.md carries the command. Do not write that element's own tag into this
     comment — the reader there cuts the output out of the dumped DOM by matching it, and a second
     copy in a comment is the one it finds first. -->
<!-- **This page loads stylesheets and heat-test.html does not.** Two of the things asserted below are
     painted rather than computed: the z-index of every Leaflet pane, and the one filter each theme
     puts on its tile panes. Without these files `overlayPane` has no z-index at all and neither pane
     carries a filter. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/map.css">
<style>#map{width:900px;height:700px}</style>
<div id="map"></div>
<!-- The elements js/map.js wires at module scope. A missing one is a TypeError at import time, and
     then nothing on this page runs at all. -->
<button id="sideClose"></button>
<dialog id="pane"></dialog>
<input id="heatOpacity" type="range" min="0" max="100" value="100">
<span id="heatOpacityVal"></span>
<!-- `applyTheme()` writes this at call time. The theme block below calls `setTheme()`. -->
<meta name="theme-color" content="">
<pre id="out">running</pre>
<script>
  const out = document.getElementById('out'), log = [];
  window.say = (...a) => { log.push(a.join(' ')); out.textContent = log.join('\n'); };
  window.onerror = (m, f, l) => say('ERROR', m, 'at', f + ':' + l);
  window.onunhandledrejection = e => say('REJECT', e.reason && (e.reason.stack || e.reason.message));
</script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script type="module">
const { say } = window;
const fails = [];
const ok = (name, pass, detail) => { say((pass ? 'ok   ' : 'FAIL ') + name + '   ' + detail);
                                     if (!pass) fails.push(name); };

const settle = ms => new Promise(r => setTimeout(r, ms));

try {
  /* **The whole namespace object, never a destructured `cover`.** `cover` is an `export let` that
     border.json fills in a tick or two after this import. Destructuring snapshots the value at import
     time, which is `undefined`, and every assertion below would then read the wrong thing. A property
     read on the namespace follows the live binding. */
  const M = await import('./js/map.js');
  const { map } = M;

  /* Wait for the map to say it has stopped, never for a guessed number of milliseconds. A
     `setZoom()` that also has to travel back inside `maxBounds` runs a pan and then a zoom, and the
     pair takes longer than one animation. Measured here: a fixed 900 ms read the zoom mid-flight
     and reported a level the map was still leaving, which reads as a broken floor. The timeout is a
     backstop, so a map that never moves fails this page rather than hanging it. */
  const stopped = (ms = 4000) => new Promise(r => {
    const done = () => { map.off('moveend', done); clearTimeout(t); r(); };
    const t = setTimeout(done, ms);
    map.on('moveend', done);
  });

  // border.json is fetched at module load, so the box arrives a tick or two after the import.
  for (let i = 0; i < 60 && !M.cover; i++) await settle(100);
  ok('the coverage box lands', !!M.cover,
     M.cover ? M.cover.toBBoxString() : 'nothing after 6 s, or the fetch failed');
  if (!M.cover) throw new Error('no box, so nothing below can be measured');
  const cover = M.cover;

  // --- the shape ---------------------------------------------------------------------------------

  const geo = await (await fetch('border.json')).json();
  const land = geo.features.find(f => f.properties.t === 'land');
  ok('the file carries a land ring', !!land && !!land.geometry.coordinates[0].length,
     land ? land.geometry.coordinates[0].length + ' points' : 'no land feature');
  const pts = land.geometry.coordinates[0];

  /* **The box has to hold every point of the LAND ring, and that ring is not the whole outline.**
     `border-build.php` drops the sea boundary, so the maritime corner in the Strait of Malacca is
     outside on purpose. Reading `bounds` instead of this ring is the fault that costs the most: the
     box grows 44 km west over open water, and the map pays CARTO for tiles of it. */
  const loose = pts.filter(([x, y]) => !cover.contains(L.latLng([y, x])));
  ok('the box holds the land it was built from', loose.length === 0,
     pts.length + ' land points, ' + loose.length + ' outside');

  /* The other half of the same rule, stated the other way round. A box built from `bounds` passes the
     assertion above and fails this one. */
  ok('the box stops short of the maritime corner', cover.getWest() > geo.bounds[0],
     'box west ' + cover.getWest().toFixed(4) + ', outline west ' + geo.bounds[0].toFixed(4));

  /* **The box is TALLER than it is wide, which is the whole reason it is a rectangle.** Selangor is
     shaped that way. A circle spent 191 km on both axes to hold a state that needs 141 by 127. */
  const kmH = (cover.getNorth() - cover.getSouth()) * 110.57;
  const kmW = (cover.getEast() - cover.getWest()) * 111.32
            * Math.cos(cover.getCenter().lat * Math.PI / 180);
  ok('the box is taller than it is wide', kmH > kmW,
     kmH.toFixed(1) + ' km north to south against ' + kmW.toFixed(1) + ' km east to west');

  /* `MARGIN` in js/map.js grows the land extent on every side. With no shading left, the box edge is
     the edge of the map, so a border flush against it reads as a map that was cut off. */
  const lats = pts.map(p => p[1]), lons = pts.map(p => p[0]);
  ok('the box carries a margin past the land',
     cover.getSouth() < Math.min(...lats) && cover.getNorth() > Math.max(...lats)
     && cover.getWest() < Math.min(...lons) && cover.getEast() > Math.max(...lons),
     'land ' + Math.min(...lons).toFixed(4) + ',' + Math.min(...lats).toFixed(4) + ' to '
     + Math.max(...lons).toFixed(4) + ',' + Math.max(...lats).toFixed(4));

  const has = ll => cover.contains(L.latLng(ll));
  ok('Shah Alam is inside', has([3.073, 101.518]), 'the state capital');
  ok('Kuala Lumpur is inside', has([3.139, 101.687]), 'an enclave of Selangor');
  ok('Putrajaya is inside', has([2.926, 101.696]), 'the second enclave');
  ok('Melaka is outside', !has([2.190, 102.250]), 'well past the south east corner');
  /* **Bentong is INSIDE and that is not a fault.** A box that holds all of Selangor's land holds a
     piece of Pahang with it. The assertion is here the right way round on purpose: a change that
     tightens the box until Bentong falls out has almost certainly clipped Selangor itself, and that is
     the fault worth catching. */
  ok('Bentong is inside', has([3.522, 101.908]), 'Pahang, and inside the box');

  // --- nothing shades the outside ----------------------------------------------------------------

  /* Everything outside a circle was shaded from 2026-09-02 to 2026-09-23. The repository owner
     deleted it. Each of these four was a separate part of that shading, and a revert can bring back
     one without the others: the drawn path, the pane it sat in, the `<pattern>` sprite that filled it,
     and the SVG mask that stood over the ground before the tile clip replaced it. */
  for (const [what, sel] of [['mask path', '.covermask'], ['pattern sprite', '#hatchdef'],
                             ['ground mask', '.coverframe']])
    ok('there is no ' + what, !document.querySelector(sel), sel + ' found none');
  ok('there is no mask pane', !map.getPane('mask'), map.getPane('mask') ? 'found' : 'none');

  // --- the limits --------------------------------------------------------------------------------

  /* One box answers the floor and the limit, so a floor the box refuses cannot happen. Read the
     zoom AFTER the animation settles: `getZoom()` answers the target the instant `setZoom()` is
     called, so a synchronous read reports a level the map never reached. */
  const floor = map.getMinZoom();
  map.setZoom(floor - 3);
  await stopped();
  ok('the zoom floor holds', map.getZoom() === floor,
     'asked for ' + (floor - 3) + ', floor is ' + floor + ', landed on ' + map.getZoom());

  const box = map.options.maxBounds;
  ok('the floor is the box', box && floor === map.getBoundsZoom(box),
     'floor ' + floor + ', the box fits at ' + (box && map.getBoundsZoom(box)));
  ok('the pan box IS the coverage box', box && box.equals(cover),
     box ? box.toBBoxString() + ' against ' + cover.toBBoxString() : 'no maxBounds');

  map.panTo([13.75, 100.50], { animate: false });   // Bangkok
  await settle(300);
  const c = map.getCenter();
  ok('a pan cannot leave the area', box.contains(c),
     'landed on ' + c.lat.toFixed(2) + ', ' + c.lng.toFixed(2));

  // --- no drawn water ---------------------------------------------------------------------------

  /* The map drew its own sea, rivers and ponds until 2026-09-14, and the repository owner removed
     them. A revert that brings back the pane puts the water over the place names with no error. */
  ok('the map has no water pane', !map.getPane('water'), map.getPane('water') ? 'found' : 'none');

  /* A water tint and river lines stood on the dark theme from 2026-09-14 to 2026-09-15, and the
     repository owner removed both. A half revert draws blue on a few rivers and nothing throws.
     **THIS READS THE PANES, AND IT READ ONE LAYER INSIDE ONE PANE UNTIL 2026-09-18.** The tint that
     was deleted on 2026-08-27 sat on `.leaflet-tile-pane` itself. So the old assertion never
     covered the element that fault lived on, and it passed with the wall still up.
     **The dark theme carries one filter on purpose since 2026-09-18.** That is Voyager inverted, so
     this states the exact chain per theme rather than forbidding every filter. It reads the labels
     pane as well, because the place names are a layer of their own and half a revert drops them.
     The layer inside the tile pane is still asked, because that is where the deleted chain was
     measured a second time. See the `.leaflet-tile-pane` rule in css/map.css for all three.
     **THE TWO PANES TAKE DIFFERENT CHAINS SINCE 2026-09-23, AND THAT IS THE POINT OF THIS BLOCK.**
     The ground gained `brightness(2.04) contrast(1.08)`, which lifts every basemap feature off the
     land.
     The place names must not take it: Voyager's label halo inverts to `#090c0f`, and this slope lifts
     that to a dark blue smudge box behind every name. Copying one rule onto both panes is the exact
     revert this asserts against, and it errors nowhere.
     `setTheme` writes the reader's own preference, so the pick goes back after. */
  const { setTheme } = M;
  const { PREFS } = await import('./js/state.js');
  const wasTheme = PREFS.theme;
  const BASE = 'invert(1) hue-rotate(180deg)';
  const WANT = {
    light: { ground: 'none', 'place name': 'none' },
    dark: { ground: `${BASE} brightness(2.04) contrast(1.08)`, 'place name': BASE },
  };
  const PANES = [['ground', '.leaflet-tile-pane'], ['place name', '.leaflet-labels-pane']];
  for (const t of ['dark', 'light']) {
    setTheme(t);
    await settle(300);
    for (const [name, sel] of PANES) {
      const got = getComputedStyle(document.querySelector(sel)).filter;
      ok(`the ${t} ${name} pane takes the filter it should`, got === WANT[t][name], got);
    }
    /* The two dark chains have to DIFFER. Both assertions above pass on a day somebody makes them
       identical by editing this file rather than the stylesheet. */
    if (t === 'dark') ok('the two dark panes take different chains',
      getComputedStyle(document.querySelector('.leaflet-tile-pane')).filter
        !== getComputedStyle(document.querySelector('.leaflet-labels-pane')).filter,
      'ground carries the lift, the place names do not');
    const layer = getComputedStyle(document.querySelector('.leaflet-tile-pane .leaflet-layer')).filter;
    ok(`the ${t} ground layer takes no filter of its own`, layer === 'none', layer);
    ok(`the ${t} theme has no river pane`, !map.getPane('rivers'),
       map.getPane('rivers') ? 'found' : 'none');
  }
  setTheme(wasTheme);

  // --- the tiles ---------------------------------------------------------------------------------

  /* The ground fills the coverage box and no tile outside it is asked for, because CARTO counts every
     tile. A revert to a plain `L.tileLayer` asks for them again and draws a map that looks almost the
     same, so nothing else on this page notices. */
  map.setZoom(map.getMinZoom(), { animate: false });
  await settle(400);
  const tileLayers = [];
  map.eachLayer(l => { if (l instanceof L.TileLayer) tileLayers.push(l); });
  const outside = (l, coords) => !cover.intersects(l._tileCoordsToBounds(coords));

  /* The floor view has to reach past the box, or the assertion under it proves nothing. The box is
     taller than this window, so the floor fits its height and leaves bare container to the left and
     the right. Those strips are what spans tiles the box does not hold. */
  let spanned = 0;
  const t0 = tileLayers[0];
  if (t0) {
    const r = t0._pxBoundsToTileRange(map.getPixelBounds());
    for (let x = r.min.x; x <= r.max.x; x++) for (let y = r.min.y; y <= r.max.y; y++) {
      const c2 = L.point(x, y);
      c2.z = t0._tileZoom;
      if (outside(t0, c2)) spanned++;
    }
  }
  ok('the floor view spans tiles outside the box', spanned > 0, spanned + ' of them');
  const asked = tileLayers.flatMap(l => Object.keys(l._tiles).map(k => [l, l._keyToTileCoords(k)]));
  const askedOut = asked.filter(([l, c2]) => outside(l, c2)).length;
  ok('no tile outside the box is asked for', asked.length > 0 && askedOut === 0,
     asked.length + ' tiles across ' + tileLayers.length + ' layers, ' + askedOut + ' outside');

  /* Every zoom level clips its tiles to the box, in that level's own pixels, so the clip shrinks
     with the level during a zoom. An SVG mask stood here first. Leaflet redraws an SVG when a zoom
     ends, so a zoom out showed the ground past the box. A level with no clip, or a clip off by the
     level's origin, draws that ground again with nothing to say so. */
  const clipped = tileLayers.flatMap(l => Object.values(l._levels).map(v => {
    const want = [cover.getNorthWest(), cover.getSouthEast()]
      .map(ll => map.project(ll, v.zoom).subtract(v.origin));
    const got = (v.el.style.clipPath.match(/-?[\d.]+(?=px)/g) || []).map(Number);
    return got.length === 8 && Math.abs(got[0] - want[0].x) < 1 && Math.abs(got[1] - want[0].y) < 1
      && Math.abs(got[4] - want[1].x) < 1 && Math.abs(got[5] - want[1].y) < 1;
  }));
  ok('every tile level clips to the box', clipped.length > 0 && clipped.every(Boolean),
     clipped.filter(Boolean).length + ' of ' + clipped.length + ' levels');

  // --- the pane order ----------------------------------------------------------------------------

  /* The place names sit over the ground and under everything this app reports. The mask used to sit
     between the names and the overlay pane, and it is gone, so the names are the top tile pane now. */
  const z = n => +getComputedStyle(map.getPane(n)).zIndex;
  ok('the names are over the ground and under the pins',
     z('labels') > z('tilePane') && z('labels') < z('overlayPane'),
     'tiles ' + z('tilePane') + ', labels ' + z('labels') + ', overlay ' + z('overlayPane'));

  say('');
  say(fails.length ? 'FAILED: ' + fails.join(', ') : 'PASS');
} catch (e) {
  say('THREW', e && (e.stack || e.message));
}
</script>
