<!doctype html>
<meta charset="utf-8">
<title>Coverage mask and map limits check</title>
<!-- Eighth runnable check in this repo. It guards the three things border.json pays for: the shading
     over everything outside the coverage area, the zoom floor, and the pan limit.

     Every fault here is SILENT. A mask that draws nothing looks like a map. A mask whose stripes
     never render looks like a flat wash somebody chose. A zoom floor the pan box refuses still
     answers its own number to `getMinZoom()`. None of them throws, and none of them is visible in a
     diff.

     Run it headless. It prints its own verdict into the output box below, so there is nothing to
     look at. docs/VERIFY.md carries the command. Do not write that element's own tag into this
     comment — the reader there cuts the output out of the dumped DOM by matching it, and a second
     copy in a comment is the one it finds first. -->
<!-- **This page loads stylesheets and heat-test.html does not, and the mask is why.** Three of the
     things asserted below are painted rather than computed: the pattern the mask asks for, the two
     paints inside that pattern's tile, and the z-index of every Leaflet pane. Without these files
     the mask draws in Leaflet's own default blue, both tile shapes resolve to black, and
     `overlayPane` has no z-index at all. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/map.css">
<style>#map{width:900px;height:700px}</style>
<div id="map"></div>
<!-- The elements js/map.js wires at module scope. A missing one is a TypeError at import time, and
     then nothing on this page runs at all. -->
<button id="sideClose"></button>
<dialog id="pane"></dialog>
<input id="heatOpacity" type="range" min="0" max="100" value="100">
<span id="heatOpacityVal"></span>
<!-- `applyTheme()` writes this at call time. The water block below calls `setTheme()`. -->
<meta name="theme-color" content="">
<pre id="out">running</pre>
<script>
  const out = document.getElementById('out'), log = [];
  window.say = (...a) => { log.push(a.join(' ')); out.textContent = log.join('\n'); };
  window.onerror = (m, f, l) => say('ERROR', m, 'at', f + ':' + l);
  window.onunhandledrejection = e => say('REJECT', e.reason && (e.reason.stack || e.reason.message));
</script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script type="module">
const { say } = window;
const fails = [];
const ok = (name, pass, detail) => { say((pass ? 'ok   ' : 'FAIL ') + name + '   ' + detail);
                                     if (!pass) fails.push(name); };

const settle = ms => new Promise(r => setTimeout(r, ms));

try {
  const { map } = await import('./js/map.js');

  /* Wait for the map to say it has stopped, never for a guessed number of milliseconds. A
     `setZoom()` that also has to travel back inside `maxBounds` runs a pan and then a zoom, and the
     pair takes longer than one animation. Measured here: a fixed 900 ms read the zoom mid-flight
     and reported a level the map was still leaving, which reads as a broken floor. The timeout is a
     backstop, so a map that never moves fails this page rather than hanging it. */
  const stopped = (ms = 4000) => new Promise(r => {
    const done = () => { map.off('moveend', done); clearTimeout(t); r(); };
    const t = setTimeout(done, ms);
    map.on('moveend', done);
  });

  // border.json is fetched at module load, so the mask arrives a tick or two after the import.
  let path = null;
  for (let i = 0; i < 60 && !path; i++) { await settle(100); path = document.querySelector('.covermask'); }
  ok('the mask draws', !!path, path ? 'one .covermask path' : 'nothing after 6 s');
  if (!path) throw new Error('no mask, so nothing below can be measured');

  // --- the shape ---------------------------------------------------------------------------------

  const d = path.getAttribute('d') || '';
  const subs = d.split('M').filter(Boolean).length;
  ok('it is a ring with a hole in it', subs >= 2, subs + ' subpaths, wanted 2 or more');

  /* `isPointInFill` reads the same fill rule the browser paints with, so this asks the rendered
     shape rather than the numbers behind it. The path is written in Leaflet's layer coordinates, so
     that is the space a probe point has to be in.
     **Every probe has to be ON SCREEN.** Leaflet clips a polygon to the viewport plus its padding,
     so a point off the edge is outside the clipped path whatever the map says about it. Ipoh sat
     here for one revision and failed for exactly that reason, which reads as a hole in the mask
     over Perak. `assert` refuses a probe the view does not hold, so the next one cannot hide. */
  map.setView([3.1, 101.5], 9, { animate: false });
  await settle(200);
  const at = ll => {
    if (!map.getBounds().contains(L.latLng(ll))) throw new Error('probe ' + ll + ' is off screen');
    const p = map.latLngToLayerPoint(L.latLng(ll));
    return path.isPointInFill(new DOMPoint(p.x, p.y));
  };

  ok('Shah Alam is not shaded', !at([3.073, 101.518]), 'inside the circle');
  ok('Kuala Lumpur is not shaded', !at([3.139, 101.687]), 'an enclave of Selangor, and the circle '
     + 'holds every part of the state');
  ok('Putrajaya is not shaded', !at([2.926, 101.696]), 'the second enclave');
  ok('Melaka is shaded', at([2.190, 102.250]), 'well past the radius on the south east');
  /* **Bentong is INSIDE and that is not a fault.** A circle that holds all of Selangor's land holds
     a piece of Pahang with it. The assertion is here the right way round on purpose: a future change
     that tightens the radius until Bentong falls out has almost certainly clipped Selangor itself,
     and that is the fault worth catching. */
  ok('Bentong is not shaded', !at([3.522, 101.908]), 'Pahang, and inside the radius');

  /* **The circle has to hold every point of the LAND ring, and that ring is not the whole outline.**
     `border-build.php` drops the sea boundary before it places the circle, so the maritime corner in
     the Strait of Malacca is outside on purpose and asserting the full outline would fail on correct
     code. Probe the ring's own points, and never its bounding box: a box corner sits further from
     the centre than any point on the shape. Four corners were asserted here for one revision and
     this page went red over nothing. */
  const geo = await (await fetch('border.json')).json();
  const land = geo.features.find(f => f.properties.t === 'land');
  ok('the file carries a land ring and a circle', !!land && Array.isArray(geo.circle),
     land ? 'circle ' + geo.circle.join(', ') : 'no land feature');
  const pts = land.geometry.coordinates[0];
  const onScreen = pts.filter(([x, y]) => map.getBounds().contains(L.latLng([y, x])));
  const shaded = onScreen.filter(([x, y]) => at([y, x]));
  ok('the circle holds the land it was built from',
     onScreen.length > 20 && shaded.length === 0,
     onScreen.length + ' of ' + pts.length + ' land points are on screen, ' + shaded.length
     + ' of them shaded');

  /* The circle sits on the land rather than on the strait. `border-build.php` earns that by dropping
     the sea ways, and a rebake against changed tagging would silently put it back over the water.
     The centre has to be east of the land ring's own middle longitude, which the sea version was
     not. */
  const lons = pts.map(p => p[0]);
  const mid = (Math.min(...lons) + Math.max(...lons)) / 2;
  ok('the circle sits east of the land ring middle', geo.circle[1] > mid,
     'centre ' + geo.circle[1].toFixed(4) + ', land middle ' + mid.toFixed(4));

  // --- the paint ---------------------------------------------------------------------------------

  /* The stripes are faint by instruction, so the hairline is what states the boundary. A stroke of
     `none` leaves a circle nobody can find, and it is the one property here whose loss is invisible
     in every other assertion on this page. */
  const paint = getComputedStyle(path);
  ok('the mask asks for the pattern', paint.fill.includes('#hatch'), paint.fill);
  ok('the circle carries an edge', paint.stroke !== 'none' && parseFloat(paint.strokeWidth) > 0,
     paint.stroke + ' at ' + paint.strokeWidth);

  /* The pattern cannot be read off a pixel here, because this page has no way to sample the
     compositor. So it is read off the two things that broke it.
     **`display: none` on the sprite is the fault this line exists for.** A `<pattern>` is a paint
     server whose tile Blink builds from the layout tree, and a hidden sprite gives its children no
     layout. The pattern still resolves, every fill still computes, and the tile is empty. The mask
     then draws as a flat wash and nothing anywhere says so. */
  const def = document.getElementById('hatchdef');
  ok('the pattern sprite is rendered', def && getComputedStyle(def).display !== 'none',
     def ? 'display ' + getComputedStyle(def).display : 'no #hatchdef at all');
  const bg = document.querySelector('#hatch .hatchbg');
  const line = document.querySelector('#hatch .hatchline');
  const fills = [bg, line].map(e => e && getComputedStyle(e).fill);
  ok('the tile holds two different paints', !!bg && !!line && fills[0] !== fills[1],
     fills.join(' against '));

  // --- the limits --------------------------------------------------------------------------------

  /* One box answers the floor and the limit, so a floor the box refuses cannot happen. Read the
     zoom AFTER the animation settles: `getZoom()` answers the target the instant `setZoom()` is
     called, so a synchronous read reports a level the map never reached. */
  const floor = map.getMinZoom();
  map.setZoom(floor - 3);
  await stopped();
  ok('the zoom floor holds', map.getZoom() === floor,
     'asked for ' + (floor - 3) + ', floor is ' + floor + ', landed on ' + map.getZoom());

  const box = map.options.maxBounds;
  ok('the floor is the box', box && floor === map.getBoundsZoom(box),
     'floor ' + floor + ', the box fits at ' + (box && map.getBoundsZoom(box)));

  map.panTo([13.75, 100.50], { animate: false });   // Bangkok
  await settle(300);
  const c = map.getCenter();
  ok('a pan cannot leave the area', box.contains(c),
     'landed on ' + c.lat.toFixed(2) + ', ' + c.lng.toFixed(2));

  // --- no drawn water ---------------------------------------------------------------------------

  /* The map drew its own sea, rivers and ponds until 2026-09-14, and the repository owner removed
     them. A revert that brings back the pane puts the water over the place names with no error. */
  ok('the map has no water pane', !map.getPane('water'), map.getPane('water') ? 'found' : 'none');

  /* A water tint and river lines stood on the dark theme from 2026-09-14 to 2026-09-15, and the
     repository owner removed both. A half revert draws blue on a few rivers and nothing throws.
     **THIS READS THE PANES, AND IT READ ONE LAYER INSIDE ONE PANE UNTIL 2026-09-18.** The tint that
     was deleted on 2026-08-27 sat on `.leaflet-tile-pane` itself. So the old assertion never
     covered the element that fault lived on, and it passed with the wall still up.
     **The dark theme carries one filter on purpose since 2026-09-18.** That is Voyager inverted, so
     this states the exact chain per theme rather than forbidding every filter. It reads the labels
     pane as well, because the place names are a layer of their own and half a revert drops them.
     The layer inside the tile pane is still asked, because that is where the deleted chain was
     measured a second time. See the `.leaflet-tile-pane` rule in css/map.css for all three.
     `setTheme` writes the reader's own preference, so the pick goes back after. */
  const { setTheme } = await import('./js/map.js');
  const { PREFS } = await import('./js/state.js');
  const wasTheme = PREFS.theme;
  const WANT = { light: 'none', dark: 'invert(1) hue-rotate(180deg)' };
  const PANES = [['ground', '.leaflet-tile-pane'], ['place name', '.leaflet-labels-pane']];
  for (const t of ['dark', 'light']) {
    setTheme(t);
    await settle(300);
    for (const [name, sel] of PANES) {
      const got = getComputedStyle(document.querySelector(sel)).filter;
      ok(`the ${t} ${name} pane takes the filter it should`, got === WANT[t], got);
    }
    const layer = getComputedStyle(document.querySelector('.leaflet-tile-pane .leaflet-layer')).filter;
    ok(`the ${t} ground layer takes no filter of its own`, layer === 'none', layer);
    ok(`the ${t} theme has no river pane`, !map.getPane('rivers'),
       map.getPane('rivers') ? 'found' : 'none');
  }
  setTheme(wasTheme);

  // --- the tiles ---------------------------------------------------------------------------------

  /* The ground fills a square frame around the circle, and no tile outside the frame is asked for,
     because CARTO counts every tile. A revert to a plain `L.tileLayer` asks for them again and draws
     a map that looks almost the same, so nothing else on this page notices. The floor view spans the
     whole pan box, so it holds tiles far past the frame. */
  const { frame } = await import('./js/map.js');
  map.setZoom(map.getMinZoom(), { animate: false });
  await settle(400);
  const [cy, cx, ckm] = geo.circle;
  // The circle's extent, worked out here rather than read off the module that draws it.
  const dLat = ckm / 110.57, dLng = ckm / (111.32 * Math.cos(cy * Math.PI / 180));
  const disc = L.latLngBounds([cy - dLat, cx - dLng], [cy + dLat, cx + dLng]);
  ok('the frame holds the circle, with room around it',
     !!frame && frame.contains(disc.pad(0.1)),
     frame ? frame.toBBoxString() + ' around ' + disc.toBBoxString() : 'no frame');
  const tileLayers = [];
  map.eachLayer(l => { if (l instanceof L.TileLayer) tileLayers.push(l); });
  const outside = (l, coords) => !frame.intersects(l._tileCoordsToBounds(coords));
  let spanned = 0;
  const t0 = tileLayers[0];
  if (t0 && frame) {
    const r = t0._pxBoundsToTileRange(map.getPixelBounds());
    for (let x = r.min.x; x <= r.max.x; x++) for (let y = r.min.y; y <= r.max.y; y++) {
      const c = L.point(x, y);
      c.z = t0._tileZoom;
      if (outside(t0, c)) spanned++;
    }
  }
  ok('the floor view spans tiles outside the frame', spanned > 0, spanned + ' of them');
  const asked = frame
    ? tileLayers.flatMap(l => Object.keys(l._tiles).map(k => [l, l._keyToTileCoords(k)])) : [];
  const askedOut = asked.filter(([l, c]) => outside(l, c)).length;
  ok('no tile outside the frame is asked for', asked.length > 0 && askedOut === 0,
     asked.length + ' tiles across ' + tileLayers.length + ' layers, ' + askedOut + ' outside');

  /* Every zoom level clips its tiles to the frame, in that level's own pixels, so the clip shrinks
     with the level during a zoom. An SVG mask stood here first. Leaflet redraws an SVG when a zoom
     ends, so a zoom out showed the ground past the square. A level with no clip, or a clip off by
     the level's origin, draws that ground again with nothing to say so. */
  const clipped = frame ? tileLayers.flatMap(l => Object.values(l._levels).map(v => {
    const want = [frame.getNorthWest(), frame.getSouthEast()]
      .map(ll => map.project(ll, v.zoom).subtract(v.origin));
    const got = (v.el.style.clipPath.match(/-?[\d.]+(?=px)/g) || []).map(Number);
    return got.length === 8 && Math.abs(got[0] - want[0].x) < 1 && Math.abs(got[1] - want[0].y) < 1
      && Math.abs(got[4] - want[1].x) < 1 && Math.abs(got[5] - want[1].y) < 1;
  })) : [];
  ok('every tile level clips to the frame', clipped.length > 0 && clipped.every(Boolean),
     clipped.filter(Boolean).length + ' of ' + clipped.length + ' levels');
  ok('no SVG mask covers the ground past the frame', !document.querySelector('.coverframe'),
     document.querySelector('.coverframe') ? 'found' : 'none');

  // --- the pane order ----------------------------------------------------------------------------

  /* The mask has to sit over the place names, so a town outside the area is shaded with the ground
     it stands on. It has to sit under the overlay pane, or it shades the heat wash and the pins. */
  const z = n => +getComputedStyle(map.getPane(n)).zIndex;
  ok('the mask is over the names and under the pins',
     z('mask') > z('labels') && z('mask') < z('overlayPane'),
     'labels ' + z('labels') + ', mask ' + z('mask') + ', overlay ' + z('overlayPane'));

  say('');
  say(fails.length ? 'FAILED: ' + fails.join(', ') : 'PASS');
} catch (e) {
  say('THREW', e && (e.stack || e.message));
}
</script>
