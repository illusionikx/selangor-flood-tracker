; Per-directory PHP settings for this app. PHP reads this file on every request under this
; directory, so it changes nothing for any other site on the same server.
;
; Nothing in this app reads $_SESSION. An auto-started session costs two things and gives nothing
; back. It takes an exclusive lock on the session file for the whole request, which puts every
; request from one browser in a queue. `api.php` calls session_write_close() on its first statement
; to release that lock, and that call stays where it is, because a server that ignores this file
; still needs it. The second cost is noise. Where the session directory refuses a write, PHP logs
; two warnings for every request, including every font, stylesheet and module. That buried the app's
; own errors under about 28,000 lines on the machine this was written on.
;
; PHP caches this file for user_ini.cache_ttl seconds, 300 by default. Wait five minutes after an
; edit, or restart the PHP service.
session.auto_start = 0
