<!doctype html>
<meta charset="utf-8">
<title>Heat layers check</title>
<!-- Third runnable check in this repo, beside shots-test.php and `php api.php --selftest`.
     It guards the rules both heat layers are built on, and all of them live in canvas pixels, where
     nothing else here can reach them. Reading the code proves none.

       1. Both layers are interpolated fields drawn as flat bands. A class is one colour, and an edge
          is one pixel wide and smooth.
       2. The rain layer takes a mean of the gauges near a point. A gauge keeps its own class, a lone
          gauge draws a hill, a dry gauge counts as zero, and the wash ends at the cover limit.
       3. The water layer takes the HIGHEST hill of the stations near a point. A station keeps its own
          class, a calm station draws nothing and lowers nothing, two stations never add up, and
          water on the ground has a class above danger.
       4. A stale reading feeds nothing. The Settings opacity stops at 80%.

     Run it headless. It prints its own verdict into the output box below, so there is nothing to
     look at. CLAUDE.md's Verify block carries the command. Do not write that element's own tag
     into this comment — the reader there cuts the output out of the dumped DOM by matching it,
     and a second copy in a comment is the one it finds first.

     It found one fault already. simpleheat sets `globalAlpha` per point in its draw loop and never
     puts it back, so the eraser inherited the last blob's weight and removed 90% instead of all of
     it. On screen that is a faint violet stain over a gauge reporting zero, which nobody would read
     as an inherited canvas setting. -->
<style>#map{width:800px;height:600px}</style>
<div id="map"></div>
<!-- The elements `js/map.js` wires at module scope. This page loads that module for the heat layer
     alone, so it has to carry them: a `#sideClose` for the panel's close handler, and the supporting
     pane, which `syncPane()` opens and closes. A missing one is a `TypeError` at import time, and
     then nothing on this page runs at all. -->
<button id="sideClose"></button>
<dialog id="pane"></dialog>
<input id="heatOpacity" type="range" min="0" max="100" value="100">
<span id="heatOpacityVal"></span>
<pre id="out">running</pre>
<script>
  const out = document.getElementById('out'), log = [];
  window.say = (...a) => { log.push(a.join(' ')); out.textContent = log.join('\n'); };
  window.onerror = (m, f, l) => say('ERROR', m, 'at', f + ':' + l);
  window.onunhandledrejection = e => say('REJECT', e.reason && (e.reason.stack || e.reason.message));
</script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script type="module">
const { say } = window;
const fails = [];
const ok = (name, pass, detail) => { say((pass ? 'ok   ' : 'FAIL ') + name + '   ' + detail);
                                     if (!pass) fails.push(name); };
try {
  const { map } = await import('./js/map.js');
  const { heat, rainHeat, classOf, smoothGrid, heatOpacity, HEAT_OPACITY_MAX } = await import('./js/heat.js');
  const { RAIN_CLASSES, WATER_CLASSES, RAIN_STOPS } = await import('./js/config.js');
  const { scalePos, heatOk, waterValue } = await import('./js/util.js');
  const { PREFS } = await import('./js/state.js');
  /* The shape tests read alpha, so they run on the FLAT wash. Stepped is the app's default since
     2026-11-23, and it lowers the alpha of every band under the top one. One test at the foot checks
     the stepped wash on its own. */
  PREFS.heatStyle = 'flat';

  const WET = [3.16, 101.75];
  const east = d => [WET[0], WET[1] + d / (111 * Math.cos(WET[0] * Math.PI / 180))];
  // Pixels in one kilometre at the current zoom.
  const pxkm = () => {
    const c = map.getCenter(), e = L.latLng(c.lat, c.lng + 1 / (111 * Math.cos(c.lat * Math.PI / 180)));
    return Math.abs(map.latLngToLayerPoint(e).x - map.latLngToLayerPoint(c).x);
  };
  // The canvas is padded — see PATCH 3 in vendor/leaflet-heat.js. A container point is not a canvas
  // point, and reading one as the other silently samples the wrong pixel.
  const origin = (layer, ll) => { const pad = layer._pad(), p = map.latLngToContainerPoint(L.latLng(ll)); return [p.x + pad.x, p.y + pad.y]; };
  const pixAt = (layer, ll) => {
    const [x, y] = origin(layer, ll);
    const d = layer._canvas.getContext('2d').getImageData(Math.round(x), Math.round(y), 1, 1).data;
    return { a: d[3], hex: [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('') };
  };
  const alphaXY = (layer, x, y) => layer._canvas.getContext('2d').getImageData(Math.floor(x), Math.floor(y), 1, 1).data[3];
  // The outermost point along a ray whose alpha is at least half. Half is where an antialiased edge
  // crosses. Pixels are read by `floor` and the ray steps a quarter pixel, so the reading is good to
  // about a quarter of a pixel. A half-pixel step with `round` read a true 0.8 px shrink as 2.0 px.
  const edgeAlong = (layer, c, ang, max) => {
    let last = 0;
    for (let d = 0; d <= max; d += 0.25) if (alphaXY(layer, c[0] + d * Math.cos(ang), c[1] + d * Math.sin(ang)) >= 128) last = d;
    return last;
  };
  // Canvas stores colour premultiplied by alpha, so reading a half-transparent pixel back costs a
  // rounding step. Measured, that is a couple of counts per channel, nowhere near the distance
  // between two named classes, which is what these assertions are about.
  const sameHue = (a, b) => [0, 2, 4].every(i =>
    Math.abs(parseInt(a.slice(i, i + 2), 16) - parseInt(b.slice(i, i + 2), 16)) <= 8);

  map.setView(WET, 12, { animate: false });
  heat.addTo(map);
  rainHeat.addTo(map);
  map.fire('zoomend');

  /* The gate every heat weight passes through. A station that is online but whose stamp is more
     than a day old is frozen on whatever it read, so it must neither paint nor deny. */
  const pad2 = n => String(n).padStart(2, '0');
  const stamp = ms => {
    const d = new Date(Date.now() - ms);
    return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
  };
  const gauge = over => ({ kind: 'rainfall', online: true, hourly: 4, updated: stamp(6e5), ...over });
  ok('fresh gauge feeds heat',       heatOk(gauge({})) === true, '');
  ok('two-day-old stamp feeds none', heatOk(gauge({ updated: stamp(2 * 864e5) })) === false, '');
  ok('offline gauge feeds none',     heatOk(gauge({ online: false })) === false, '');
  ok('no reading feeds none',        heatOk(gauge({ hourly: null })) === false, '');

  /* Thirteen rain classes, each JPS class split in quarters. Weights come from RAIN_STOPS: 0 mm is
     0.25, 10 mm is 0.5, 30 mm is 0.75 and 60 mm is 1. So the edges fall at 2.5, 5, 7.5, 10, 15, 20,
     25, 30, 37.5, 45 and 52.5 mm, and the open top class is above 60. A reading on an edge stays in
     the class below it. */
  const mmw = mm => scalePos(mm, RAIN_STOPS) / 100;
  for (const [mm, k] of [[2, 0], [2.5, 0], [3, 1], [5, 1], [6, 2], [8, 3], [10, 3], [12, 4], [18, 5], [22, 6],
                         [28, 7], [35, 8], [40, 9], [50, 10], [55, 11], [61, 12]])
    ok('classOf ' + mm + ' mm is band ' + k + '          '.slice(String(k).length), classOf(mmw(mm), RAIN_CLASSES) === k,
       'band ' + classOf(mmw(mm), RAIN_CLASSES) + (mm === 10 ? ', JPS moderate is above 10' : ''));
  ok('the classes number thirteen and ten', RAIN_CLASSES.length === 13 && WATER_CLASSES.length === 10, '');

  /* **The water scale.** `waterValue()` scores a station against its own marks and maps it onto one
     scale: 0.25 at the alert mark, 0.625 at the warning mark, 1 at the danger mark, and 1.25 for water
     measured on the ground. Everything else is 0, and a 0 station is absent from the layer. */
  {
    const river = o => ({ kind: 'river', online: true, level: 3, alert: 3, warning: 4, danger: 5, updated: stamp(6e5), ...o });
    const flood = o => ({ kind: 'gauge', online: true, depth: 0.2, status: 1, updated: stamp(6e5), ...o });
    const near = (a, b) => Math.abs(a - b) < 1e-9;
    ok('a river at its alert mark is 0.25       ', near(waterValue(river({ level: 3 })), 0.25), String(waterValue(river({ level: 3 }))));
    ok('at its warning mark, 0.625              ', near(waterValue(river({ level: 4 })), 0.625), String(waterValue(river({ level: 4 }))));
    ok('at its danger mark, 1                   ', near(waterValue(river({ level: 5 })), 1), String(waterValue(river({ level: 5 }))));
    ok('a river under its alert mark is 0       ', waterValue(river({ level: 2.5 })) === 0, String(waterValue(river({ level: 2.5 }))));
    ok('a river with no marks is 0              ', waterValue(river({ alert: undefined, warning: undefined, danger: undefined })) === 0, '');
    ok('a stale river is 0                      ', waterValue(river({ updated: stamp(2 * 864e5) })) === 0, '');
    ok('a flood gauge past its warning is 1.25  ', near(waterValue(flood({})), 1.25), String(waterValue(flood({}))));
    ok('a dry flood gauge is 0                  ', waterValue(flood({ depth: -0.2, status: 0 })) === 0, '');
    ok('a doubted flood gauge is 0              ', waterValue(flood({ backed: false })) === 0, '');
    const low = waterValue(flood({ depth: 0.1, status: 0 }));
    ok('a gauge under its warning sits on the scale', low > 0.25 && low < 0.625, String(low));
    // The water classes, by value. A value on an edge stays in the class below it.
    for (const [v, k] of [[0.3, 0], [0.34375, 0], [0.4, 1], [0.5, 2], [0.6, 3], [0.625, 3], [0.7, 4], [0.8, 5],
                          [0.9, 6], [0.99, 7], [1, 8], [1.1, 8], [1.25, 9]])
      ok('water value ' + v + ' is band ' + k + '          '.slice(String(k).length), classOf(v, WATER_CLASSES) === k,
         'band ' + classOf(v, WATER_CLASSES));
  }

  /* **The water wash is the highest hill of the stations near a point.** Each probe states one
     promise that a mean would break. Water takes no dry list, because a calm station is absent. */
  const WH = WATER_CLASSES.map(c => c[1].slice(1));
  const wcls = ll => { const q = pixAt(heat, ll); return q.a === 0 ? -1 : WH.findIndex(h => sameHue(q.hex, h)); };
  const wpaint = list => { heat.setLatLngs(list); heat._redraw(); };
  const DANGER = WATER_CLASSES.length - 2, GROUND = WATER_CLASSES.length - 1;

  // A lone station at its alert mark colours 5 km: the reach it had as a disc.
  wpaint([[...WET, 0.25]]);
  ok('a station at alert colours 4 km, not 6 km', pixAt(heat, east(4)).a > 0 && pixAt(heat, east(6)).a === 0,
     'alpha ' + pixAt(heat, east(4)).a + ' at 4 km, ' + pixAt(heat, east(6)).a + ' at 6 km');

  // A lone station at danger draws a hill: the class falls with distance, and the wash ends at 10 km.
  wpaint([[...WET, 1]]);
  ok('a danger station keeps the danger class  ', wcls(WET) === DANGER, 'band ' + wcls(WET) + ', wanted ' + DANGER);
  ok('and the class falls with distance        ', wcls(east(3)) < DANGER && wcls(east(3)) > wcls(east(6)) && wcls(east(6)) >= 0,
     'bands ' + [0, 3, 6].map(d => wcls(east(d))).join(' ') + ' at 0, 3 and 6 km');
  ok('and the wash ends before 10.5 km         ', pixAt(heat, east(6)).a > 0 && pixAt(heat, east(10.8)).a === 0,
     'alpha ' + pixAt(heat, east(6)).a + ' at 6 km, ' + pixAt(heat, east(10.8)).a + ' at 10.8 km');

  // Two stations at warning, 4 km apart: where two hills meet the higher shows. They never add up.
  wpaint([[...WET, 0.625], [...east(4), 0.625]]);
  {
    const k = classOf(0.625, WATER_CLASSES), mid = wcls(east(2));
    ok('two stations at warning do not add up    ', wcls(WET) === k && wcls(east(4)) === k && mid >= 1 && mid <= k,
       'bands ' + wcls(WET) + ', ' + mid + ', ' + wcls(east(4)) + ' at 0, 2 and 4 km, wanted none above ' + k);
  }

  // Water on the ground outranks a river at its danger mark, and each keeps its own class.
  wpaint([[...WET, 1.25], [...east(3), 1]]);
  ok('water on the ground has its own top class', wcls(WET) === GROUND && wcls(east(3)) === DANGER,
     'bands ' + wcls(WET) + ' and ' + wcls(east(3)) + ', wanted ' + GROUND + ' and ' + DANGER);

  // A higher neighbour is never lowered, and a lower one is never raised past its own value.
  wpaint([[...WET, 0.3], [...east(1), 1]]);
  ok('a low station beside a high one is not lowered', wcls(east(1)) === DANGER && wcls(WET) >= classOf(0.3, WATER_CLASSES),
     'bands ' + wcls(WET) + ' and ' + wcls(east(1)));

  // The usual day: no station past its alert mark. Nothing paints and nothing throws.
  wpaint([]);
  ok('no station past alert paints nothing     ', [WET, east(1), east(5)].every(ll => pixAt(heat, ll).a === 0), '');

  /* The shape of a hill. A lone station's wash is a circle, and its edge is one pixel wide. The
     radius is read along eight rays, and the spread between the longest and the shortest must stay
     under 1.5 px. Across the rim, at most two pixels are neither empty nor whole. */
  wpaint([[...WET, 1]]);
  {
    const c = origin(heat, WET), max = pxkm() * 12;
    const radii = [0, 1, 2, 3, 4, 5, 6, 7].map(i => edgeAlong(heat, c, i * Math.PI / 4 + 0.2, max));
    const spread = Math.max(...radii) - Math.min(...radii);
    ok('a lone hill is a circle                  ', spread <= 1.5, 'radii ' + radii.map(r => r.toFixed(1)).join(' ') + ', spread ' + spread.toFixed(2) + ' px');
    const re = edgeAlong(heat, c, Math.PI, max);
    let partial = 0;
    for (let d = re - 6; d <= re + 6; d += 1) { const a = alphaXY(heat, c[0] - d, c[1]); if (a > 10 && a < 245) partial++; }
    ok('the edge is one pixel wide               ', partial <= 2, partial + ' partial pixels across the rim, wanted at most 2');
  }

  /* **Corners are rounded, and the rounding is bounded.** The wash is the positive part of a field
     that is a `min()` or a `max()` of other fields, so it has corners wherever two of them meet. The
     grid is blurred before it is traced. A straight edge must not move, and a corner must be cut. */
  {
    const W = 40, F = new Float32Array(W * W), G = new Float32Array(W * W);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) { F[y * W + x] = x - 20; G[y * W + x] = Math.min(x - 20, y - 20); }
    smoothGrid(F, W, W, 3); smoothGrid(G, W, W, 3);
    ok('smoothing leaves a straight edge where it was', Math.abs(F[20 * W + 20]) < 0.01, 'the field at the edge is ' + F[20 * W + 20].toFixed(4));
    ok('and cuts a corner                         ', G[20 * W + 20] < -1, 'the field at the corner is ' + G[20 * W + 20].toFixed(2) + ', wanted below -1');
    const small = new Float32Array(W * W).fill(1);
    smoothGrid(small, W, W, 0.3);
    ok('and a blur under half a cell does nothing ', small.every(v => v === 1), '');
  }

  /* **The rain wash is an estimate between gauges.** It takes a distance-weighted MEAN of every gauge
     within INTERP_KM, wet and dry, with a dry gauge as the value 0 and a constant prior of 0 that
     makes the value fall to half at PRIOR_KM. Each probe states one promise. */
  const RH = RAIN_CLASSES.map(c => c[1].slice(1));
  const rpix = ll => pixAt(rainHeat, ll);
  const rcls = ll => { const q = rpix(ll); return q.a === 0 ? -1 : RH.findIndex(h => sameHue(q.hex, h)); };
  const paint = (wet, dryList = []) => { rainHeat.setDry(dryList); rainHeat.setLatLngs(wet); rainHeat._redraw(); };
  const at = (dx, dy) => [WET[0] + dy / 111, WET[1] + dx / (111 * Math.cos(WET[0] * Math.PI / 180))];
  map.setView(WET, 12, { animate: false });

  // A gauge keeps its own reading. Three gauges 8 km apart, at three different classes.
  paint([[...east(-8), 0.3], [...WET, 0.6], [...east(8), 1]]);
  for (const [ll, w] of [[east(-8), 0.3], [WET, 0.6], [east(8), 1]])
    ok('a gauge keeps its own class (' + w + ')       ', rcls(ll) === classOf(w, RAIN_CLASSES) && rpix(ll).a === 255,
       'class ' + rcls(ll) + ', wanted ' + classOf(w, RAIN_CLASSES));

  // A lone gauge draws a hill, not a disc. The class falls with distance, and the wash ends at the
  // cover limit rather than at the 12 km where the estimate itself would end.
  paint([[...WET, 0.6]]);
  {
    const k0 = rcls(WET), k2 = rcls(east(2)), k6 = rcls(east(6));
    ok('a lone gauge draws a hill                ', k2 <= k0 && k6 >= 0 && k6 < k0, 'classes ' + k0 + ', ' + k2 + ', ' + k6 + ' at 0, 2 and 6 km');
    ok('and the wash ends before 10.5 km         ', rpix(east(8)).a > 0 && rpix(east(10.8)).a === 0,
       'alpha ' + rpix(east(8)).a + ' at 8 km, ' + rpix(east(10.8)).a + ' at 10.8 km');
  }

  // Two equal gauges 8 km apart: the ground between them is a little under either, and never over.
  // The estimate at the midpoint is 0.49 against 0.6 at a gauge, which is two of the 13 bands.
  paint([[...WET, 0.6], [...east(8), 0.6]]);
  {
    const kg = rcls(WET), km = rcls(east(4));
    ok('between two equal gauges, at most two bands under', km >= kg - 2 && km <= kg, 'band ' + km + ' at the midpoint, ' + kg + ' at a gauge');
  }

  // A dry gauge is evidence. The field falls toward it, and it is bare at the gauge.
  paint([[...WET, 0.9]], [east(6)]);
  {
    const ks = [];
    for (let d = 0; d <= 5.5; d += 0.5) { const k = rcls(east(d)); if (k >= 0) ks.push(k); }
    const rises = ks.slice(1).filter((k, i) => k > ks[i]).length;
    ok('the ground is bare at a dry gauge        ', rpix(east(6)).a === 0, 'alpha ' + rpix(east(6)).a);
    ok('and painted 1 km from the wet gauge      ', rpix(east(1)).a > 0, 'alpha ' + rpix(east(1)).a);
    ok('and the classes fall toward the dry one  ', rises === 0 && ks.length >= 6, 'classes ' + ks.join(' ') + ', rises ' + rises);
  }

  // A very heavy gauge among light ones keeps the top class. Blurring lowers a peak, and the put-back
  // near a gauge is what restores it.
  paint([[...WET, 1], [...at(3, 0), 0.3], [...at(-3, 0), 0.3], [...at(0, 3), 0.3], [...at(0, -3), 0.3]]);
  ok('a very heavy gauge among light ones keeps the top class', rcls(WET) === RH.length - 1, 'class ' + rcls(WET) + ', wanted ' + (RH.length - 1));

  // Two gauges 50 m apart, unlike: nothing divides by zero or leaves a hole. They sit 1.3 px apart,
  // inside one grid cell, so the nearer gauge sets the plateau and the other cannot show. The
  // promise is only that the wash is whole there, and finite.
  paint([[...WET, 0.9], [...east(0.05), 0.3]]);
  ok('two gauges 50 m apart leave no hole      ', [WET, east(0.025), east(0.05)].every(ll => rpix(ll).a === 255),
     'alphas ' + [WET, east(0.025), east(0.05)].map(ll => rpix(ll).a).join(' '));

  // All gauges dry: nothing paints, and nothing throws.
  paint([], [WET, east(2)]);
  ok('all gauges dry paints nothing            ', [WET, east(1), east(5)].every(ll => rpix(ll).a === 0), '');

  // Bare ground. A lone very heavy gauge reaches the cover limit and no further.
  paint([[...WET, 1]]);
  ok('ground past the cover limit stays bare   ', rpix(east(9)).a > 0 && rpix(east(11)).a === 0,
     'alpha ' + rpix(east(9)).a + ' at 9 km, ' + rpix(east(11)).a + ' at 11 km');
  paint([[...WET, 0.6]]);


  /* The wash sits under the place names. Both layers put their canvas in the `heat` pane, which is
     over the ground tiles and under the names, so a name reads over the wash. */
  {
    const zi = n => +getComputedStyle(map.getPane(n)).zIndex;
    ok('both wash canvases are in the heat pane  ', rainHeat._canvas.parentNode === map.getPane('heat')
         && heat._canvas.parentNode === map.getPane('heat'), 'parents are ' + rainHeat._canvas.parentNode.className + ' and ' + heat._canvas.parentNode.className);
    // This page loads no stylesheet, so the tile pane has no z-index here. map-limits-test.html loads
    // them and asserts that the heat pane is over the ground. This one states the other half.
    ok('which is under the place names           ', zi('heat') < zi('labels'),
       'heat ' + zi('heat') + ', names ' + zi('labels'));
    ok('and takes no pointer events              ', getComputedStyle(map.getPane('heat')).pointerEvents === 'none', '');
  }

  /* The dark theme has its own rain colours. Very heavy rain must draw in the dark set's top colour
     on a dark ground, and in the light set's on a light one. The theme goes back after. */
  {
    const { RAIN_CLASSES_DARK } = await import('./js/config.js');
    const root = document.documentElement, was = root.dataset.theme;
    const topLight = RAIN_CLASSES[RAIN_CLASSES.length - 1][1].slice(1), topDark = RAIN_CLASSES_DARK[RAIN_CLASSES_DARK.length - 1][1].slice(1);
    rainHeat.setDry([]);
    rainHeat.setLatLngs([[...WET, 1]]);
    root.dataset.theme = 'dark';
    rainHeat._redraw();
    const dk = rpix(WET);
    root.dataset.theme = 'light';
    rainHeat._redraw();
    const lt = rpix(WET);
    if (was === undefined) delete root.dataset.theme; else root.dataset.theme = was;
    ok('very heavy rain takes the dark colour on dark ', dk.hex === topDark, '#' + dk.hex + ', wanted #' + topDark);
    ok('and the light colour on light               ', lt.hex === topLight, '#' + lt.hex + ', wanted #' + topLight);
    ok('the two sets have the same edges            ', RAIN_CLASSES_DARK.length === RAIN_CLASSES.length
         && RAIN_CLASSES_DARK.every((c, i) => c[0] === RAIN_CLASSES[i][0]), '');
    // Water differs in one class: water on the ground, which a dark ground cannot read in dark red.
    const { WATER_CLASSES_DARK } = await import('./js/config.js');
    const wTopLight = WATER_CLASSES[WATER_CLASSES.length - 1][1].slice(1), wTopDark = WATER_CLASSES_DARK[WATER_CLASSES_DARK.length - 1][1].slice(1);
    wpaint([[...WET, 1.25]]);
    root.dataset.theme = 'dark';
    heat._redraw();
    const wdk = pixAt(heat, WET);
    root.dataset.theme = 'light';
    heat._redraw();
    const wlt = pixAt(heat, WET);
    if (was === undefined) delete root.dataset.theme; else root.dataset.theme = was;
    ok('water on the ground takes its dark colour on dark', wdk.hex === wTopDark, '#' + wdk.hex + ', wanted #' + wTopDark);
    ok('and its light colour on light                ', wlt.hex === wTopLight, '#' + wlt.hex + ', wanted #' + wTopLight);
    ok('the other nine water classes are shared      ', WATER_CLASSES_DARK.length === WATER_CLASSES.length
         && WATER_CLASSES_DARK.every((c, i) => c[0] === WATER_CLASSES[i][0] && (i === WATER_CLASSES.length - 1 || c[1] === WATER_CLASSES[i][1])), '');
    rainHeat.setLatLngs([[...WET, 0.6]]);
    rainHeat._redraw();
    wpaint([]);
  }

  /* The opacity cap. A class carries a colour and no opacity, so the Settings slider alone sets
     it, and it stops at 80%. A stored 95% from before the cap must read as 80%. */
  PREFS.heatOpacity = 0.95;
  heatOpacity();
  const shown = +rainHeat._canvas.style.opacity;
  ok('opacity stops at the cap', HEAT_OPACITY_MAX === 0.8 && Math.abs(shown - 0.8) < 1e-6,
     'canvas opacity ' + shown + ' from a stored 0.95, cap ' + HEAT_OPACITY_MAX);
  PREFS.heatOpacity = 0.4;
  heatOpacity();
  ok('and below the cap it follows the slider', Math.abs(+rainHeat._canvas.style.opacity - 0.4) < 1e-6,
     'canvas opacity ' + rainHeat._canvas.style.opacity + ' from a stored 0.4');
  delete PREFS.heatOpacity;

  /* The stepped wash. The canvas carries the top band's opacity, and the lowest band is drawn at
     the lowest opacity over the top one. A lone light gauge paints the lowest class at its edge and
     a very heavy one the top class at its centre. */
  PREFS.heatStyle = 'stepped'; PREFS.heatOpacityTop = 0.7; PREFS.heatOpacityMin = 0.35;
  heatOpacity();
  rainHeat.setDry([]);
  rainHeat.setLatLngs([[...WET, 1]]);
  rainHeat._redraw();
  const topA = pixAt(rainHeat, WET).a;
  rainHeat.setLatLngs([[...WET, 0.3]]);
  rainHeat._redraw();
  const lowA = pixAt(rainHeat, WET).a;
  ok('stepped: top band is opaque on the canvas', topA > 250, 'alpha ' + topA);
  ok('stepped: lowest band is drawn at min / top', Math.abs(lowA - 255 * 0.5) < 6, 'alpha ' + lowA + ', wanted about 128');
  ok('stepped: canvas carries the top opacity', Math.abs(+rainHeat._canvas.style.opacity - 0.7) < 1e-6, rainHeat._canvas.style.opacity);
  PREFS.heatStyle = 'flat'; delete PREFS.heatOpacityTop; delete PREFS.heatOpacityMin;

  say('');
  say(fails.length ? 'FAILED: ' + fails.join(', ') : 'PASS');
} catch (e) {
  say('THREW', e && (e.stack || e.message));
}
</script>
