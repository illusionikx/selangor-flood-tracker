# Bake the app to GitHub Pages. Pages serves static files only, so the PHP that normally answers
# every visit runs here instead, on a schedule, and its output is published as `api.json`.
#
# The cost of that trade is freshness: cron is best-effort and often runs late, so the map is
# 15-30 minutes behind rather than 5. Upstream stamps readings to the quarter hour, so this is
# roughly one reading of lag, not many.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'   # GitHub disables this after 60 days with no commits — it emails first
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two bakes at once: they would race on the history db and on the deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, sqlite3, mbstring

      - run: composer install --no-dev --no-progress --quiet

      # The trend history is the one piece of state a bake can't rebuild. Losing it costs an hour
      # of `rising` flags — everything keyed off them (alerts, filter, heat weighting) goes quiet
      # until enough samples land again. Caches are evicted after 7 days unused; the schedule keeps
      # this one warm, but a long quiet spell will still cost the samples.
      - uses: actions/cache@v4
        with:
          path: .history.db
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Poll the three sources
        run: php api.php > api.json

      # The weather layer. `php api.php` above already wrote the `wx:box` row, so this only lifts
      # it out. `|| true` because nothing optional can fail the bake. A failed weather file must
      # leave the map updating. js/wx.js reports the gap on #wxHint, the hint span on the chip.
      - name: Bake the weather layer
        run: |
          php -r '$d = new PDO("sqlite:.history.db");
                  $b = $d->query("SELECT body FROM page WHERE url = \"wx:box\"")->fetchColumn();
                  file_put_contents("wx.json",
                    is_string($b) && $b !== "" ? $b : "{\"points\":[]}");' || true

      # api.php answers with an error object rather than a non-zero exit when upstream dies. Fail
      # here instead of publishing it: a failed bake leaves the last good deployment on the site.
      - name: Check the payload
        run: |
          php -r '$j = json_decode(file_get_contents("api.json"), true);
                  $n = count($j["stations"] ?? []);
                  echo "stations: $n\nsources: ", json_encode($j["sources"] ?? []), "\n";
                  exit($n > 100 ? 0 : 1);'

      # The build. It bundles and minifies the front end, names every output by its content, and
      # writes `site/`. It replaces a hand-written cp list and a `sed` on one line of js/config.js.
      # Every rule that list carried now lives in build.mjs, next to the reason for it: which files
      # are optional, which must fail the bake when missing, and the STATIC flip.
      #
      # `--static` is what makes this the Pages build. It flips STATIC and leaves the PHP out, since
      # Pages runs none. The cold load fell from 371 KB brotli to 66 KB, because a reader stops
      # paying for the comments that carry this app's reasoning. See docs/FEATURES.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run build:static

      # Pages serves no dotfile by default, and Jekyll would otherwise try to process the output.
      - run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
