<!-- The wordmark draws only where it fits, and it never clips. This check measures that in rendered
     pixels. Two ways it fails silently. A threshold that is too low draws a word wider than its box,
     which clips. A selector that loses on specificity draws nothing, which looks exactly like a
     box that is too narrow. A third fault is new with the rebrand. The wordmark face is Archivo
     Expanded, and a font that fails to load falls back to Roboto, which is narrower. The word then
     fits, the check passes, and the brand is wrong. So this file also asks the browser whether the
     face loaded.

     **The heading has TWO homes, and it is measured in both.** Below 600px it sits in the app bar.
     Above 600px the navigation rail holds it. A SHUT rail draws no heading at all. An OPEN rail is
     164px and draws the mark and the word `FLOOD WATCH` at 13px. The phone bar draws the same
     lockup from 360px, and the mark alone under it. See `#brand` and `#rail #brand` in
     css/chrome.css.

     **Four boxes, four fixed answers, and no ladder.**
       rail, shut           nothing at all
       rail, open           the mark and the word, and the word fits
       phone bar, 360+      the mark and the word, clear of both button groups
       phone bar, <360      the mark alone, and the word stays in the page for a screen reader

     **Nothing is hard-coded about the fit.** The mark's own width and the heading's own `gap` are
     read back, so a change to either fails here rather than on somebody's screen.

     **300 to 319px are probed on purpose, not rounded off to 320.** `NARROW_PX` in js/config.js
     blocks the whole page under 300px, so this is the narrowest real width the phone header ever
     has to answer for, and the check reads that constant rather than a copy of it.

     chrome --headless=new --dump-dom title-test.html -->
<title>Wordmark</title>
<style>body { font: 13px/1.5 monospace; margin: 16px } .f { color: #b00 }</style>
<pre id="out">running…</pre>
<script>
const rows = [], fail = [];
/* Reachability, not just fit. Three boxes, tracked apart, because each one is supposed to draw a
   DIFFERENT fixed answer, and a combined tally could not tell "always right" from "right
   somewhere". */
const railShutDrawn = new Set(), railOpenWord = new Set(), phoneWord = new Set(), phoneMark = new Set();

/* One reading of the lockup, wherever it is. `box` is the container the query measures, `need` is
   what the drawn word actually asks for: its own width, the mark beside it and the gap between the
   two, all read back rather than stated here. */
function read(d, win) {
  const h = d.getElementById('brand');
  if (!h) return { err: 'no #brand in the document' };
  const word = h.querySelector('.word'), mark = h.querySelector('.mark');
  if (!word || !mark) return { err: '#brand lost its .word or its .mark' };
  const shown = s => win.getComputedStyle(s).display !== 'none';
  const gap = parseFloat(win.getComputedStyle(h).gap) || 0;
  const home = h.closest('#rail') ? 'rail' : h.closest('header') ? 'bar' : '???';
  /* **`display: none` on an ANCESTOR is invisible to `getComputedStyle` on the child.** A shut rail
     hides `.railbrand`, and the word inside still computes the display its own rule states.
     `getClientRects()` is the question that survives that: it is empty when nothing draws,
     whichever ancestor decided it. */
  if (!h.getClientRects().length)
    return { home, box: 0, drawn: false, word: false, need: 0, txt: '(not drawn)' };
  const wr = word.getBoundingClientRect();
  /* The phone bar keeps the word in the page and clips it to one pixel. So "drawn" means a box a
     reader can see, and "in the page" means `display` is not `none`. */
  const visible = shown(word) && wr.width > 2;
  return {
    drawn: true, home,
    box: h.clientWidth,
    word: visible,
    inPage: shown(word),
    txt: word.textContent,
    mark: shown(mark) && mark.getBoundingClientRect().width > 0,
    need: visible ? wr.width + mark.getBoundingClientRect().width + gap : 0,
    clipped: visible && word.scrollWidth > word.clientWidth + 1,
    font: visible ? win.getComputedStyle(word).fontFamily : '',
    loaded: visible ? d.fonts.check('900 13px Archivo') : null,
  };
}

const check = (label, r) => {
  if (r.err) return fail.push(`${label}: ${r.err}`);
  rows.push(`${label.padEnd(20)} ${r.home.padEnd(5)} box ${String(r.box).padStart(4)}px  ` +
            `${r.word ? `word, needs ${r.need.toFixed(0)}px` : r.drawn ? 'mark alone' : '(not drawn)'}`);
  if (r.word && r.need > r.box + 1)
    fail.push(`${label}: "${r.txt}" wants ${r.need.toFixed(0)}px of a ${r.box}px box`);
  if (r.clipped) fail.push(`${label}: the word clips inside its own box`);
  if (r.word && !/^"?Archivo/.test(r.font)) fail.push(`${label}: the word draws in ${r.font}, not Archivo`);
  if (r.word && !r.loaded) fail.push(`${label}: Archivo is declared and has not loaded`);
  return r;
};

(async () => {
  /* NARROW_PX is read out of the source rather than copied here, the same rule narrow-test.html
     already states: a check carrying its own copy of a constant reports on the number it
     remembers, not on the one the app uses. */
  /* **`?base=/site/` runs this check against the built output instead of against the source.** Both
     targets are real. The source is what a person edits, and `site/` is what a browser gets. A check
     that only ever reads the source guards nothing about what ships. The default is the source, so a
     plain run behaves as it always did. See build.mjs.
     The `NARROW_PX` fetch below stays on the source on purpose. It reads a constant out of a file
     the build bundles away, and the value is the same on both targets. */
  const BASE = new URLSearchParams(location.search).get('base') || '/';
  const NARROW_PX = +(await (await fetch('js/config.js')).text()).match(/NARROW_PX\s*=\s*(\d+)/)[1];
  /* **`#railToggle` writes the REAL `localStorage` of `flood-exp.test`, because every iframe here
     loads the same `index.html` a reader's own browser does.** Snapshot the stored `prefs` once,
     before the first `railShut()` can touch it, and put it back in a `finally` around the whole
     sweep — so a run of this file costs a reader nothing in their own stored rail preference,
     pass or throw. The outer page shares the iframes' own origin, so `localStorage` here already
     is their storage; there is no frame to reach into. */
  const origPrefs = localStorage.getItem('prefs');
  const W = [1600, 1400, 1280, 1200, 1100, 1000, 900, 800, 700, 601, 600, 480, 414, 360, 320,
             ...Array.from({ length: 320 - NARROW_PX }, (_, i) => 319 - i)];
  try {
  for (const w of W) {
    const f = document.createElement('iframe');
    f.style.cssText = `width:${w}px;height:800px;border:0;position:absolute;left:-9999px`;
    f.src = BASE + 'index.html';
    document.body.append(f);
    await new Promise(r => f.addEventListener('load', r, { once: true }));
    await new Promise(r => setTimeout(r, 700));            // the map settles, the bar reflows
    const d = f.contentDocument, win = f.contentWindow;
    /* **Every iframe shares one `localStorage`, so the rail's preference leaks between widths.** The
       second frame LANDS with whatever the first left, and a shut-rail assertion then reads an open
       one. It failed on every other width, which reads as a flapping check rather than as shared
       state.
       **Press the control, never rewrite the blob.** `PREFS` is read into memory once per frame, so
       a later write to storage leaves the module holding the old value and the next press flips
       away from the state the check just set. Driving the real control is the only thing that keeps
       the two in step, and it is the path a reader takes. */
    const railShut = () => {
      if (d.body.classList.contains('railopen')) d.getElementById('railToggle').click();
    };
    railShut();
    await new Promise(r2 => setTimeout(r2, 60));
    /* Motion off before anything is measured. The rail transitions its own width, and headless
       virtual time does not run a transition faithfully — it freezes it at the start value, which
       reads as a rail that never opened. Every check in this repo states the same rule. */
    d.head.insertAdjacentHTML('beforeend', '<style>*{transition:none !important}</style>');

    const wide = w > 600;
    const r = check(`${w}px${wide ? ' shut' : ''}`, read(d, win));
    if (r && !r.err) {
      /* The heading belongs to the layout that has room for it. A phone has no rail to put it in,
         and above 600px the app bar is the ticker's strip. */
      const want = wide ? 'rail' : 'bar';
      if (r.home !== want) fail.push(`${w}px: the heading is in the ${r.home}, not the ${want}`);
      /* **A shut rail draws no heading at all.** The repository owner asked for that on 2026-08-24:
         a collapsed rail carries the destinations and nothing else. */
      if (wide && r.drawn) fail.push(`${w}px: a shut rail drew "${r.txt}" rather than nothing`);
      if (wide) railShutDrawn.add(r.drawn);
      /* The phone bar has two answers, split at 360px since 2026-11-27. From 360px it draws the
         rail's lockup, the mark and the word. Under 360px it draws the mark alone. The word stays in
         the page there, clipped, so a screen reader still reads the heading. */
      if (!wide) {
        const full = w >= 360;
        if (full && !r.word) fail.push(`${w}px: the phone bar drew no word beside the mark`);
        if (!full && r.word) fail.push(`${w}px: the phone bar drew the word "${r.txt}" under 360px`);
        if (!r.mark) fail.push(`${w}px: the phone bar lost its mark`);
        if (!r.inPage || !/flood watch/i.test(r.txt))
          fail.push(`${w}px: the word left the page, so a screen reader reads no heading`);
        /* The lockup is centred on the window, so it must clear both 40px button groups. */
        if (r.word) {
          const b = d.getElementById('brand').getBoundingClientRect();
          const l = d.querySelector('header .hlead').getBoundingClientRect();
          const t = d.querySelector('header .hactions').getBoundingClientRect();
          if (b.left < l.right || b.right > t.left)
            fail.push(`${w}px: the lockup ${b.left.toFixed(0)}-${b.right.toFixed(0)} overlaps a button group`);
        }
        (full ? phoneWord : phoneMark).add(r.word);
      }
    }

    /* The open rail is the desktop's own box, and it is the half a reader actually reads. */
    if (wide) {
      d.getElementById('railToggle').click();
      await new Promise(r2 => setTimeout(r2, 120));
      const o = check(`${w}px open`, read(d, win));
      if (o && !o.err) {
        if (!o.word) fail.push(`${w}px: an open rail drew no word at all`);
        if (o.box <= r.box) fail.push(`${w}px: opening the rail did not widen the heading's box`);
        if (!o.mark) fail.push(`${w}px: an open rail lost its mark`);
        railOpenWord.add(o.word);
      }
    }
    f.remove();
  }
  } finally {
    // Whatever the reader's own browser held before this run touched the rail preference — put
    // it back, pass or throw. `null` means the key was never set at all.
    if (origPrefs === null) localStorage.removeItem('prefs');
    else localStorage.setItem('prefs', origPrefs);
  }
  /* **Reachability, not just fit.** Every width above only ever checked that whatever drew fit its
     own box, and a box frozen on one answer passes that forever. What they cannot see is a rule that
     is individually correct at every width and yet never draws the word. So each box's own SET of
     answers is asserted here, and each must hold exactly one. */
  if (railShutDrawn.size !== 1 || !railShutDrawn.has(false))
    fail.push(`rail, shut drew a heading at some width: ${[...railShutDrawn]}`);
  if (railOpenWord.size !== 1 || !railOpenWord.has(true))
    fail.push(`rail, open did not always draw the word: ${[...railOpenWord]}`);
  if (phoneWord.size !== 1 || !phoneWord.has(true))
    fail.push(`the phone bar at 360px and up did not always draw the word: ${[...phoneWord]}`);
  if (phoneMark.size !== 1 || !phoneMark.has(false))
    fail.push(`the phone bar under 360px drew the word at some width: ${[...phoneMark]}`);
  out.innerHTML = rows.join('\n') + '\n\n' +
    (fail.length ? `<b class="f">FAIL</b>\n` + fail.join('\n') : '<b>PASS</b>');
})().catch(e => { out.innerHTML = `<b class="f">THREW</b>\n${(e && e.stack) || e}`; });
</script>
