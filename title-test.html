<!-- The wordmark shortens rather than ellipsises, and the rungs are container queries against
     measured font widths. Two ways that fails silently. A threshold that is too low draws a spelling
     wider than its box, which clips. A selector that loses on specificity draws nothing, which
     looks exactly like the bottom rung.

     **The heading has TWO homes now, and it is measured in both.** Below 600px it sits in the app
     bar, at 22px across up to 300px of rail. Above it the navigation rail holds it, at
     `title-medium` across 56px shut and 180px open. Three different boxes and two font sizes, so
     the ladder is measured rather than assumed. See `#brand` and `#rail #brand` in css/chrome.css.

     **Nothing is hard-coded about the drop.** The mark's own width and the heading's own `gap` are
     read back, so a change to either fails here rather than on somebody's screen.

     **300 to 319px are probed on purpose, not rounded off to 320.** That is where the phone
     ladder's own recalibrated crossing sits — see the comment on `#brand`'s phone `@container`
     rules in css/chrome.css. `NARROW_PX` in js/config.js blocks the whole page under 300px, so
     this is the narrowest real width the phone header ever has to answer for, and the check reads
     that constant rather than a copy of it.

     **Three rungs, not four.** There were three spellings and a fourth, `KVFW`, that no real box
     ever drew — see the reachability block at the foot of this file for the three that do, and
     where each one lives. A rung with no box to draw it in is dead weight in the markup, the CSS
     and this file alike, so it is gone from all three rather than merely disclosed as unreachable.

     chrome --headless=new --dump-dom title-test.html -->
<title>Wordmark ladder</title>
<style>body { font: 13px/1.5 monospace; margin: 16px } .f { color: #b00 }</style>
<pre id="out">running…</pre>
<script>
const RUNG = { 'w-lg': 2, 'w-md': 1 };                     // taller number, longer spelling. 0 is the drop.
const rows = [], fail = [];
/* Reachability, not just fit — see the block at the foot of the run. Three boxes, tracked apart,
   because each one is supposed to draw a DIFFERENT fixed answer or a different RANGE of answers,
   and a combined tally could not tell "always right" from "right somewhere". */
const railShutRungs = new Set(), railOpenRungs = new Set(), phoneRungs = new Set();

/* One reading of the lockup, wherever it is. `box` is the container the query measures, `need` is
   what the drawn spelling actually asks for: its own width, the mark beside it and the gap between
   the two, all read back rather than stated here. */
function read(d, win) {
  const h = d.getElementById('brand');
  if (!h) return { err: 'no #brand in the document' };
  const shown = s => win.getComputedStyle(s).display !== 'none';
  const word = h.querySelector('.word'), mark = h.querySelector('.mark');
  const on = [...word.children].filter(shown);
  const rung = shown(word) && on.length === 1 ? RUNG[on[0].className] : 0;
  const gap = parseFloat(win.getComputedStyle(h).gap) || 0;
  return {
    home: h.closest('#rail') ? 'rail' : h.closest('header') ? 'bar' : '???',
    box: h.clientWidth, rung, count: shown(word) ? on.length : 0,
    txt: rung ? on[0].textContent : '(logo)',
    need: rung ? on[0].getBoundingClientRect().width + mark.getBoundingClientRect().width + gap : 0,
  };
}

const check = (label, r) => {
  if (r.err) return fail.push(`${label}: ${r.err}`);
  rows.push(`${label.padEnd(20)} ${r.home.padEnd(5)} box ${String(r.box).padStart(4)}px  ${r.txt}`);
  if (r.count > 1) fail.push(`${label}: ${r.count} spellings drawn at once`);
  if (r.rung && r.need > r.box + 1)
    fail.push(`${label}: "${r.txt}" wants ${r.need.toFixed(0)}px of a ${r.box}px box`);
  return r;
};

(async () => {
  /* NARROW_PX is read out of the source rather than copied here, the same rule narrow-test.html
     already states: a check carrying its own copy of a constant reports on the number it
     remembers, not on the one the app uses. This is the floor the phone probes below need — the
     app blocks the whole page under it, so it is the narrowest real width the header ever answers
     for, and the one this ladder's phone crossing is measured against. */
  const NARROW_PX = +(await (await fetch('js/config.js')).text()).match(/NARROW_PX\s*=\s*(\d+)/)[1];
  /* **`#railToggle` writes the REAL `localStorage` of `flood-exp.test`, because every iframe here
     loads the same `index.html` a reader's own browser does.** Snapshot the stored `prefs` once,
     before the first `railShut()` can touch it, and put it back in a `finally` around the whole
     sweep — so a run of this file costs a reader nothing in their own stored rail preference,
     pass or throw. The outer page shares the iframes' own origin, so `localStorage` here already
     is their storage; there is no frame to reach into. */
  const origPrefs = localStorage.getItem('prefs');
  const W = [1600, 1400, 1280, 1200, 1100, 1000, 900, 800, 700, 601, 600, 480, 414, 360, 320,
             ...Array.from({ length: 320 - NARROW_PX }, (_, i) => 319 - i)];
  let last = 4;                                            // nothing above the longest spelling
  try {
  for (const w of W) {
    const f = document.createElement('iframe');
    f.style.cssText = `width:${w}px;height:800px;border:0;position:absolute;left:-9999px`;
    f.src = 'index.html';
    document.body.append(f);
    await new Promise(r => f.addEventListener('load', r, { once: true }));
    await new Promise(r => setTimeout(r, 700));            // the map settles, the bar reflows
    const d = f.contentDocument, win = f.contentWindow;
    /* **Every iframe shares one `localStorage`, so the rail's preference leaks between widths.** The
       second frame LANDS with whatever the first left, and a shut-rail assertion then reads an open
       one. It failed on every other width, which reads as a flapping check rather than as shared
       state.
       **Press the control, never rewrite the blob.** `PREFS` is read into memory once per frame, so
       a later write to storage leaves the module holding the old value and the next press flips
       away from the state the check just set. Driving the real control is the only thing that keeps
       the two in step, and it is the path a reader takes. */
    const railShut = () => {
      if (d.body.classList.contains('railopen')) d.getElementById('railToggle').click();
    };
    railShut();
    await new Promise(r2 => setTimeout(r2, 60));
    /* Motion off before anything is measured. The rail transitions its own width, and headless
       virtual time does not run a transition faithfully — it freezes it at the start value, which
       reads as a rail that never opened. Every check in this repo states the same rule. */
    d.head.insertAdjacentHTML('beforeend', '<style>*{transition:none !important}</style>');

    const wide = w > 600;
    const r = check(`${w}px${wide ? ' shut' : ''}`, read(d, win));
    if (r && !r.err) {
      /* The heading belongs to the layout that has room for it. A phone has no rail to put it in,
         and above 600px the app bar is the ticker's strip. */
      const want = wide ? 'rail' : 'bar';
      if (r.home !== want) fail.push(`${w}px: the heading is in the ${r.home}, not the ${want}`);
      /* A shut rail is 96px of column and the lockup is the drop alone. A word there sits beside a
         24px glyph in a box narrower than either item under it. */
      if (wide && r.rung) fail.push(`${w}px: a shut rail drew "${r.txt}" rather than the drop alone`);
      if (wide) railShutRungs.add(r.rung);
      /* Only the phone layout may widen its box as the viewport narrows, so it restarts the ladder.
         The 601/600 step changes the home as well, so it restarts there too. */
      if (!wide && w !== 600 && r.rung > last) fail.push(`${w}px: a narrower box drew a LONGER spelling`);
      if (!wide) { last = r.rung; phoneRungs.add(r.rung); }
    }

    /* The open rail is the desktop's own ladder, and it is the half a reader actually reads. */
    if (wide) {
      d.getElementById('railToggle').click();
      await new Promise(r2 => setTimeout(r2, 120));
      const o = check(`${w}px open`, read(d, win));
      if (o && !o.err) {
        if (!o.rung) fail.push(`${w}px: an open rail drew no spelling at all`);
        if (o.box <= r.box) fail.push(`${w}px: opening the rail did not widen the heading's box`);
        railOpenRungs.add(o.rung);
      }
    }
    f.remove();
  }
  } finally {
    // Whatever the reader's own browser held before this run touched the rail preference — put
    // it back, pass or throw. `null` means the key was never set at all.
    if (origPrefs === null) localStorage.removeItem('prefs');
    else localStorage.setItem('prefs', origPrefs);
  }
  /* **Reachability, not just fit.** Every width above only ever checked that whatever drew fit its
     own box, and a ladder frozen on one rung passes that forever. There is no fourth rung to lose
     that way any more -- see the comment on `#brand .word > span` in css/chrome.css for why `KVFW`
     is gone rather than disclosed as unreachable. Three rungs are real, each tied to a fixed box:

       rail, shut     56px   always the drop alone -- under even the rail's own 145px floor
       rail, open    180px   always `.w-md` -- past 145px, short of the 213px `.w-lg` needs
       phone bar   ~viewport steps `.w-md` to `.w-lg` across the 306/307px crossing

     The per-width checks above already fail the moment any one reading breaks its own row of that
     table -- a shut rail drawing a word, an open rail drawing `.w-lg`, a phone width fitting nothing
     it drew. What they cannot see on their own is a ladder that is individually correct at every
     width yet frozen on one answer throughout -- the exact shape a dead threshold left behind
     before this fix. So each box's own SET of drawn rungs is asserted here: the two fixed boxes for
     holding to their one answer, and the phone bar for visiting both of its own. */
  if (railShutRungs.size !== 1 || !railShutRungs.has(0))
    fail.push(`rail, shut drew rung ${[...railShutRungs]}, not only the drop`);
  if (railOpenRungs.size !== 1 || !railOpenRungs.has(RUNG['w-md']))
    fail.push(`rail, open drew rung ${[...railOpenRungs]}, not only .w-md`);
  if (phoneRungs.size !== 2 || !phoneRungs.has(RUNG['w-md']) || !phoneRungs.has(RUNG['w-lg']))
    fail.push(`the phone bar drew rung ${[...phoneRungs]}, not both .w-md and .w-lg`);
  out.innerHTML = rows.join('\n') + '\n\n' +
    (fail.length ? `<b class="f">FAIL</b>\n` + fail.join('\n') : '<b>PASS</b>');
})().catch(e => { out.innerHTML = `<b class="f">THREW</b>\n${(e && e.stack) || e}`; });
</script>
