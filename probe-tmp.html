<!doctype html><meta charset=utf-8><title>probe</title><pre id="out">running...</pre>
<iframe id="f" src="/index.html" style="width:1200px;height:900px;border:0"></iframe>
<script type="module">
const out = document.getElementById('out'); const say = t => out.textContent += '\n' + t;
const f = document.getElementById('f');
await new Promise(r => f.addEventListener('load', r, { once: true }));
await new Promise(r => setTimeout(r, 6000));
const d = f.contentDocument;
const s = document.createElement('script'); s.type = 'module';
s.textContent = `
  try {
  import('/js/map.js');
  } catch(e) { window.__err = e.message; }
  import { openSide } from '/js/map.js';
  import { sitePopup } from '/js/popup.js';
  import { state } from '/js/state.js';
  const one = state.data.stations.find(x => x.kind === 'rainfall');
  openSide('probe1', sitePopup([one]));
  window.__one = document.getElementById('sideKinds').innerHTML;
  const g = {}; for (const x of state.data.stations) (g[x.site] ||= []).push(x);
  const mast = Object.values(g).find(a => a.length > 2);
  openSide('probe2', sitePopup(mast));
  window.__mast = document.getElementById('sideKinds').innerHTML;
  window.__body = document.getElementById('sideBody').firstElementChild?.className;
  window.__n = state.data?.stations?.length;
`;
d.body.appendChild(s);
await new Promise(r => setTimeout(r, 800));
say('single-sensor #sideKinds: ' + (f.contentWindow.__one || '(EMPTY)').slice(0, 160));
say('mast        #sideKinds: ' + (f.contentWindow.__mast || '(EMPTY)').slice(0, 240));
say('body first element     : ' + f.contentWindow.__body);
say('err: ' + f.contentWindow.__err);
say('stations: ' + (f.contentWindow.__n));
</script>
