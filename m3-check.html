<!doctype html>
<meta charset="utf-8">
<title>M3 surface check</title>
<!--
  Every M3 surface in this app, in rendered pixels. There are three components and each has two
  variants, and the whole point of this file is that a surface cannot quietly become the wrong one.

    DIALOGS   #dataBox #camBox #aboutBox #helpBox
              #settingsBox                          full-screen < 600px, basic above
              #lightbox #warnBox #confirmBox        basic at every width
              #eggBox #narrowBox                    exempt, each for a stated reason
    LISTS     the two saved lists, the developer group   M3 segmented, with a switch, an icon
              every alert group in the On alert pane      M3 segmented, under an assist chip
                                                         button, a snackbar and a confirmation
    SHEETS    #side                                 side sheet >= 601px, bottom sheet <= 600px
    BANDS     the four dialogs across M3's window size classes

  Transcribed from the M3 Expressive component set, so every number here is greppable against a
  real file rather than eyeballed:
    https://github.com/bczak/m3you/tree/development/src/components

  Six faults this guards, and five of them shipped during the work.

  A bare `.modalhead` rule reached two basic dialogs and moved their close button to the leading
  edge of a 56px bar while the box around them stayed a floating card. Hence the roll call.

  A dialog that scrolls ITSELF runs its scrollbar the full height of the pane and past the header,
  and a sticky header there pins to the scroller's PADDING box, so `top: 0` holds it 18 or 20px down.
  Every dialog holds a body that scrolls instead.

  The 56dp headline start drifts invisibly across panes built from four different paddings.

  The browser's own stylesheet caps every dialog at `calc(100% - 6px - 2em)`, which is wider than
  the pane in three of four bands, so it bites in one and three look right.

  A furniture box translated by a token whose phone override had gone pushed the legend past the
  viewport, which
  pushed the legend past the viewport, put a scrollbar on the document, shortened the ICB and left
  BOTH bottom sheets 15px above the edge they are anchored to. A layout fault two elements away.

  And a drag handle drawn over a gesture nobody wired up is a promise the panel does not keep.

  Motion has to be read BEFORE this file switches transitions off, or `getComputedStyle` reports the
  override rather than the rule. `settle()` is a separate call for that reason.

  Run:
    chrome --headless=new --disable-gpu --ignore-certificate-errors \
      --virtual-time-budget=180000 --window-size=1600,1000 --dump-dom \
      https://flood-exp.test/m3-check.html
-->
<style>
  body { font: 13px/1.5 monospace; margin: 12px; }
  iframe { border: 0; position: absolute; left: -4000px; }
  pre { white-space: pre-wrap; }
</style>
<iframe id="phone" src="/index.html" style="width:360px;height:760px"></iframe>
<iframe id="desk" src="/index.html" style="width:1200px;height:800px"></iframe>
<pre id="out">running...</pre>
<script>
const out = document.getElementById('out');
let bad = 0, done = 0;
const say = s => { out.textContent += s + '\n'; };
const is = (got, want, name) => {
  const ok = got === want;
  if (!ok) bad++;
  say((ok ? 'ok   ' : 'FAIL ') + name + '  -> ' + JSON.stringify(got) + (ok ? '' : '  want ' + JSON.stringify(want)));
};

/* `settle()` is separate from `ready()`, and that is the whole reason this reads correctly.
   Headless virtual time does not run a transition or a keyframe faithfully, so geometry has to be
   measured with both switched off. But the override is what `getComputedStyle` then reports, so an
   animation read after it comes back `none` on markup that is right. Motion is asserted as a
   DECLARATION, before `settle()`. Geometry is measured after it. paint-check.html states the same
   rule. */
function ready(id) {
  return new Promise(res => {
    const f = document.getElementById(id);
    const go = () => setTimeout(() => {
      const d = f.contentDocument, w = f.contentWindow;
      res({
        d, w, cs: e => w.getComputedStyle(e), r: e => e.getBoundingClientRect(),
        settle: () => d.head.insertAdjacentHTML('beforeend',
          '<style>*{transition:none !important;animation:none !important}</style>'),
      });
    }, 3500);
    if (f.contentDocument && f.contentDocument.readyState === 'complete') go(); else f.onload = go;
  });
}

// M3's easing-emphasized and easing-standard are the same curve in M3's own token table.
const M3_EASE = 'cubic-bezier(0.2, 0, 0, 1)';

/* `#pane` opens from a MutationObserver on the body class, so the open is one microtask plus one
   frame behind the class that asks for it. Every assertion about the pane waits on this. */
const settled = () => new Promise(res => setTimeout(res, 120));

const DIALOGS = ['dataBox', 'camBox', 'aboutBox', 'helpBox', 'settingsBox'];

/* Run a module INSIDE the frame, so it shares that document's module map and reaches the live
   `openSide()`. Importing from this page builds a second instance with an empty state and a map
   that has no container to attach to. */
function inFrame(d, code) {
  return new Promise(res => {
    const sc = d.createElement('script');
    sc.type = 'module';
    sc.textContent = code + '\ndocument.documentElement.dataset.probeDone = "1";';
    delete d.documentElement.dataset.probeDone;
    d.body.appendChild(sc);
    const t = setInterval(() => {
      if (d.documentElement.dataset.probeDone) { clearInterval(t); res(); }
    }, 30);
  });
}

/* A card in the shape `popup.js` emits: the ⋮ and its popover first, then the name, the region and
   the badges. Fixed rather than taken from the live payload, so the assertions below cannot move
   with the weather. */
const CARD = `<div class="pophead">
    <button class="icon near" data-cam="camera-1" data-tip="Nearest webcam
KG BARU · 2.1 km"></button>
    <button class="icon fav" data-fav="a,b" data-tip="Add to favorites"></button>
    <button class="icon dots" popovertarget="probemenu"></button>
    <div class="menu" id="probemenu" popover></div>
    <div class="popname" data-go="1">SUNGAI DAMANSARA DI TTDI JAYA</div>
    <div class="muted">Shah Alam, Selangor</div>
    <div class="badges"><span class="badge" style="--c:var(--k-river)"
      ><i class="i i-water_drop"></i>Water level</span></div>
  </div>
  <div class="sensor" data-sensor="a">
    <div class="sensorhead">
      <i class="glyph i i-water_drop" style="color:var(--k-river)"></i>
      <b>Water level</b>
      <span class="muted">SG. DAMANSARA</span>
    </div>
    <ul class="sbody">
      <li><div class="subhead">Right now</div><div class="state">3.42 m</div></li>
      <li><div class="subhead">Last 9 h</div><div class="spark"></div></li>
    </ul>
  </div>
  <div class="sensor" data-sensor="b">
    <div class="sensorhead">
      <i class="glyph i i-rainy" style="color:var(--k-rainfall)"></i>
      <b>Rainfall</b>
    </div>
    <ul class="sbody"><li><div class="subhead">Right now</div><div class="state">0.0 mm/h</div></li></ul>
  </div>`;
/* `JSON.stringify` rather than a nested template literal: the card is HTML with quotes in it, and
   the escaping of a template inside a template inside an injected module is the kind of thing that
   fails at parse time and prints nothing at all. */
const OPEN_CARD = "import { openSide } from '/js/map.js'; openSide('probe', " + JSON.stringify(CARD) + ");";

/* **Every `<dialog>` in the app, and which of the three kinds it is.** The roll call is the point:
   the check reads the document for dialogs and fails on any id that is not in this table, so a new
   one cannot ship without somebody deciding what it is. A bare `.modalhead` rule once reached two
   basic dialogs and moved their close button to the leading edge while the box around them stayed a
   floating card. Nothing here caught it, because nothing here knew those two existed.
     fullscreen  full-screen below 600px, basic above it
     basic       a basic dialog at every width
     exempt      deliberately neither, and each names its reason where it is defined */
const KIND = {
  dataBox: 'fullscreen', camBox: 'fullscreen', aboutBox: 'fullscreen', helpBox: 'fullscreen',
  // Settings, added 2026-08-25. It holds the two saved lists and the developer controls.
  settingsBox: 'fullscreen',
  lightbox: 'basic', warnBox: 'basic',
  /* The reset confirmation, added 2026-08-25 in place of a native `confirm()`. **It carries no
     `.modalhead` and no close X**, and the sweep below skips those two assertions where there is no
     header. A confirmation answers with its two buttons, and a third way out states a third answer
     this dialog does not have. */
  confirmBox: 'basic',
  // A picture with no chrome at all, and a blocking state screen with no way out on purpose.
  eggBox: 'exempt', narrowBox: 'exempt',
  /* The supporting pane. It is a `<dialog>` for the compact window, where M3's canonical layout
     navigates to the supporting pane as a full-screen destination, and only a real dialog gets the
     top layer, the focus trap and an inert page. It takes a block of its own below rather than a row
     in the sweep: it is the one surface here whose kind CHANGES with the window, so the sweep's
     one-kind-per-id shape cannot describe it. */
  pane: 'pane',
};

async function phone() {
  const { d, w, cs, r, settle } = await ready('phone');
  const VW = w.innerWidth, VH = w.innerHeight;
  say('--- phone, ' + VW + 'x' + VH + ' -------------------------------------------------');

  /* --- motion, read BEFORE the override that switches it off ---
     Every dialog at once, each against the kind it is declared as. A full-screen dialog travels:
     opacity 0 with translateY(100%) at duration-short2. A basic one grows in place: opacity 0 with
     scale(.95) at duration-extra-short4. Both curves are M3's one cubic-bezier.
     **This loop is why the roll call exists.** Reading `animationName` off a settled frame returns
     `none`, so these cannot move down to the sweep below — and the sweep is where a new dialog gets
     noticed. The two halves have to agree on the table, which is the only copy of it. */
  for (const [id, kind] of Object.entries(KIND)) {
    // `pane` has its own motion assertion below: it is a full-screen dialog here and a side sheet
    // above 600px, so one row in a per-id table cannot state its enter.
    if (kind === 'exempt' || kind === 'pane') continue;
    const b = d.getElementById(id);
    b.showModal();
    const fs = kind === 'fullscreen';
    is(cs(b).animationName, fs ? 'fsOpen' : 'dlgOpen',
       id + ': ' + (fs ? 'travels up from the bottom edge' : 'grows in place'));
    is(cs(b).animationDuration, fs ? '0.3s' : '0.2s',
       id + ': M3 ' + (fs ? 'duration-short2' : 'duration-extra-short4'));
    is(cs(b).animationTimingFunction, M3_EASE, id + ': on M3 easing');
    b.close();
  }
  /* The supporting pane transitions rather than animates, so it gets the exit as well as the enter.
     **The motion is on the pane and never on an occupant.** One box travels, so switching the
     station card for the search swaps the content of a container already in place. Two sheets
     sliding through each other is what that switch looked like while each carried its own travel.
     **The two occupants are `#side` and `#findpane`.** The search is a pane occupant at THIS width
     alone, which is why every probe below runs in the compact frame. */
  /* The pane transitions on `[open]` and gets an enter AND an exit. `@starting-style` supplies the
     closed state `show()` and `showModal()` leave nothing to transition from. `allow-discrete` on
     `display` and on `overlay` is what keeps the box, and the top layer, alive across that exit.
     A keyframe bought the enter alone, so the pane arrived over 300ms and left in one frame. Both
     variants travel in from the edge they are anchored to. */
  const paneEl = d.getElementById('pane');
  d.body.classList.add('find');
  await settled();
  is(paneEl.open, true, 'the observer opens the pane when an occupant asks for it');
  const paneCs = cs(paneEl);
  is(paneCs.animationName, 'none', 'the pane transitions, so one declaration carries both directions');
  is(paneCs.transitionDuration.split(',').every(v => v.trim() === '0.3s'), true,
     'M3 duration-short2, a full-screen dialog\'s own, on every property');
  is(paneCs.transitionTimingFunction.split(/,\s*(?=cubic-bezier|ease|linear|steps)/)
       .every(v => v.trim() === M3_EASE), true, 'on M3 easing-emphasized');
  is(paneCs.transitionProperty.includes('transform'), true,
     'it travels from the edge it is anchored to');
  is(paneCs.transitionProperty.includes('overlay'), true,
     'and it holds the top layer across the exit, or the modal variant leaves behind the page');
  is(paneCs.transitionBehavior.includes('allow-discrete'), true,
     'both of those are discrete properties, so the exit is drawn at all');
  /* **One motion changes what the pane holds, and TWO events have to read it.** An occupant swapped
     for another inside `#pane` is one. A station swapped for another inside `#side` is the other.
     They were two motions for one revision, and a reader met both and asked for one. So the numbers
     are asserted on each event and then against each other.
     M3's fade through stood on the first of those two and is gone. It faded the outgoing surface
     over the first 30% of 300ms, then faded and scaled the incoming one from 92%. The reading of the
     spec was right and the result was two motions in one box. */
  /* **The exit is instant on a SWAP, and that is what a station swap does.** That one replaces the
     card with `innerHTML` and the new card fades in from nothing, so the outgoing occupant just
     stops drawing. So this has to be a real swap, with the pane open and one occupant replacing
     another. Removing every class closes the pane instead, and a closing pane is the one case an
     occupant DOES fade, or the pane slides off holding nothing. */
  d.body.classList.remove('find');
  d.body.classList.add('side');
  await settled();
  is(paneEl.open, true, 'swap: the pane stays open while its occupant is replaced');
  is(cs(d.getElementById('findpane')).transitionDuration.split(',')[0].trim(), '0s',
     'swap: the outgoing occupant leaves at once, the way a replaced station does');
  d.body.classList.remove('side');
  await settled();
  is(cs(d.getElementById('side')).transitionDuration.split(',')[0].trim(), '0.3s',
     'close: the occupant on screen fades with the pane, so nothing slides off empty');
  d.body.classList.add('find');
  await settled();
  const inCs = cs(d.getElementById('findpane'));
  is(inCs.transitionDuration.split(',')[0].trim(), '0.22s', 'swap: the incoming one takes 220ms');
  is(inCs.transitionDelay.split(',')[0].trim(), '0s', 'and it starts at once, waiting for nothing');
  is(inCs.transitionTimingFunction.split(/,\s*(?=cubic-bezier|ease|linear|steps)/)[0],
     M3_EASE, 'on M3 easing-emphasized');
  is(inCs.transitionProperty.includes('translate'), true, 'it slides in as well as fades');
  is(inCs.transitionProperty.includes('scale'), false,
     'and it does not scale: that was the fade through, and a reader cut it');
  is(cs(d.getElementById('findpane')).animationName, 'none',
     'a transition and not a keyframe, so the container itself never moves');
  /* The other event, read off the same element the app animates. Equal numbers are the assertion:
     one token feeds both, so a change to either has to move both or fail here. */
  const sideEl = d.getElementById('side');
  sideEl.classList.add('swap');
  const swapCs = cs(d.getElementById('sideTitle'));
  is(swapCs.animationDuration, inCs.transitionDuration.split(',')[0].trim(),
     'a station swap runs for exactly as long as an occupant swap');
  is(swapCs.animationTimingFunction, M3_EASE, 'on the same curve');
  sideEl.classList.remove('swap');
  d.body.classList.remove('find');
  await settled();
  settle();
  const box = e => [r(e).top, r(e).left, r(e).width, r(e).height].map(Math.round).join(',');
  const FULL = '0,0,' + VW + ',' + VH;

  /* --- the supporting pane is an M3 FULL-SCREEN DIALOG here ---
     M3's canonical supporting-pane layout hides the supporting pane in a compact window and
     navigates to it as a full-screen destination:
       https://m3.material.io/foundations/layout/canonical-examples/supporting-pane
     So this is the dialog component's full-screen variant, and it takes that variant's four:
     covers the screen, 0dp corners, no elevation, no scrim.
     **`showModal()` is the assertion that matters.** The pane drew as a `<div>` styled to look
     full-screen for one revision. That looks identical on screen and is not the same thing: only a
     modal dialog gets the top layer, a focus trap, and a page behind it that is inert. A styled div
     also cannot be covered by another dialog, and four of them open over this one.
     **One box, two occupants.** `#side` and `#findpane` are content inside the pane, so each is
     asserted against the same box. A destination that changed shape with its content is not one
     destination.

     The scrim, the drag handle and the swipe are all gone, and that is the point rather than a
     regression. They belonged to the bottom sheet this replaced. */
  const pane = d.getElementById('pane');
  /* Fill the station card through the real `openSide()` first. `#sideHead` hides itself while
     `#sideTitle` is empty — a 56px band of nothing over the readings is worse than no band — so an
     empty panel measures 0 and every header assertion below reads as broken. */
  await inFrame(d, OPEN_CARD);
  d.body.classList.remove('side');
  await settled();
  /* **No card at this width, and the radius is why it has to be a query rather than a token.** With
     `--gap` at 0 the map fills the window, and a 16px radius on a full-bleed box notches the four
     screen corners and shows the page through them. There is no second pane beside it either: the
     supporting pane is a destination over the map, so there is nothing for a card to separate from.
     M3 states a 16dp margin for a compact window. This is the divergence, and 32px off a 360px map
     is the reason. */
  const mapEl = d.getElementById('map');
  is(cs(d.documentElement).getPropertyValue('--gap').trim(), '0px', 'no card inset on a phone');
  // The rail takes no width below 600px, and the element itself does not draw.
  is(cs(d.documentElement).getPropertyValue('--rail-w').trim(), '0px', 'and the rail reads 0 too');
  is(cs(d.getElementById('rail')).display, 'none', 'so the rail element does not draw here');
  /* **The two TOP corners keep the radius here and the two bottom ones lose it.** The top edge is
     not a screen edge: `--hdr` holds the map under the app bar, so that corner is drawn against the
     page rather than notched out of it. The bottom two ARE the screen edge, and a radius there
     shows the page through them. Assert BOTH ends: a rule that rounds all four notches the screen,
     and one that rounds none loses the seam under the app bar, and one assertion cannot see both. */
  is(cs(mapEl).borderTopLeftRadius, '16px', 'the top corners keep shape-corner-large');
  is(cs(mapEl).borderBottomLeftRadius, '0px', 'and the bottom two lose it, or they notch the screen');
  is(w.getComputedStyle(mapEl, '::after').content, 'none', 'and no card edge');
  is(Math.round(r(mapEl).width), VW, 'the map is the full width of the window');

  /* **There is no button on the map at this width at all.** The layer controls became a chip row on
     2026-08-25, and the location button moved into the navigation bar's middle slot the same day. So
     the map's bottom strip holds the legend, the credit and Leaflet's own zoom cluster and nothing
     else.
     **Assert that `#locate` does not DRAW, never that it is absent.** `js/locate.js` still owns that
     node and still writes its three states onto it, and it mirrors the glyph and the words onto
     `#navLocate`. A check that read the element as gone would pass the day somebody deleted the one
     control the desktop needs. */
  is(d.getElementById('paint'), null, 'phone: the layers button is gone at every width');
  is(cs(d.getElementById('locate')).display, 'none',
     'phone: and the map draws no location button, because the bar carries one');
  is(!!d.getElementById('navLocate'), true, 'phone: which is where the location control lives here');

  /* **The credit is the lowest thing on the map here as well.** A reader stated that rule for every
     width on 2026-08-25, and `bands()` never runs a width under 700px. The phone block writes its
     own offsets for all four of these boxes, so a number that drifts there is invisible to every
     other probe in this file. */
  const cr = r(d.getElementById('credit'));
  const low = [['#legend', d.getElementById('legend')],
               ['#locate', d.getElementById('locate')],
               ['.leaflet-control-zoom', d.querySelector('.leaflet-control-zoom')]]
    .filter(([, e]) => e && r(e).width > 1 && r(e).height > 1)
    .filter(([, e]) => r(e).bottom > cr.bottom + 0.5)
    .map(([sel, e]) => `${sel} ${Math.round(r(e).bottom - cr.bottom)}px under it`);
  is(low.join(', '), '', 'phone: the credit is the lowest thing on the map');
  const lgp = r(d.getElementById('legend'));
  is(lgp.bottom <= cr.bottom + 0.5, true, 'phone: the credit never sits above the scale');
  /* At this width the row cannot hold both, so the credit takes a line of its own under the scale.
     The scale itself still states one line, which is what a reader asked for on 2026-08-25. */
  is(lgp.bottom <= cr.top + 0.5, true, 'phone: so here it sits under it');
  is(lgp.height < 30, true, 'phone: and the scale is one line');
  /* Flush LEFT at this width, against flush right on a desktop. The phone block has to cancel the
     auto margin AND the `text-align`, and the box is what reports whether it cancelled both. */
  is(Math.round(cr.left - r(d.getElementById('mapfoot')).left), 0, 'phone: the credit is flush left');
  is(Math.round(cr.left - lgp.left), 0, 'phone: on the same leading edge as the scale');

  is(pane.tagName, 'DIALOG', 'the pane is a real <dialog>, not a div dressed as one');
  is(!!d.getElementById('scrim'), false,
     'and there is no scrim left: a full-screen dialog covers the screen, so it has no outside');
  is(!!pane.querySelector(':scope > .grab'), false,
     'and no drag handle: that variant has no swipe, and a handle over no gesture is a promise');
  /* `getElementById` finds `#findpane` wherever it sits in the document, so checking it merely
     exists proves nothing about width: above 600px it lives outside the pane too, as a docked card.
     `pane.contains(...)` is the phone-only claim, and it is marked as one — the desktop pass below
     asserts the opposite shape. */
  is(pane.contains(d.getElementById('findpane')), true,
     'phone: the search sits inside the pane, because an 80px rail cannot hold a 300px field');

  /* --- the phone app bar, and the card corner under it ---
     Asked for on 2026-08-24 as the start of a new phone design. The bar came back above the map,
     holding the brand glyph centred and nothing else yet. The news stayed on the map as a pill.
     **The map keeps its own corner here, and that only works because the bar is above it.** A 16px
     radius on a full-bleed box notches the two screen corners and shows the page through them. With
     a bar over the top edge, those corners sit against the bar's own surface instead.
     **Assert the brand's CENTRE against the window's**, never a left edge. The bar centres one item
     with `justify-content`, so a box that grew would still be centred and a left-edge literal would
     read that as a fault. */
  const phoneBar = d.querySelector('header'), phoneMap = d.getElementById('map');
  is(cs(phoneBar).display !== 'none', true, 'phone: the app bar draws above the map');
  is(Math.round(r(phoneBar).height),
     parseFloat(cs(d.documentElement).getPropertyValue('--hdr')), 'phone: --hdr tall');
  is([Math.round(r(phoneBar).top), Math.round(r(phoneBar).left),
      Math.round(VW - r(phoneBar).right)].join(','), '0,0,0',
     'phone: spanning the window from its very top');
  const phoneBrand = r(d.getElementById('brand'));
  is(Math.abs((phoneBrand.left + phoneBrand.right) / 2 - VW / 2) <= 1, true,
     'phone: with the brand glyph on the centre line');
  is(d.getElementById('brand').closest('header') !== null, true,
     'phone: and the brand is in the bar, not the rail and not the news pill');
  /* **The bar's trailing actions, and the overflow menu is the only one in the group.** A reader
     asked for the More button here on 2026-08-25. It stood in the navigation bar's fifth slot, and
     that slot went to the location button.
     **The theme switch LEFT this group the same day, and that reverses what stood here.** It used to
     travel between the rail and this bar, because the rail is `display: none` at this width and a
     phone otherwise carried no theme control at all. The picker is three rows in Settings now, so a
     phone has one, and the switch never leaves the rail. This asserts both halves: the group holds
     one control, and the switch is not it.
     **Assert the trailing GLYPH centre, never a button's own edge.** 28px inside the trailing edge
     is the number every app bar in this app lands a trailing glyph on, and a control that grew
     would fail a box-edge literal while still being right.
     **And assert that the group is out of flow.** A flex item on the trailing end pushes a centred
     title off centre by half its width, which is the whole reason this is positioned. The centre
     assertion above runs with the group already in the bar, so it covers the outcome. This states
     the mechanism, so a spacer-based repair fails here rather than silently passing.
     **`popovertarget` is the whole of the wiring.** A missing attribute draws a button that opens
     nothing and errors nowhere. */
  const hact = d.querySelector('header .hactions');
  is(!!hact, true, 'phone: the app bar carries a trailing action group');
  is(cs(hact).position, 'absolute',
     'phone: out of flow, so the centred brand never sees it');
  is([...hact.children].map(c => c.id).filter(Boolean).join(','), 'navMore',
     'phone: the overflow menu alone, because the theme picker moved into Settings');
  is(d.getElementById('railApps').closest('header'), null,
     'phone: and the theme switch stays in the rail, with no second home to keep in step');
  is(d.getElementById('navMore').getAttribute('popovertarget'), 'appMenu',
     'phone: the overflow opens the menu, with no handler to keep in step');
  is(d.getElementById('apps'), null,
     'phone: and the old app bar overflow id is gone, never two More buttons at one width');
  const lastGlyph = r(hact.lastElementChild.querySelector('.i'));
  is(Math.round(VW - (lastGlyph.left + lastGlyph.right) / 2), 28,
     'phone: the trailing glyph centre sits 28px inside the window edge');

  /* --- the app bar's leading action ---
     A reader asked for the search on the leading edge on 2026-08-25. M3 gives a small top app bar a
     leading slot, and this bar had none.
     **The same three facts as the trailing group.** It is out of flow, so the brand still centres on
     the window. Its glyph centre lands 28px inside the leading edge, which is the number every app
     bar in this app lands a glyph on. And it holds the search.
     **Assert the ID, because the id is the wiring.** `js/ui.js` binds `navFind` from one handler
     table and `railSync()` writes its `aria-expanded` beside `railFind`. Both match on the suffix.
     So a rename here draws a button that opens nothing, and nothing on screen says why. */
  const hlead = d.querySelector('header .hlead');
  is(!!hlead, true, 'phone: the app bar carries a leading action group');
  is(cs(hlead).position, 'absolute',
     'phone: out of flow, so the centred brand never sees it either');
  is([...hlead.children].map(c => c.id).filter(Boolean).join(','), 'navFind',
     'phone: holding the search, and nothing else');
  const leadGlyph = r(hlead.firstElementChild.querySelector('.i'));
  is(Math.round((leadGlyph.left + leadGlyph.right) / 2), 28,
     'phone: its glyph centre sits 28px inside the leading edge');
  is(d.getElementById('navFind').closest('#navbar'), null,
     'phone: and it left the navigation bar, which is what freed the middle slot');

  /* --- the navigation bar ---
     M3 states no rail below 600px, and 80px of a 360px screen is 22% of it. The bar holds the same
     destinations, capped at the five M3 allows. Help and About go to the app bar's overflow menu.
     **Assert the ids as an ORDERED list.** Each one is its rail twin with one prefix changed, and
     `railActive()` matches on that suffix. A renamed id breaks the pairing and nothing on screen
     says so: the item still draws, and only the indicator stops following it.
     **`--navbar-h` must equal what the bar really measures**, or the map card and every box in the
     bottom strip clear the wrong distance. Read it back rather than compare two literals. */
  const nav = d.getElementById('navbar');
  is(!!nav, true, 'phone: a navigation bar draws below 600px');
  is(cs(nav).display !== 'none', true, 'phone: and it is not merely in the markup');
  is(Math.round(r(nav).height), 64, 'phone: M3 navigation bar, 64dp with no safe-area inset');
  is([...nav.querySelectorAll('.navitem')].map(b => b.id).join(','),
     'navAlerts,navLocate,navTable,navCams',
     'phone: four items, inside the three-to-five M3 states for this component');
  /* **THE LOCATION BUTTON IS NO LONGER AT THE CENTRE, and that is a cost of the panel deletion.** A
     reader asked for the middle slot on 2026-08-25, and the filters item that made five was deleted
     Four items have no centre slot, so it keeps its place in the reading order instead.
     **It has no rail twin, because the map draws `#locate` itself wherever there is room.** That is
     why this id breaks the `rail`/`nav` pairing every other item here keeps.
     **It is a destination and takes `aria-current`**, which `railSync()` writes while the "You are
     here" card is the pane's occupant. So it states no `aria-expanded`: that attribute belongs to
     the search, which reports on a pane it toggles. */
  const navIds = [...nav.querySelectorAll('.navitem')].map(b => b.id);
  is(navIds.indexOf('navLocate'), 1,
     'phone: the location button keeps its place, with no centre slot left to hold');
  is(d.getElementById('navFilters'), null,
     'phone: and no filters item, because that panel was deleted');
  is(d.getElementById('railLocate'), null,
     'phone: and it has no rail twin, because the map draws that button itself above 600px');
  is(d.getElementById('navLocate').hasAttribute('aria-expanded'), false,
     'phone: it is a destination, so it states no aria-expanded');
  is(d.getElementById('navMore').closest('#navbar'), null,
     'phone: and the overflow left this bar, which is what freed that slot');
  /* **The layers item is gone, and so is the panel it opened.** The layer controls are a chip row
     over the map since 2026-08-25. A bar item pointing at a panel that no longer exists opens
     nothing and errors nowhere, which is the fault this asserts against. */
  is(d.getElementById('navLayers'), null, 'phone: no layers item, because there is no panel');
  is(d.getElementById('paintmenu'), null, 'phone: and no panel for one to open');
  is(!!d.getElementById('mapchips'), true, 'phone: the chip row over the map is the control instead');
  is([Math.round(r(nav).bottom), Math.round(r(nav).left), Math.round(VW - r(nav).right)].join(','),
     [VH, 0, 0].join(','), 'phone: spanning the window along its bottom edge');
  is(cs(d.getElementById('rail')).display, 'none',
     'phone: and the rail does not draw at this width');
  /* **Read the map card against the bar, never `--navbar-h` against a literal.** That token holds
     `calc(64px + env(...))`, and a custom property computes to its own token stream rather than to a
     pixel. So `parseFloat` on it answers `NaN` and an assertion against it can only ever be wrong.
     The fact worth holding is what the token is FOR: the card clears the whole bar by one gap. */
  is(Math.round(r(nav).top - r(phoneMap).bottom),
     parseFloat(cs(d.documentElement).getPropertyValue('--gap')),
     'phone: the map card stops one gap above the bar');
  /* Every item splits the window evenly. A basis of `auto` sizes each to its own word, so `Cameras`
     takes more room than `Table` and the five stop reading as one row. */
  const navW = [...nav.querySelectorAll('.navitem')].map(b => Math.round(r(b).width));
  is(new Set(navW).size, 1, 'phone: four equal columns, whatever each label says');
  /* The indicator is the rail's own, drawn once and shared. A second copy drifts. */
  is(!!nav.querySelector('#navAlerts .railbadge'), true,
     'phone: the alert item carries the rail badge, not a copy of it');
  is(Math.round(r(nav.querySelector('#navAlerts .railpill')).width), 56,
     'phone: and the shared 56dp indicator pill reaches this component');
  /* **The selected LABEL takes `secondary` here, and the rail's takes `on-surface`.** That is the
     reference's own split, and this bar carried the rail's value for a whole revision. Read it
     against a probe rather than against a literal: the bridge in `css/base.css` is what resolves
     that role, so a hex here reports on the number this file remembers. */
  {
    const probe = d.createElement('div');
    probe.style.color = 'var(--md-sys-color-secondary)';
    d.body.appendChild(probe);
    const want = cs(probe).color;
    probe.remove();
    /* **Press the item, never set the attribute by hand.** `railSync()` derives `aria-current` from
       the live DOM and runs from a MutationObserver, so a hand-written attribute is cleared by the
       next body-class write and this assertion then reads an unselected item. The class that used to
       drive this is gone, so the alert list stands in. */
    const item = d.getElementById('navAlerts');
    item.click();
    await settled();
    is(cs(item).color, want,
       'phone: a selected item takes M3’s `secondary`, which is the vertical arrangement’s own');
    d.body.classList.remove('side');
    await settled();
  }
  /* **Every item answers a pointer with a state layer, and this bar had none for a revision.** A
     `:hover` cannot be driven from a script, so this is a CSSOM walk: a control with no hover rule
     draws correctly and answers nothing, which no rendered measurement can see. That is the shape
     the rail's own state-layer block already uses. */
  {
    const seen = [];
    for (const sheet of d.styleSheets) {
      let rules; try { rules = sheet.cssRules; } catch { continue; }
      /* **Test `selectorText` BEFORE recursing, never instead of it.** A `CSSStyleRule` carries its
         own `cssRules` list in every modern engine, for nested rules, and that list is a truthy
         empty object. So a walk that treats `rule.cssRules` as "this is a group" skips every style
         rule there is and reports that no rule exists. This block did exactly that and failed on
         markup that was right. */
      const walk = list => {
        for (const rule of list) {
          if (rule.selectorText && /#navbar\b/.test(rule.selectorText)
              && /:hover|:active/.test(rule.selectorText)
              && rule.style.getPropertyValue('background')) seen.push(rule.selectorText);
          if (rule.cssRules) walk(rule.cssRules);
        }
      };
      walk(rules);
    }
    is(seen.some(s => /:hover/.test(s) && !/aria-current/.test(s)), true,
       'phone: a bar item declares a hover state layer');
    is(seen.some(s => /aria-current[^)]*:hover/.test(s)), true,
       'phone: and a SELECTED item declares its own, over its own container rather than over nothing');
    is(seen.some(s => /:active/.test(s)), true, 'phone: with a pressed layer beside it');
    /* `every` on an empty array answers true, so the count is what stops this passing vacuously the
       day the walk above breaks again. */
    is(seen.length >= 4 && seen.every(s => /\.railpill/.test(s)), true,
       'phone: every one of them on the INDICATOR, never on the whole 72px column');
  }
  is(Math.round(r(phoneMap).top), Math.round(r(phoneBar).bottom),
     'phone: the map starts where the bar ends');
  is(parseFloat(cs(phoneMap).borderTopLeftRadius) > 0, true,
     'phone: and keeps its own top corner, which only reads against a bar above it');
  is(cs(phoneMap).borderBottomLeftRadius, '0px',
     'phone: the bottom corner stays square, because that edge IS the screen edge');
  const phonePill = r(d.getElementById('ticker'));
  is(phonePill.top >= r(phoneMap).top, true, 'phone: the news pill sits inside the map, not above it');
  is([Math.round(phonePill.left - r(phoneMap).left),
      Math.round(r(phoneMap).right - phonePill.right)].join(','), '12,12',
     'phone: on the same 12px furniture inset the desktop card uses');
  /* **The search is in this loop for the pane assertions and NOT for the header ones.** M3 gives a
     search view no title bar: its own search bar is the header, and it carries the back arrow. So
     the pane's `#findHead` is gone, and the block guarded below is the block that measured it. */
  for (const [id, cls, name] of [['side', 'side', 'station panel'],
                                 ['findpane', 'find', 'search']]) {
    d.body.classList.add(cls);
    await settled();
    const b = r(pane);
    is(pane.open, true, name + ': asking for an occupant opens the pane');
    is(pane.matches(':modal'), true, name + ': through showModal(), so the page behind is inert');
    is(cs(d.getElementById(id)).display, 'flex', name + ': and its occupant draws');
    is([b.top, b.left, b.width, b.height].map(Math.round).join(','), '0,0,' + VW + ',' + VH,
       name + ': fills the screen, app bar included');
    is(cs(pane).borderTopLeftRadius, '0px', name + ': M3 0dp corner');
    /* **The header is M3's medium flexible top app bar at BOTH widths, and only the close moves.**
       A full-screen dialog puts its X on the leading edge, where the side sheet above 600px trails
       it. `order`, not `row-reverse`: reversing the row puts the trailing actions between the X and
       the title, and M3 keeps them at the far end.
       **Assert the glyph CENTRE, never the box edge.** The app bar's top row is 4px of padding
       around a 48px target. The other four full-screen dialogs are 8px around a 40px one. Both land
       the glyph on 28px, so the centre is the fact that survives either convention. */
    if (id !== 'findpane') {
      const hd = d.querySelector('#sideHead');
      const x = d.getElementById('sideClose');
      const xr = r(x);
      is(Math.round(r(hd).height) >= 112, true, name + ': M3 112dp medium flexible app bar');
      is(Math.round((xr.left + xr.right) / 2), 28,
         name + ': its back arrow leads, with the glyph 28px in as every full-screen bar here has it');
      is(!!x.querySelector('.i-arrow_back'), true, name + ': and it is an arrow, not a close X');
      is(Math.round(xr.bottom) <= Math.round(r(hd.querySelector('.apflex')).top), true,
         name + ': and the headline sits on the row under it, which is what makes this the medium bar');
    }
    is(cs(pane).boxShadow, 'none', name + ': and no elevation');
    is(w.getComputedStyle(pane, '::backdrop').backgroundColor, 'rgba(0, 0, 0, 0)',
       name + ': no scrim, which M3 leaves out of this variant');
    /* The map keeps its whole width. A full-screen destination covers the map rather than sitting
       beside it, so `--pane-w` has to stay 0 at this width however the pane is drawn. */
    is(Math.round(r(d.getElementById('map')).width), VW,
       name + ': the map keeps its full width, because a destination takes none of it');
    is(Math.round(r(d.getElementById('legend')).right) <= VW, true,
       name + ': nothing steps aside, so nothing overflows the document');
    d.body.classList.remove(cls);
    await settled();
    is(pane.open, false, name + ': and closing the occupant closes the pane');
  }
  /* --- the full-screen search view, below 600px ---
     **It was a dropdown here and M3 says it is a screen.** base.css floats `#gotoHits` under the
     field with `position: absolute; top: 100%`, outlines it, caps it at 46vh and puts an
     `expand_more` caret in the field. Under a 112px `Go to` title bar, that read as a form control
     on a page. `Search/search.css` gives this variant a 72px bar carrying the back arrow, a divider
     under it, and the results filling the rest of the screen.
     **Every one of those five faults is invisible on its own.** A floating list inside a full-screen
     surface looks like a design, and only reading the boxes apart tells them apart. */
  d.body.classList.add('find');
  await settled();
  const fBar = d.getElementById('gotobar'), fHits = d.getElementById('gotoHits'),
        fBack = d.getElementById('findBack'), fBody = d.getElementById('findBody');
  is(d.getElementById('findHead'), null,
     'phone: a search view carries no title bar, so the pane header is gone');
  is(cs(fBack).display !== 'none', true, 'phone: the search bar leads with the back arrow instead');
  is(!!fBack.querySelector('.i-arrow_back'), true, 'phone: and it is an arrow, not a close X');
  const fbg = r(fBack.querySelector('.i'));
  is(Math.round(fbg.left + fbg.width / 2 - r(fBar).left), 28,
     'phone: with its glyph 28px in, as every full-screen bar in this app has it');
  is(Math.round(r(fBar).height), 72, 'phone: M3 full-screen search bar, 72px');
  is(Math.round(r(fBar).top), Math.round(r(d.getElementById('pane')).top),
     'phone: and the bar IS the top of the screen, with nothing above it');
  is(cs(fBar).borderBottomWidth, '1px', 'phone: a divider under it, not a card around it');
  is(cs(fBar).boxShadow, 'none', 'phone: and no elevation, because the surface is the screen');
  is(w.getComputedStyle(d.getElementById('gotoBox'), '::after').display, 'none',
     'phone: no caret, which is the affordance of a field that opens a list under itself');
  /* The list is `hidden` until a query runs, so this drives the real field and waits. */
  d.getElementById('goto').value = 'a';
  d.getElementById('goto').dispatchEvent(new w.Event('input', { bubbles: true }));
  await settled();
  is(cs(fHits).position, 'static', 'phone: the results are in flow, never floated under the field');
  is(Math.round(r(fHits).top), Math.round(r(fBar).bottom),
     'phone: they start where the bar ends');
  is(Math.round(r(fHits).bottom), Math.round(r(fBody).bottom),
     'phone: and run to the foot of the screen, rather than stopping at a 46vh cap');
  is(cs(fHits).borderRadius, '0px', 'phone: no corner, because it is the screen and not a card');
  is(cs(fHits).borderTopWidth, '0px', 'phone: and no outline around it either');
  is(Math.round(r(fBody).bottom) <= VH, true, 'phone: the whole view stays inside the screen');
  d.getElementById('goto').value = '';
  d.getElementById('goto').dispatchEvent(new w.Event('input', { bubbles: true }));
  d.body.classList.remove('find');
  await new Promise(res => setTimeout(res, 200));
  /* Escape reaches a modal dialog natively as `cancel`. The body classes have to follow the element,
     or the observer reopens the pane on the next class write with nothing having changed. */
  d.body.classList.add('side');
  await settled();
  is(pane.open, true, 'the pane is open before the native close, or the next line proves nothing');
  /* **Wait on the event, never on a timer.** `close` is fired as a queued element task, and headless
     virtual time fast-forwards a `setTimeout` past it: measured, a 300ms wait resolved BEFORE the
     event was delivered, so a correct handler read as a broken one. */
  const shut = new Promise(res => pane.addEventListener('close', res, { once: true }));
  pane.close();
  await shut;
  await settled();
  is(d.body.className.includes('side'), false,
     'a native close clears the body class, so the element and the state cannot drift');

  // --- the four dialogs ---
  for (const id of DIALOGS) {
    const b = d.getElementById(id);
    b.showModal();
    is(box(b), FULL, id + ' fills the screen');
    is(cs(b).borderTopLeftRadius, '0px', id + ': M3 0dp corner');
    const mh = b.querySelector('.modalhead'), x = b.querySelector('.dclose'), h2 = mh.querySelector('h2');
    /* **These four wear the same medium flexible app bar the pane does.** A column, so the icons take
       a row of their own and the headline takes the row under them. They were M3's small variant, one
       56px row with the X and the headline side by side, and a reader put them on the pane's. */
    is(cs(mh).flexDirection, 'column', id + ': a column, so the icons and the headline are two rows');
    is(Math.round(r(mh).height) >= (h2 ? 112 : 56), true,
       id + ': M3 112dp with a headline, and the 56dp top row without one');
    /* The glyph centre, never the box edge. These four reach 28px as 8px of padding around a 40px
       target where the pane reaches it as 4px around a 48px one. */
    is(Math.round((r(x).left + r(x).right) / 2), 28, id + ': its arrow leads with the glyph 28px in');
    // About carries no headline: M3 marks it optional and that pane's identity is its logo lockup.
    if (h2) {
      is(Math.round(r(h2).top) >= Math.round(r(x).bottom), true,
         id + ': the headline sits on the row under the icons');
      is(cs(h2).fontSize, '28px', id + ': at headline-medium, the rung the pane takes');
      is(Math.round(r(h2).left) <= 20, true,
         id + ': starting on the pane padding rather than beside a button that is no longer there');
    }
    is(w.getComputedStyle(b, '::backdrop').backgroundColor, 'rgba(0, 0, 0, 0)',
       id + ': no scrim, because there is no outside');
    /* **No line under a full-screen header.** The fourth surface in this app to lose one, after the
       map card, the app bar and the supporting pane. `#dataBox` and `#camBox` carry theirs on
       `.dtop` rather than on `.modalhead`, because that box holds the filter field too. */
    const dtop = b.querySelector('.dtop');
    is(cs(dtop || mh).borderBottomWidth, '0px', id + ': no line under the header');
    b.close();
  }
  /* **The prose dialogs scroll a BODY, and the dialog itself never scrolls.** A reader asked for
     that on 2026-08-25: the scrollbar belongs inside the pane, under the header, rather than up the
     whole box and past the bar. So the header is a fixed row and `.docbody` is the scroller. */
  for (const id of ['helpBox', 'aboutBox']) {
    const b = d.getElementById(id);
    b.showModal();
    const mh = b.querySelector('.modalhead'), body = b.querySelector('.docbody');
    body.scrollTop = 600;
    is(b.scrollTop, 0, id + ': the dialog itself does not scroll');
    is(Math.round(r(mh).top), 0, id + ': header holds the top while the body scrolls under it');
    // Never == VW: a classic scrollbar takes width off the scrollport in headless and the bar
    // correctly stops beside it. A phone's overlay scrollbar takes none.
    is(Math.round(r(mh).width) >= VW - 20, true, id + ': header is full bleed');
    b.close();
  }

  // --- every dialog is accounted for, and each obeys the kind it is declared as ---
  const found = [...d.querySelectorAll('dialog')].map(x => x.id).sort();
  is(found.filter(id => !KIND[id]).join(','), '',
     'every <dialog> in the app is in the roll call — a new one needs a kind, not a default');
  is(Object.keys(KIND).filter(id => !found.includes(id)).join(','), '',
     'and every id in the roll call is still in the document');

  for (const [id, kind] of Object.entries(KIND)) {
    /* `pane` is skipped here and asserted in its own blocks. It is the one surface whose kind
       CHANGES with the window — full-screen dialog below 600px, standard side sheet above — so the
       one-kind-per-id shape this sweep is built on cannot describe it. It stays in the roll call so
       the two completeness assertions above still account for it. */
    if (kind === 'exempt' || kind === 'pane') continue;
    const b = d.getElementById(id);
    b.showModal();
    const mh = b.querySelector('.modalhead'), x = b.querySelector('.dclose');
    if (kind === 'basic') {
      /* A basic dialog keeps its close on the TRAILING edge and never fills the screen, at any
         width. M3 puts the full-screen variant behind a task with steps, keyboard input or a nested
         dialog, and none of these is that.
         **The header assertions run only where there IS a header.** `#confirmBox` carries none: a
         confirmation answers with its two buttons, and M3 marks the close X optional on this
         variant. The two below hold for every basic dialog either way. */
      if (mh) {
        is(cs(mh).flexDirection, 'row', id + ' (basic): × stays on the trailing edge, even on a phone');
        is(Math.round(r(x).right) < VW - 8, true, id + ' (basic): and inside the pane, not against it');
      }
      is(cs(b).borderTopLeftRadius, '28px', id + ' (basic): M3 28dp corner');
      is(Math.round(r(b).width) < VW, true, id + ' (basic): does not fill the screen');
    } else {
      is(cs(mh).flexDirection, 'column', id + ' (full-screen): a two-row app bar, X on the top row');
      is(Math.round(r(b).width), VW, id + ' (full-screen): fills the screen');
      is(cs(b).borderTopLeftRadius, '0px', id + ' (full-screen): M3 0dp corner');
    }
    b.close();
  }

  /* --- the ways out ---
     M3 leaves a full-screen dialog two, and this pane has exactly those two. The close X in each
     occupant's own app bar, and the platform's own back or escape. **Neither is written in this
     app any more.** Escape and the Android back gesture reach a modal `<dialog>` natively as
     `cancel`, and `js/ui.js` used to carry a `keydown` handler gated on a width test for the same
     job. The one line still needed is the `close` listener in map.js that clears the body class, and
     the assertion above this covers it.
     The scrim and the swipe are not here to assert. They went with the bottom sheet. */
  is(!!d.getElementById('sideClose'), true, 'the station card carries a close button');
  is(!!d.getElementById('findBack'), true, 'and the search bar carries the arrow that is its own');
  d.body.classList.add('side');
  await settled();
  is(pane.matches(':modal'), true, 'the pane is modal, which is what makes Escape reach it at all');
  d.body.classList.remove('side');
  await settled();
}

async function desktop() {
  const { d, w, cs, r, settle } = await ready('desk');
  say('--- desktop, ' + w.innerWidth + 'x' + w.innerHeight + ' ----------------------------------');

  // --- motion, read BEFORE the override ---
  /* **The map card resizes on a transition, and that is the whole of the pane's arrival on screen.**
     It snapped for one revision, on the argument that animating the width makes Leaflet resize on
     every frame. It does, and that is what keeps live tiles in the card as it grows rather than
     revealing a blank strip for 300ms. `right` for the pane's own arrival, `left` for the rail's:
     the navigation rail now runs the full height on the leading edge, and the map's own leading
     inset has to travel with it. `--m3-travel` (pane) and `--m3-rail` (rail) cite the same M3 curve
     — M3's own token table gives `easing-emphasized` and `easing-standard` the same one — and they
     carry DIFFERENT durations since 2026-08-25. The rail's travel re-rasters the map card every
     frame, so it took `duration-extra-short3` and the pane kept `duration-short2`. Read the two
     edges as two values, never as one value twice: that is what tells a deliberate 150 from a rail
     that quietly lost its own timing. */
  const mapCs = cs(d.getElementById('map'));
  is(mapCs.transitionProperty, 'right, left',
     'the map card transitions its trailing edge for the pane and its leading edge for the rail');
  is(mapCs.transitionDuration, '0.3s, 0.15s',
     'the pane on M3 duration-short2, the rail on duration-extra-short3');
  is(mapCs.transitionTimingFunction, `${M3_EASE}, ${M3_EASE}`,
     'one easing on each edge — --m3-travel and --m3-rail cite the same M3 curve');

  /* The app bar's own leading edge reads the same rail motion, so it never overlaps the rail as the
     rail's width changes. Same rule, same file: read before `settle()` switches transitions off. */
  const headerCsMotion = cs(d.getElementById('ticker'));
  is(headerCsMotion.transitionProperty, 'left, right',
     'the news pill travels with the rail on one edge and with the pane on the other');
  is(headerCsMotion.transitionDuration, '0.15s, 0.3s',
     "the rail's own --m3-rail leads here, so the two read in the other order");
  is(headerCsMotion.transitionTimingFunction, `${M3_EASE}, ${M3_EASE}`,
     'and both cite the same M3 curve');

  // The M3 basic dialog: opacity 0 and scale(.95), duration-extra-short4 (200ms) on easing-standard.
  // It grows in place rather than travelling, which is the within-screen-bounds pattern.
  for (const id of DIALOGS) {
    const b = d.getElementById(id);
    b.showModal();
    is(cs(b).animationName, 'dlgOpen', id + ': M3 basic-dialog enter, a scale in place');
    is(cs(b).animationDuration, '0.2s', id + ': M3 duration-extra-short4');
    b.close();
  }
  settle();
  /* --- the supporting pane is an M3 STANDARD SIDE SHEET here, and the map is the main pane ---
     Transcribed from SideSheet/side-sheet.css. The standard variant is the one that leaves the main
     pane live beside it: `surface`, NO radius, NO elevation, and a 1px `outline-variant` line on the
     edge facing the content.
     **The map is a pane, so its box ends where this one begins.** That is the whole of the layout
     change and the whole of what can silently go wrong. A map that keeps its full width under an
     opaque pane looks identical until a reader tries to press something in the covered strip, and
     `focusOn()` then centres a station under the panel that describes it. */
  const side = d.getElementById('side');
  const pane2 = d.getElementById('pane'), mapBox = d.getElementById('map'), VW = w.innerWidth;
  const VH = w.innerHeight;
  d.body.classList.remove('side');
  await settled();

  /* --- the main pane is drawn as a card ---
     M3's canonical layout separates panes with space rather than with a line, so the map sits inside
     its own inset surface. `--gap` is that inset on three sides AND the space between the two panes
     on the fourth, because one number has to read as one margin.
     **Every silent fault here is off by exactly `--gap`.** A furniture box that misses it sits on the
     page beside the card rather than on the map. A radius without the gap notches the four screen
     corners. And an edge drawn as a `border` takes two pixels off the map instead of drawing round
     it, which is invisible until somebody measures the container. */
  const GAP = parseFloat(cs(d.documentElement).getPropertyValue('--gap'));
  const SEAM = parseFloat(cs(d.documentElement).getPropertyValue('--seam'));
  const hdr = parseFloat(cs(d.documentElement).getPropertyValue('--hdr'));
  is(GAP > 0, true, 'the map card is inset from the window at this width');
  /* Two numbers, and M3's layout names them separately: a margin holds content off the window edge
     and a spacer separates one pane from the next. `--seam` is the trailing inset alone. */
  is(SEAM > 0 && SEAM < GAP, true, 'and the space between the two panes is its own, smaller number');
  /* --- the navigation rail takes the leading edge, and the map gives up exactly that width ---
     `--rail-w` is 80px above 600px and 0 below it, which is m3.material.io's own navigation rail
     specs page rather than the Expressive file's 96. The
     rail runs the full window height now, and the app bar starts where the rail ends rather than
     the rail starting under the app bar. So this block asserts the rail's own box, the app bar's
     leading edge, and the map's leading edge. */
  const RAIL = parseFloat(cs(d.documentElement).getPropertyValue('--rail-w'));
  const railEl = d.getElementById('rail');
  is(RAIL, VW > 600 ? 80 : 0, 'the rail is 80px above 600px and takes no width below it');
  const mb = r(mapBox);
  is(Math.round(mb.left), Math.round(RAIL + GAP),
     'the map card starts after the rail plus the window margin');
  is([mb.top - hdr, VH - mb.bottom].map(Math.round).join(','),
     [GAP, GAP].join(','), 'shut, the card still sits one gap in on the top and bottom window edges');
  /* **A gap, not a seam, while the pane is shut.** `--seam` is the space between two panes, and
     with no pane beside it that edge owes the window what the other three owe. It read `--seam`
     whatever was there, so a shut pane left the card 8px from the window against 16 everywhere
     else. `--map-r` is a `max()` of the two now. */
  is(Math.round(VW - mb.right), GAP,
     'and one gap in on the trailing edge too, because no pane stands there');
  is([Math.round(mb.top), Math.round(mb.left - RAIL), Math.round(VW - mb.right),
      Math.round(VH - mb.bottom)].join(','), [GAP, GAP, GAP, GAP].join(','),
     'so all four insets are one gap with the pane shut, which is what a reader asked for');
  /* --- the news pill, above 600px ---
     The strip ran the width of the window above both panes and took 64px off the top of everything.
     It is a long pill inside the map card now, on the card's own 12px furniture inset.
     **Nothing stands above the two panes any more**, which is the whole of what this change bought:
     the map starts at `--gap` and the supporting pane starts at 0.
     **The trailing inset is `--seam` and never `--gap`.** A box measuring from the card's trailing
     edge measures across the space between the two panes. This shipped with both terms for one
     measurement, and the pill stopped 28px short of the card against 12px on the leading side. */
  const pill = r(d.getElementById('ticker')), card = r(d.getElementById('map'));
  is(Math.round(hdr), 0, 'no strip stands above the panes');
  is(Math.round(card.top), GAP, 'so the map card starts one gap from the top of the window');
  /* The pane is SHUT here, so its box measures nothing. `getComputedStyle` still answers for a
     `display: none` element, and `top` is the fact this needs. */
  is(cs(pane2).top, '0px', 'and the supporting pane starts at the very top of the window');
  is([Math.round(pill.left - card.left), Math.round(card.right - pill.right)].join(','), '12,12',
     'the pill sits 12px inside the card on both edges, the furniture inset this map already uses');
  is(pill.top > card.top && pill.bottom < card.bottom, true, 'and inside it top to bottom');
  is(Math.round(pill.height),
     parseFloat(cs(d.documentElement).getPropertyValue('--tick-h')), '--tick-h tall');
  is(parseFloat(cs(d.getElementById('ticker')).borderTopLeftRadius) >= pill.height / 2, true,
     'drawn as a pill, not a card');
  is(cs(d.getElementById('ticker')).boxShadow !== 'none', true,
     'and lifted off the map it floats on');
  /* Everything else at the top of the map clears it, through `--top-free`. Two of these are hidden
     until something puts them there, so each is measured only when it draws. */
  for (const sel of ['#pills', '#toast', '#findpane', '#mapchips']) {
    const e = d.querySelector(sel);
    if (e && r(e).height > 1 && cs(e).visibility !== 'hidden' && cs(e).display !== 'none')
      is(r(e).top >= pill.bottom - 0.5, true, sel + ' clears the news pill');
  }
  if (RAIL) {
    const rb = r(railEl);
    is([rb.left, rb.width].map(Math.round).join(','), '0,80',
       'the rail is flush with the leading edge and 80px wide');
    is(Math.round(rb.top), 0, 'and it runs the full height, starting at the top of the window');
    is(Math.round(rb.bottom), Math.round(VH), 'reaching the bottom of the window');
    is(cs(railEl).paddingTop + ' ' + cs(railEl).paddingBottom, '0px 20px',
       'no top pad: M3 reserves 44px for a status bar this app does not draw');
    const items = [...railEl.querySelectorAll('.railitem')];
    is(items.map(b => b.id).join(','),
       'railAlerts,railTable,railCams,railSettings,railHelp,railAbout',
       'six rail items, in the order the spec states');
    is(d.getElementById('railFilters'), null,
       'and no Filters item, because there is no panel for one to open');
    const first = items[0];
    is(Math.round(r(first).height), 64, 'M3 item min-height 64px');
    is(cs(first.querySelector('.i')).fontSize, '24px', 'M3 icon 24px');
    is(cs(first.querySelector('.raillabel')).fontSize,
       cs(d.documentElement).getPropertyValue('--md-sys-typescale-title-small-size').trim(),
       'M3 label title-small');
    const pill = r(items[0].querySelector('.railpill'));
    is([pill.width, pill.height].map(Math.round).join(','), '56,32',
       'M3 active indicator 56 by 32');
    /* --- the search FAB ---
       Amendment of 2026-08-24: the search leaves the item list and takes M3's own FAB slot, between
       the brand and the items. Three things fail silently here. A FAB left in the item list is a
       destination that `railActive()` can light, and this app must never draw a selected action. A
       label that leaves the flow rather than clipping makes the FAB jump between two widths instead
       of growing. And a 56px box drawn with `width` cannot grow at all, so the extended form never
       arrives. */
    const fabEl = d.getElementById('railFind');
    is(fabEl.classList.contains('railitem'), false,
       'the search FAB is not a rail item, so nothing can mark it the current destination');
    is(fabEl.previousElementSibling.className, 'railbrand',
       'it sits in M3 FAB slot, directly under the brand');
    is(fabEl.nextElementSibling.className, 'railitems',
       'and directly above the items it is not one of');
    is([r(fabEl).width, r(fabEl).height].map(Math.round).join(','), '56,56',
       'M3 medium FAB, a 56px box, Fab/fab.css');
    is(cs(fabEl).borderRadius,
       cs(d.documentElement).getPropertyValue('--md-sys-shape-corner-large').trim(),
       'M3 shape-corner-large');
    is(Math.round(r(fabEl.querySelector('.fablab')).width), 0,
       'a collapsed FAB shows no label');
    is(cs(fabEl.querySelector('.fablab')).display !== 'none', true,
       'but the label stays in the flow, or the box jumps between two widths instead of growing');
    is(cs(fabEl.querySelector('.i')).fontSize, '24px', 'M3 FAB icon 24px');
    is(Math.abs(Math.round(r(fabEl).left + r(fabEl).width / 2)
              - Math.round(r(fabEl.querySelector('.i')).left
                         + r(fabEl.querySelector('.i')).width / 2)) <= 1, true,
       'and the glyph sits on the FAB centre, not pushed off it by a gap reserved for the label');
    is(!!railEl.querySelector('hr'), true,
       'a divider separates the four destinations from Help and About');
    is(railEl.querySelector('hr').previousElementSibling.id, 'railCams',
       'and it sits after Cameras');
    is(railEl.lastElementChild.id, 'railApps', 'the theme button is the last thing in the rail');
    /* The group is still in the markup — it is the phone bar's own, and `<header>` does not draw at
       this width at all. So the claim to hold here is that nothing of it renders, never that the
       element is absent. */
    is(cs(d.querySelector('header')).display, 'none',
       'the app bar does not draw, so its trailing group cannot either');
    is(d.getElementById('railApps').closest('#rail') !== null, true,
       'and the theme switch stands at the foot of the rail, which is its one home now');
    is(cs(d.getElementById('navbar')).display, 'none',
       'the navigation bar does not draw above 600px');
    // `header > button` counts only a direct child of the bar, never a descendant.
    // The ticker holds its own buttons, one per tile in the marquee. Those are real content, not
    // a leftover control. A live alert makes `header button` count the tiles too, so the check
    // would fail on the exact case it exists to prove safe: a real flood on screen.
    is([...d.querySelectorAll('header > button')].length, 0, 'and no button at all above 600px');
    is(!!d.querySelector('.railbrand #brand'), true,
       'the brand moved into the rail above 600px, out of the app bar');

    /* --- the state layers, and the theme button's resting disc ---
       Every button in this rail answers a pointer with an M3 state layer: the surface's own content
       colour at 8% hovered and 10% pressed, over that surface's own shape.
       **A `:hover` cannot be driven from a script**, so this asserts the two halves that can fail
       silently instead. First, that the expression RESOLVES: `--m3-state-hover` is a `calc()` on a
       vendored fraction, and a `color-mix()` that cannot read it drops the whole declaration and
       leaves a button that answers nothing. A probe element carrying the same expression is what
       reads that back. Second, that every one of the four controls still DECLARES a hover rule.
       That is a CSSOM walk, because "all four" is the claim and a missing one draws correctly.
       The resting disc is the one part of this that is a real pixel, so it is measured as one. */
    {
      const probe = d.createElement('div');
      probe.style.background = 'color-mix(in srgb, var(--md-sys-color-on-surface)' +
                               ' var(--m3-state-hover), transparent)';
      d.body.appendChild(probe);
      const mix = cs(probe).backgroundColor;
      probe.remove();
      is(/0\.08\)?$/.test(mix.replace(/\s/g, '')), true,
         'the hover state layer resolves to 8% of the content colour, not a dropped declaration');

      const apps = d.getElementById('railApps');
      is(cs(apps).backgroundColor !== cs(railEl).backgroundColor, true,
         'the theme button rests on a disc, one step off the rail surface it stands on');
      is(cs(apps).backgroundColor,
         (() => { const p = d.createElement('div');
                  p.style.background = 'var(--md-sys-color-surface-container-highest)';
                  d.body.appendChild(p); const v = cs(p).backgroundColor; p.remove(); return v; })(),
         "and that disc is M3's surface-container-highest, the unselected filled icon button");
      is(Math.round(r(apps).width) + ',' + Math.round(r(apps).height), '40,40',
         'in the 40px box every icon button in this app draws');

      /* A CSSOM walk, because the claim is that NO rail button was left out. A control with no
         hover rule draws correctly and answers nothing, which no rendered measurement can see. */
      const hoverSel = [];
      for (const sheet of d.styleSheets) {
        let rules; try { rules = sheet.cssRules; } catch { continue; }
        for (const rule of rules)
          if (rule.selectorText && /#rail\b/.test(rule.selectorText)
              && /:hover/.test(rule.selectorText)
              && rule.style.getPropertyValue('background')) hoverSel.push(rule.selectorText);
      }
      const covers = re => hoverSel.some(s => re.test(s));
      is(covers(/\.railitem:hover/), true, 'a rail item declares a hover layer');
      is(covers(/aria-current[^)]*:hover/), true,
         'and a SELECTED item declares its own, over its own container rather than over nothing');
      is(covers(/\.railfab:hover/), true, 'the search FAB declares one');
      is(covers(/#railToggle:hover/), true, 'the rail toggle declares one');
      is(covers(/#railApps:hover/), true, 'and the theme button declares one over its disc');
    }

    /* --- a collapsed rail carries the destinations and nothing else ---
       Asked for on 2026-08-24. The brand, the divider, Help and About draw at 220px alone. Every
       one of these is a `display: none` on a node that stays in the document, so `querySelector`
       still finds all four and only a computed style tells them apart. */
    /* --- one column, one size ---
       Every glyph in this rail stands on one leading edge and draws at one size, at both widths.
       Three did not. The menu button and the theme button take `.icon`, which draws 22px against
       M3's 24px for a rail glyph. And an open rail leads an item with `padding-inline: 16px`, while
       those two buttons and the brand mark each started on the rail's own 20px padding edge.
       Measured before the fix: items at left 36, and 29, 20 and 29 for the three.
       **Assert the property, never the 36 and the 24.** A rail at another padding, or an icon at
       another size, still has to draw one column. A pair of literals here passes a rail that moved
       every glyph together and fails one that moved none. */
    const oneColumn = label => {
      const g = [...railEl.querySelectorAll('.i')]
        .filter(i => i.getClientRects().length).map(i => i.getBoundingClientRect());
      is(g.length >= 5, true, label + ': there are glyphs to measure, or the two below prove nothing');
      is(new Set(g.map(b => Math.round(b.left))).size, 1,
         label + ': every glyph stands on one leading edge');
      is(new Set(g.map(b => Math.round(b.width) + 'x' + Math.round(b.height))).size, 1,
         label + ': and every one of them draws at one size');
    };
    oneColumn('shut rail');

    /* --- the menu glyph names the rail's own state ---
       M3 draws `menu` on a collapsed rail and `menu_open` on an expanded one. One `menu_open` turned
       180 degrees stood here first, which names the direction of the next press instead.
       **Read `mask-image`, and compare against a probe.** A computed `--i` is not evidence that
       anything painted — `paint-check.html` states that rule from its own experience, where a rule
       resolved the right token and drew a blank plate. And the token's own text and the resolved
       `mask-image` are two different strings, so a probe wearing the icon class settles both through
       the same engine. */
    const glyphMask = cls => {
      const probe = d.createElement('i');
      probe.className = 'i ' + cls;
      d.body.appendChild(probe);
      const m = cs(probe).maskImage;
      probe.remove();
      return m;
    };
    const toggleGlyph = d.querySelector('#railToggle .i');
    is(glyphMask('i-menu') !== glyphMask('i-menu_open'), true,
       'the two menu glyphs are different pictures, or the two below prove nothing');
    is(cs(toggleGlyph).maskImage, glyphMask('i-menu'), 'shut rail: the toggle draws `menu`');
    is(cs(toggleGlyph).rotate, 'none', 'and it is not a turned `menu_open` any more');

    /* --- every rail item draws the glyph its own markup states ---
       `setDrawer()` rewrote `#railFilters`'s glyph on every landing, so a new glyph in the markup
       never drew once and reading the markup said it did. That item and that writer were deleted
       with it. The trap is a class of trap, so the assertion stays on the items that are left.
       **Assert the glyph against a probe wearing the class the MARKUP names**, at both pane states.
       A literal here would need a copy of the path data. */
    const drewAsMarkup = label => {
      for (const [id, cls] of [['railAlerts', 'i-warning'],
                               ['railTable', 'i-table'], ['railCams', 'i-photo_camera'],
                               ['railFind', 'i-search']])
        is(cs(d.querySelector('#' + id + ' .i')).maskImage, glyphMask(cls),
           label + ': ' + id + ' draws ' + cls);
    };
    d.body.classList.remove('side');
    await settled();
    drewAsMarkup('pane shut');
    d.body.classList.add('side');
    await settled();
    drewAsMarkup('pane open');
    /* **`aria-expanded` is derived, and nothing writes it at the opener.** `railSync()` reads the
       live body class, so a class written directly still reaches it. */
    d.body.classList.add('find');
    await settled();
    is(d.getElementById('railFind').getAttribute('aria-expanded'), 'true',
       'and the search states the pane is open, derived rather than written by the opener');
    d.body.classList.remove('find', 'side');
    await settled();
    is(d.getElementById('railFind').getAttribute('aria-expanded'), 'false',
       'and states it shut again when something else clears the class');

    /* --- Help draws a picture of each control, and that picture has to be the control's own ---
       A glyph changed on the rail and left behind in Help states a control that does not exist.
       Read the pair through the same engine, never the two class names. `#helpBox` is shut, and
       `getComputedStyle` answers for a `display: none` subtree, so nothing here has to open it. */
    const helpGlyph = label => [...d.querySelectorAll('#helpBox .ctl')]
      .find(c => c.textContent.trim() === label)?.querySelector('.i');
    /* **Help names each control by the word the rail draws under it**, and it did not. It carried
       `Layers and filters`, `Station table`, `All cameras` and `On alert` from the app bar that held
       those controls before the rail. One name for one thing is this repo's own rule, and a reader
       comparing the page to the page cannot follow two names.
       `Show the labels`, `Help`, `About` and `Theme` are named in Help too and have no rail glyph to
       compare against: two draw the same `flood` and `info` marks the About pane and the alert list
       already use, and the rail toggle swaps its own glyph. So the pairs below are the five that a
       drift in either file can put wrong. */
    for (const [id, label] of [['railTable', 'Table'],
                               ['railCams', 'Cameras'], ['railAlerts', 'Alerts'],
                               ['railFind', 'Go to a station']]) {
      const h = helpGlyph(label);
      is(!!h, true, 'Help names "' + label + '"');
      if (h) is(cs(h).maskImage, cs(d.querySelector('#' + id + ' .i')).maskImage,
                'and draws ' + id + "'s own glyph");
    }

    const shutHidden = ['.railbrand', 'hr', '#railSettings', '#railHelp', '#railAbout'];
    for (const sel of shutHidden)
      is(cs(railEl.querySelector(sel)).display, 'none',
         'shut rail: ' + sel + ' does not draw');
    for (const id of ['railAlerts', 'railTable', 'railCams'])
      is(cs(d.getElementById(id)).display !== 'none', true,
         'shut rail: ' + id + ' still draws, because a destination is what the rail is for');
    is(cs(d.getElementById('railFind')).display !== 'none', true,
       'shut rail: and so does the search FAB');

    /* --- the theme: a picker in Settings and a switch on the rail ---
       It held a popover carrying a three-way pill. That pill and Auto were cut on 2026-08-24, and
       the repository owner asked for Auto back on 2026-08-25 with the picker in Settings.
       **The rail glyph names the SHADE ON SCREEN, and that reverses what this block asserted.** It
       named the next press, on the argument that a reader can already see the shade. Under Auto the
       pick is a WORD, and the one thing a reader cannot read off the page is which shade that word
       resolved to.
       **So the two halves have to be asserted apart.** The glyph is the state and the words carry
       the act, and a control that got one of the two right would otherwise pass.
       `prefs` is captured and restored by the block around this one, so pressing a
       preference-owned control here costs a reader nothing. */
    const themeBtn = d.getElementById('railApps'), root = d.documentElement;
    const themeWas = root.dataset.theme;
    /* The three-way pill is gone from the MENU. `#appMenu` is back for a different job: it is the
       phone overflow, holding Settings, Help and About, which are rail items at THIS width. So the
       claim is that the menu carries no theme control, never that the element is absent. */
    is(!!d.querySelector('#appMenu #themeRow'), false,
       'the theme popover is gone: the picker is three rows in Settings now');
    is([...d.querySelectorAll('#appMenu .mi')].map(b2 => b2.id).join(','),
       'menuSettings,menuHelp,menuAbout',
       'and the menu that kept the id holds the three destinations the navigation bar cannot');
    is(themeBtn.hasAttribute('popovertarget'), false, 'and the button opens no box');
    /* **Three rows, and Auto is one of them.** They are radios in one group, because three choices
       is not a state a switch can hold — the rule that keeps the two heat layers in one string. */
    is([...d.querySelectorAll('#themeList input')].map(i2 => i2.value).join(','),
       'auto,light,dark', 'Settings holds the three choices, with Auto first');
    is(new Set([...d.querySelectorAll('#themeList input')].map(i2 => i2.type + i2.name)).size, 1,
       'as one radio group, so two answers at once is unrepresentable');
    for (let i = 0; i < 2; i++) {
      const now = root.dataset.theme, other = now === 'dark' ? 'light' : 'dark';
      is(!!themeBtn.querySelector('.i-' + now + '_mode'), true,
         'the glyph names the shade ON SCREEN, which is the one thing Auto hides');
      is(themeBtn.getAttribute('aria-label').endsWith('Switch to ' + other + '.'), true,
         'and its words name the act, so the glyph and the label say two different things');
      themeBtn.click();
      await settled();
      is(root.dataset.theme, other, 'one press flips the theme, with no box in between');
    }
    is(root.dataset.theme, themeWas, 'and two presses land back where this block started');
    /* **A press on the rail sets an explicit shade, which LEAVES Auto**, and the rows have to say
       so. A picker that went on reporting Auto over a shade a reader pinned is the two surfaces
       reporting two answers, which is what one writer exists to stop. */
    is(d.querySelector('#themeList input[value="auto"]').checked, false,
       'a press on the rail leaves Auto, and the picker reports that');
    is(d.querySelector('#themeList input:checked').value, root.dataset.theme,
       'with the row for the shade on screen checked instead');
    /* And back the other way: the picker writes the preference and the button re-reads it. */
    const autoRow = d.querySelector('#themeList input[value="auto"]');
    autoRow.checked = true;
    autoRow.dispatchEvent(new w.Event('change', { bubbles: true }));
    await settled();
    is(themeBtn.getAttribute('aria-label').startsWith('Automatic.'), true,
       'and picking Auto is reported back on the rail button, in its own words');
    is(!!themeBtn.querySelector('.i-' + root.dataset.theme + '_mode'), true,
       'while the glyph still names the shade that word resolved to');

    /* --- the diagnostics popover, against the header it is really anchored to ---
       `#netstats` is a child of `<header>`, and `header` is its own nearest positioned ancestor.
       `header` already carries `left: var(--rail-w)`, so `#netstats`'s own `left` has to be a
       constant offset from HEADER, never from the rail again — adding `--rail-w` a second time
       here is exactly the fault this reads against a real header box rather than against a
       literal, at both rail widths, so a reintroduced `--rail-w` term fails here immediately. */
    /* **Against the RAIL's own right edge, never a literal and never `header` any more.** This box
       was absolute inside `<header>`, which already carried `left: var(--rail-w)`, so adding the
