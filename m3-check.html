<!doctype html>
<meta charset="utf-8">
<title>M3 surface check</title>
<!--
  Every M3 surface in this app, in rendered pixels. There are three components and each has two
  variants, and the whole point of this file is that a surface cannot quietly become the wrong one.

    DIALOGS   #dataBox #camBox #aboutBox #helpBox   full-screen < 600px, basic above
              #lightbox #warnBox                    basic at every width
              #eggBox #narrowBox                    exempt, each for a stated reason
    SHEETS    #bar #side                            side sheet >= 601px, bottom sheet <= 600px
    BANDS     the four dialogs across M3's window size classes

  Transcribed from the M3 Expressive component set, so every number here is greppable against a
  real file rather than eyeballed:
    https://github.com/bczak/m3you/tree/development/src/components

  Six faults this guards, and five of them shipped during the work.

  A bare `.modalhead` rule reached two basic dialogs and moved their close button to the leading
  edge of a 56px bar while the box around them stayed a floating card. Hence the roll call.

  A sticky header pins to the scroller's PADDING box, so `top: 0` holds it 18 or 20px down.

  The 56dp headline start drifts invisibly across panes built from four different paddings.

  The browser's own stylesheet caps every dialog at `calc(100% - 6px - 2em)`, which is wider than
  the pane in three of four bands, so it bites in one and three look right.

  `body.drawer #legend` translated by `--drawer` after the phone override for that token went, which
  pushed the legend past the viewport, put a scrollbar on the document, shortened the ICB and left
  BOTH bottom sheets 15px above the edge they are anchored to. A layout fault two elements away.

  And a drag handle drawn over a gesture nobody wired up is a promise the panel does not keep.

  Motion has to be read BEFORE this file switches transitions off, or `getComputedStyle` reports the
  override rather than the rule. `settle()` is a separate call for that reason.

  Run:
    chrome --headless=new --disable-gpu --ignore-certificate-errors \
      --virtual-time-budget=180000 --window-size=1600,1000 --dump-dom \
      https://flood-exp.test/m3-check.html
-->
<style>
  body { font: 13px/1.5 monospace; margin: 12px; }
  iframe { border: 0; position: absolute; left: -4000px; }
  pre { white-space: pre-wrap; }
</style>
<iframe id="phone" src="/index.html" style="width:360px;height:760px"></iframe>
<iframe id="desk" src="/index.html" style="width:1200px;height:800px"></iframe>
<pre id="out">running...</pre>
<script>
const out = document.getElementById('out');
let bad = 0, done = 0;
const say = s => { out.textContent += s + '\n'; };
const is = (got, want, name) => {
  const ok = got === want;
  if (!ok) bad++;
  say((ok ? 'ok   ' : 'FAIL ') + name + '  -> ' + JSON.stringify(got) + (ok ? '' : '  want ' + JSON.stringify(want)));
};

/* `settle()` is separate from `ready()`, and that is the whole reason this reads correctly.
   Headless virtual time does not run a transition or a keyframe faithfully, so geometry has to be
   measured with both switched off. But the override is what `getComputedStyle` then reports, so an
   animation read after it comes back `none` on markup that is right. Motion is asserted as a
   DECLARATION, before `settle()`. Geometry is measured after it. paint-check.html states the same
   rule. */
function ready(id) {
  return new Promise(res => {
    const f = document.getElementById(id);
    const go = () => setTimeout(() => {
      const d = f.contentDocument, w = f.contentWindow;
      res({
        d, w, cs: e => w.getComputedStyle(e), r: e => e.getBoundingClientRect(),
        settle: () => d.head.insertAdjacentHTML('beforeend',
          '<style>*{transition:none !important;animation:none !important}</style>'),
      });
    }, 3500);
    if (f.contentDocument && f.contentDocument.readyState === 'complete') go(); else f.onload = go;
  });
}

// M3's easing-emphasized and easing-standard are the same curve in M3's own token table.
const M3_EASE = 'cubic-bezier(0.2, 0, 0, 1)';

/* `#pane` opens from a MutationObserver on the body class, so the open is one microtask plus one
   frame behind the class that asks for it. Every assertion about the pane waits on this. */
const settled = () => new Promise(res => setTimeout(res, 120));

const DIALOGS = ['dataBox', 'camBox', 'aboutBox', 'helpBox'];

/* Run a module INSIDE the frame, so it shares that document's module map and reaches the live
   `openSide()`. Importing from this page builds a second instance with an empty state and a map
   that has no container to attach to. */
function inFrame(d, code) {
  return new Promise(res => {
    const sc = d.createElement('script');
    sc.type = 'module';
    sc.textContent = code + '\ndocument.documentElement.dataset.probeDone = "1";';
    delete d.documentElement.dataset.probeDone;
    d.body.appendChild(sc);
    const t = setInterval(() => {
      if (d.documentElement.dataset.probeDone) { clearInterval(t); res(); }
    }, 30);
  });
}

/* A card in the shape `popup.js` emits: the ⋮ and its popover first, then the name, the region and
   the badges. Fixed rather than taken from the live payload, so the assertions below cannot move
   with the weather. */
const CARD = `<div class="pophead">
    <button class="icon fav" data-fav="a,b" data-tip="Add to favorites"></button>
    <button class="icon dots" popovertarget="probemenu"></button>
    <div class="menu" id="probemenu" popover></div>
    <div class="popname" data-go="1">SUNGAI DAMANSARA DI TTDI JAYA</div>
    <div class="muted">Shah Alam, Selangor</div>
    <div class="badges"><span class="badge" style="--c:var(--k-river)"
      ><i class="i i-water_drop"></i>Water level</span></div>
  </div>
  <div class="sensor"><b>Water level</b></div>
  <div class="sensor"><b>Rainfall</b></div>`;
/* `JSON.stringify` rather than a nested template literal: the card is HTML with quotes in it, and
   the escaping of a template inside a template inside an injected module is the kind of thing that
   fails at parse time and prints nothing at all. */
const OPEN_CARD = "import { openSide } from '/js/map.js'; openSide('probe', " + JSON.stringify(CARD) + ");";

/* **Every `<dialog>` in the app, and which of the three kinds it is.** The roll call is the point:
   the check reads the document for dialogs and fails on any id that is not in this table, so a new
   one cannot ship without somebody deciding what it is. A bare `.modalhead` rule once reached two
   basic dialogs and moved their close button to the leading edge while the box around them stayed a
   floating card. Nothing here caught it, because nothing here knew those two existed.
     fullscreen  full-screen below 600px, basic above it
     basic       a basic dialog at every width
     exempt      deliberately neither, and each names its reason where it is defined */
const KIND = {
  dataBox: 'fullscreen', camBox: 'fullscreen', aboutBox: 'fullscreen', helpBox: 'fullscreen',
  lightbox: 'basic', warnBox: 'basic',
  // A picture with no chrome at all, and a blocking state screen with no way out on purpose.
  eggBox: 'exempt', narrowBox: 'exempt',
  /* The supporting pane. It is a `<dialog>` for the compact window, where M3's canonical layout
     navigates to the supporting pane as a full-screen destination, and only a real dialog gets the
     top layer, the focus trap and an inert page. It takes a block of its own below rather than a row
     in the sweep: it is the one surface here whose kind CHANGES with the window, so the sweep's
     one-kind-per-id shape cannot describe it. */
  pane: 'pane',
};

async function phone() {
  const { d, w, cs, r, settle } = await ready('phone');
  const VW = w.innerWidth, VH = w.innerHeight;
  say('--- phone, ' + VW + 'x' + VH + ' -------------------------------------------------');

  /* --- motion, read BEFORE the override that switches it off ---
     Every dialog at once, each against the kind it is declared as. A full-screen dialog travels:
     opacity 0 with translateY(100%) at duration-short2. A basic one grows in place: opacity 0 with
     scale(.95) at duration-extra-short4. Both curves are M3's one cubic-bezier.
     **This loop is why the roll call exists.** Reading `animationName` off a settled frame returns
     `none`, so these cannot move down to the sweep below — and the sweep is where a new dialog gets
     noticed. The two halves have to agree on the table, which is the only copy of it. */
  for (const [id, kind] of Object.entries(KIND)) {
    // `pane` has its own motion assertion below: it is a full-screen dialog here and a side sheet
    // above 600px, so one row in a per-id table cannot state its enter.
    if (kind === 'exempt' || kind === 'pane') continue;
    const b = d.getElementById(id);
    b.showModal();
    const fs = kind === 'fullscreen';
    is(cs(b).animationName, fs ? 'fsOpen' : 'dlgOpen',
       id + ': ' + (fs ? 'travels up from the bottom edge' : 'grows in place'));
    is(cs(b).animationDuration, fs ? '0.3s' : '0.2s',
       id + ': M3 ' + (fs ? 'duration-short2' : 'duration-extra-short4'));
    is(cs(b).animationTimingFunction, M3_EASE, id + ': on M3 easing');
    b.close();
  }
  /* The supporting pane transitions rather than animates, so it gets the exit as well as the enter.
     **The motion is on the pane and never on an occupant.** One box travels, so switching the
     station card for the filters swaps the content of a container already in place. Two sheets
     sliding through each other is what that switch looked like while each carried its own travel. */
  /* The pane animates on `[open]` like every other dialog here, because `show()` and `showModal()`
     both flip `display` and leave no closed state to transition from. Both variants travel in from
     the edge they are anchored to. */
  const paneEl = d.getElementById('pane');
  d.body.classList.add('drawer');
  await settled();
  is(paneEl.open, true, 'the observer opens the pane when an occupant asks for it');
  is(cs(paneEl).animationName, 'paneUp', 'the pane travels up from the bottom edge here');
  is(cs(paneEl).animationDuration, '0.3s', 'M3 duration-short2, a full-screen dialog\'s own');
  is(cs(paneEl).animationTimingFunction, M3_EASE, 'on M3 easing-emphasized');
  /* **One motion changes what the pane holds, and TWO events have to read it.** An occupant swapped
     for another inside `#pane` is one. A station swapped for another inside `#side` is the other.
     They were two motions for one revision, and a reader met both and asked for one. So the numbers
     are asserted on each event and then against each other.
     M3's fade through stood on the first of those two and is gone. It faded the outgoing surface
     over the first 30% of 300ms, then faded and scaled the incoming one from 92%. The reading of the
     spec was right and the result was two motions in one box. */
  d.body.classList.remove('drawer', 'side');
  await settled();
  /* **The exit is instant, which is what a station swap does.** That one replaces the card with
     `innerHTML` and the new card fades in from nothing, so the outgoing occupant just stops drawing.
     `display` therefore needs no transition and no `allow-discrete` to survive one. */
  is(cs(d.getElementById('bar')).transitionDuration.split(',')[0].trim(), '0s',
     'swap: the outgoing occupant leaves at once, the way a replaced station does');
  d.body.classList.add('drawer');
  await settled();
  const inCs = cs(d.getElementById('bar'));
  is(inCs.transitionDuration.split(',')[0].trim(), '0.22s', 'swap: the incoming one takes 220ms');
  is(inCs.transitionDelay.split(',')[0].trim(), '0s', 'and it starts at once, waiting for nothing');
  is(inCs.transitionTimingFunction.split(/,\s*(?=cubic-bezier|ease|linear|steps)/)[0],
     M3_EASE, 'on M3 easing-emphasized');
  is(inCs.transitionProperty.includes('translate'), true, 'it slides in as well as fades');
  is(inCs.transitionProperty.includes('scale'), false,
     'and it does not scale: that was the fade through, and a reader cut it');
  is(cs(d.getElementById('bar')).animationName, 'none',
     'a transition and not a keyframe, so the container itself never moves');
  /* The other event, read off the same element the app animates. Equal numbers are the assertion:
     one token feeds both, so a change to either has to move both or fail here. */
  const sideEl = d.getElementById('side');
  sideEl.classList.add('swap');
  const swapCs = cs(d.getElementById('sideTitle'));
  is(swapCs.animationDuration, inCs.transitionDuration.split(',')[0].trim(),
     'a station swap runs for exactly as long as an occupant swap');
  is(swapCs.animationTimingFunction, M3_EASE, 'on the same curve');
  sideEl.classList.remove('swap');
  d.body.classList.remove('drawer');
  await settled();
  settle();
  const box = e => [r(e).top, r(e).left, r(e).width, r(e).height].map(Math.round).join(',');
  const FULL = '0,0,' + VW + ',' + VH;

  /* --- the supporting pane is an M3 FULL-SCREEN DIALOG here ---
     M3's canonical supporting-pane layout hides the supporting pane in a compact window and
     navigates to it as a full-screen destination:
       https://m3.material.io/foundations/layout/canonical-examples/supporting-pane
     So this is the dialog component's full-screen variant, and it takes that variant's four:
     covers the screen, 0dp corners, no elevation, no scrim.
     **`showModal()` is the assertion that matters.** The pane drew as a `<div>` styled to look
     full-screen for one revision. That looks identical on screen and is not the same thing: only a
     modal dialog gets the top layer, a focus trap, and a page behind it that is inert. A styled div
     also cannot be covered by another dialog, and four of them open over this one.
     **One box, two occupants.** `#bar` and `#side` are content inside the pane, so each is asserted
     against the same box. A destination that changed shape with its content is not one destination.

     The scrim, the drag handle and the swipe are all gone, and that is the point rather than a
     regression. They belonged to the bottom sheet this replaced. */
  const pane = d.getElementById('pane');
  /* Fill the station card through the real `openSide()` first. `#sideHead` hides itself while
     `#sideTitle` is empty — a 56px band of nothing over the readings is worse than no band — so an
     empty panel measures 0 and every header assertion below reads as broken. */
  await inFrame(d, OPEN_CARD);
  d.body.classList.remove('side');
  await settled();
  /* **No card at this width, and the radius is why it has to be a query rather than a token.** With
     `--gap` at 0 the map fills the window, and a 16px radius on a full-bleed box notches the four
     screen corners and shows the page through them. There is no second pane beside it either: the
     supporting pane is a destination over the map, so there is nothing for a card to separate from.
     M3 states a 16dp margin for a compact window. This is the divergence, and 32px off a 360px map
     is the reason. */
  const mapEl = d.getElementById('map');
  is(cs(d.documentElement).getPropertyValue('--gap').trim(), '0px', 'no card inset on a phone');
  is(cs(mapEl).borderTopLeftRadius, '0px', 'and no corner, which would notch the screen');
  is(w.getComputedStyle(mapEl, '::after').content, 'none', 'and no card edge');
  is(Math.round(r(mapEl).width), VW, 'the map is the full width of the window');

  is(pane.tagName, 'DIALOG', 'the pane is a real <dialog>, not a div dressed as one');
  is(!!d.getElementById('scrim'), false,
     'and there is no scrim left: a full-screen dialog covers the screen, so it has no outside');
  is(!!pane.querySelector(':scope > .grab'), false,
     'and no drag handle: that variant has no swipe, and a handle over no gesture is a promise');
  for (const [id, cls, name] of [['bar', 'drawer', 'filters'], ['side', 'side', 'station panel']]) {
    d.body.classList.add(cls);
    await settled();
    const b = r(pane);
    is(pane.open, true, name + ': asking for an occupant opens the pane');
    is(pane.matches(':modal'), true, name + ': through showModal(), so the page behind is inert');
    is(cs(d.getElementById(id)).display, 'flex', name + ': and its occupant draws');
    is([b.top, b.left, b.width, b.height].map(Math.round).join(','), '0,0,' + VW + ',' + VH,
       name + ': fills the screen, app bar included');
    is(cs(pane).borderTopLeftRadius, '0px', name + ': M3 0dp corner');
    /* **The header is M3's medium flexible top app bar at BOTH widths, and only the close moves.**
       A full-screen dialog puts its X on the leading edge, where the side sheet above 600px trails
       it. `order`, not `row-reverse`: reversing the row puts the trailing actions between the X and
       the title, and M3 keeps them at the far end.
       **Assert the glyph CENTRE, never the box edge.** The app bar's top row is 4px of padding
       around a 48px target. The other four full-screen dialogs are 8px around a 40px one. Both land
       the glyph on 28px, so the centre is the fact that survives either convention. */
    const hd = d.querySelector(id === 'bar' ? '#barHead' : '#sideHead');
    const x = d.getElementById(id === 'bar' ? 'barClose' : 'sideClose');
    const xr = r(x);
    is(Math.round(r(hd).height) >= 112, true, name + ': M3 112dp medium flexible app bar');
    is(Math.round((xr.left + xr.right) / 2), 28,
       name + ': its back arrow leads, with the glyph 28px in as every full-screen bar here has it');
    is(!!x.querySelector('.i-arrow_back'), true, name + ': and it is an arrow, not a close X');
    is(Math.round(xr.bottom) <= Math.round(r(hd.querySelector('.apflex')).top), true,
       name + ': and the headline sits on the row under it, which is what makes this the medium bar');
    is(cs(pane).boxShadow, 'none', name + ': and no elevation');
    is(w.getComputedStyle(pane, '::backdrop').backgroundColor, 'rgba(0, 0, 0, 0)',
       name + ': no scrim, which M3 leaves out of this variant');
    /* The map keeps its whole width. A full-screen destination covers the map rather than sitting
       beside it, so `--pane-w` has to stay 0 at this width however the pane is drawn. */
    is(Math.round(r(d.getElementById('map')).width), VW,
       name + ': the map keeps its full width, because a destination takes none of it');
    is(Math.round(r(d.getElementById('legend')).right) <= VW, true,
       name + ': nothing steps aside, so nothing overflows the document');
    d.body.classList.remove(cls);
    await settled();
    is(pane.open, false, name + ': and closing the occupant closes the pane');
  }
  /* Escape reaches a modal dialog natively as `cancel`. The body classes have to follow the element,
     or the observer reopens the pane on the next class write with nothing having changed. */
  d.body.classList.add('side');
  await settled();
  is(pane.open, true, 'the pane is open before the native close, or the next line proves nothing');
  /* **Wait on the event, never on a timer.** `close` is fired as a queued element task, and headless
     virtual time fast-forwards a `setTimeout` past it: measured, a 300ms wait resolved BEFORE the
     event was delivered, so a correct handler read as a broken one. */
  const shut = new Promise(res => pane.addEventListener('close', res, { once: true }));
  pane.close();
  await shut;
  await settled();
  is(d.body.className.includes('side'), false,
     'a native close clears the body class, so the element and the state cannot drift');

  // --- the four dialogs ---
  for (const id of DIALOGS) {
    const b = d.getElementById(id);
    b.showModal();
    is(box(b), FULL, id + ' fills the screen');
    is(cs(b).borderTopLeftRadius, '0px', id + ': M3 0dp corner');
    const mh = b.querySelector('.modalhead'), x = b.querySelector('.dclose'), h2 = mh.querySelector('h2');
    /* **These four wear the same medium flexible app bar the pane does.** A column, so the icons take
       a row of their own and the headline takes the row under them. They were M3's small variant, one
       56px row with the X and the headline side by side, and a reader put them on the pane's. */
    is(cs(mh).flexDirection, 'column', id + ': a column, so the icons and the headline are two rows');
    is(Math.round(r(mh).height) >= (h2 ? 112 : 56), true,
       id + ': M3 112dp with a headline, and the 56dp top row without one');
    /* The glyph centre, never the box edge. These four reach 28px as 8px of padding around a 40px
       target where the pane reaches it as 4px around a 48px one. */
    is(Math.round((r(x).left + r(x).right) / 2), 28, id + ': its X leads with the glyph 28px in');
    // About carries no headline: M3 marks it optional and that pane's identity is its logo lockup.
    if (h2) {
      is(Math.round(r(h2).top) >= Math.round(r(x).bottom), true,
         id + ': the headline sits on the row under the icons');
      is(cs(h2).fontSize, '28px', id + ': at headline-medium, the rung the pane takes');
      is(Math.round(r(h2).left) <= 20, true,
         id + ': starting on the pane padding rather than beside a button that is no longer there');
    }
    is(w.getComputedStyle(b, '::backdrop').backgroundColor, 'rgba(0, 0, 0, 0)',
       id + ': no scrim, because there is no outside');
    /* **No line under a full-screen header.** The fourth surface in this app to lose one, after the
       map card, the app bar and the supporting pane. `#dataBox` and `#camBox` carry theirs on
       `.dtop` rather than on `.modalhead`, because that box holds the filter field too. */
    const dtop = b.querySelector('.dtop');
    is(cs(dtop || mh).borderBottomWidth, '0px', id + ': no line under the header');
    b.close();
  }
  // The prose dialogs are their own scroller, so their header is pinned rather than scrolled away.
  for (const id of ['helpBox', 'aboutBox']) {
    const b = d.getElementById(id);
    b.showModal();
    b.scrollTop = 600;
    const mh = b.querySelector('.modalhead');
    is(Math.round(r(mh).top), 0, id + ': header holds the top while content scrolls');
    // Never == VW: a classic scrollbar takes width off the scrollport in headless and the bar
    // correctly stops beside it. A phone's overlay scrollbar takes none.
    is(Math.round(r(mh).width) >= VW - 20, true, id + ': header is full bleed');
    b.close();
  }

  // --- every dialog is accounted for, and each obeys the kind it is declared as ---
  const found = [...d.querySelectorAll('dialog')].map(x => x.id).sort();
  is(found.filter(id => !KIND[id]).join(','), '',
     'every <dialog> in the app is in the roll call — a new one needs a kind, not a default');
  is(Object.keys(KIND).filter(id => !found.includes(id)).join(','), '',
     'and every id in the roll call is still in the document');

  for (const [id, kind] of Object.entries(KIND)) {
    /* `pane` is skipped here and asserted in its own blocks. It is the one surface whose kind
       CHANGES with the window — full-screen dialog below 600px, standard side sheet above — so the
       one-kind-per-id shape this sweep is built on cannot describe it. It stays in the roll call so
       the two completeness assertions above still account for it. */
    if (kind === 'exempt' || kind === 'pane') continue;
    const b = d.getElementById(id);
    b.showModal();
    const mh = b.querySelector('.modalhead'), x = b.querySelector('.dclose');
    if (kind === 'basic') {
      /* A basic dialog keeps its close on the TRAILING edge and never fills the screen, at any
         width. M3 puts the full-screen variant behind a task with steps, keyboard input or a nested
         dialog, and neither of these two is that. */
      is(cs(mh).flexDirection, 'row', id + ' (basic): × stays on the trailing edge, even on a phone');
      is(Math.round(r(x).right) < VW - 8, true, id + ' (basic): and inside the pane, not against it');
      is(cs(b).borderTopLeftRadius, '28px', id + ' (basic): M3 28dp corner');
      is(Math.round(r(b).width) < VW, true, id + ' (basic): does not fill the screen');
    } else {
      is(cs(mh).flexDirection, 'column', id + ' (full-screen): a two-row app bar, X on the top row');
      is(Math.round(r(b).width), VW, id + ' (full-screen): fills the screen');
      is(cs(b).borderTopLeftRadius, '0px', id + ' (full-screen): M3 0dp corner');
    }
    b.close();
  }

  /* --- the ways out ---
     M3 leaves a full-screen dialog two, and this pane has exactly those two. The close X in each
     occupant's own app bar, and the platform's own back or escape. **Neither is written in this
     app any more.** Escape and the Android back gesture reach a modal `<dialog>` natively as
     `cancel`, and `js/ui.js` used to carry a `keydown` handler gated on a width test for the same
     job. The one line still needed is the `close` listener in map.js that clears the body class, and
     the assertion above this covers it.
     The scrim and the swipe are not here to assert. They went with the bottom sheet. */
  is(!!d.getElementById('barClose'), true, 'the filters carry a close button');
  is(!!d.getElementById('sideClose'), true, 'and so does the station card');
  d.body.classList.add('side');
  await settled();
  is(pane.matches(':modal'), true, 'the pane is modal, which is what makes Escape reach it at all');
  d.body.classList.remove('side');
  await settled();
}

async function desktop() {
  const { d, w, cs, r, settle } = await ready('desk');
  say('--- desktop, ' + w.innerWidth + 'x' + w.innerHeight + ' ----------------------------------');

  // --- motion, read BEFORE the override ---
  /* **The map card resizes on a transition, and that is the whole of the pane's arrival on screen.**
     It snapped for one revision, on the argument that animating the width makes Leaflet resize on
     every frame. It does, and that is what keeps live tiles in the card as it grows rather than
     revealing a blank strip for 300ms. `right` alone: the other three sides never move. */
  const mapCs = cs(d.getElementById('map'));
  is(mapCs.transitionProperty, 'right', 'the map card transitions its trailing edge and nothing else');
  is(mapCs.transitionDuration, '0.3s', 'on M3 duration-short2, the same travel the pane takes');
  is(mapCs.transitionTimingFunction, M3_EASE, 'and M3 easing-emphasized, so the two move as one');

  // The M3 basic dialog: opacity 0 and scale(.95), duration-extra-short4 (200ms) on easing-standard.
  // It grows in place rather than travelling, which is the within-screen-bounds pattern.
  for (const id of DIALOGS) {
    const b = d.getElementById(id);
    b.showModal();
    is(cs(b).animationName, 'dlgOpen', id + ': M3 basic-dialog enter, a scale in place');
    is(cs(b).animationDuration, '0.2s', id + ': M3 duration-extra-short4');
    b.close();
  }
  settle();
  /* --- the supporting pane is an M3 STANDARD SIDE SHEET here, and the map is the main pane ---
     Transcribed from SideSheet/side-sheet.css. The standard variant is the one that leaves the main
     pane live beside it: `surface`, NO radius, NO elevation, and a 1px `outline-variant` line on the
     edge facing the content.
     **The map is a pane, so its box ends where this one begins.** That is the whole of the layout
     change and the whole of what can silently go wrong. A map that keeps its full width under an
     opaque pane looks identical until a reader tries to press something in the covered strip, and
     `focusOn()` then centres a station under the panel that describes it. */
  const bar = d.getElementById('bar'), side = d.getElementById('side');
  const pane2 = d.getElementById('pane'), mapBox = d.getElementById('map'), VW = w.innerWidth;
  const VH = w.innerHeight;
  d.body.classList.remove('drawer', 'side');
  await settled();

  /* --- the main pane is drawn as a card ---
     M3's canonical layout separates panes with space rather than with a line, so the map sits inside
     its own inset surface. `--gap` is that inset on three sides AND the space between the two panes
     on the fourth, because one number has to read as one margin.
     **Every silent fault here is off by exactly `--gap`.** A furniture box that misses it sits on the
     page beside the card rather than on the map. A radius without the gap notches the four screen
     corners. And an edge drawn as a `border` takes two pixels off the map instead of drawing round
     it, which is invisible until somebody measures the container. */
  const GAP = parseFloat(cs(d.documentElement).getPropertyValue('--gap'));
  const SEAM = parseFloat(cs(d.documentElement).getPropertyValue('--seam'));
  const hdr = parseFloat(cs(d.documentElement).getPropertyValue('--hdr'));
  is(GAP > 0, true, 'the map card is inset from the window at this width');
  /* Two numbers, and M3's layout names them separately: a margin holds content off the window edge
     and a spacer separates one pane from the next. `--seam` is the trailing inset alone. */
  is(SEAM > 0 && SEAM < GAP, true, 'and the space between the two panes is its own, smaller number');
  const mb = r(mapBox);
  is([mb.left, mb.top - hdr, VH - mb.bottom].map(Math.round).join(','),
     [GAP, GAP, GAP].join(','), 'shut, the card sits one gap in on the three window edges');
  is(Math.round(VW - mb.right), SEAM, 'and one seam in on the edge that faces the pane');
  is(cs(mapBox).borderTopLeftRadius, '16px', 'M3 shape-corner-large');
  is(cs(mapBox).overflow, 'hidden', 'and the tiles clip to that corner');
  /* **The corner is the whole boundary, and no line may come back on any of these three surfaces.**
     The card carried an inset 1px outline for one revision, the app bar carried a rule under it, and
     the pane carried M3's own `outline-variant` on the edge facing the map. A reader cut all three.
     They separate by space now — `--gap` on three sides of the card and between the two panes, and
     the same gap under the app bar. A line inside that space states one seam twice.
     A `border` is checked separately from a shadow because the two fail differently: a border on an
     absolutely positioned box takes two pixels off the map rather than drawing around it, which is
     invisible until somebody measures the container. */
  is(cs(mapBox).borderWidth, '0px', 'no border on the card');
  is(w.getComputedStyle(mapBox, '::after').content, 'none', 'and no pseudo-element drawing one');
  is(cs(d.querySelector('header')).borderBottomWidth, '0px', 'no rule under the app bar');
  /* The furniture rides the card. Leaflet's own controls are inside the container and get it free;
     these three are siblings of `#map` and each has to add the card's own inset to its offset.
     **Which inset depends on the edge.** A box measuring from the trailing edge measures across the
     space between the two panes and takes `--seam`. Every other edge takes `--gap`. */
  for (const [id, x, y] of [['legend', 12, 12], ['credit', 10, 8], ['paint', 48, 36]]) {
    const e = r(d.getElementById(id));
    const lead = id === 'legend';
    const off = lead ? Math.round(e.left) : Math.round(VW - e.right);
    is(off, x + (lead ? GAP : SEAM), id + ' rides the card inset, not the window edge');
    is(Math.round(VH - e.bottom), y + GAP, '  and on the other axis too');
  }
  is(Math.round(VW - r(d.querySelector('.leaflet-control-zoom')).right), 10 + SEAM,
     'the zoom control gets it free, having never left the map container');
  d.body.classList.add('drawer');
  await settled();
  is(cs(pane2).boxShadow, 'none', 'a standard side sheet has no elevation');
  /* M3 gives it a 1px `outline-variant` on the edge facing the content, and this app declines it.
     The map is a card inset by `--gap`, so the two panes are already separated by space, which is
     what M3's own layout guidance separates panes with. The divergence is from the component and
     not from the layout. */
  is(cs(pane2).borderWidth, '0px', 'and no line facing the map: the gap between them is the seam');
  is(cs(pane2).borderTopLeftRadius, '0px', 'the standard variant is square');
  is([r(pane2).top, r(pane2).width, Math.round(VW - r(pane2).right)].map(Math.round).join(','),
     '64,360,0', 'a 360px pane on the trailing edge, under the app bar');
  is(Math.round(r(mapBox).width), VW - 360 - GAP - SEAM,
     'and the map gives up that width, keeping its leading gap and its trailing seam');
  is(Math.round(r(pane2).left - r(mapBox).right), SEAM,
     'one seam between the two panes, which is the smaller of the two numbers');
  /* Leaflet's own controls live INSIDE the map container and follow it for free. These three are
     siblings of the map and position against the window, so each adds `--pane-w` to its own offset.
     A missed one sits under the pane, which is exactly where a reader cannot reach it. */
  for (const [id, base] of [['credit', 10], ['paint', 48], ['toast', 12]]) {
    is(Math.round(VW - r(d.getElementById(id)).right), base + 360 + SEAM,
       id + ' steps aside by the pane width, on top of the seam it already had');
  }
  /* 360 for the pane, `--gap` for the space between the panes, then the control's own 10 inside the
     card. It picks up ONE gap and not two: the map's trailing inset is the pane plus the gap, and
     the control measures from that edge. */
  is(Math.round(VW - r(d.querySelector('.leaflet-control-zoom')).right), 360 + SEAM + 10,
     'and the zoom control follows the map, having never left it');
  /* The occupants are content. Neither states a width, a position or an edge of its own. */
  is(cs(bar).display, 'flex', 'the filters occupy the pane');
  is(cs(side).display, 'none', 'and only one occupant draws at a time');
  /* The occupant is not the scroller. Its body is, which is the shape `#side` already had. */
  is(cs(bar).overflowY, 'visible', 'the filters occupant does not scroll itself');
  is(cs(d.getElementById('barBody')).overflowY, 'auto', 'its body does');
  /* **Absolute, and the swap is why.** They were `flex: 1` children of a column, so two visible at
     once would split the pane's height between them for the 90ms the fade through overlaps. Filling
     the pane absolutely lets the outgoing one leave while the incoming one is already in place. The
     pane still owns the box: the occupants state `inset: 0` and nothing else about it. */
  is(cs(bar).position + ' ' + cs(side).position, 'absolute absolute',
     'both occupants fill the pane absolutely, so a swap can overlap them');
  const bi = r(bar), pi = r(pane2);
  is([bi.left - pi.left, bi.top - pi.top, pi.right - bi.right, pi.bottom - bi.bottom]
     .map(Math.round).join(','), '0,0,0,0', 'and each states inset: 0 and nothing more');
  d.body.classList.remove('drawer');
  await settled();
  is(Math.round(r(mapBox).width), VW - GAP - SEAM,
     'shut again, the map takes the width straight back, less its own two insets');
  d.body.classList.add('side');
  await settled();
  /* --- the header is M3's medium flexible top app bar, filled by the real openSide() split ---
     Transcribed from AppBar/app-bar.css: a 112px container, a 56px `__top-row` at
     `padding: 8px 4px 0`, and a `__flex-content` under it at `min-height: 56px`,
     `padding-inline: 16px`, `padding-bottom: 12px`, bottom aligned, `gap: 4px`. The headline takes
     `headline-medium` and the supporting text `body-medium` at weight 500.
     **The split is the part that can break silently.** The card is built as one string whose first
     element is `.pophead`, and `openSide()` takes FOUR pieces out of it now. A template change that
     renames or reorders any of them leaves the header empty and the name buried in the body, and
     nothing else in this app would notice. */
  await inFrame(d, OPEN_CARD);
  const sh = d.getElementById('sideHead'), st = d.getElementById('sideTitle');
  const sa = d.getElementById('sideActions'), sc2 = d.getElementById('sideClose');
  is(!!st.querySelector('.popname'), true, 'the split puts the place name in the title slot');
  is(!!sa.querySelector('.dots'), true, 'and the ⋮ in the trailing actions');
  is(!!sa.querySelector('.menu'), true, 'with the popover it targets, or the button opens nothing');
  is(!!d.querySelector('#sideBody .pophead .popname'), false, 'the name is not left in the body too');
  /* **Both supporting lines are the app bar's now, so both go UP with the name.** They stayed in
     the body on the argument that M3 puts supporting content there. That is the side SHEET's rule,
     and this header stopped being one. The app bar states a headline and the lines under it, and
     the region and the kind chips always were that. `.pophead` is left holding nothing, so
     `openSide()` removes it — the fourth assertion is the one that catches a template still
     leaving something behind in a box nothing styles any more. */
  is(!!d.getElementById('sideSub').querySelector('.muted'), true,
     'the region line becomes the app bar supporting text');
  is(!!d.querySelector('#sideBody .pophead > .muted'), false, 'and it is not left in the body too');
  const sk = d.getElementById('sideKinds');
  is(!!sk.querySelector('.badges'), true, 'the kind chips become its second supporting line');
  is(!!d.querySelector('#sideBody .pophead'), false, 'and the emptied seam is removed, not left');
  /* **A mast emits a `.badges` box and a single-sensor card emits one bare `.badge`.** The lift
     names both, and only the box shape is in the fixture above. So the bare one is driven here.
     A selector that lost it would leave every node card's kind in a box nothing styles any more. */
  await inFrame(d, "import { openSide } from '/js/map.js'; openSide('probe-one', "
    + JSON.stringify(CARD.replace(/<div class="badges">([^]*?)<\/div>/, '$1')) + ");");
  is(!!d.getElementById('sideKinds').querySelector(':scope > .badge'), true,
     'a single-sensor card lifts its bare chip too, not only a mast box');
  await inFrame(d, OPEN_CARD);
  /* --- each chip is an M3 ASSIST CHIP ---
     Transcribed from Chip/chip.css: a 32dp container, `shape-corner-small` (8dp), a 1dp outline,
     `label-large`, and an 18dp leading icon. The label takes `on-surface` and the icon takes the
     accent role, which here is the station kind's own hue. **The kind hue on the label is the
     fault to guard**: a chip whose text is painted by the station kind reads as a status, and this
     app reserves that reading for the traffic-light ladder alone. */
  const chip = sk.querySelector('.badge');
  is(Math.round(r(chip).height), 32, 'M3 assist chip: a 32dp container');
  is(cs(chip).borderTopLeftRadius, '8px', 'at shape-corner-small');
  is(cs(chip).borderTopWidth, '1px', 'with a 1dp outline, which is what makes it assist and not filled');
  is(cs(chip).padding, '0px 16px 0px 8px', 'at M3 padding: 8dp behind the icon, 16dp past the label');
  is(cs(chip).fontSize, '14px', 'label-large');
  is(cs(chip).fontWeight, '500', 'at its own weight');
  is(cs(chip).textTransform, 'none', 'and not the badge uppercase it replaced');
  is(cs(chip).color, cs(d.body).color, 'the label is on-surface, never the station kind');
  is(cs(chip.querySelector('.i')).fontSize, '18px', 'an 18dp leading icon');
  is(cs(chip.querySelector('.i')).color !== cs(chip).color, true, 'which is the one thing that takes the kind hue');
  const top = sh.querySelector('.apptop'), flex = sh.querySelector('.apflex');
  is(Math.round(r(sh).height) >= 112, true, 'M3 112dp medium flexible app bar');
  is(Math.round(r(top).height) >= 56, true, 'a 56px top row for the icons');
  is(cs(top).padding, '8px 4px 0px', 'at M3 __top-row padding');
  is(cs(top).alignItems, 'flex-start', 'with the icons held at its own top edge');
  is(Math.round(r(flex).height) >= 56, true, 'and a 56px label block under it');
  is(cs(flex).padding, '0px 16px 12px', 'at M3 __flex-content padding');
  is(cs(flex).justifyContent, 'flex-end', 'bottom aligned, which is what puts the name on the seam');
  is(cs(flex).rowGap, '4px', 'and the medium variant gap between the two lines');
  is(cs(st.querySelector('.popname')).fontSize, '28px', 'headline-medium');
  is(cs(st.querySelector('.popname')).lineHeight, '36px', 'at its own line height');
  is(cs(st.querySelector('.popname')).color, cs(d.body).color,
     'in on-surface: an app bar headline names the screen, where a side sheet title labels a panel');
  const sub2 = d.querySelector('#sideSub .muted');
  is(cs(sub2).fontSize, '14px', 'the supporting text is body-medium');
  is(cs(sub2).fontWeight, '500', 'at the weight M3 states for it');
  /* Against `#shown`, not against a `.muted` in this card's body: the region line was the only one
     there and it has moved up here. `getComputedStyle` resolves `color` on a `display: none`
     element, so the drawer being the pane's other occupant costs nothing. */
  is(cs(sub2).color, cs(d.getElementById('shown')).color, 'in on-surface-variant');
  is(cs(sc2).position, 'static', 'the button is a flex item, so nothing floats and nothing is padded');
  /* **Leading at THIS width too, and that is the change.** It was a trailing close X above 600px and
     a leading one below it, moved by `order: -1`. M3 gives a top app bar a leading navigation icon,
     so one bar reads the same at both widths and the tab order follows the reading order.
     Read as a glyph centre for the reason the compact block states: 4px of top-row padding around a
     48px target puts it 28px in. */
  is(!!sc2.querySelector('.i-arrow_back'), true, 'the leading button is a back arrow');
  is(cs(sc2.querySelector('.i')).maskImage !== 'none', true, 'and its mask actually resolves');
  is(Math.round((r(sc2).left + r(sc2).right) / 2 - r(pane2).left), 28,
     'sitting 28px in from the pane leading edge, the same place it takes on a phone');
  is(r(sc2).right < r(d.getElementById('sideActions')).left, true,
     'with the trailing actions on the far side of the spacer');
  /* **The favorite is a button beside the ⋮, not a row inside it.** It was a corner glyph, then a
     menu row, and a reader pulled it back out on 2026-08-21. The app bar gives the actions a row of
     their own, which is what answers the objection that took it into the menu: the pair used to owe
     the title 108px of a 328px line. */
  const favB = d.querySelector('#sideActions .fav');
  is(!!favB, true, 'the favorite is a button in the trailing actions');
  is(favB && favB.compareDocumentPosition(d.querySelector('#sideActions .dots'))
     & Node.DOCUMENT_POSITION_FOLLOWING ? true : false, true, 'and it sits before the ⋮');
  is(!!favB.dataset.fav, true, 'carrying the id list the one delegated handler reads');
  is(!!favB.dataset.tip, true,
     'and `data-tip`, because a `title` never opens on touch and half these devices are phones');
  is(!!d.querySelector('#sideActions .menu [data-fav]'), false,
     'so the menu no longer carries the same action a second time');
  is(cs(d.getElementById('sideBody')).padding, '12px 24px', 'M3 side sheet body padding');

  /* --- each sensor section is an M3 FILLED CARD ---
     Transcribed from Card/card.css: `surface-container-highest`, `shape-corner-medium` (12dp), no
     border and no elevation at rest. `--hover` stands in for the container tone, because this app
     holds one surface tone and the palette rule keeps M3's colour roles out of it.
     **The double line is what this replaced, and it is the fault to guard.** A section separated
     itself with a top rule while `.pophead` ended in a bottom rule. Nothing stacked them while
     `openSide()` lifted the whole header out of the body. The moment it lifted three pieces instead,
     `.pophead` became the body's first child, `#sideBody > .sensor:first-child` stopped matching,
     and both rules drew 8px apart under the title. Neither rule exists now, and asserting that they
     are gone is the only way to keep them gone. */
  const secs = [...d.querySelectorAll('#sideBody > .sensor')];
  is(secs.length, 2, 'the body holds one section per sensor');
  is(cs(secs[0]).borderTopWidth, '0px', 'and none over the first card, or the two are a double line');
  is(cs(secs[0]).backgroundColor !== cs(d.getElementById('side')).backgroundColor, true,
     'filled card: a container tone one step off the sheet, or the card is invisible');
  is(cs(secs[0]).borderTopLeftRadius, '12px', 'M3 shape-corner-medium');
  is(cs(secs[0]).borderTopWidth + cs(secs[0]).boxShadow, '0pxnone',
     'no outline and no elevation: filled, not outlined and not elevated');
  is(Math.round(r(secs[1]).top - r(secs[0]).bottom), 8, 'cards separate by a gap, not by a rule');
  /* `.pophead` is gone, so the first card leads the body and there is no sibling left to measure
     it against. The sheet's own 12px padding plus the 8px every card carries is what clears it, so
     the assertion is that arithmetic rather than the 20 it comes to. A change to either number is
     then caught where it was made. */
  is(Math.round(r(secs[0]).top - r(d.getElementById('sideBody')).top),
     12 + Math.round(r(secs[1]).top - r(secs[0]).bottom),
     'and the first one clears the header on the sheet padding plus one card gap');
  /* M3's side sheet has a header. The drawer went unnamed for a long time on the argument that the
     hamburger which opened it stays on screen — true, and it still left the panel with no title. */
  /* **A pinned header needs a height of its own.** `.modalhead` was written as a row in the flow, so
     it sized to its title and pulled its close button back onto that line with a negative margin on
     all four sides. Pinning it made it a bar with a divider, and the vertical pull then hung the
     40px button through that divider — About drew a 24px bar under a 38px button, and Help a 35px
     one. Both look like a browser artifact and are a number written for another layout. */
  for (const id of ['aboutBox', 'helpBox']) {
    const b = d.getElementById(id); b.showModal();
    const hd = b.querySelector('.modalhead'), x = hd.querySelector('.dclose');
    is(Math.round(r(hd).height) >= 56, true, id + ': its pinned bar measures M3 56dp');
    is(Math.round(r(x).bottom) <= Math.round(r(hd).bottom), true,
       id + ': and the close button stays inside it');
    is(Math.round(r(x).top) >= Math.round(r(hd).top), true, id + ': at both ends');
    b.close();
  }

  d.body.classList.remove('side'); d.body.classList.add('drawer');
  const bh = d.getElementById('barHead');
  is(cs(bh).display, 'flex', 'the side sheet carries a header, which M3 says it does');
  /* **112, and the `<h2>` keeps no margin.** This read `>= 64` while the header was a side sheet's,
     and a `<h2>` carrying the UA's own `0.83em` block margin drew an 86px box under it for a whole
     revision. `#sideHead` beside it was 64, and nothing here saw the difference because no check
     ever put the two side by side. Both are the same app bar now, so both are asserted the same. */
  is(Math.round(r(bh).height), 112, 'M3 112dp medium flexible app bar');
  is(cs(bh.querySelector('h2')).fontSize, '28px', 'with a headline-medium headline');
  is(cs(bh.querySelector('h2')).marginTop, '0px', 'and the heading keeps no UA margin of its own');
  is(cs(bh.querySelector('h2')).fontSize, cs(d.querySelector('#sideTitle .popname')).fontSize,
     'which is the same headline the station panel takes, this pane having one');
  /* **Both occupants are a fixed header over a scrolling body, and the drawer was one box doing
     both.** So its own title scrolled away with the sections under it, and the fade through's
     `scale` ran on a scroll container in one occupant and a static flex column in the other. Assert
     the SHAPE and then the BEHAVIOUR: an occupant that scrolls itself and one whose header happens
     to fit are different faults, and only the second is invisible. */
  for (const [box, body, head] of [['bar', 'barBody', 'barHead'], ['side', 'sideBody', 'sideHead']]) {
    is(cs(d.getElementById(box)).overflowY, 'visible', box + ': the occupant is not the scroller');
    is(cs(d.getElementById(body)).overflowY, 'auto', box + ': its body is');
    is(cs(d.getElementById(head)).flexGrow + ' ' + cs(d.getElementById(head)).flexShrink, '0 0',
       box + ': and its header is a flex: none sibling of that body');
  }
  const bb = d.getElementById('barBody');
  bb.scrollTop = 200;
  const moved = bb.scrollTop;
  is(moved > 0, true, 'the filters body has something to scroll, or the next line proves nothing');
  is(Math.round(r(bh).top), Math.round(r(d.getElementById('bar')).top),
     'and its header stays on the occupant top edge while the body scrolls under it');
  bb.scrollTop = 0;
  is(!!pane2.querySelector(':scope > .grab'), false, 'and no drag handle: a side sheet has none');
  /* A standard side sheet is not modal, and `show()` is what makes that true. `showModal()` would
     put the pane in the top layer and make the map behind it inert, which is the one thing a pane
     beside live content must not do. There is no `#scrim` to assert against any more — the box went
     with the bottom sheet, and this variant paints no backdrop of its own either. */
  is(pane2.matches(':modal'), false, 'and it is NOT modal, so the map stays live beside it');
  is(!!d.getElementById('scrim'), false, 'with no scrim box left in the document');
  d.body.classList.remove('drawer'); d.body.classList.remove('side');
  await settled();
  /* Shut is `display: none`, not a box parked off screen. The pane is a `<dialog>`, so the browser's
     own `dialog:not([open]) { display: none }` does it and the author rule sets `display` on `[open]`
     alone. An author `display` on the element itself beats the UA rule and lays a shut pane out over
     the page — that trap has bitten this repo before, on `#dataBox`. */
  is(pane2.open, false, 'shut, the pane is closed as an element');
  is(cs(pane2).display, 'none', 'and `display` is on [open], never on the element');
  for (const id of DIALOGS) {
    const b = d.getElementById(id);
    b.showModal();
    const mh = b.querySelector('.modalhead');
    is(cs(mh).flexDirection, 'row', id + ': × stays at the trailing edge');
    /* The pin has to hold here too, not only on a phone: this is the width where Help is longest.
       The property is that the header does not MOVE, not that it sits on any particular pixel. A
       sticky box pins to the padding box, one border inside the pane, and the two flex-column
       dialogs hold their header inside a `.dtop` that carries its own padding. Comparing against
       the pane's own top asserts neither of those and fails on both. */
    const was = Math.round(r(mh).top);
    b.scrollTop = 600;
    is(Math.round(r(mh).top), was, id + ': its header does not move when the pane scrolls');
    is(b.scrollTop > 0 || b.querySelector('.data, #camGrid, .skelrows, .skeltiles') !== null, true,
       id + ': and there was something to scroll, so that assertion meant something');
    b.scrollTop = 0;
    is(cs(mh).position, id.startsWith('data') || id.startsWith('cam') ? 'static' : 'sticky',
       id + ': the prose panes pin their header, the two flex-column ones do it structurally');
    is(Math.round(r(b).width) <= w.innerWidth - 2 * parseFloat(cs(d.documentElement).getPropertyValue('--dlg-inset')) + 1,
       true, id + ': sits inside the band inset');
    is(cs(b).borderTopLeftRadius, '28px', id + ': M3 basic-dialog 28dp corner');
    is(w.getComputedStyle(b, '::backdrop').backgroundColor !== 'rgba(0, 0, 0, 0)', true,
       id + ': keeps its scrim');
    b.close();
  }
}

/* The four window size classes, read off one frame resized through them. `100vw` inside an iframe
   resolves to the iframe's own viewport, so a resize is a real breakpoint crossing.
   The numbers are the arithmetic of `--dlg-inset`, `--dlg-wide` and `--dlg-prose`, not a copy of
   them: a check that restates the variables reports on the numbers it remembers. */
async function bands() {
  const f = document.getElementById('desk');
  const { d, w, cs, r } = await ready('desk');
  d.head.insertAdjacentHTML('beforeend',
    '<style>*{transition:none !important;animation:none !important}</style>');
  say('--- the four window size classes -------------------------------------------');
  const wide = (id, expect, name) => {
    const b = d.getElementById(id);
    b.showModal();
    is(Math.round(r(b).width), expect, name);
    b.close();
  };
  const prose = (expect, name) => {
    const b = d.getElementById('helpBox');
    b.showModal();
    is(Math.round(parseFloat(cs(b).maxWidth)), expect, name);
    b.close();
  };
  for (const [px, label, inset, camW, tblW, proseW] of [
    [700,  'medium',   16, 668,  668,  560],
    [900,  'expanded', 24, 852,  852,  820],
    [1400, 'large',    32, 1336, 1200, 820],
  ]) {
    f.style.width = px + 'px';
    await new Promise(res => setTimeout(res, 150));
    is(w.innerWidth, px, label + ' @' + px + ': the frame really resized');
    is(cs(d.documentElement).getPropertyValue('--dlg-inset').trim(), inset + 'px',
       label + ': inset is ' + inset + 'px');
    wide('camBox', camW, label + ': the camera wall takes the room, uncapped');
    wide('dataBox', tblW, label + ': the table caps at its widest row');
    prose(proseW, label + ': the prose pane caps at a readable measure');

    /* **M3's canonical supporting-pane ratios.** Medium splits the window equally between the two
       panes. Expanded gives 70% to the main pane and 30% to the supporting one, and the bands above
       it keep that ratio.
       https://m3.material.io/foundations/layout/canonical-examples/supporting-pane
       Asserted as a SHARE of the window, never as a pixel count, because that is what the spec
       states and because the number moves with the frame. The map's own share is asserted from the
       other end: the two have to add up, or one is drawing over the other. */
    const share = label === 'medium' ? 0.5 : 0.3;
    const pane = d.getElementById('pane');
    const gap = parseFloat(cs(d.documentElement).getPropertyValue('--gap'));
    const seam = parseFloat(cs(d.documentElement).getPropertyValue('--seam'));
    d.body.classList.add('side');
    await new Promise(res => setTimeout(res, 200));
    const pw = r(pane).width, mw = r(d.getElementById('map')).width;
    /* The RATIO is against the window, because that is what M3 states. The map is then measured
       against what is left of the window after the pane and the card's own three insets. Add the
       two and the gaps back, and the window has to come out whole: anything else means one pane is
       drawing over the other. */
    is(Math.abs(pw / px - share) < 0.01, true,
       label + ': the supporting pane takes ' + Math.round(share * 100) + '% of the window');
    is(Math.round(mw + pw + gap + seam), px,
       label + ': and the map takes the rest, less its leading gap and its trailing seam');
    is(Math.round(r(pane).left - r(d.getElementById('map')).right), seam,
       label + ': one seam between the two panes');
    d.body.classList.remove('side');
    await new Promise(res => setTimeout(res, 150));
  }
  f.style.width = '1200px';
}

(async () => {
  out.textContent = '';
  try {
    await phone();
    await desktop();
    await bands();
  } catch (e) {
    bad++;
    say('THREW  ' + e.message);
  }
  say(bad ? 'FAIL: ' + bad : 'PASS');
})();
</script>
