     Measured against the real payload, a 1200px window stretches this column to 296px. That
     growth is deliberate. A reading gets more room to draw in on a big screen.
     So no rendered pixel count can tell a 220px floor from a 150px one once the stretch takes
     over. A check against the rendered box cannot tell them apart. Read the RULE instead.
     Below 600px the box holds no stretch, so the check reads the box there. The same media
     query narrows this column to 160px and moves `min-width` from 820px to 760px on the two
     sections. Reverting that move brings the stretch back, and the check then reads 173,
     proving it still watches the right thing. */
  if (w.innerWidth <= 600) {
    const nameW = Math.round(r(d.querySelector('.chead th:first-child')).width);
    is(nameW, 160, label + ': the name column is 160px on a phone');
  } else {
    const rule = [...d.styleSheets].filter(s => (s.href || '').includes('chrome.css'))
      .flatMap(s => [...s.cssRules])
      .find(x => x.selectorText === 'table.data td.nm, table.data .chead th:first-child');
    is(rule && rule.style.minWidth, '220px', label + ': the name column keeps a 220px floor');
  }
  b.close();
}

/* M3's state layer: the surface's own content colour at 8% on hover and 10% on press. This row
   took `var(--hover)` on hover and answered a press with nothing.

   A `:hover` cannot be driven from a script, so this checks two things per rule.

   First, the mix must RESOLVE. A probe element carries the expression and proves the percentage
   is not a dropped declaration. That is the shape the rail's own state-layer check already uses.

   Second, that each of the four selectors still DECLARES its own rule, walked by name rather than
   joined into one string. An unanchored join let an earlier version pass while only `td.nm`'s
   rules were broken, because the row's own rules still carried the text it searched for. */
async function rowState() {
  const { d, cs } = await ready('desk');
  say('--- the table row state layer --------------------------------------------');

  const resolves = (token, frac) => {
    const p = d.createElement('div');
    p.style.background = `color-mix(in srgb, var(--on-surface) var(${token}), transparent)`;
    d.body.appendChild(p);
    const v = cs(p).backgroundColor.replace(/\s/g, '');
    p.remove();
    return new RegExp(frac.replace('.', '\\.') + '\\)?$').test(v);
  };
  is(resolves('--m3-state-hover', '0.08'), true,
     'the hover mix resolves to 8% of the content colour, not a dropped declaration');
  is(resolves('--m3-state-press', '0.1'), true, 'and the press mix resolves to 10%');

  const rules = [];
  for (const sheet of d.styleSheets) {
    let list; try { list = sheet.cssRules; } catch { continue; }
    for (const rule of list)
      if (rule.selectorText && rule.selectorText.includes('tr[data-mast]')) rules.push(rule);
  }
  const declares = (selector, token) => {
    const rule = rules.find(x => x.selectorText === selector);
    return !!rule && rule.style.getPropertyValue('background').includes(token);
  };
  is(declares('table.data tr[data-mast]:hover > td', '--m3-state-hover'), true,
     'the row itself declares a hover layer');
  is(declares('table.data tr[data-mast]:active > td', '--m3-state-press'), true,
     'and a press layer');
  is(declares('table.data tr[data-mast]:hover td.nm', '--m3-state-hover'), true,
     'the sticky name cell declares its own hover layer');
  is(declares('table.data tr[data-mast]:active td.nm', '--m3-state-press'), true,
     'and its own press layer');

  /* Both fractions live in css/base.css, derived from the vendored state scale. A hand-copied
     number drifts the day M3 moves it, and nothing on screen says so. */
  const baseCss = [...d.styleSheets]
    .filter(s => (s.href || '').includes('base.css'))
    .flatMap(s => [...s.cssRules]).map(x => x.cssText).join('\n');
  is(/--m3-state-hover:/.test(baseCss), true, 'the hover fraction is derived, not hand-copied');
  is(/--m3-state-press:/.test(baseCss), true, 'and the press fraction too');
}

/* M3's assist chip, the same component `#sideKinds` and the alert head draw. It is 32dp, at
   `shape-corner-small`, with a 1dp outline, `label-large` text, and an 18dp leading icon.

   The colour splits M3's way. The label takes `on-surface`, and the 18dp leading icon takes the
   status hue. A chip whose label wears the status starts under 4.5 to 1 against its own tint.
   That is the contrast problem `.state` in css/base.css already records. */
const CELLS = `<tr data-mast="probe">
    <td class="nm">SUNGAI DAMANSARA</td>
    <td class="k"><div class="cv"><span class="mchip" style="--c:var(--s-alert)"
      ><i class="i i-rainy"></i>4 mm/h</span></div></td>
  </tr>`;

async function cellChips() {
  const { d, cs, r, settle } = await ready('desk');
  say('--- the table cell chips -------------------------------------------------');
  settle();
  const b = d.getElementById('dataBox');
  b.showModal();
  d.getElementById('dataBody').innerHTML = CELLS;
  const chip = d.querySelector('.mchip');
  const root = cs(d.documentElement);
  is(Math.round(r(chip).height), 32, 'the chip is 32dp');
  /* Read the radius and the size off their own tokens, never as a hand-copied pixel figure. That
     is the same rule the column head and the count line already state for label-large and
     title-small. */
  is(cs(chip).borderRadius, root.getPropertyValue('--md-sys-shape-corner-small').trim(),
     'shape-corner-small');
  is(cs(chip).fontSize, root.getPropertyValue('--md-sys-typescale-label-large-size').trim(),
     'label-large');
  is(cs(chip).borderTopWidth, '1px', 'a 1dp outline');
  const glyph = chip.querySelector('.i');
  is(Math.round(r(glyph).width), 18, 'an 18dp leading icon');
  /* The label is on-surface and the glyph carries the status. Compare the two against each
     other, never against a hex. */
  is(cs(chip).color === cs(glyph).color, false, 'the label is not painted by the status');
  is(Math.round(r(d.querySelector('td.k')).height), 53, 'so a chip cell is 53px');
  b.close();
}

/* **M3's rich tooltip**: a `surface-container` container, a 12dp corner, 12px by 16px of
   padding, a `title-small` subhead and `body-medium` rows. The panel already held a head over
   rows and already lived in the top layer, so this is tokens and numbers only.
   **`title-small` and `body-medium` are both 14px on 20px**, so a size assertion cannot tell
   one from the other. Every type assertion here reads the tracking and the weight too.
   **It must keep its own pills.** The panel sits inside a cell in the DOM, so the cell's rules
   reach it. The top layer changes where a thing paints, not what selectors match it. */
async function richTip() {
  const { d, cs, r, settle } = await ready('desk');
  say('--- the hover panel ------------------------------------------------------');
  settle();
  const b = d.getElementById('dataBox');
  b.showModal();
  d.getElementById('dataBody').innerHTML = `<tr><td class="k">
    <div id="probetip" class="tipbox" popover>
      <div class="tiphead">2 sensors here</div>
      <div class="tiprow"><span>SG. DAMANSARA</span><span class="tv">
        <span class="badge" style="--c:var(--s-alert)">light</span></span></div>
    </div></td></tr>`;
  const tip = d.getElementById('probetip');
  tip.showPopover();
  const root = cs(d.documentElement);
  const tok = n => root.getPropertyValue(n).trim();

  is(cs(tip).borderRadius, tok('--md-sys-shape-corner-medium'), 'a 12dp corner');
  is(cs(tip).padding, '12px 16px', 'M3 rich tooltip padding');

  /* The container tone, read off a probe and never off a literal. The bridge in `css/base.css`
     is what resolves the role, so a literal here states the answer twice. */
  const probe = d.createElement('div');
  probe.style.background = 'var(--hover)';
  d.body.appendChild(probe);
  const want = cs(probe).backgroundColor;
  probe.remove();
  is(cs(tip).backgroundColor, want, 'surface-container, not the page surface');

  /* The outline is deleted. M3 gives this component no outline, and the shadow is what lifts it.
     A deletion needs an assertion, or a half-finished revert draws a line nothing reports. */
  is(cs(tip).borderTopWidth, '0px', 'no outline');
  is(cs(tip).boxShadow !== 'none', true, 'and it keeps this app one elevation');

  const head = cs(tip.querySelector('.tiphead'));
  is(head.fontSize, tok('--md-sys-typescale-title-small-size'), 'title-small subhead: size');
  is(head.lineHeight, tok('--md-sys-typescale-title-small-line-height'), 'and its line height');
  is(head.letterSpacing, tok('--md-sys-typescale-title-small-tracking'), 'and its tracking');
  is(head.fontWeight, tok('--md-sys-typescale-title-small-weight'), 'and its weight');
  is(head.textTransform, 'none', 'sentence case, not the old uppercase block');

  const row = cs(tip.querySelector('.tiprow'));
  is(row.fontSize, tok('--md-sys-typescale-body-medium-size'), 'body-medium rows: size');
  is(row.letterSpacing, tok('--md-sys-typescale-body-medium-tracking'), 'and its tracking');
  is(row.fontWeight, tok('--md-sys-typescale-body-medium-weight'), 'and its weight');

  /* The head and the rows must not land on one scale. Both are 14px, so this is the assertion
     that says the two components are actually different. */
  is(head.letterSpacing !== row.letterSpacing, true, 'the two scales stay apart');

  /* The panel keeps the word the cell gave up, so a pill in here must still draw. */
  is(Math.round(r(tip.querySelector('.badge')).height) > 0, true, 'and it still draws its pills');
  tip.hidePopover();
  b.close();
}

/* **M3's filled card**: `surface-container-highest`, a 12dp corner, no outline, and a state layer.
   This app bridges `surface-container-highest` onto `--hover`, which `.camtile` already drew.
   **The 2px alert border stays, as a stated DIVERGENCE.** It is this app's status language, not a
   card outline. M3's outlined card states a 1dp neutral line, and 1dp of red around a 254px tile is
   much quieter than 2px. */
async function camCard() {
  const { d, cs, settle } = await ready('desk');
  say('--- the camera tile ------------------------------------------------------');
  settle();
  const b = d.getElementById('camBox');
  b.showModal();
  d.getElementById('camGrid').innerHTML =
    `<button class="camtile done" data-cam="1"><span class="camname">PROBE</span></button>
     <button class="camtile done t-now" data-cam="2"><span class="camname">PROBE</span></button>`;
  const tile = d.querySelector('.camtile');
  /* Read the shape token, never the number. The claim is that a tile wears `corner-medium`, not
     that it measures 12px. A literal goes stale the day the scale is re-baked, and it then reports
     the drift as a fault in the tile. */
  const tok = n => cs(d.documentElement).getPropertyValue(n).trim();
  is(cs(tile).borderRadius, tok('--md-sys-shape-corner-medium'), 'a 12dp corner');
  is(cs(tile).borderTopWidth, '2px', 'and 2px of border reserved');
  is(cs(tile).borderTopColor, 'rgba(0, 0, 0, 0)', 'transparent while the tile is quiet');
  /* The alert border keeps its token. Never a hex: the palette has moved four times. */
  const probe = d.createElement('span');
  probe.style.color = 'var(--s-danger)';
  d.body.appendChild(probe);
  is(cs(d.querySelector('.camtile.t-now')).borderTopColor, cs(probe).color,
     'and the alert tier still paints it');
  probe.remove();
  b.close();
}

/* A `:hover` cannot be driven from a script, so the state layer is a CSSOM walk.
   **Three assertions, and the third is the one that matters.** An inset `box-shadow` paints with
   the tile's own background, and `.camtile > img` is an in-flow descendant that paints after it.
   So a shadow layer is invisible the moment a picture arrives, which is every tile that works. */
async function camCardState() {
  const { d } = await ready('desk');
  const css = [...d.styleSheets]
    .filter(s => (s.href || '').includes('chrome.css'))
    .flatMap(s => [...s.cssRules]).map(x => x.cssText).join('\n');
  is(/\.camtile:hover::after[^}]*--m3-state-hover/.test(css), true, 'a tile answers a hover');
  is(/\.camtile:active::after[^}]*--m3-state-press/.test(css), true, 'and a press');
  is(/\.camtile:(hover|active)\s*\{[^}]*box-shadow/.test(css), false,
     'and never an inset shadow, which the picture paints over');
}

(async () => {
  out.textContent = '';
  try {
    await phone();
    await shortPhone();
    /* **`#railToggle` writes the REAL `localStorage` of `flood-exp.test`, because `#desk` loads the
       same `index.html` a reader's own browser does.** `desktop()` and `bands()` both press it now,
       to reach a 220px rail for real rather than assert a number nobody's press ever produces.
       Snapshot the frame's stored `prefs` once, before either function touches it, and put it back
       in a `finally` — so a run of this file costs a reader nothing in their own stored
       preferences, pass or throw. */
    const deskWin = document.getElementById('desk').contentWindow;
    const origPrefs = deskWin.localStorage.getItem('prefs');
    try {
      await desktop();
      /* AFTER `desktop()`, never before it. `alertPane()` switches transitions off in `#desk`,
         and `desktop()` reads its motion declarations before its own `settle()`. Called first,
         this probe answered every one of those with `none` — 16 assertions failed on markup that
         was right. The file header states the rule and this is where it bites. */
      await alertPane();
      await bands();
      /* AFTER `bands()`, for the same reason as `alertPane()` above: `panelInset()` calls
         `settle()` on the shared `#desk` frame, and a probe reading motion after that sees the
         override rather than the rule. Nothing here reads motion, but the ordering rule is the
         frame's and not any one probe's to break. */
      await panelInset('phone', 'phone');
      await panelInset('desk', 'desktop');
      await safeArea();
      /* `searchBar()` calls `settle()` on the shared frame too. It runs after
         `panelInset()`, for the same reason `panelInset()` runs after `bands()`.
         Nothing here reads motion. The ordering rule belongs to the frame,
         not to any one probe. */
      await searchBar('phone', 'phone');
      await searchBar('desk', 'desktop');
      /* `countLine()` calls `settle()` on the shared `#desk` frame too. It runs after
         `searchBar()`, for the same reason `searchBar()` runs after `panelInset()`. Nothing here
         reads motion. The ordering rule belongs to the frame, not to any one probe. */
      await countLine();
      /* `tableHead()` calls `settle()` on its own frame too. It runs after `countLine()`, for the
         same reason `countLine()` runs after `searchBar()`. Nothing here reads motion. The
         ordering rule belongs to the frame, not to any one probe. */
      await tableHead('phone', 'phone');
      await tableHead('desk', 'desktop');
      /* `rowState()` reads the CSSOM and a probe element, so ordering after `tableHead()` costs
         nothing. */
      await rowState();
      /* `cellChips()` calls `settle()` on the shared `#desk` frame too. It runs after
         `rowState()`, because Task 6 is the last table probe. Every probe above it already
         settled the frame. */
      await cellChips();
      /* `richTip()` calls `settle()` on the shared `#desk` frame too. It runs after
         `cellChips()`, because Task 7 is the next table probe. Every probe above it already
         settled the frame. */
      await richTip();
      /* `camCard()` calls `settle()` on the shared `#desk` frame too. It runs after `richTip()`,
         because Task 8 is the next probe in this phase. Every probe above it already settled
         the frame. */
      await camCard();
      /* `camCardState()` reads the CSSOM alone, so ordering after `camCard()` costs nothing. */
      await camCardState();
    } finally {
      if (origPrefs === null) deskWin.localStorage.removeItem('prefs');
      else deskWin.localStorage.setItem('prefs', origPrefs);
    }
  } catch (e) {
    bad++;
    say('THREW  ' + e.message);
  }
  say(bad ? 'FAIL: ' + bad : 'PASS');
})();
</script>
