       rail term here counted it twice. `header` is a 40px pill inside the map card now, so the
       popover left that element and states the rail term itself. The mark that opens it lives in
       the rail, so the rail is what it stands beside. */
    const netstatsGap = () =>
      Math.round(r(d.getElementById('netstats')).left - r(railEl).right);
    is(netstatsGap(), 8, 'the diagnostics popover sits 8px past the rail, rail shut');

    /* --- the rail expands and collapses ---
       `NavigationRail/navigation-rail.css`: 220px open against 80px shut, `padding-inline: 20px`,
       a 56px leading-aligned item at `border-radius: 28px`, a 56 by 32 pill that gives up its own
       fill for the whole row. `PREFS.railOpen` holds the state, so the control is pressed here
       rather than the preference written directly — the rule `syncHeat()` states for every
       preference-owned control in this app.
       **The toggle writes to the REAL `localStorage` of the app's own origin**, because this
       iframe loads the same `index.html` a reader's browser does. A press here can leave a
       developer's own rail preference open the next time they visit the real app. The outer IIFE
       captures the frame's stored `prefs` before this function runs and restores it in a
       `finally`, so this block presses the control freely rather than writing the preference
       directly — that is what keeps the assertions honest about the control a reader actually
       has. It starts from a known shut state rather than assuming one, in case the reader's own
       stored preference was already open when this ran. */
    const toggle = d.getElementById('railToggle');
    if (d.body.classList.contains('railopen')) { toggle.click(); await settled(); }

  const segs = [...secs[0].querySelectorAll('.sbody > li')];
  is(segs.length > 1, true, 'a river draws several segments, one per block it holds');
  is(cs(segs[0]).borderTopLeftRadius, '16px', 'the first segment takes the outer corner');
  is(cs(segs[0]).borderBottomLeftRadius, '4px', 'and the inner one where the next segment meets it');
  is(cs(segs.at(-1)).borderBottomLeftRadius, '16px', 'the last one takes the outer corner below');
  is(cs(segs[0]).backgroundColor !== cs(d.getElementById('side')).backgroundColor, true,
     'each segment is a filled container, or the group is invisible');
  is(Math.round(r(segs[1]).top - r(segs[0]).bottom), 2,
     'and they read as one block at M3 own 2px, never at the 8px `.mseg` takes');
  /* **Every segment in a group of several carries a title, and it leads the segment.** A meter, a
     metric row and a graph each answer a different question, and the title is what says which. The
     first line inside a segment cancels its own top margin: the item states 12px of padding, and a
     10px margin over that first line stands it 22px down. A group of ONE takes no title, because
     the head above it already named the only thing under it — the camera is the kind that reaches
     that, and the node harness in CLAUDE.md holds both halves over the live payload. */
  const heads = segs.map(x => x.firstElementChild);
  is(heads.every(h => h && h.classList.contains('subhead')), true,
     'each segment leads with its own title');
  is(cs(heads[0]).marginTop, '0px',
     'and that title cancels its top margin, or it stands 22px inside a 12px segment');
  /* **A pinned header needs a height of its own.** `.modalhead` was written as a row in the flow, so
     it sized to its title and pulled its close button back onto that line with a negative margin on
     all four sides. Pinning it made it a bar with a divider, and the vertical pull then hung the
     40px button through that divider — About drew a 24px bar under a 38px button, and Help a 35px
     one. Both look like a browser artifact and are a number written for another layout. */
  for (const id of ['aboutBox', 'helpBox']) {
    const b = d.getElementById(id); b.showModal();
    const hd = b.querySelector('.modalhead'), x = hd.querySelector('.dclose');
    is(Math.round(r(hd).height) >= 56, true, id + ': its pinned bar measures M3 56dp');
    is(Math.round(r(x).bottom) <= Math.round(r(hd).bottom), true,
       id + ': and the close button stays inside it');
    is(Math.round(r(x).top) >= Math.round(r(hd).top), true, id + ': at both ends');
    b.close();
  }

  /* **The occupant is a fixed header over a scrolling body.** One box doing both scrolls its own
     title away with the content under it. Assert the SHAPE and then the BEHAVIOUR: an occupant that
     scrolls itself and one whose header happens to fit are different faults, and only the second is
     invisible. */
  is(cs(d.getElementById('side')).overflowY, 'visible', 'side: the occupant is not the scroller');
  is(cs(d.getElementById('sideBody')).overflowY, 'auto', 'side: its body is');
  is(cs(sh).flexGrow + ' ' + cs(sh).flexShrink, '0 0',
     'side: and its header is a flex: none sibling of that body');
  const bb = d.getElementById('sideBody');
  /* **The body is capped for the probe.** A short card fits a 1000px window, so there is nothing to
     scroll and the line under this one proves nothing. What is asserted is that the header stays put
     WHILE the body scrolls, and a cap is the smallest thing that creates a scroll without inventing
     content. */
  bb.style.maxHeight = '80px';
  await settled();
  bb.scrollTop = 200;
  const moved = bb.scrollTop;
  is(moved > 0, true, 'the card body has something to scroll, or the next line proves nothing');
  is(Math.round(r(sh).top), Math.round(r(d.getElementById('side')).top),
     'and its header stays on the occupant top edge while the body scrolls under it');
  bb.scrollTop = 0;
  bb.style.maxHeight = '';
  is(!!pane2.querySelector(':scope > .grab'), false, 'and no drag handle: a side sheet has none');
  /* A standard side sheet is not modal, and `show()` is what makes that true. `showModal()` would
     put the pane in the top layer and make the map behind it inert, which is the one thing a pane
     beside live content must not do. There is no `#scrim` to assert against any more — the box went
     with the bottom sheet, and this variant paints no backdrop of its own either. */
  is(pane2.matches(':modal'), false, 'and it is NOT modal, so the map stays live beside it');
  is(!!d.getElementById('scrim'), false, 'with no scrim box left in the document');
  d.body.classList.remove('side');
  await settled();

  /* --- the docked search, above 600px ---
     Item 2 of the 2026-08-24 amendment moves `#gotoBox` out of the pane. Above 600px it floats over
     the map's leading corner instead, collapsed to its rail item until a reader asks for it. Nothing
     here checked that box at this width before now. Three faults survived a review of it: the
     mutual clear still ran here though the search is no longer a pane occupant, a reparent with no
     focus guard dropped whatever a reader was typing, and the rail button still named `#pane` in
     `aria-controls` once the search left it. These three assertions guard all three. */
  const findEl = d.getElementById('findpane'), findBtnEl = d.getElementById('railFind');

  // 1. Collapsed until asked for — guards a desktop rule leaking past the button.
  is(cs(findEl).display, 'none', 'the docked search stays collapsed until a reader asks for it');

  // 2. Open geometry: under the app bar, past the rail, clear of the pane, no stray caret.
  findBtnEl.click();
  await settled();
  is(cs(findEl).display, 'flex', 'pressing Search draws the docked card');
  is(findBtnEl.getAttribute('aria-controls'), 'findpane',
     'and the button now names the card it actually opens, not the shut pane behind it');
  const fb = r(findEl);
  /* **`--top-chips`, not `--top-free`.** That first token is the top of the map, and the layer chip
     row took it on 2026-08-25. Everything that used to dock there starts under the row instead, and
     the docked card must not be the one that forgot. Read it against the chip row's own bottom edge
     rather than against a number: a token that drifts from the row's height is invisible until the
     two boxes touch. */
  const chipRow = r(d.getElementById('mapchips'));
  is(fb.top >= chipRow.bottom - 0.5, true, 'the docked search starts under the layer chip row');
  is(fb.top >= r(d.getElementById('ticker')).bottom - 0.5, true, 'and under the news pill above it');
  is(Math.round(fb.left), Math.round(12 + GAP + RAIL), 'and past the rail, on the leading edge');
  const pr = r(pane2);
  const overlaps = fb.left < pr.right && fb.right > pr.left && fb.top < pr.bottom && fb.bottom > pr.top;
  is(overlaps, false, 'its box never intersects the pane, which stays shut behind it');
  is(w.getComputedStyle(d.getElementById('gotoBox'), '::after').display, 'none',
     'the results caret is the pane affordance, and this card IS the list');
  is(cs(d.getElementById('goto')).paddingRight, cs(d.getElementById('goto')).paddingLeft,
     'so the field reserves no room for a caret that never draws here');

  /* --- the bar and the results are two surfaces ---
     Amendment of 2026-08-24. One card held the field and the list on one tone, under one shadow, so
     a reader read one surface rather than two. Each paints itself now and `#findpane`
     paints nothing. The fault is invisible either way: a single card looks like a design, and only
     reading the three boxes apart tells them apart. `#gotoHits` is `hidden` until a query runs, and
     `getComputedStyle` still reports its paint, so this needs no search to have happened. */
  const barEl = d.getElementById('gotobar'), hitsEl = d.getElementById('gotoHits');
  const clear = c => c === 'rgba(0, 0, 0, 0)' || c === 'transparent';
  is(clear(cs(findEl).backgroundColor) && cs(findEl).boxShadow === 'none', true,
     'the column that holds the two paints nothing of its own');
  is(clear(cs(barEl).backgroundColor), false, 'the search bar carries its own surface');
  is(cs(barEl).boxShadow !== 'none', true, 'and its own elevation');
  is(clear(cs(hitsEl).backgroundColor), false, 'the results box carries its own surface');
  is(cs(hitsEl).boxShadow !== 'none', true, 'and its own elevation');
  is(cs(barEl).boxShadow, cs(hitsEl).boxShadow,
     'both take this app one elevation, never two shadows five percent apart');
  is(clear(cs(d.getElementById('goto')).backgroundColor)
     && cs(d.getElementById('goto')).boxShadow === 'none', true,
     'and the field inside the bar paints nothing, or two surfaces stack on one row');
  is(Math.round(r(barEl).height), 56, 'M3 search bar, 56px');

  /* --- the bar's leading back arrow ---
     M3 leads an active search view with a back arrow, and both variants are search views. So this
     is one control at both widths, at 56px here and 72px on a phone. The phone pass asserts that
     half. */
  const backEl = d.getElementById('findBack');
  is(cs(backEl).display !== 'none', true, 'the docked search bar leads with a back arrow');
  is(!!backEl.querySelector('.i-arrow_back'), true, 'and it is an arrow, not a close X');
  is([r(backEl).width, r(backEl).height].map(Math.round).join(','), '48,48',
     'M3 48px leading target in a search bar, wider than the 40px this app draws elsewhere');
  const bg = r(backEl.querySelector('.i'));
  is(Math.round(bg.left + bg.width / 2 - r(barEl).left), 28,
     'so its glyph lands 28px in, where every full-screen bar in this app already puts one');
  is(r(backEl).right <= r(d.getElementById('goto')).left, true, 'and it leads the field, never overlaps it');
  is(cs(barEl).borderRadius,
     cs(d.documentElement).getPropertyValue('--md-sys-shape-corner-extra-large').trim(),
     'a full pill, Search/search.css');
  is(cs(barEl).borderRadius === cs(hitsEl).borderRadius, false,
     'and the results take a smaller corner, so the two never read as one box');
  is(cs(d.getElementById('gotoBox')).rowGap, '8px', 'with a real gap between them');

  /* --- the results list, as M3's own list ---
     Scoped to `#gotoHits`, never to `.picklist`: the ignored list, the favorites list and the three
     Settings groups all wear that class and none of them is a search result. A widened rule restyles
     every one of them, and only this one is on screen here, so nothing would say so.
     `#gotoHits` is `hidden` until a query runs, so this drives the real field and waits. */
  d.getElementById('goto').value = 'a';
  d.getElementById('goto').dispatchEvent(new w.Event('input', { bubbles: true }));
  await settled();
  const rows = [...hitsEl.querySelectorAll('li:not(.head):not(.none)')];
  is(rows.length > 0, true, 'a query fills the list, or the rules below are measured on nothing');
  if (rows.length) {
    /* The list's own padding. A later same-specificity `#gotoHits` rule set `padding: 0` and beat
       the M3 block, with nothing on screen to say so. */
    is(cs(hitsEl).paddingTop, '8px', 'M3 list padding-block 8px, and no later rule beats it');
    is(Math.round(r(rows[0]).height) >= 56, true, 'M3 one-line list item, 56dp');
    is(cs(rows[0]).paddingLeft, '16px', 'M3 list padding-inline 16px');
    is(cs(rows[0]).columnGap, '16px', 'M3 list gap 16dp');
    is(cs(rows[0]).borderRadius, '0px', 'and no corner: a row in a list is not a pill');
    is(cs(rows[0]).fontSize,
       cs(d.documentElement).getPropertyValue('--md-sys-typescale-body-large-size').trim(),
       'M3 list headline body-large');
    const gl = rows[0].querySelector('.glyph');
    if (gl) is(cs(gl).fontSize, '24px', 'M3 leading icon 24dp');
    /* Hover and keyboard selection must not paint the same thing. They both drew the accent tint,
       so a mouse crossing the list erased the one mark that says what Enter opens. */
    const dl = d.createElement('div');
    dl.style.background = 'color-mix(in srgb, var(--accent) 14%, transparent)';
    d.body.appendChild(dl);
    /* Nothing is selected until an arrow key moves onto a row: `sel` starts at -1, and a keystroke
       in the field rebuilds the list without moving it. So this drives the real key handler. */
    d.getElementById('goto').dispatchEvent(
      new w.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
    await settled();
    const selRow = hitsEl.querySelector('li.sel');
    is(!!selRow, true, 'the down arrow stands the keyboard on a row');
    if (selRow) is(cs(selRow).backgroundColor, cs(dl).backgroundColor,
       'and it keeps the accent tint, which is where Enter goes');
    dl.remove();
  }
  /* Leave the field as this block found it, or every assertion after this one reads an open list. */
  d.getElementById('goto').value = '';
  d.getElementById('goto').dispatchEvent(new w.Event('input', { bubbles: true }));
  await settled();

  /* **Close through the real control, then wait out `#goto`'s own blur-close timer, before
     touching `find` again.** `gotoIn.onblur` in ui.js schedules `setFind(false)` 150ms after the
     field loses focus, and closing here — through the field's own docked card going
     `display: none` — is exactly what fires that blur. `settled()` (120ms) is short of that 150ms
     window, so checking again too soon can race a still-pending timer. 200ms clears it. */
  d.getElementById('findBack').click();
  await new Promise(res => setTimeout(res, 200));
  is(cs(findEl).display, 'none', 'closing collapses the card back to its rail item');

  // 3. The mutual clear no longer runs at this width — a floating box shares the screen by design.
  await inFrame(d, OPEN_CARD);
  await settled();
  is(d.body.classList.contains('side'), true, 'a station card is open before the search opens');
  findBtnEl.click();
  await settled();
  is(d.body.classList.contains('side'), true,
     'opening the search above 600px leaves an open station card in place');
  is(cs(d.getElementById('side')).display, 'flex', 'and the card itself keeps drawing');

  /* The mirror, with `find` left open from the click above rather than closed and reopened — a
     second close-then-open here would race the same blur timer the comment above avoids.
     The alert list is the second surface. */
  d.getElementById('railAlerts').click();
  is(d.body.classList.contains('find'), true,
     'opening the alert list above 600px leaves the search open beside it');
  is(cs(findEl).display, 'flex', 'and the docked card keeps drawing');

  d.getElementById('findBack').click();
  d.body.classList.remove('side');
  await settled();

  /* Shut is `display: none`, not a box parked off screen. The pane is a `<dialog>`, so the browser's
     own `dialog:not([open]) { display: none }` does it and the author rule sets `display` on `[open]`
     alone. An author `display` on the element itself beats the UA rule and lays a shut pane out over
     the page — that trap has bitten this repo before, on `#dataBox`. */
  is(pane2.open, false, 'shut, the pane is closed as an element');
  is(cs(pane2).display, 'none', 'and `display` is on [open], never on the element');
  for (const id of DIALOGS) {
    const b = d.getElementById(id);
    b.showModal();
    const mh = b.querySelector('.modalhead');
    /* **THE SAME APP BAR THE PANE WEARS, AT THIS WIDTH TOO**, asked for on 2026-08-25. These five
       drew a 56px row here with the headline beside the button, and the table and the wall drew 36.
       So one panel changed shape at 600px and no two panels agreed with each other.
       **Assert the PARTS, not a second copy of the numbers.** `.apptop` and `.apflex` are the pane's
       own classes, so a header holding them cannot drift from it. The measurements under them catch
       a rule that lands on the class and is then beaten by an id, which is how the headline drew 24
       here and 28 on a phone for a whole revision. */
    const top = mh.querySelector('.apptop'), h2b = mh.querySelector('.apflex');
    is(cs(mh).flexDirection, 'column', id + ': the pane’s app bar, so the icons and the headline are two rows');
    is(!!top, true, id + ': its icon row is `.apptop`, the part the pane places');
    is(Math.round(r(mh).height) >= (h2b ? 112 : 56), true,
       id + ': M3 112dp with a headline, and the 56dp top row without one');
    const g = mh.querySelector('.dclose .i');
    is(Math.round(r(mh.querySelector('.dclose')).width), 48, id + ': a 48dp target, the pane’s own');
    is(Math.round((r(g).left + r(g).right) / 2 - r(mh).left), 28, id + ': glyph 28px in');
    is(Math.round((r(g).top + r(g).bottom) / 2 - r(mh).top), 32, id + ': and 32px down');
    /* Against the pane's own headline, never against a literal. `getComputedStyle` resolves a
       font-size inside a shut `<dialog>`, so this holds with `#pane` closed. */
    if (h2b) is(cs(h2b.querySelector('h2')).fontSize,
       cs(d.querySelector('#sideTitle .popname')).fontSize,
       id + ': and one headline size across every panel');
    /* **The five full-screen-capable panes lead with a back arrow at BOTH widths**, asked for on
       2026-08-25. The pane already did, so one glyph in one position now answers every panel. This
       reverses the trailing X these carried above 600px. */
    const back = b.querySelector('.dclose');
    is(cs(b.querySelector('.modalhead form')).order, '-1',
       id + ': and its back arrow leads, the way the pane already reads');
    is(Math.round(r(back).left - r(b).left) < Math.round(r(b).right - r(back).right), true,
       id + ': on the leading half of the bar, never the trailing one');
    is(!!back.querySelector('.i-arrow_back'), true, id + ': and it is an arrow, not an X');
    /* **All five hold the header still the same way: the DIALOG does not scroll and a body inside it
       does.** A reader asked for that on 2026-08-25, because a dialog that scrolls itself runs its
       scrollbar the whole height of the pane and past the bar.
       **`position: sticky` stood on the three prose panes for one revision, and it is gone.** A
       sticky box pins to its scroller's PADDING box, so it needed a negative `top` and four negative
       margins, each of which had to stay in step with the padding it cancelled. A structural seam
       needs none of them, and it moves the scrollbar under the header as a side effect.
       **Cap the scroller when it does not already overflow.** Settings holds two saved lists that
       are empty on a fresh browser, so on a 1000px window it fits and there is nothing to scroll.
       A cap is the smallest thing that makes a scroll without inventing content. It goes on the
       BODY, never on the dialog: capping the dialog makes the dialog the scroller and the header
       then travels with it, which is a fault the cap invented. */
    is(cs(mh).position, 'static', id + ': every one of the five is structural, none is sticky');
    const sc = b.querySelector('.docbody, table.data, #camGrid');
    is(!!sc, true, id + ': and it holds one body that scrolls');
    is(cs(sc).overflowY, 'auto', id + ': that body is the scroller');
    /* The scrollbar rides the body, so it starts under the bar rather than beside it. That is the
       whole of what a reader asked for, stated as geometry. */
    is(Math.round(r(sc).top) >= Math.round(r(mh).bottom), true,
       id + ': the scroller starts under the header, never beside it');
    const capped = sc.scrollHeight <= sc.clientHeight;
    if (capped) { sc.style.maxHeight = '120px'; await settled(); }
    const was = Math.round(r(mh).top);
    sc.scrollTop = 600;
    b.scrollTop = 600;
    is(b.scrollTop, 0, id + ': the dialog itself has nothing to scroll');
    is(Math.round(r(mh).top), was, id + ': its header does not move when the body scrolls');
    is(sc.scrollTop > 0 || b.querySelector('.skelrows, .skeltiles') !== null, true,
       id + ': and there was something to scroll, so that assertion meant something');
    sc.scrollTop = 0;
    if (capped) { sc.style.maxHeight = ''; await settled(); }
    is(Math.round(r(b).width) <= w.innerWidth - 2 * parseFloat(cs(d.documentElement).getPropertyValue('--dlg-inset')) + 1,
       true, id + ': sits inside the band inset');
    is(cs(b).borderTopLeftRadius, '28px', id + ': M3 basic-dialog 28dp corner');
    is(w.getComputedStyle(b, '::backdrop').backgroundColor !== 'rgba(0, 0, 0, 0)', true,
       id + ': keeps its scrim');
    b.close();
  }

  /* --- Settings holds two M3 LISTS ---
     Transcribed from List/list.css in the M3 Expressive component set. The two saved lists left the
     filters drawer on 2026-08-25, and a reader asked for M3's list shape the same day.
     **One row is injected, in the shape `js/render.js` emits.** The live payload has nothing starred
     on a fresh browser, and seeding the preference costs a reload. The shape is fixed here, the way
     `CARD` above is, so these numbers cannot move with the weather.
     **Measure BEFORE the next poll.** `render()` rewrites both lists from the preference, so an
     injected row survives until then and no longer.
     **The inline padding is M3's one divergence here**, and it is dropped rather than halved. The
     pane already pads 24px. A list that pads 16px inside that puts its rows 16px in from the
     Developer prose under them, and one pane states one inset. */
  {
    const sb = d.getElementById('settingsBox');
    sb.showModal();
    const list = d.getElementById('favList');
    /* **Inject AFTER the wait, never before it.** `favPanel()` rewrites this list from the
       preference on every poll, so a row written before a 120ms wait is a row a poll can replace.
       The check then measures the reader's own favorites, and `:last-child` reaches row 1 of several
       rather than the only row there is. That failed on markup that is right, and it failed only
       when a poll happened to land inside the wait. Reading a computed style flushes layout by
       itself, so nothing has to be awaited after the write. */
    await settled();
    list.innerHTML = `<li>
        <i class="glyph i i-water_drop" style="color:#1a73e8"></i>
        <span class="nm">SUNGAI DAMANSARA DI TTDI JAYA<br
          ><span class="muted">Shah Alam, Selangor · Water level</span></span>
        <button class="mtrail" data-unfav="probe" data-tip="Remove"
          ><i class="i i-heart_minus"></i></button>
      </li>`;
    const li = list.firstElementChild;
    const nm = li.querySelector('.nm'), sup = li.querySelector('.nm .muted');
    const tok = n => cs(d.documentElement).getPropertyValue(n).trim();
    is(Math.round(r(li).height) >= 72, true, 'settings list: M3 two-line item, min 72dp');
    is(cs(li).gap, '16px', 'settings list: M3 16dp between the slots');
    is(cs(li).cursor, 'default', 'settings list: a static row, so no pointer — the button is the action');
    /* **Segmented, on a reader's instruction of 2026-08-25.** Every row is a filled container on
       `surface-container`, and the group's own outer edges take the 16dp corner while the rows keep
       the 4dp one. A row that paints nothing is the STANDARD appearance, which stood here for one
       revision. */
    is(cs(li).backgroundColor !== 'rgba(0, 0, 0, 0)', true,
       'settings list: a segmented row paints a container, never nothing');
    is(parseFloat(cs(li).borderTopLeftRadius), parseFloat(tok('--md-sys-shape-corner-large')),
       'settings list: the group’s first row takes M3’s 16dp outer corner');
    /* **The bottom corner is the INNER one here, and `.mfoot` is why.** The clear action is the
       group's own last row, in a list of its own under this one, so the two read as one shape and
       only the footer's row takes the outer corner below. This assertion read 16dp and belongs to
       the revision before that row moved out of a `.rowbtns` box. A group with no footer still
       takes 16dp on both ends, which is what `#ignoredList` and the alert groups draw. */
    is(parseFloat(cs(li).borderBottomLeftRadius),
       parseFloat(tok('--md-sys-shape-corner-extra-small')),
       'settings list: and the inner corner below it, where its clear-action footer continues');
    is(parseFloat(cs(d.querySelector('#settingsBox .mfoot > li')).borderBottomLeftRadius),
       parseFloat(tok('--md-sys-shape-corner-large')),
       'settings list: the footer row is what closes the group on M3’s 16dp outer corner');
    is(cs(li.querySelector('.glyph')).fontSize, '24px', 'settings list: M3 24dp leading icon');
    is(Math.round(r(li.querySelector('.glyph')).height) >= 48, true,
       'settings list: on M3 48dp of leading slot, which is what holds a one-line row at 56');
    is(cs(nm).fontSize, tok('--md-sys-typescale-body-large-size'),
       'settings list: the headline at body-large');
    /* `.muted` carries a `font-size` of its own, so the supporting rule needs three classes to beat
       it. That trap is written up in CLAUDE.md and it shipped once, on the rain chart's labels. */
    is(cs(sup).fontSize, tok('--md-sys-typescale-body-medium-size'),
       'settings list: the supporting line at body-medium, over `.muted`’s own 12px');
    is(cs(sup).color, cs(sb.querySelector('h3')).color,
       'settings list: and in on-surface-variant, the subheader’s own role');
    /* **The trailing action is an M3 icon button, and it was a text pill reading `remove`.** M3 puts
       48dp on the trailing slot, and a real icon button carries that on both axes rather than
       reaching it with an `::after`. */
    const trail = li.querySelector('.mtrail');
    is(!!trail, true, 'settings list: the trailing action is an icon button');
    is(!!trail.querySelector('.i'), true, 'settings list: carrying a glyph, never the word `remove`');
    is([Math.round(r(trail).width), Math.round(r(trail).height)].join(','), '48,48',
       'settings list: at M3’s 48dp trailing slot, on both axes');
    /* A `title` never opens on touch, which is a rule this app already states. `data-tip` is what
       `js/sparktip.js` answers on hover and on tap alike. */
    is(trail.hasAttribute('data-tip'), true, 'settings list: its words ride data-tip, never title');
    is(trail.hasAttribute('title'), false, 'settings list: and never a title, which a phone cannot open');

    /* **The clear action is the group's LAST ROW, not a button under it.** A reader asked for that
       on 2026-08-25. It was a full-width link in a `.rowbtns` box.
       **Two elements and one group, because `render.js` owns the list's `innerHTML`.** A row written
       inside the `<ul>` is wiped on the next poll. So the corners are what say the two are one
       thing: the list drops its bottom outer corner and `.mfoot` takes it. Assert both halves — a
       list that kept its corner and a `.mfoot` that took one too reads as two stacked cards. */
    const foot = list.nextElementSibling;
    is(foot?.classList.contains('mfoot'), true, 'settings list: its action is the group’s last row');
    is(!!d.getElementById('favClear')?.classList.contains('mrow'), true,
       'settings list: and a row-filling action, never a link in a box of its own');
    is(d.querySelector('#settingsBox .rowbtns'), null, 'settings: no `.rowbtns` left in this pane');
    /* The two corners that join the boxes are asserted above, beside the row's own. This is the
       third fact they depend on: the seam is the group's own gap and nothing wider. */
    is(parseFloat(cs(foot.firstElementChild).borderTopLeftRadius),
       parseFloat(tok('--md-sys-shape-corner-extra-small')),
       'settings list: the action row keeps a 4dp corner facing the list above it');
    is(Math.round(r(foot).top - r(list).bottom), 8,
       'settings list: on the group’s own 8px gap, so nothing says the action is separate');

    /* --- the Developer group --- */
    const dev = d.getElementById('devList');
    const rows = [...dev.children];
    // The row's own class first: `.readout` carries the readings TABLE, which has an id of its own.
    is(rows.map(x => x.className || x.querySelector('[id]')?.id).join(','),
       'testMode,readout,devForce,devRaw,devReset',
       'developer: the reader’s own order — switch, readings, refresh, raw, reset');
    /* **M3's switch.** Track 52x32 with a 2px border, thumb 16px off and 24px on, in a 48x68 target.
       The amber `.testtog` pill is gone. */
    const sw = dev.querySelector('.msw'), track = sw.querySelector('.mswtrack');
    // A live element already painted in `--accent`, so the check reads the token rather than a hex.
    const sh0 = d.createElement('span');
    sh0.style.color = 'var(--md-sys-color-primary)';
    sb.appendChild(sh0);
    const thumb = sw.querySelector('.mswthumb'), box = d.getElementById('testMode');
    is([Math.round(r(sw).width), Math.round(r(sw).height)].join(','), '68,48',
       'developer: M3 switch, a 68x48 touch target');
    is([Math.round(r(track).width), Math.round(r(track).height)].join(','), '52,32',
       'developer: on a 52x32 track');
    is(cs(track).borderTopWidth, '2px', 'developer: with M3’s 2px outline');
    is(Math.round(r(thumb).width), 16, 'developer: and a 16dp handle while it is off');
    is(d.querySelector('.testtog'), null, 'developer: the amber pill is gone');
    box.checked = true;
    await settled();
    is(Math.round(r(thumb).width), 24, 'developer: the handle grows to M3’s 24dp when it is on');
    is(cs(track).backgroundColor, cs(sh0).color,
       'developer: and the track fills with primary, which is this app’s accent');
    box.checked = false;
    sh0.remove();
    await settled();
    /* The readings take no press: no button, no anchor, no pointer. */
    const ro = dev.querySelector('.readout');
    is(ro.querySelector('button, a'), null, 'developer: the readings row holds no control');
    is(cs(ro).cursor, 'default', 'developer: so nothing about it invites a tap');
    is(!!ro.querySelector('#devstats'), true, 'developer: and it is where the readings table lives');
    /* The three actions are M3 list ACTION rows: a button that fills the item. */
    for (const id of ['devForce', 'devRaw', 'devReset']) {
      const btn = d.getElementById(id);
      is(btn.classList.contains('mrow'), true, id + ': is a row-filling action, not a pill');
      is(Math.round(r(btn).width), Math.round(r(btn.closest('li')).width),
         id + ': and fills its own container, so the row is the target');
      is(cs(btn).cursor, 'pointer', id + ': which a pressable row states');
    }

    const sh = sb.querySelector('h3');
    is(cs(sh).fontSize, tok('--md-sys-typescale-title-small-size'),
       'settings subheader: M3 list subheader at title-small');
    is(cs(sh).textTransform, 'none',
       'settings subheader: not `.docbox h3`, the 11px uppercase label the prose panes take');
    is(Math.round(r(sh).height) >= 48, true, 'settings subheader: M3 48dp');
    /* **No glyph and no disc on a heading.** Both stood here for one revision and the repository
       owner cut them on 2026-08-25. That lands on M3's own list subheader, which states a label and
       nothing else. Assert the absence: markup left behind by a half-finished revert draws a disc on
       one heading and nothing on the next, and neither errors. */
    is(sb.querySelector('h3 .hdisc'), null, 'settings: no disc on a heading');
    is(sb.querySelector('h3 .i'), null, 'settings: and no glyph either, which is M3 subheader');
    /* Developer heads no list and takes the same style anyway. One pane states one heading. */
    const devH = [...sb.querySelectorAll('h3')].pop();
    is(cs(devH).fontSize, cs(sh).fontSize,
       'settings: the Developer heading is the same subheader, so the pane has one heading style');
    is(Math.round(r(sh).left), Math.round(r(li).left),
       'settings: the subheader and its rows stand on one inset');
    is(Math.round(r(devH).left), Math.round(r(dev.firstElementChild).left),
       'settings: and so does the group under it');
    list.innerHTML = '';
    sb.close();
  }

  /* --- the reset confirmation is an M3 basic dialog ---
     It replaced a native `confirm()` on 2026-08-25. Three things this asserts and nothing else in
     the app can: that it opens OVER the settings pane rather than closing it, that it takes the
     numbers `Dialog/dialog.css` states, and that Cancel leaves the preferences alone.
     **A confirmation carries no close X**, which is why the roll call above marks it a basic dialog
     with no `.modalhead`. It answers with its two buttons. */
  {
    const sb = d.getElementById('settingsBox'), cb = d.getElementById('confirmBox');
    sb.showModal();
    d.getElementById('devReset').click();
    await settled();
    is(cb.open, true, 'reset: the confirmation opens');
    is(sb.open, true, 'reset: over the settings pane, which stays open behind it');
    is(parseFloat(cs(cb).borderTopLeftRadius), 28, 'reset: M3 basic-dialog 28dp corner');
    is(cs(cb).padding, '24px', 'reset: and M3’s own 24px of padding');
    is(Math.round(r(cb).width), Math.min(560, Math.round(w.innerWidth - 48)),
       'reset: at min(560, window - 48)');
    const foot = cb.querySelector('.mdlgfoot');
    is(cs(foot).justifyContent, 'flex-end', 'reset: its actions sit on the trailing edge');
    is(cs(foot).gap, '8px', 'reset: at M3’s 8px between them');
    is([...foot.children].map(b2 => b2.id).join(','), 'confirmNo,confirmYes',
       'reset: Cancel first, the destructive answer last, which is M3’s order');
    is(cs(cb.querySelector('.mdlgtitle')).fontSize,
       cs(d.documentElement).getPropertyValue('--md-sys-typescale-headline-small-size').trim(),
       'reset: the headline at headline-small');
    /* Cancel must change nothing. This is the one assertion that would notice a wired-up Reset on
       the wrong button, and that mistake wipes every preference a reader has. */
    const before = w.localStorage.getItem('prefs');
    d.getElementById('confirmNo').click();
    await settled();
    is(cb.open, false, 'reset: Cancel closes it');
    is(w.localStorage.getItem('prefs'), before, 'reset: and leaves every preference alone');

    /* **All three destructive presses in Settings share this one dialog**, asked for on 2026-08-25.
       The fault a shared dialog invents is stale words: a second caller opens it still carrying the
       first caller's headline, and a reader confirms the wrong act. So each press is asserted to
       REWRITE all three strings, and the two list presses are asserted against each other rather
       than against a literal.
       **The buttons disable themselves on an empty list**, and a fresh browser has both empty.
       Enabling them here tests the wiring, which is what this block is about.
       **Cancel every time.** Confirming would empty a reader's own saved list on the machine this
       runs on, and the assertion above already covers what Cancel must not do. */
    const seen = new Set();
    for (const [press, act] of [['favClear', 'Remove'], ['ignoredClear', 'Stop ignoring']]) {
      const b2 = d.getElementById(press);
      b2.disabled = false;
      b2.click();
      await settled();
      is(cb.open, true, press + ': confirms rather than acting at once');
      is(sb.open, true, press + ': over the settings pane, which stays open behind it');
      const head = d.getElementById('confirmTitle').textContent.trim();
      is(head.length > 0 && d.getElementById('confirmBody').textContent.trim().length > 0, true,
         press + ': with a headline and a line under it');
      is(seen.has(head), false, press + ': and words of its own, never the last caller’s');
      seen.add(head);
      /* M3 names the act on the confirming button. "OK" is the word a reader who mis-tapped has no
         way to read back. */
      is(d.getElementById('confirmYes').textContent.trim(), act,
         press + ': its confirming button names the act');
      const was2 = w.localStorage.getItem('prefs');
      d.getElementById('confirmNo').click();
      await settled();
      is(cb.open, false, press + ': Cancel closes it');
      is(w.localStorage.getItem('prefs'), was2, press + ': and the list survives it');
    }
    sb.close();
  }

  /* --- the snackbar is a popover, and that is the only way it can be seen ---
     It reports on a control inside a modal dialog. A modal dialog is in the top layer, and no
     `z-index` reaches over that — the rule `js/sparktip.js` already obeys from the other side. */
  {
    const sn = d.getElementById('snack');
    is(sn.getAttribute('popover'), 'manual',
       'snackbar: a manual popover, so it outranks the modal pane it reports on');
    is(sn.getAttribute('role'), 'status', 'snackbar: and speaks as a status');
    sn.textContent = 'Refreshed in 1 ms';
    sn.showPopover();
    await settled();
    is(Math.round(r(sn).height) >= 48, true, 'snackbar: M3 single-line 48dp');
    is(Math.round(r(sn).width), Math.min(344, Math.round(w.innerWidth - 32)),
       'snackbar: at min(344, window - 32)');
    is(parseFloat(cs(sn).borderTopLeftRadius), 4, 'snackbar: on M3’s 4dp corner');
    is(cs(sn).backgroundColor !== 'rgba(0, 0, 0, 0)', true, 'snackbar: filled with inverse-surface');
    is(Math.round((r(sn).left + r(sn).right) / 2), Math.round(w.innerWidth / 2),
       'snackbar: centred on the window');
    is(Math.round(w.innerHeight - r(sn).bottom) >= 16, true,
       'snackbar: standing at least M3’s 16dp off the bottom edge');
    sn.hidePopover();
  }
}

/* --- the alert pane: an M3 assist chip over an M3 segmented list ---------------------------------

   Both arrived on 2026-08-25, on a reader's instruction. Each replaced a shape this app had invented
   for itself: the kind was a `.badge` pill and the places were a bare list with a 6dp radius.

   Three faults here put nothing obviously wrong on screen.

   The chip rule is a SHARED selector, `#sideKinds .badge, .alert .badge`. Drop the second half and
   the alert card silently goes back to the uppercase pill, which still looks deliberate.

   `.mseg` was hoisted out of `#settingsBox` so two surfaces state one set of numbers. An unscoped
   `.mseg > li` is one class and one element, and `.picklist li` beside it is the same specificity.
   So the hoist can move Settings by source order alone, and nothing on the alert side would show it.
   Hence the Settings row is measured here too.

   A segmented GROUP is one shape: 4dp inner corners with the 16dp outer one on the first and last
   row only. A rule that gives every row 16dp all round reads as a stack of cards, and a rule that
   gives none of them the outer corner reads as a plain list. Both look intentional.

   The markup is fixed rather than taken from the live payload, the same rule `CARD` above states.
   That the real `groupCard()` emits these classes is asserted in CLAUDE.md's Verify block, which
   reads `js/alerts.js` as source. Neither half is enough alone. */
const ALERT_CARD = `<div class="pophead"><div class="popname">On alert</div>
    <div class="badges">
      <span class="badge" style="--c:var(--s-danger)" data-tip="2 at danger" aria-label="2 at danger"
        ><i class="i i-warning"></i>2</span>
      <span class="badge" style="--c:var(--muted)"><i class="i i-near_me"></i>Nearest first</span>
    </div></div>
  <div class="alert t-now grouped">
    <h3 class="nsub">Water levels at danger<span class="tg tg-now">HAPPENING NOW</span></h3>
    <ul class="slist mseg">
      <li data-go="a"><i class="i i-water_drop"></i>
        <span class="nm">SG A<br><small class="muted">Shah Alam, Selangor</small></span>
        <b class="rd">5.32 m</b></li>
      <li data-go="b"><i class="i i-layers"></i>
        <span class="nm">SG B<br><small class="muted">Hulu Langat, Selangor</small></span>
        <b class="rd">3.10 m</b></li>
      <li data-go="c"><i class="i i-water_drop"></i>
        <span class="nm">SG C<br><small class="muted">Klang, Selangor</small></span>
        <b class="rd">2.04 m</b></li>
    </ul>
  </div>`;

async function alertPane() {
  const { d, cs, r } = await ready('desk');
  d.head.insertAdjacentHTML('beforeend',
    '<style>*{transition:none !important;animation:none !important}</style>');
  await inFrame(d, "import { openSide } from '/js/map.js'; openSide('@probe-alert', "
    + JSON.stringify(ALERT_CARD) + ");");
  await settled();

  /* **The head's own chips, and the lift is half of what this asserts.** The counts and
     `Nearest first` are M3 assist chips in a `.badges` row, and `openSide()` moves
     `:scope > .badge, :scope > .badges` into `#sideKinds` — the app bar's own chip line. So the
     alert head reads exactly as a station card does.
     They were `.tally b`, a 12px pill that stayed in the body. `.pophead` never emptied behind it,
     so the seam was never removed, and an empty seam still draws its own bottom margin.
     `Nearest first` was a muted fragment INSIDE `.popname`, which this function lifts whole into
     the headline. A 32dp chip inside a headline is not a chip, so it had to leave the title. */
  const kinds = d.getElementById('sideKinds');
  const headChips = [...kinds.querySelectorAll('.badge')];
  is(headChips.length, 2, 'alert head: the counts and Nearest first were lifted into the app bar');
  is(!!kinds.querySelector('.badges'), true, 'alert head: as one .badges row, not loose chips');
  is(cs(headChips[0]).height, '32px', 'alert head: a count is an M3 assist chip');
  is(cs(headChips[0]).textTransform, 'none', 'alert head: not the 12px pill it replaced');
  /* The colour splits M3's way. A count whose NUMBER is painted by the status reads as a reading,
     and a count of stations is not one. The pill did paint the number. */
  /* `on-surface`, which is the pane's own body ink. Compared against `#sideBody` and not against a
     second chip: the group chip this once matched is gone, and `getComputedStyle(null)` throws
     rather than fails, so it took the whole block with it. */
  is(cs(headChips[0]).color, cs(d.getElementById('sideBody')).color,
     'alert head: the label takes on-surface, the ink the pane itself uses');
  is(cs(headChips[0].querySelector('.i')).color !== cs(headChips[0]).color, true,
     'alert head: and only the leading icon carries the status hue');
  is(headChips[1].textContent.trim(), 'Nearest first',
     'alert head: the ordering states itself as a chip and no longer inside the headline');
  is(d.getElementById('sideTitle').textContent.trim(), 'On alert',
     'alert head: so the headline holds the title alone');
  // `.pophead` empties once every piece is lifted, and an empty seam still draws its own margin.
  is(!!d.querySelector('#sideBody .pophead'), false, 'alert head: the seam empties and is removed');

  /* **A GROUP DRAWS NO CHIP AND NO SHELL.** A reader cut both on 2026-08-25. The kind chip stated
     the kind a third time, over a heading that names it and rows that all carry its glyph. The
     coloured left rule stated the tier a third time beside a tag that says it in words.
     Both deletions are asserted, because markup left behind by a half-finished revert draws a
     control nobody meant to ship and errors nowhere. */
  is(d.querySelectorAll('.alert .badge').length, 0, 'alert group: no kind chip inside the card');
  is(!!d.querySelector('.alerttop'), false, 'alert group: and no row left over for it to sit in');
  const card = d.querySelector('.alert');
  is(cs(card).borderLeftWidth, '0px', 'alert group: no coloured left rule');
  is(cs(card).borderTopWidth, '0px', 'alert group: and no divider above it — this pane spaces');

  /* **The head is the M3 list SUBHEADER the Notices pane draws, `.nsub`.** One component, two
     panes, so the numbers are stated once: `title-small` in `on-surface-variant` at 48dp, with a
     24dp leading glyph. */
  const sub = d.querySelector('.alert .nsub');
  is(!!sub, true, 'alert group: it heads itself with a list subheader');
  is(cs(sub).minHeight, '48px', 'alert subheader: M3 48dp');
  is(cs(sub).fontSize, cs(d.querySelector('.nsub')).fontSize,
     'alert subheader: the same title-small the Notices pane takes');
  /* **NO GLYPH AND NO DISC, and this is the third shape the head has had.** A tier-coloured glyph
     stated the tier a third time, right after the left rule was cut for doing that. A neutral one
     repeated the mark every row under it already carries. An `avat()` disc made a 40dp mark out of
     the repeat. The repository owner cut all three on 2026-08-25.
     M3's list subheader is a label and nothing else, so this is the component and not a divergence.
     **The Notices pane keeps its own glyph**, so the absence is asserted on this subheader alone —
     a rule written against `.nsub` reaches both panes. */
  is(sub.querySelectorAll('.i').length, 0, 'alert subheader: no glyph, this pane states the kind in words');
  is(!!sub.querySelector('.avat'), false, 'alert subheader: and no disc around one');
  is(!!d.querySelector('.nlist') || !!d.querySelector('.nrow'), false,
     'alert subheader: the Notices pane is not on screen, so its own glyph is untouched here');
  // It wraps rather than squashing. A 302px row holds a 24px glyph, a title and a ~100px tag.
  is(cs(sub).flexWrap, 'wrap', 'alert subheader: wraps rather than squashing its own tag');
  /* The tag stays. The rule was colour and colour alone is a code nobody was taught, so the word is
     what carries CAP's certainty axis. Its own 6px margin is cancelled: the flex gap states the
     space once. */
  const tg = sub.querySelector('.tg');
  is(!!tg, true, 'alert subheader: the tier tag stays, because it is the word and not the rule');
  is(cs(tg).marginLeft, '0px', 'alert subheader: and the flex gap spaces it, not its own margin');

  /* M3's LIST at `appearance: segmented`. The container, the two corners and the typescale come
     from `.mseg`, which Settings draws from as well. */
  const ul = d.querySelector('.slist');
  is(ul.classList.contains('mseg'), true, 'alert list: it declares itself segmented');
  is(cs(ul).display + ' ' + cs(ul).flexDirection, 'flex column', 'alert list: a flex column');
  is(cs(ul).gap, '8px', 'alert list: 8px between rows');
  is(cs(ul).listStyleType, 'none', 'alert list: no marker');
  is(cs(ul).padding + ' ' + cs(ul).margin, '0px 0px', 'alert list: and no box of its own');

  const li = [...ul.querySelectorAll('li')];
  is(li.length, 3, 'alert list: three rows to measure the group shape on');
  is(cs(li[0]).minHeight, '72px', 'alert row: M3 two-line item');
  is(cs(li[0]).padding, '8px 16px', 'alert row: M3 layout padding');
  is(cs(li[0]).gap, '16px', 'alert row: M3 layout gap');
  is(cs(li[0]).fontSize, '16px', 'alert row: body-large headline');
  /* The GROUP is one shape. Read all three, because a first-and-last-only rule and an every-row rule
     agree on a list of one and disagree on a list of three. */
  is(cs(li[0]).borderRadius, '16px 16px 4px 4px', 'alert group: 16dp on the top, 4dp inside');
  is(cs(li[1]).borderRadius, '4px', 'alert group: a middle row is 4dp all round');
  is(cs(li[2]).borderRadius, '4px 4px 16px 16px', 'alert group: 16dp on the bottom');

  // M3's three slots. Leading is a 24dp glyph, trailing is 48dp, and the supporting line is
  // body-medium. `.muted` carries a size of its own, so that last one is the trap CLAUDE.md records.
  const g = li[0].querySelector('.i');
  is(cs(g).fontSize + ' ' + cs(g).minWidth, '24px 24px', 'alert row: a 24dp leading slot');
  is(cs(li[0].querySelector('.rd')).minWidth, '48px', 'alert row: a 48dp trailing slot');
  is(cs(li[0].querySelector('small')).fontSize, '14px', 'alert row: body-medium supporting line');
  /* This app paints the leading glyph with the TIER colour rather than `on-surface-variant`. That is
     the one divergence. It used to be asserted against the card's left rule, and that rule is gone —
     `borderLeftColor` on a border-less box answers the element's own `color`, so the assertion
     compared the tier red against the body ink and failed on markup that was right. The subheader
     assertion above carries the claim now. */

  // A row opens a station card, so it keeps a pointer. Settings rows are static and must not.
  is(cs(li[0]).cursor, 'pointer', 'alert row: pressable');

  /* The hoist check. `.mseg` moved out of `#settingsBox` so two surfaces state one set of numbers,
     and an unscoped class rule can lose to `.picklist li` on source order alone. */
  d.getElementById('settingsBox').showModal();
  await settled();
  /* A FIXED row, injected into the favorites list rather than found in it. Two reasons, and both
     already have a rule in this file. A reader with no favorites leaves that list holding `li.none`
     alone, so there is nothing to measure. And a loose `.mseg > li` search reaches the Developer
     group, whose rows carry `padding: 0` because the `.mrow` button inside them carries it — that
     is what this assertion first read, and it failed on markup that was right. */
  const fav = d.getElementById('favList');
  fav.insertAdjacentHTML('beforeend',
    '<li><i class="glyph i i-water_drop"></i><span class="nm">SG A'
    + '<br><small class="muted">Shah Alam</small></span><button class="solo">Remove</button></li>');
  const srow = fav.lastElementChild;
  is(!!srow, true, 'settings: a saved-list row to measure the hoist against');
  if (srow) {
    is(cs(srow).minHeight, '72px', 'settings row: still M3 two-line after the hoist');
    is(cs(srow).padding, '8px 16px', 'settings row: still M3 layout padding');
    is(cs(srow).gap, '16px', 'settings row: still M3 layout gap');
    is(cs(srow).fontSize, '16px', 'settings row: still body-large');
    is(cs(srow).cursor, 'default', 'settings row: still static, unlike an alert row');
  }
  srow.remove();
  d.getElementById('settingsBox').close();
  await inFrame(d, "import { closeSide } from '/js/map.js'; closeSide();");
  await settled();
}

/* The four window size classes, read off one frame resized through them. `100vw` inside an iframe
   resolves to the iframe's own viewport, so a resize is a real breakpoint crossing.
   The numbers are the arithmetic of `--dlg-inset`, `--dlg-wide` and `--dlg-prose`, not a copy of
   them: a check that restates the variables reports on the numbers it remembers. */
async function bands() {
  const f = document.getElementById('desk');
  const { d, w, cs, r } = await ready('desk');
  d.head.insertAdjacentHTML('beforeend',
    '<style>*{transition:none !important;animation:none !important}</style>');
  const wide = (id, expect, name) => {
    const b = d.getElementById(id);
    b.showModal();
    is(Math.round(r(b).width), expect, name);
    b.close();
  };
  const prose = (expect, name) => {
    const b = d.getElementById('helpBox');
    b.showModal();
    is(Math.round(parseFloat(cs(b).maxWidth)), expect, name);
    b.close();
  };
  /* **Every one of these numbers reads `--rail-w` live, but nothing ran this sweep with the rail
     OPEN until now.** `finding 1` — the diagnostics popover double-counting the rail's own width —
     lived in exactly that gap: a fault that only a 220px rail exposes, in a check that only ever
     ran collapsed. `sweep()` is the four-band loop, unchanged, run once at each rail width. */
  const sweep = async railLabel => {
  say(`--- the four window size classes, rail ${railLabel} -----------------------------`);
  for (const [px, label0, inset, camW, tblW, proseW] of [
    [700,  'medium',   16, 668,  668,  560],
    [900,  'expanded', 24, 852,  852,  820],
    [1400, 'large',    32, 1336, 1200, 820],
  ]) {
    const label = `${label0} (rail ${railLabel})`;
    f.style.width = px + 'px';
    await new Promise(res => setTimeout(res, 150));
    is(w.innerWidth, px, label + ' @' + px + ': the frame really resized');
    is(cs(d.documentElement).getPropertyValue('--dlg-inset').trim(), inset + 'px',
       label + ': inset is ' + inset + 'px');
    wide('camBox', camW, label + ': the camera wall takes the room, uncapped');
    wide('dataBox', tblW, label + ': the table caps at its widest row');
    prose(proseW, label + ': the prose pane caps at a readable measure');

    /* **M3's canonical supporting-pane ratios.** Medium splits the window equally between the two
       panes. Expanded gives 70% to the main pane and 30% to the supporting one, and the bands above
       it keep that ratio.
       https://m3.material.io/foundations/layout/canonical-examples/supporting-pane

       **Medium is asserted as EQUALITY, not as a 50% share, and that is the fault it caught.**
       `--gap` (16) and `--seam` (8) both come out of the MAP, so a pane at a flat 50vw left the map
       24px short of half and the main pane was the smaller of the two right across the band.
       Measured at 839px: a 420px pane against a 396px map. `50vw - 12px` puts the seam back in the
       middle. A share assertion cannot see this — 50% of the window is exactly what the pane was
       taking while the split was wrong.

       **Expanded carries a FLOOR under the ratio.** 30% of 840px is 252px, which is under M3's own
       256dp minimum for a side sheet, and it lands as a 168px collapse off the 420 the band below
       ends on. Every landscape tablet sits in that range. So 360px — the width a camera still needs
       — is the floor.
       **The rail comes off the window before the ratio applies, the same correction `--pane`'s own
       comment in base.css states for the medium band.** So the ratio takes over at 1280px, where
       30% of the window less the rail passes 360, rather than at 1200. */
    const pane = d.getElementById('pane');
    const gap = parseFloat(cs(d.documentElement).getPropertyValue('--gap'));
    const seam = parseFloat(cs(d.documentElement).getPropertyValue('--seam'));
    const rail = parseFloat(cs(d.documentElement).getPropertyValue('--rail-w'));
    d.body.classList.add('side');
    await new Promise(res => setTimeout(res, 200));
    const pw = r(pane).width, mw = r(d.getElementById('map')).width;
    if (label0 === 'medium') {
      /* **A floor lives under the equal split too, now that the rail can be 220px wide.** At
         700px with the rail open, half the remaining window is 228px -- under M3's own 256dp
         minimum -- so `--pane` floors there instead, and the map absorbs the difference rather
         than staying equal. `want` is the same `max(256px, ...)` formula css/base.css states, so
         this checks the real rule rather than a copy of it, in both the equal and the floored
         case. */
      const want = Math.max(256, Math.round((px - rail) / 2 - 12));
      is(Math.round(pw), want,
         label + ": half the window less the rail, floored at M3's 256dp minimum");
      if (want === 256) is(mw <= pw + 1, true, label + ': floored, so the map is what shrinks rather than the two staying equal');
      else is(Math.abs(pw - mw) <= 1, true, label + ': unfloored, the two panes are equal');
    } else {
      is(Math.round(pw), Math.max(360, Math.round((px - rail) * 0.3)),
         label + ': 30% of the window less the rail, or the 360px floor where that falls under it');
    }
    is(pw >= 256, true, label + ": at or above M3's own 256dp minimum for this surface");
    /* Add the two panes, the card's insets and the rail back, and the window has to come out whole.
       Anything else means one pane is drawing over the other. One pixel of slack, because
       `50vw - 12px` on an odd window is a half pixel. */
    is(Math.abs(mw + pw + gap + seam + rail - px) <= 1, true,
       label + ': and the map takes the rest, less its leading gap, its trailing seam and the rail');

    /* **The map furniture has to clear ITSELF, not just the pane.** Every box down there adds
       `--pane-w`, so none of them ever reaches the supporting pane, and that is all this check used
       to ask. They were still colliding with each other as the map narrowed: measured at 840px the
       credit line ran 191px in under the legend, and at 700px the layer button sat on the legend,
       60px by 60. Nothing else in this app could see it, because each box was correct on its own.
       Read every visible box in the bottom strip and intersect them pairwise. A box with no size is
       skipped rather than counted, since `#pills` and `#toast` are absent unless something puts
       them there. */
    /* `#legend` and `#credit` are flex items of `#mapfoot` now, so the browser keeps those two
       apart. Both are still read here: a wrapper that clears the cluster does not prove that the
       row inside it does. */
    const FURNITURE = ['#ticker', '#legend', '#paint', '#locate', '#credit', '#pills', '#toast',
                       '.leaflet-control-zoom', '.leaflet-control-scale'];
    const boxes = FURNITURE.map(sel => [sel, d.querySelector(sel)])
      .filter(([, e]) => e && r(e).width > 1 && r(e).height > 1)
      .map(([sel, e]) => [sel, r(e)]);
    const clashes = [];
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const [an, a] = boxes[i], [bn, b] = boxes[j];
      const ox = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      const oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      if (ox > 0.5 && oy > 0.5) clashes.push(`${an} x ${bn} ${Math.round(ox)}x${Math.round(oy)}`);
    }
    is(clashes.join(', '), '', label + ': no two boxes on the map overlap each other');
    /* **THE CREDIT IS THE LOWEST THING ON THE MAP, AND EVERY OTHER ELEMENT STANDS ABOVE IT.** A
       reader stated that rule on 2026-08-25, for every width. The pairwise check above cannot
       answer it: a button beside the credit on one band never intersects it, and that is the
       arrangement this rule refuses. So read the credit's own bottom edge and assert that nothing
       else reaches under it. The two checks state the rule together. This one gives the credit the
       bottom band, and the one above keeps every other box out of it. */
    const credit = r(d.getElementById('credit'));
    const under = boxes.filter(([sel]) => sel !== '#credit')
      .filter(([, b]) => b.bottom > credit.bottom + 0.5)
      .map(([sel, b]) => `${sel} ${Math.round(b.bottom - credit.bottom)}px under it`);
    is(under.join(', '), '', label + ': the credit is the lowest thing on the map');
    /* **They share one row where it fits, and the credit drops under the scale where it does not.**
       So the assertion is that the credit never sits ABOVE the scale, never that it sits under it.
       On a shared line the two bottoms are equal, which the tolerance covers. */
    const lg = r(d.getElementById('legend')), foot2 = r(d.getElementById('mapfoot'));
    is(lg.bottom <= credit.bottom + 0.5, true, label + ': the credit never sits above the scale');
    /* **The scale states itself on one line wherever the map leaves room, and wraps rather than
       run under the zoom cluster where it does not.** It broke onto two lines on a phone and a
       reader asked for one on 2026-08-25. One line needs about 273px, measured, and the row hands
       106px of its trailing edge to that cluster. The medium band leaves the map 236 to 300px, so
       there is no width there that is both one line and clear. 30 is one 23px line with room. */
    const room = r(d.getElementById('mapfoot')).width - 106;
    is(room < 320 || lg.height < 30, true,
       label + ': the scale is one line wherever the map leaves room for one');
    is(lg.right <= foot2.right - 106 + 0.5, true,
       label + ': and it never reaches under the zoom cluster');
    /* **Flush RIGHT while it shares the scale's line, and flush LEFT the moment it takes its own.**
       A reader asked for that on 2026-08-25. `justify-content: space-between` states it per flex
       line, so there is no width to assert and nothing to keep in step.
       **Read which line it is on, never a width.** The two share a line when their bottoms agree,
       which is what `align-items: flex-end` guarantees. Assert the case the layout is actually in,
       or the check states one width's answer at every width.
       Read the BOX and not the `text-align`. A right-aligned text in a left-placed box is a real
       fault and the alignment alone cannot see it. */
    const shared = Math.abs(lg.bottom - credit.bottom) < 1;
    is(Math.round(shared ? foot2.right - credit.right : credit.left - foot2.left), 0,
       label + (shared ? ': the credit is flush right while it shares the scale line'
                       : ': the credit leads on the left once it takes a line of its own'));
    /* **One button beside the zoom cluster, and there were two.** The layer controls are a chip row
       over the map since 2026-08-25, so `#locate` took the slot that button held. */
    const lb = r(d.getElementById('locate')), zb2 = r(d.querySelector('.leaflet-control-zoom'));
    is(lb.right < zb2.left + 0.5, true, label + ': locate sits beside the zoom cluster');
    is(Math.abs(lb.bottom - zb2.bottom) < 1.5, true, label + ': on its own baseline');
    /* The chip row runs along the TOP of the map, so nothing in the bottom strip can reach it. */
    const ch = r(d.getElementById('mapchips'));
    is(ch.bottom < foot2.top, true, label + ': and the chip row clears the whole bottom strip');
    is(Math.round(r(pane).left - r(d.getElementById('map')).right), seam,
       label + ': one seam between the two panes');
    d.body.classList.remove('side');
    await new Promise(res => setTimeout(res, 150));
  }
  };  // sweep()

  const toggle = d.getElementById('railToggle');
  /* Start from a known shut rail, whatever the reader's own stored preference happened to be —
     the outer IIFE restores that stored value once this whole file is done, in a `finally`. */
  if (d.body.classList.contains('railopen')) { toggle.click(); await new Promise(res => setTimeout(res, 120)); }
  await sweep('shut');
  toggle.click();
  await new Promise(res => setTimeout(res, 120));
  await sweep('open');
  toggle.click();
  await new Promise(res => setTimeout(res, 120));

  /* --- the medium band's own floor, at its bottom edge, rail SHUT ---
     `sweep()` only ever probed 700px, so a floor that also bites a SHUT rail went unmeasured. It
     does: `(window - 80) / 2 - 12` drops under M3's 256dp minimum for every window from 601 to
     615px, an ordinary desktop width and not an edge case — the base.css comment on `--pane` states
     the exact range. 610px sits inside it. **The range moved with the rail**: at a 96px rail it ran
     to 631px, so 620 was inside it and is not any more. This is the one probe that range needs: that `--pane`
     really floors there, and that the map is what absorbs the difference, the same shape the
     `sweep('open')` pass already asserts at 700px. */
  f.style.width = '610px';
  await new Promise(res => setTimeout(res, 200));
  is(w.innerWidth, 610, 'medium (rail shut, band floor): the frame really resized');
  {
    const gap = parseFloat(cs(d.documentElement).getPropertyValue('--gap'));
    const seam = parseFloat(cs(d.documentElement).getPropertyValue('--seam'));
    const rail = parseFloat(cs(d.documentElement).getPropertyValue('--rail-w'));
    is(rail, 80, 'medium (rail shut, band floor): the rail really is shut here');
    const pane = d.getElementById('pane');
    d.body.classList.add('side');
    await new Promise(res => setTimeout(res, 200));
    const pw = r(pane).width, mw = r(d.getElementById('map')).width;
    is(Math.round(pw), 256,
       "medium (rail shut, band floor): floors at M3's 256dp minimum, same as the open-rail case");
    is(mw <= pw + 1, true,
       'medium (rail shut, band floor): and the map is what shrinks, not the two staying equal');
    is(Math.abs(mw + pw + gap + seam + rail - 610) <= 1, true,
       'medium (rail shut, band floor): the window still comes out whole');
    d.body.classList.remove('side');
    await new Promise(res => setTimeout(res, 150));
  }

  f.style.width = '1200px';
}

/* --- M3's FLEXIBLE navigation bar, at a compact HEIGHT -------------------------------------------
   The bar states two item arrangements. Vertical stacks the glyph over the label, and horizontal
   puts the two on one row inside an indicator that wraps the whole item. M3 asks for horizontal
   where the window's height is compact, which is 480dp.
   **This app declines the horizontal arrangement, and this probe is what holds the decline.** It was
   built to the reference's own numbers and then measured: five items needed 569px against a 360px
   window. The band where it could apply at all is 569px to 600px, because this bar draws below
   600px alone and a phone held sideways is 760 by 360 and gets the rail instead.
   **So the assertion is that a compact height changes NOTHING.** Nothing else in this file can say
   that: `phone()` runs one 360x760 frame and `bands()` never runs a width under 700px, so a media
   query added back here would clip a label with nothing on screen to say so.
   **Resize the HEIGHT alone, and put it back.** The width stays 360, so this crosses one query
   rather than running a second phone pass. */
async function shortPhone() {
  const f = document.getElementById('phone');
  const { d, w, cs, r, settle } = await ready('phone');
  /* Geometry only in this probe, so the override goes in first. `phone()` has already read every
     motion declaration this frame carries, and it runs before this one. */
  settle();
  f.style.height = '420px';
  await new Promise(res => setTimeout(res, 200));
  say('--- the navigation bar at a compact height, ' + w.innerWidth + 'x' + w.innerHeight + ' -----');
  is(w.innerHeight, 420, 'short phone: the frame really resized, so a height query would have fired');
  const nav = d.getElementById('navbar'), item = d.getElementById('navLocate');
  is(cs(nav).display !== 'none', true, 'short phone: the bar still draws');
  is(Math.round(r(nav).height), 64, 'short phone: still M3’s 64dp container');
  is(cs(item).flexDirection, 'column',
     'short phone: and still the VERTICAL arrangement, which is the decline this probe holds');
  is(cs(nav).gap, 'normal', 'short phone: with no 20px item gap, which only the horizontal one states');
  is(Math.round(r(d.querySelector('#navbar .railpill')).width), 56,
     'short phone: and the 56dp pill, never the glyph’s own 24px box');
  /* The reason the decline stands, restated as a measurement rather than as prose. Five items at
     M3's horizontal numbers need more room than this window has, and this is that window. */
  is(w.innerWidth < 569, true,
     'short phone: the window is narrower than the 569px five horizontal items measured');
  f.style.height = '760px';
  await new Promise(res => setTimeout(res, 200));
}

/* **One panel states ONE inset.** Before this, `#dataBox` stated four: 16px to the headline, 16px
   to the filter, 20px to a row's name and 14px to that name on a phone. So the headline and the
   first column under it did not line up at either width.
   **Assert the two LEFT EDGES against each other, never against a literal.** A literal passes the
   day somebody moves the app bar and leaves the body behind, which is the exact drift this exists
   to catch. */
async function panelInset(frame, label) {
  const { d, w, cs, r, settle } = await ready(frame);
  say('--- one inset, ' + label + ' ---------------------------------------------');
  settle();

  for (const id of ['dataBox', 'camBox']) {
    const b = d.getElementById(id);
    b.showModal();
    const head = r(b.querySelector('.apflex'));
    /* **The ROW, not the `<input>` inside it.** The input now sits behind a
       leading glyph. It no longer lines up with the headline on its own.
       Task 2 wraps the field in `.m3search`, an M3 search bar. The row is
       the filter now. Its own box lines up with the headline. The text
       inside it sits further in, past the glyph. */
    const field = r(b.querySelector('.dtop .m3search'));
    is(Math.round(field.left - head.left), 0, id + ': the filter starts on the headline');
    const body = id === 'dataBox'
      ? b.querySelector('table.data .chead th:first-child') || b.querySelector('table.data')
      : d.getElementById('camGrid');
    /* The table may hold no rows yet, because js/table.js is deferred. So read the box's own
       padding rather than a cell that may not exist. */
    const pad = id === 'dataBox'
      ? parseFloat(cs(b.querySelector('table.data')).paddingLeft)
      : parseFloat(cs(body).paddingLeft);
    is(pad, 16, id + ': the body inset is 16px');
    is(parseFloat(cs(b).getPropertyValue('--pane')), 16, id + ': --pane is 16px');
    b.close();
  }
}

/* **The bottom safe area.** Both panels take `100dvh` on a phone, so the last row and the tally sit
   under the iOS home indicator. `env(safe-area-inset-bottom)` reads 0 in headless Chrome, so this
   asserts that the DECLARATION reaches the element, not that the inset has a value. A machine with
   no notch cannot test a notch. */
async function safeArea() {
  const { d } = await ready('phone');
  say('--- the bottom safe area, phone ------------------------------------------');
  const css = [...d.styleSheets]
    .filter(s => (s.href || '').includes('chrome.css'))
    .flatMap(s => [...s.cssRules])
    .map(x => x.cssText).join('\n');
  is(/#camBox\s+#camCount[^}]*safe-area-inset-bottom/.test(css), true,
     'camCount reads the bottom safe area');
  is(/table\.data[^}]*safe-area-inset-bottom/.test(css), true,
     'the table reads the bottom safe area');
}

/* **M3's search bar**, and every number is
   https://github.com/bczak/m3you/blob/development/src/components/Search/search.css — a 56dp
   container at a full corner on `surface-container-high`, a 24dp leading glyph 16dp in, and
   `body-large` text.
   **A DIVERGENCE this app states out loud:** in M3 a search bar opens a search view. These two
   filter what is already on screen. The go-to box is a real search view and wears the same shape,
   so this app draws one search shape for two behaviors. */
async function searchBar(frame, label) {
  const { d, w, cs, r, settle } = await ready(frame);
  say('--- the search bar, ' + label + ' -----------------------------------------');
  settle();
  for (const [id, field] of [['dataBox', 'dataFind'], ['camBox', 'camFind']]) {
    const b = d.getElementById(id);
    b.showModal();
    const bar = b.querySelector('.m3search');
    is(Math.round(r(bar).height), 56, id + ': 56dp container');
    is(cs(bar).borderRadius, '28px', id + ': a full corner');
    const glyph = bar.querySelector('.i-search');
    is(!!glyph, true, id + ': a leading search glyph');
    is(Math.round(r(glyph).width), 24, id + ': the glyph is 24dp');
    is(Math.round(r(glyph).left - r(bar).left), 16, id + ': and it sits 16dp in');
    /* The clear button appears only once the field holds something. A control that is always
       there offers to clear an empty field. */
    const clear = bar.querySelector('[data-clear]');
    is(clear.hidden, true, id + ': the clear button is hidden while the field is empty');
    const input = d.getElementById(field);
    input.value = 'x';
    input.dispatchEvent(new w.Event('input', { bubbles: true }));
    is(clear.hidden, false, id + ': and it appears once the field holds something');
    /* Pressing it must clear the field AND rerun the filter, or the list stays filtered by a
       query the reader can no longer see. */
    clear.click();
    is(input.value, '', id + ': pressing it clears the field');
    is(clear.hidden, true, id + ': and it goes away again');
    b.close();
  }
}

/* **The count is M3's list subheader**, the component the alert panel, the Notices pane and
   Settings already draw: `title-small` in `on-surface-variant`, 48dp, at the pane's own inset. One
   panel states one heading style. */
async function countLine() {
  const { d, cs, r, settle } = await ready('desk');
  say('--- the count line -------------------------------------------------------');
  settle();
  for (const [box, id] of [['dataBox', 'dataCount'], ['camBox', 'camCount']]) {
    const b = d.getElementById(box);
    b.showModal();
    const p = d.getElementById(id);
    p.textContent = '450 stations';
    const st = cs(p);
    const root = cs(d.documentElement);
    is(st.fontSize, root.getPropertyValue('--md-sys-typescale-title-small-size').trim(),
       id + ': title-small');
    is(Math.round(r(p).height), 48, id + ': 48dp');
    /* **The size alone cannot tell one scale from another here.** `title-small`, `label-large` and
       `body-medium` are all 14px in the vendored token set. So assert the two properties that
       actually change: this line was 12px `.muted` with no height, and every old table heading in
       this app was uppercase and letter-spaced.
       **The tracking is read off the token, never asserted as `normal`.** `title-small` carries a
       real tracking value, `0.1px`. Asserting `normal` would pass only while the rule omits it. */
    is(st.textTransform, 'none', id + ': sentence case');
    is(st.letterSpacing, root.getPropertyValue('--md-sys-typescale-title-small-tracking').trim(),
       id + ': and the title-small tracking');
    /* `on-surface-variant`, which this app bridges onto `--muted`. Compare against a probe carrying
       the token, never against a hex: the palette has moved four times and every copy went stale. */
    const probe = d.createElement('span');
    probe.style.color = root.getPropertyValue('--muted').trim();
    d.body.appendChild(probe);
    is(st.color, cs(probe).color, id + ': in on-surface-variant');
    probe.remove();
    b.close();
  }
}

/* The table's column structure. **A fixed head, never the live one**: `js/table.js` arrives through
   `lazy()`, and a probe that waits for the payload asserts on the weather.
   The markup mirrors what `drawHead()` now emits. The sorted `<th>` carries `class="on"` and an
   `arrow_upward` glyph after its label. It never carries the old `up`/`down` classes or a CSS
   triangle.
   **All five kind columns ride along, not just one.** `table.data td.k, table.data .chead
   th:not(:first-child)` sets every non-name column to 120px, matching the real six-column head
   `KIND_RANK` produces. A fixture with fewer columns leaves the browser's table layout free to
   stretch the name column past its own width. The floor assumes six columns, not two. */
const HEAD = `<tr class="chead">
    <th data-sort="name" class="on">Station<i class="i i-arrow_upward"></i></th>
    <th data-sort="river"><i class="i i-water_drop"></i>Water level</th>
    <th data-sort="siren"><i class="i i-siren"></i>Siren</th>
    <th data-sort="gauge"><i class="i i-flood"></i>Flood gauge</th>
    <th data-sort="rainfall"><i class="i i-rainy"></i>Rainfall</th>
    <th data-sort="camera"><i class="i i-videocam"></i>Camera</th>
  </tr>`;
const DROW = `<tr class="dhead"><th colspan="6">Gombak <span class="muted">12</span></th></tr>`;

async function tableHead(frame, label) {
  const { d, w, cs, r, settle } = await ready(frame);
  say('--- the table head, ' + label + ' -----------------------------------------');
  settle();
  const b = d.getElementById('dataBox');
  b.showModal();
  d.getElementById('dataHead').innerHTML = HEAD;
  d.getElementById('dataBody').innerHTML = DROW;
  const th = d.querySelector('.chead th[data-sort="river"]');
  const root = cs(d.documentElement);

  /* **56dp, which is M3's minimum touch target.** This head was 30px, and a column head is a sort
     control. A phone reader tapped it and often missed. */
  is(Math.round(r(th).height), 56, label + ': the sort target is 56dp');

  /* `label-large`, in `on-surface-variant`. It was 11px uppercase with .06em of letter-spacing.
     **Read the tracking off the token, never assert `normal`.** `label-large` carries a real
     tracking value, `0.1px` — the same trap the count line's own check already names. */
  is(cs(th).fontSize, root.getPropertyValue('--md-sys-typescale-label-large-size').trim(),
     label + ': label-large');
  is(cs(th).textTransform, 'none', label + ': sentence case, not uppercase');
  is(cs(th).letterSpacing, root.getPropertyValue('--md-sys-typescale-label-large-tracking').trim(),
     label + ': and the label-large tracking');

  /* **The sort mark is a glyph now.** It was a CSS triangle, drawn from borders. It existed
     only because an uppercase, letter-spaced cell cannot hold a glyph. Sentence case removes the
     reason. Assert `mask-image`, never the `--i` token. A rule that sets `--i` and never joins
     the mask list in css/icons.css draws an empty box. That shipped once. */
  const mark = d.querySelector('.chead th.on .i-arrow_upward');
  is(!!mark, true, label + ': the sorted head carries an arrow glyph');
  is(cs(mark).maskImage !== 'none', true, label + ': and the glyph actually paints');

  /* **The district head sticks UNDER the column head, and the two numbers must agree.** `.dhead`
     stuck at `top: 30px`, which was `.chead`'s own height. The head is 56px now. Two numbers
     that must match are exactly the shape that goes stale. Assert them against each other. */
  const dh = d.querySelector('.dhead th');
  is(parseFloat(cs(dh).top), Math.round(r(th).height), label + ': the district head clears it');

  /* **The district head is M3's list subheader too**, the same component `.nsub`, `#settingsBox
     h3` and `#dataCount` already draw. Read its scale off `title-small`, never a literal. */
  is(cs(dh).fontSize, root.getPropertyValue('--md-sys-typescale-title-small-size').trim(),
     label + ': the district head is title-small');
  is(cs(dh).textTransform, 'none', label + ': and sentence case, not uppercase');
  is(cs(dh).letterSpacing, root.getPropertyValue('--md-sys-typescale-title-small-tracking').trim(),
     label + ': and the title-small tracking');

  /* **220px is a floor above 600px, not a fixed width.** `width: 100%` on the two `display:
     table` sections lets the six columns fill whatever room a wide dialog offers.
