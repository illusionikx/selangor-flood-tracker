<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geolocation boundary probe</title>
<!-- A diagnostic, not a check. The other three test files here print a verdict and need no human.
     This one needs the machine that fails, because the fault is somewhere between an operating
     system, a browser and a permission grant, and none of those three is in this repo.

     Open it over https on the failing machine, from the same origin as the app, or the permission
     grant under test is a different grant.

     It asks one question at each boundary, in order, and it puts its own clock on every request.
     The clock is the point. `navigator.geolocation.getCurrentPosition()` takes a `timeout`, and
     Leaflet passes ours straight through and adds no timer of its own. So the app trusts the
     browser to answer. A browser that answers neither callback leaves `#locate` in its busy state,
     which carries `pointer-events: none`, and the reader can never press it again. That reads as
     "the location will not lock in" and no error reaches the screen.

     Read the four rows together:
       B answers and C answers  -> the browser works. Look above Leaflet.
       B hangs and C answers    -> high accuracy is the fault on this machine.
       B and C both hang        -> the position provider never replies. The app needs its own clock.
       B and C both fail fast   -> read the code and the message. That is an ordinary refusal. -->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 46rem }
  pre  { background: #f4f4f5; padding: 12px; border-radius: 6px; white-space: pre-wrap;
         overflow-wrap: anywhere }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e6e6e6 } pre { background: #23262b } }
</style>
<h1>Geolocation boundary probe</h1>
<p>Allow location when the browser asks. Takes up to 90 seconds. Copy the whole box.</p>
<pre id="out">starting…</pre>
<script>
const out = document.getElementById('out'), log = [];
const say = s => { log.push(s); out.textContent = log.join('\n'); };
onerror = (m, f, l) => say('ERROR ' + m + ' at ' + f + ':' + l);

// Every probe gets a wall clock, because the question is whether a callback arrives at all. A
// browser that ignores its own `timeout` is the fault this page exists to name, so the page may
// never rely on that same `timeout` to end a probe.
const CODE = { 1: 'PERMISSION_DENIED', 2: 'POSITION_UNAVAILABLE', 3: 'TIMEOUT' };

function probe(name, opts, wall) {
  return new Promise(done => {
    const t0 = performance.now();
    let over = false;
    const ms = () => Math.round(performance.now() - t0);
    const end = line => { if (over) return; over = true; clearTimeout(timer); say(line); done(); };
    const timer = setTimeout(
      () => end(`${name}  NO CALLBACK after ${ms()} ms — the browser ignored its own timeout`),
      wall);

    navigator.geolocation.getCurrentPosition(
      p => end(`${name}  fix in ${ms()} ms  ±${Math.round(p.coords.accuracy)} m`
             + `  ${p.coords.latitude.toFixed(4)},${p.coords.longitude.toFixed(4)}`
             + `  age ${Math.round((Date.now() - p.timestamp) / 1000)} s`),
      e => end(`${name}  error in ${ms()} ms  ${CODE[e.code] || e.code}  "${e.message}"`),
      opts);
  });
}

(async () => {
  say('A  context');
  say(`   url        ${location.origin}`);
  say(`   secure     ${window.isSecureContext}`);
  say(`   api        ${'geolocation' in navigator}`);
  say(`   agent      ${navigator.userAgent}`);
  try {
    const p = await navigator.permissions.query({ name: 'geolocation' });
    say(`   permission ${p.state}`);
  } catch (e) { say(`   permission unreadable — ${e.message}`); }
  // What the app itself is holding. A stored fix inside its 15 minutes short-circuits findMe(),
  // so a reader can be looking at an old position and read it as a new one that will not move.
  try {
    const f = JSON.parse(localStorage.prefs || '{}').fix;
    say(`   saved fix  ${f ? f.slice(0, 3).join(', ') + `  ${Math.round((Date.now() - f[3]) / 1000)} s old` : 'none'}`);
  } catch (e) { say('   saved fix  unreadable'); }

  if (!('geolocation' in navigator)) return say('\nNo Geolocation API. Nothing else to ask.');

  say('');
  // The app's own call, verbatim from js/locate.js. Its maximumAge lets the browser answer from
  // its own cache, which is the one path that can succeed while every fresh acquisition hangs.
  await probe('B  app options (high accuracy, timeout 10 s, maximumAge 15 min)',
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 900000 }, 25000);
  // The same question with the two things that can make a desktop hang taken away.
  await probe('C  low accuracy, fresh (timeout 30 s, maximumAge 0)',
              { enableHighAccuracy: false, timeout: 30000, maximumAge: 0 }, 40000);
  await probe('D  high accuracy, fresh (timeout 30 s, maximumAge 0)',
              { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }, 40000);

  say('\ndone — copy everything above');
})();
</script>
