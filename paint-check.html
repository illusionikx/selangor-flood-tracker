<!doctype html>
<meta charset="utf-8">
<title>paint chooser check</title>
<!--
  The paint chooser is a map control holding six boxes in two groups. What it guards is rendered
  pixels, which `php -l`, `node --check` and any query over .cache.json all miss.

  **It took three tries to sit right, and both failures were about the same thing.** First it drew
  the active layer's glyph — the water drop, the rain cloud — on a `--surface` plate, alone in the
  top-left corner among pins carrying those exact shapes. A reader called it indistinguishable from
  a map icon. Then it became an accent-filled FAB with a label, still alone in that corner, and it
  stood out too much. A control on its own in the middle of a map has to shout to read as a control.

  It sits in the zoom control's cluster now and wears the zoom control's look, so it needs to do
  neither. The check asserts the layers glyph, the shared look, and the adjacency in rendered pixels
  at both widths — beside the zoom box on a desktop, above it on a phone.

  Run:
  "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --disable-gpu \
    --ignore-certificate-errors --virtual-time-budget=30000 --window-size=1600,1000 --dump-dom \
    https://flood-exp.test/paint-check.html | perl -0777 -ne 'print $1 if /<pre id="out">(.*?)<\/pre>/s'
-->
<style>html, body { margin: 0 } iframe { width: 1536px; height: 900px; border: 0 }</style>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html"></iframe>
<script type="module">
const out = document.getElementById('out'), lines = [];
let bad = 0;
/* Painted after every assertion, not once at the end. A check that reports only on completion
   reports nothing at all when it hangs, and this one hung. */
const is = (got, want, name) => {
  const ok = got === want; if (!ok) bad++;
  lines.push((ok ? 'ok  ' : 'FAIL') + '  ' + name + '  -> ' + JSON.stringify(got)
    + (ok ? '' : '  want ' + JSON.stringify(want)));
  out.textContent = lines.join('\n');
};
const wait = ms => new Promise(r => setTimeout(r, ms));

try {
const f = document.getElementById('f');
await new Promise(r => f.addEventListener('load', r, { once: true }));
await wait(4000);
const w = f.contentWindow, d = f.contentDocument;
const el = id => d.getElementById(id);

/* **Headless virtual time does not run CSS transitions faithfully**, so nothing here can measure one
   mid-flight. Reading the branch at 120ms returned a value that then stuck at 0 for the rest of the
   run, on markup that works in a real browser. So the animation is asserted as a DECLARATION, once,
   and then transitions come out of the way and every state below is measured settled.
   Assert the declaration BEFORE the override, or the override is what gets read. */
{
  const t = w.getComputedStyle(d.querySelector('.subgrp')).transitionProperty;
  is(t.includes('grid-template-rows'), true, 'the branch animates its collapse');
  is(t.includes('visibility'), true, 'and carries visibility, which holds the tab order');
  /* One press switches the whole map layer, and the glyph is the same at every state. So the press
     answers for itself here, rather than leaving the map to answer somewhere else. */
  is(w.getComputedStyle(el('paint')).transitionProperty.includes('transform'), true,
     'the button answers a press, because what the press changes is somewhere else');
  is(w.getComputedStyle(d.querySelector('.chip .glyph')).transitionProperty.includes('opacity'), true,
     'and a chip glyph fades with the rest of its chip, rather than snapping beside it');
}
const noAnim = d.createElement('style');
noAnim.textContent = '*{transition:none !important}';
d.head.appendChild(noAnim);

const btn = el('paint'), menu = el('paintmenu');
if (!btn || !menu) {
  out.textContent = 'FAIL  the paint chooser did not render at all';
  throw new Error('no control');
}
/* `getPropertyValue` hands back the substituted value, never the `var(...)` that was written. So
   the expected side has to be the same token resolved off :root, or every rung reports a mismatch
   between two spellings of one correct answer. */
const glyph = () => w.getComputedStyle(btn, '::before').getPropertyValue('--i').trim();
const token = n => w.getComputedStyle(d.documentElement).getPropertyValue('--i-' + n).trim();
const ink = () => w.getComputedStyle(btn).color;

// --- the control -------------------------------------------------------------------------------

is(menu.hasAttribute('popover'), true, 'the panel is a popover, so Escape and light dismiss are free');
is(btn.getAttribute('popovertarget'), 'paintmenu', 'the button is the popover invoker');
is(menu.classList.contains('menu'), true, 'it carries .menu, which is what places it under the button');

// --- it opens, and the shared placement handler catches it -------------------------------------
/* The handler in js/ui.js keys on `.menu` and on a `[popovertarget]` pointing back at the box. Miss
   either and the popover still opens, at the UA's own centred position, over the middle of the map. */
btn.click();
await wait(200);
is(menu.matches(':popover-open'), true, 'the button opens the panel');
const mb = menu.getBoundingClientRect(), bb = btn.getBoundingClientRect();
/* The button sits 36px off the bottom edge, so a menu opened downward is clamped up over the button
   it came from. A button in the bottom half opens UPWARD. It is a position test and never a space
   test — see the handler's own comment for the fault that distinction avoids. */
is(bb.top > w.innerHeight / 2, true, 'the button is in the bottom half of the viewport');
is(mb.bottom <= bb.top && bb.top - mb.bottom < 16, true, 'so the panel opens upward from it');
is(mb.bottom < bb.top, true, 'and never over the button it came from');
is(mb.left >= 8, true, 'and clamped onto the screen rather than off its left edge');
/* Away from the nearest edge. This button sits in the bottom-RIGHT cluster now, so the menu aligns
   the right edges. It spent one revision on the left, where the same rule aligned the left edges —
   the handler decides from the button's own position, so neither placement is written down twice. */
is(bb.left > w.innerWidth / 2, true, 'the button is in the right half of the viewport');
is(Math.abs(mb.right - bb.right) < 2, true, 'so its menu aligns the right edges');
is(mb.width > 0 && mb.height > 0, true, 'it has a size, so the three chips laid out');
// A press inside must not dismiss it: three mutually-exclusive choices means trying another one.
el('favOnly').closest('label').click();
await wait(120);
is(menu.matches(':popover-open'), true, 'picking a layer leaves the panel open to pick another');
el('favOnly').checked = false;
menu.hidePopover();
await wait(120);
is(menu.matches(':popover-open'), false, 'and it closes again');

// --- hover opens it on a pointer device, and only a mouse does -------------------------------
/* `popovertarget` keeps the press path for touch and the keyboard. Hover only adds a way in. A tap
   fires `pointerenter` too, so the handler tests `pointerType` as well as the media query — without
   that test a phone reporting `hover: hover` opens the panel under the finger before the press. */
const ptr = (type, node, kind) =>
  node.dispatchEvent(new w.PointerEvent(type, { pointerType: kind }));
if (menu.matches(':popover-open')) menu.hidePopover();
await wait(200);
for (const kind of ['touch', 'pen']) {
  ptr('pointerenter', btn, kind);
  await wait(250);
  is(menu.matches(':popover-open'), false, `a ${kind} pointer does not open it`);
}
ptr('pointerenter', btn, 'mouse');
await wait(250);
is(menu.matches(':popover-open'), true, 'a mouse pointer does');
/* The pointer crosses a 4px gap on the way to a chip. Leaving the button must not shut the panel
   the reader is reaching for. */
ptr('pointerleave', btn, 'mouse');
ptr('pointerenter', menu, 'mouse');
await wait(400);
is(menu.matches(':popover-open'), true, 'and it survives the gap between button and panel');
ptr('pointerleave', menu, 'mouse');
await wait(500);
is(menu.matches(':popover-open'), false, 'leaving both closes it');
btn.click();
await wait(200);
is(menu.matches(':popover-open'), true, 'and the press path still works');

// --- and with the panel already open under the pointer, the press switches the layer -----------
/* Hover is what makes the press free on a pointer device. A tap and a keyboard press keep the
   native toggle, because neither one has a way to open the panel without it. */
const layer = () => (el('wxLayer').checked ? 'weather' : 'stations');
ptr('pointerenter', btn, 'mouse');
await wait(250);
const was = layer();
btn.click();
await wait(2500);   // picking weather awaits a deferred module
is(layer() !== was, true, 'a press with the pointer on the button switches the layer');
is(menu.matches(':popover-open'), true, 'and never shuts the panel it switched in');
btn.click();
await wait(2500);
is(layer(), was, 'so the next press switches back');
ptr('pointerleave', btn, 'mouse');
await wait(500);

// --- the panel never scrolls with nothing to scroll --------------------------------------------
/* `.menu` is `overflow-y: auto`, so anything that leaks into its scroll height draws a scrollbar
   down a box that fits. The collapsed branch did exactly that: 157px tall, 352px claimed. */
const fits = () => menu.scrollHeight <= menu.clientHeight + 1;
const gutter = () => menu.offsetWidth - menu.clientWidth;

// --- the three choices moved, and none of them is in two places --------------------------------

const BOXES = ['heat', 'rainHeat', 'stations', 'favOnly', 'wxLayer', 'risingOnly'];
is(d.querySelectorAll(BOXES.map(i => '#' + i).join(', ')).length, 6, 'all six boxes exist once');
for (const id of BOXES)
  is(el(id).closest('#paintmenu') !== null, true, id + ' is in the map panel');
is(el('bar').contains(el('heat')), false, 'and no copy is left in the drawer');
is(!!el('layersect'), false, '#layersect is gone');
is(!!el('layerN'), false, '#layerN is gone with the summary it fed');

// --- the drawer keeps the kinds and nothing else -----------------------------------------------

is(el('bar').contains(el('risingOnly')), false, 'on alert left the drawer');
is(el('bar').contains(el('favOnly')), false, 'favorites left the drawer');
is(d.querySelector('#kinds input[data-kind]') !== null, true, 'the sensor kinds stayed');
is(d.querySelector('#kinds hr'), null, 'and the rule that split them went with them');

// --- placement, in rendered pixels -------------------------------------------------------------

const r = btn.getBoundingClientRect();
const zoom = d.querySelector('.leaflet-control-zoom').getBoundingClientRect();
const zbtn = d.querySelector('.leaflet-control-zoom a').getBoundingClientRect();
/* Beside the zoom box, on its baseline, at the same size. The offsets in chrome.css are derived
   from Leaflet's own margins, so a change to either drifts the two apart on screen and nowhere
   else. These assert the result rather than the arithmetic. */
is(Math.round(r.bottom), Math.round(zoom.bottom), 'desktop: shares the zoom control baseline');
is(r.right < zoom.left, true, 'desktop: sits to the LEFT of the zoom box');
is(Math.round(zoom.left - r.right) <= 12, true, 'desktop: and up against it, not adrift');
/* **As high as the zoom box, and asserted against that box rather than against a number.** It sat
   at M3's 56 first, 4px shorter than the 60 beside it, and a mismatch of one shade or one pixel
   reads as a mistake at that distance. It is still larger than a zoom BUTTON, which is the point:
   it opens the map's own settings and is the one control in the cluster that is not a zoom. It
   stands out by size, never by colour — a reader cut the accent fill that tried the other way. */
is(Math.round(r.height), Math.round(zoom.height), 'desktop: as high as the zoom box beside it');
is(Math.round(r.width), Math.round(r.height), 'desktop: and square');
is(r.width > zbtn.width, true, 'desktop: larger than a zoom button, which is the point');
/* M3's FAB is a 16px radius on a 56px box carrying a 24px glyph, which is 2/7 and 3/7 of it. One
   `--fab` and two `calc()`s hold those ratios at any size, so a breakpoint moves one number. */
const px = (node, prop) => parseFloat(w.getComputedStyle(node)[prop]);
is(Math.abs(px(btn, 'borderTopLeftRadius') / r.height - 2 / 7) < 0.01, true,
   'desktop: the radius holds the M3 FAB ratio, 2/7 of the box');
is(Math.abs(px(btn.querySelector('.i'), 'fontSize') / r.height - 3 / 7) < 0.01, true,
   'desktop: and the glyph holds its 3/7');
// Nothing else floats here. An overlap is a control a reader cannot press.
for (const id of ['legend', 'pills', 'toast', 'credit', 'bar']) {
  const o = el(id); if (!o) continue;
  const b = o.getBoundingClientRect();
  if (!b.width || !b.height || w.getComputedStyle(o).visibility === 'hidden') continue;
  is(r.left < b.right && b.left < r.right && r.top < b.bottom && b.top < r.bottom, false,
     `does not overlap #${id}`);
}
is(r.left < zoom.left && r.top < zoom.bottom && r.bottom > zoom.top
   && r.right > zoom.left, false, 'and it does not overlap the zoom control itself');

// --- the button is a control, not a pin ------------------------------------------------------
/* The fault this replaced: the glyph followed the active layer, so it drew `water_drop` or `rainy`
   - the river and rainfall PIN glyphs - beside real pins carrying the same shape. And the plate was
   `--surface`, which on the dark theme is the tone of the basemap under it. */
const ico = btn.querySelector('.i');
is(!!ico, true, 'the button carries a glyph element');
is(ico.classList.contains('i-layers'), true, 'and it is the layers glyph');
is(/water_drop|rainy|sunny/.test(ico.className), false, 'never a station-pin glyph');
is(w.getComputedStyle(ico).maskImage !== 'none', true, 'the glyph is masked, so it paints');

const me = w.getComputedStyle(btn);
const zc = w.getComputedStyle(d.querySelector('.leaflet-control-zoom'));
const za = w.getComputedStyle(d.querySelector('.leaflet-control-zoom a'));
is(btn.textContent.trim(), '', 'it carries no text — the glyph and the panel do the talking');
is(me.backgroundColor !== 'rgba(0, 0, 0, 0)' && me.backgroundColor !== 'transparent', true,
   'the plate is opaque');
/* It stands against the zoom box, so a mismatch of one shade or one pixel reads as a mistake. Two
   rules in two files paint them, because Leaflet's sheet needs beating and this does not. */
is(me.backgroundColor, za.backgroundColor, 'it wears the zoom control fill');
is(me.color, za.color, 'and its ink');
is(me.boxShadow, zc.boxShadow, 'and its elevation');
/* NOT its radius. This one is a FAB, so it takes M3's 16px against the control strip's 8px. That
   difference is deliberate and the assertion above pins the number. */
is(me.borderTopLeftRadius !== zc.borderTopLeftRadius, true, 'but its own FAB radius');

/* The glyph holds whatever paints. That is the whole point of the change. */
const seen = new Set();
for (const [h, r, x] of [[1, 0, 0], [0, 1, 0], [0, 0, 1], [0, 0, 0]]) {
  el('heat').checked = !!h; el('rainHeat').checked = !!r; el('wxLayer').checked = !!x;
  await wait(50);
  seen.add(w.getComputedStyle(ico).maskImage);
}
is(seen.size, 1, 'the glyph holds at all four states, so it can never name a layer');

// --- two layers at the top, and everything else is a choice about one of them --------------------
/* There are no headings over the top level. Stations and Weather are the two things this map can
   draw, and every other control in the panel answers a question ABOUT the station layer, so it
   lives inside it. */
const sub = menu.querySelector('.subgrp');
is(!!sub, true, 'Stations carries a branch');
for (const id of ['heat', 'rainHeat', 'favOnly', 'risingOnly'])
  is(el(id).closest('.subgrp') === sub, true, id + ' is inside that branch');
is(el('stations').closest('.subgrp'), null, 'Stations itself is not — it is the parent');
is(el('wxLayer').closest('.subgrp'), null, 'and Weather is a layer of its own, not a child');
// The parent has to come first, or the indent points at nothing above it.
const rows = [...menu.querySelectorAll('.chip, .subgrp')];
is(rows.indexOf(el('stations').closest('.chip')) < rows.indexOf(sub), true,
   'Stations is drawn above its branch');
is(rows.indexOf(sub) < rows.indexOf(el('wxLayer').closest('.chip')), true,
   'and Weather below it, so the branch cannot look like Weather\'s');

// --- every chip names itself, and the two layers name what they measure ------------------------
/* The label names the control. On a layer, `.note` at the right edge names the discipline that
   layer measures. `.hint` is the third thing: JS writes it and it reports a state, such as how many
   stations a filter holds, so it is not required here.
   Every chip carried a sentence under its label for four revisions. A reader cut all of them. */
is(menu.querySelector('small'), null, 'no chip carries a line of flavour text any more');
for (const id of BOXES)
  is(el(id).closest('.chip').querySelector('.lab').textContent.trim().length > 0, true,
     id + ' still names itself');
const note = id => el(id).closest('.chip').querySelector('.note')?.textContent.trim() ?? null;
is(note('stations'), 'Hydrological Measurement', 'stations names what it measures');
is(note('wxLayer'), 'Nowcasting', 'and weather names what it forecasts');
for (const id of ['heat', 'rainHeat', 'favOnly', 'risingOnly'])
  is(note(id), null, id + ' carries none, because it is a choice about a layer and not a layer');
/* **Flush with the right edge, and the edge is measured rather than assumed.** A containment test
   passes on a note sitting anywhere after the label, and that is what shipped: `margin-left: auto`
   on the note AND the hint split the chip's slack in two, leaving the Weather note 41px short.
   Measured with the panel OPEN: a closed popover is `display: none`, so every rect inside it reads
   zero and an edge test compares 0 against 0. */
if (!menu.matches(':popover-open')) menu.showPopover();
await wait(150);
const rightEdge = chip => {
  const cs = w.getComputedStyle(chip);
  return chip.getBoundingClientRect().right
       - parseFloat(cs.paddingRight) - parseFloat(cs.borderRightWidth);
};
for (const id of BOXES) {
  const chip = el(id).closest('.chip');
  const last = [...chip.querySelectorAll('.note, .hint')]
    .filter(e => w.getComputedStyle(e).display !== 'none').pop();
  if (!last) continue;
  is(Math.abs(rightEdge(chip) - last.getBoundingClientRect().right) < 1, true,
     id + ': the right slot is flush with the right edge of its chip');
}
/* An empty hint comes off the line rather than sitting at zero width. It carries the flex `gap`
   either way, which held the note 8px off an edge the Stations chip met exactly. */
is(w.getComputedStyle(el('wxHint')).display, 'none', 'an empty hint takes no room, not even its gap');

/* **The press shortcut is named, on the one class of device that can take it.** Hover opens this
   panel on a pointer device, which is what frees the press to switch the layer. A tap and a keyboard
   press keep the native toggle, so on those the line would name an action that does not exist. The
   phone block at the foot of this file asserts the other half. */
const foot = menu.querySelector('.mfoot');
is(!!foot, true, 'the panel names the press shortcut');
is(w.getComputedStyle(foot).display !== 'none', true, 'desktop: and draws it, because hover opens the panel here');
is(w.getComputedStyle(foot).textAlign, 'right', 'desktop: right, because it points at a control outside the panel');
/* Flush with the notes above it. Two right-aligned texts that miss each other by a few pixels read
   as a mistake, and this line sits directly under the Weather chip's note. */
is(Math.abs(foot.getBoundingClientRect().right
   - menu.querySelector('.note').getBoundingClientRect().right) < 1, true,
   'desktop: on the same right edge as the notes above it');
/* **The line points at the button by drawing its glyph, not by naming it.** So the two marks have to
   be the same one. Read `mask-image` rather than `--i`: a resolved token is not evidence that
   anything painted, which is the fault `#paint::before` shipped with. */
const fg = foot.querySelector('.i');
is(w.getComputedStyle(fg).maskImage, w.getComputedStyle(btn.querySelector('.i')).maskImage,
   'desktop: and the glyph in it is the button’s own');
is(fg.getBoundingClientRect().height > 0, true, 'desktop: with a box to paint in');
/* A mask has no text of its own, so a reader who cannot see it is left with a sentence pointing at
   nothing. */
is(!!fg.getAttribute('aria-label'), true, 'desktop: and an accessible name, because a mask has no text');
is(foot.getBoundingClientRect().height < 24, true, 'desktop: the line does not wrap around it');

/* The weather chip takes the hue its own clear-sky pin draws in, never a status hue. `--wx-clear`
   is muted away from `--s-alert` on purpose, so an amber chip here cannot read as an alert.
   Compared against the RESOLVED token, because a custom property substitutes its `var()` at computed
   time. Reading the literal back is the same mistake the glyph assertion made once. */
const wxc = w.getComputedStyle(el('wxLayer').closest('.chip')).getPropertyValue('--c').trim();
const tok = n => w.getComputedStyle(d.documentElement).getPropertyValue(n).trim();
is(wxc, tok('--wx-clear'), 'the weather chip is painted its own weather hue');
for (const s of ['--s-normal', '--s-alert', '--s-warning', '--s-danger'])
  is(wxc === tok(s), false, 'and never ' + s + ', which is reserved for status');

// --- the branch is two labelled sections ----------------------------------------------------------
const groups = [...sub.querySelectorAll('.mgroup')].map(g => g.textContent.trim());
is(groups.length, 2, 'the branch is two labelled sections');
is(groups[0], 'Heatmap', 'the wash comes first');
is(groups[1], 'Icon', 'then which pins draw');
is(menu.querySelectorAll(':scope > .mgroup').length, 0, 'and nothing is labelled at the top level');

el('stations').checked = true; el('wxLayer').checked = false;
/* Geometry has to be measured with the panel OPEN. A closed popover is `display: none`, so every
   rect inside it is zero and an indent assertion compares 0 against 0. That passed as a failure
   here once, on an indent that was working. */
if (!menu.matches(':popover-open')) menu.showPopover();
await wait(120);
is(w.getComputedStyle(sub).display !== 'none', true, 'Stations on -> the children show');
const subBox = sub.getBoundingClientRect();
const parBox = el('stations').closest('.chip').getBoundingClientRect();
is(subBox.width > 0 && parBox.width > 0, true, 'the panel is open, so these rects are real');
is(subBox.left > parBox.left, true, 'and the children are indented under Stations');
is(el('favOnly').closest('.chip').getBoundingClientRect().left > subBox.left, true,
   'the chips themselves clear the spine');
is(w.getComputedStyle(sub).borderLeftStyle !== 'none', true, 'with a spine carrying the nesting');

/* Driven by picking the OTHER layer, because that is the only way a reader can put Stations away.
   The chips are radios: clicking the checked one cannot clear it. */
const favWas = el('favOnly').checked, alertWas = el('risingOnly').checked;
el('wxLayer').checked = true;
el('wxLayer').dispatchEvent(new w.Event('change'));
await wait(2500);
is(sub.offsetHeight, 0, 'weather picked -> the whole branch collapses');
is(fits(), true, 'collapsed: the clipped rows stay out of the scroll height');
is(gutter() < 10, true, 'so no scrollbar is drawn down a box that fits');
is(w.getComputedStyle(sub).visibility, 'hidden', 'and leaves the tab order with it');
is(el('favOnly').checked === favWas && el('risingOnly').checked === alertWas, true,
   'collapsing changes nothing inside it');
/* The panel is anchored by its bottom edge, so a branch that grows or shrinks moves away from the
   button rather than dragging the box off it. */
const glued = () => Math.round(el('paint').getBoundingClientRect().top
                             - menu.getBoundingClientRect().bottom);
const gapCollapsed = glued();
el('stations').checked = true;
el('stations').dispatchEvent(new w.Event('change'));
await wait(1500);
is(sub.offsetHeight > 0, true, 'stations picked -> the branch comes back');
is(glued(), gapCollapsed, 'and the panel stays the same distance off the button either way');
is(glued() >= 0 && glued() <= 12, true, 'which is hard against it');
is(fits(), true, 'expanded: the panel does not claim more than it holds');
is(gutter() < 10, true, 'so no scrollbar is drawn');
menu.hidePopover();
await wait(60);

/* **One at a time in each section**, and driven through the real `change` path rather than by
   assignment: the preference is what makes both-on unrepresentable, and only the handler writes it.
   A pair of booleans is the shape this must never go back to — see syncHeat()'s own comment for the
   two repairs that failed before the pair became one string. */
const pick = async id => {
  const box = el(id);
  box.checked = true;
  box.dispatchEvent(new w.Event('change'));
  await wait(400);
};
/* **Assert the property, not the scenario.** A pick only takes when its set has members: the live
   payload usually has nothing starred, so Favorites is disabled and syncPins() clears any attempt
   to select it. That is correct behaviour, and a scenario test reads it as a failure. What must
   hold either way is that a pair can never both be checked. */
const onCount = pair => pair.filter(id => el(id).checked).length;
for (const id of ['favOnly', 'risingOnly', 'favOnly', 'rainHeat', 'heat', 'rainHeat']) {
  await pick(id);
  is(onCount(['favOnly', 'risingOnly']) <= 1, true, 'after ' + id + ': at most one pin filter on');
  is(onCount(['heat', 'rainHeat']) <= 1, true, 'after ' + id + ': at most one heatmap on');
  /* **The layers are the stricter rule: EXACTLY one, never none.** A map with neither is a basemap
     with no answer on it. Radios are what enforce it, so this holds through every press above. */
  is(onCount(['stations', 'wxLayer']), 1, 'after ' + id + ': exactly one map layer on');
}
/* **A layer switch closes `#side`.** Both panels are that panel: the weather card is a tenant of
   it under a `@wx-` key, the shape the alert list already uses. The card names something the map no
   longer draws, and nothing can refresh it either. This is the fifth way out of that panel, and the
   only one that is not a press on the panel itself. */
el('alertBtn').click();
await wait(400);
is(d.body.classList.contains('side'), true, 'the panel opens, so there is something to close');
await pick(el('stations').checked ? 'wxLayer' : 'stations');
await wait(2500);
is(d.body.classList.contains('side'), false, 'switching the layer closes the panel over it');
/* Radios rather than checkboxes, and that is the difference from the two pairs above. The pairs
   inside Stations keep "neither" reachable, so they stay checkboxes. */
for (const id of ['stations', 'wxLayer']) {
  is(el(id).type, 'radio', id + ' is a radio, so a press cannot clear it');
  is(el(id).name, el('stations').name, 'and both sit in one group');
}
for (const id of ['heat', 'rainHeat', 'favOnly', 'risingOnly'])
  is(el(id).type, 'checkbox', id + ' stays a checkbox, because "neither" is a real answer there');

// Weather needs a longer wait: picking it awaits a deferred module.
el('wxLayer').checked = true;
el('wxLayer').dispatchEvent(new w.Event('change'));
await wait(2500);
is(onCount(['stations', 'wxLayer']), 1, 'weather picked -> exactly one map layer on');
is(sub.offsetHeight, 0, 'and the station branch collapses with its parent');
el('stations').checked = true;
el('stations').dispatchEvent(new w.Event('change'));
await wait(1500);
is(el('stations').checked, true, 'picking stations returns to them');
/* And the mechanism behind it: one preference holding one string. A pair of booleans can hold
   both-on, which is the state this panel cannot draw. */
const prefs = JSON.parse(w.localStorage.getItem('prefs') || '{}');
is(typeof prefs.pinFilter, 'string', 'the pin filters are one preference holding one string');
is('favOnly' in prefs, false, 'and the old favOnly boolean is migrated away');
is('risingOnly' in prefs, false, 'and the old risingOnly boolean with it');
is(typeof prefs.heatLayer, 'string', 'the heatmaps are the same shape, which this copies');
is(typeof prefs.mapLayer, 'string', 'and the two map layers are one string too');
is(['stations', 'weather'].includes(prefs.mapLayer), true,
   'which is only ever one of the two — there is no empty map layer');
is('wx' in prefs, false, 'the old wx boolean is migrated away');
is('stations' in prefs, false, 'and the old stations boolean with it');
// Leave the map unfiltered and the water wash on, or later assertions read a filtered payload.
el('risingOnly').checked = false;
el('risingOnly').dispatchEvent(new w.Event('change'));
await wait(400);
el('heat').checked = true;
el('heat').dispatchEvent(new w.Event('change'));
await wait(400);

/* **No dim and no caption any more.** Weather and Stations are one choice, so weather unchecks
   Stations rather than overruling it, and the collapse above is the whole of what a reader sees.
   The dim existed for a state that is now unrepresentable: a checked Stations box beside a weather
   map. The exclusivity assertions further up are what guard it. */
is(menu.querySelector('.mhint'), null, 'the weather caption is gone, because the state it named is');

// --- phone width -------------------------------------------------------------------------------
/* 360px, the width the app bar is measured against. The button is ABOVE the zoom box here rather
   than beside it, because #legend takes the width left of those buttons. Same 56px at both widths,
   which is M3's FAB and already clears the 44px touch target. */
/* Reloaded at this width rather than resized to it. A phone LANDS here, and landing is the path
   that leaves the drawer shut — resizing an open one only exercises the breakpoint listener. */
f.style.width = '360px';
f.contentWindow.location.reload();
await new Promise(r => f.addEventListener('load', r, { once: true }));
await wait(4000);
const pd = f.contentDocument, pw = f.contentWindow, pbtn = pd.getElementById('paint');
pd.body.classList.add('rising');          // the state that puts #risebadge on screen
await wait(300);

is(pd.body.classList.contains('drawer'), false, 'phone: lands with the drawer shut');
const pr = pbtn.getBoundingClientRect();
const pz = pd.querySelector('.leaflet-control-zoom').getBoundingClientRect();
const pza = pd.querySelector('.leaflet-control-zoom a').getBoundingClientRect();
/* No size override here. The desktop button matches the zoom BOX because the two stand side by
   side, and this one stands above it, so there is no edge to line up with. It matched for one
   revision, at 88px, which is a quarter of a 360px screen. */
is(Math.round(pr.height), Math.round(r.height), 'phone: the same button as the desktop one');
is(Math.round(pr.width), Math.round(pr.height), 'phone: and still square');
is(pr.height >= 44, true, 'phone: which clears the touch target on its own');
/* The press shortcut is a pointer-device affordance, and a tap keeps the native toggle. So the line
   naming it must not draw here, or it names an action a phone cannot take. */
is(pw.getComputedStyle(pd.querySelector('#paintmenu .mfoot')).display, 'none',
   'phone: the press shortcut is not named, because a tap cannot take it');
is(pr.width > pza.width, true, 'phone: still larger than a zoom button, which is 44 here');
/* ABOVE the zoom box here, not beside it. #legend takes `left: 12px; right: 68px` at this width, so
   the strip left of the zoom buttons belongs to the legend and there is nowhere to stand. */
is(pr.bottom <= pz.top, true, 'phone: sits ABOVE the zoom box');
is(Math.round(pz.top - pr.bottom) <= 12, true, 'phone: and up against it, not adrift');
is(Math.round(pr.right), Math.round(pz.right), 'phone: sharing its right edge');
const plg = pd.getElementById('legend').getBoundingClientRect();
is(pr.left < plg.right && plg.left < pr.right && pr.top < plg.bottom && plg.top < pr.bottom, false,
   'phone: and clear of the legend, which takes the width beside the zoom buttons');

const pb = pd.getElementById('pills').getBoundingClientRect();
is(pb.width > 0, true, 'phone: the rising pill is on screen, so there is something to clear');
/* It used to share the top-left corner with this button and needed measuring against it. The button
   is at the bottom now, so the two cannot meet. Kept as an assertion rather than deleted: the
   button has moved twice already. */
is(pr.left < pb.right && pb.left < pr.right && pr.top < pb.bottom && pb.top < pr.bottom, false,
   'phone: the rising pill clears the button');

lines.push(bad ? `FAIL: ${bad}` : 'PASS');
/* Without this the page stays on "running..." and says nothing about why. A check that can
   fail silently is not a check. */
} catch (e) { bad++; lines.push('THREW: ' + ((e && e.stack) || e)); lines.push('FAIL: ' + bad); }
out.textContent = lines.join('\n');
</script>
