<!doctype html>
<meta charset="utf-8">
<title>layer chips check</title>
<!--
  The layer controls are a bare chip row over the map. What this guards is rendered pixels, which
  `php -l`, `node --check` and any query over .cache.json all miss.

  **The control took five shapes to get here, and every one of them failed on the same axis.** It
  drew the active layer's own glyph on a plate in the map's corner, and read as a map pin. It became
  an accent FAB with a label, and shouted. It became a panel behind a `layers` button in the zoom
  cluster, then a bottom sheet on a phone, then connected button groups inside that panel. Each one
  put a settings dialog between a reader and a setting.

  The chips ARE the control now. There is no panel, no button that opens one, and no navigation bar
  item pointing at one. So this file asserts a row of chips over a map rather than a dialog.

  Run:
  "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --disable-gpu \
    --ignore-certificate-errors --virtual-time-budget=60000 --window-size=1600,1000 --dump-dom \
    https://flood-exp.test/paint-check.html | perl -0777 -ne 'print $1 if /<pre id="out">(.*?)<\/pre>/s'
-->
<style>html, body { margin: 0 } iframe { width: 1536px; height: 900px; border: 0 }</style>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html"></iframe>
<script type="module">
const out = document.getElementById('out'), lines = [];
let bad = 0;
/* Painted after every assertion, not once at the end. A check that reports only on completion
   reports nothing at all when it hangs, and this one hung. */
const is = (got, want, name) => {
  const ok = got === want; if (!ok) bad++;
  lines.push((ok ? 'ok  ' : 'FAIL') + '  ' + name + '  -> ' + JSON.stringify(got)
    + (ok ? '' : '  want ' + JSON.stringify(want)));
  out.textContent = lines.join('\n');
};
const wait = ms => new Promise(r => setTimeout(r, ms));
/* **A fixed wait races the payload, and a bigger virtual-time budget is what exposes it.** Headless
   virtual time runs the page's own timers far ahead of real network I/O, so `await wait(4000)` can
   land before the first `render()`. At a 120s budget this file passed and at 300s it read a chip the
   app had not written yet. Wait for the STATE, never for a clock. */
const until = async (fn, tries = 60) => {
  for (let i = 0; i < tries; i++) { if (fn()) return true; await wait(200); }
  return false;
};

try {
const f = document.getElementById('f');
await new Promise(r => f.addEventListener('load', r, { once: true }));
await until(() => f.contentDocument.querySelectorAll('#map .pin').length > 0);
await wait(600);
const w = f.contentWindow, d = f.contentDocument;
const el = id => d.getElementById(id);
const box = id => el(id).getBoundingClientRect();
const cs = id => w.getComputedStyle(el(id));

/* **Headless virtual time does not run CSS transitions faithfully**, so nothing here can measure one
   mid-flight. So motion is asserted as a DECLARATION, once, and then transitions come out of the way
   and every state below is measured settled.
   Assert the declaration BEFORE the override, or the override is what gets read. */
{
  const bt = w.getComputedStyle(d.querySelector('#mapchips .chip')).transitionProperty;
  is(bt.includes('background'), true, 'a chip fades its fill rather than snapping it');
  is(bt.includes('border-color'), true, 'and its outline, which the selected state takes away');
  is(bt.includes('padding-left'), true, 'and its leading padding, which the checkmark changes');
  /* The checkmark is what makes a filter chip, so it has to arrive rather than appear. M3 animates
     a container from 0 to 18px with its glyph scaling in behind it. */
  const ct = w.getComputedStyle(d.querySelector('#mapchips .chipcheck')).transitionProperty;
  is(ct.includes('width'), true, 'the checkmark grows in rather than appearing');
  is(ct.includes('transform'), true, 'with its glyph scaling behind it, which is M3 own pair');
}
const noAnim = d.createElement('style');
noAnim.textContent = '*{transition:none !important}';
d.head.appendChild(noAnim);

// --- the panel and its two openers are gone ----------------------------------------------------
/* All three went on 2026-08-25. A control that opens nothing is worse than no control, and two ways
   to one setting is two things to keep in step. This is the assertion that catches a half-finished
   revert: markup left behind draws a dead button on the map and nothing errors. */
is(el('paintmenu'), null, 'the layer panel is gone');
is(el('paint'), null, 'and the button that opened it');
is(el('navLayers'), null, 'and its twin in the navigation bar');
is(d.querySelectorAll('#navbar .navitem').length, 4, 'so the bar carries four items, not five');

// --- the row itself ----------------------------------------------------------------------------
const row = el('mapchips');
if (!row) { out.textContent = 'FAIL  the chip row did not render at all'; throw new Error('no row'); }
const rb = box('mapchips'), map = d.getElementById('map').getBoundingClientRect();
/* On the map, under the ticker, on the legend's own leading line. `--map-l` and `--map-r` already
   carry the rail and the supporting pane, which is the rule every floating box here obeys: a box
   that misses that term sits on the page beside the card rather than on it. */
is(rb.left >= map.left && rb.right <= map.right, true, 'the row sits inside the map card');
is(rb.top >= map.top, true, 'and under its top edge, which is under the ticker');
is(Math.round(rb.left - map.left), 12, 'on the legend own 12px leading line');
is(cs('mapchips').flexWrap, 'wrap', 'the row wraps rather than scrolling sideways');
is(cs('mapchips').gap, '8px', 'at M3 8px between chips');
/* The row spans the map so its chips can wrap across it, and a row that took clicks would swallow
   every press along the top of the map. Each chip takes them back. */
is(cs('mapchips').pointerEvents, 'none', 'the row itself takes no clicks');
is(w.getComputedStyle(el('layerChip')).pointerEvents, 'auto', 'and each chip takes them back');

// --- four chips, two kinds ---------------------------------------------------------------------
/* **A chip that opens a menu states its VALUE and carries a trailing arrow. A filter chip states a
   NAME and answers with a leading check.** That is M3's own split, and it is what tells the two
   kinds apart before their position does. */
const MENUS = ['layerChip', 'heatChip', 'kindChip'], FILTERS = ['alertChip', 'favChip'];
for (const id of [...MENUS, ...FILTERS]) {
  const e = el(id);
  is(!!e, true, id + ' is on the map');
  is(e.classList.contains('chip'), true, id + ' is a chip');
  is(Math.round(box(id).height), 32, id + ': M3 states a chip at 32px');
  is(cs(id).fontSize, '14px', id + ': label-large');
  is(Math.round(parseFloat(cs(id).borderTopLeftRadius)), 8, id + ': on shape-corner-small');
  /* Every chip here floats over a basemap, so it carries the panel tone and this app's one
     elevation. `.chip` alone is transparent, which is right inside a panel and invisible on a map. */
  is(cs(id).backgroundColor !== 'rgba(0, 0, 0, 0)', true, id + ': paints a fill, over a basemap');
  is(cs(id).boxShadow !== 'none', true, id + ': and lifts off the map on this app one elevation');
}
for (const id of MENUS) {
  const e = el(id);
  is(e.tagName, 'BUTTON', id + ': a menu chip is a button');
  is(!!e.getAttribute('popovertarget'), true, id + ': which opens a menu through the browser');
  is(!!e.querySelector('.tail'), true, id + ': and carries a trailing arrow, the promise of one');
  is(e.querySelector('.chipcheck'), null, id + ': and no checkmark, because it states a value');
}
for (const id of FILTERS) {
  const e = el(id);
  is(e.tagName, 'LABEL', id + ': a filter chip wraps its own radio');
  is(!!e.querySelector('.chipcheck'), true, id + ': and carries a leading checkmark');
  is(e.querySelector('.tail'), null, id + ': and no arrow, because it opens nothing');
}

// --- a menu chip states its own value -----------------------------------------------------------
/* The label IS the answer, so the map says what it draws with nothing opened. Written from the
   preference by render() and syncHeat(), never read back off the chip. */
is(el('layerChipLabel').textContent.trim(), 'Stations', 'the layer chip states the layer on screen');
{
  const want = [['heatOff', '', 'Heatmap', 'gradient'], ['heat', 'water', 'Water level', 'water_drop'],
                ['rainHeat', 'rain', 'Rainfall', 'rainy']];
  for (const [id, val, label, icon] of want) {
    el(id).closest('label').click();
    await wait(300);
    is(el('heatChipLabel').textContent.trim(), label, id + ' writes its own value on the chip');
    is(JSON.parse(w.localStorage.getItem('prefs')).heatLayer, val, id + ': and into the preference');
    /* And the glyph names the same value. A mask that never painted resolves its token all the
       same, so this reads `mask-image` — the fault css/icons.css already shipped once. */
    is(el('heatChipIcon').classList.contains('i-' + icon), true, id + ': and the glyph names it');
    is(/url|image/.test(getComputedStyle(el('heatChipIcon')).maskImage), true, id + ': and it paints');
  }
  el('heat').closest('label').click();
  await wait(300);
}

// --- the menus ----------------------------------------------------------------------------------
/* The shared placement handler in js/ui.js opens a menu away from the nearest edge and clamps it on
   screen. These chips lead on the map's own leading edge, so the menu opens rightward and downward.
   **A menu placed against a box that measures zero lands in the top-left corner of the window.**
   That is the fault the handler's own comment records, so this reads the placement rather than
   trusting it. */
for (const pair of [['layerChip', 'layerMenu', 2], ['heatChip', 'heatMenu', 3],
                    ['kindChip', 'kindMenu', 5]]) {
  const chip = pair[0], menuId = pair[1], rows = pair[2];
  el(chip).click();
  await wait(300);
  const m = el(menuId);
  is(m.matches(':popover-open'), true, menuId + ' opens from its chip');
  const mb = m.getBoundingClientRect(), cb = box(chip);
  is(mb.width > 0 && mb.height > 0, true, menuId + ': and has a size, so it laid out');
  is(Math.abs(mb.left - cb.left) <= 1, true, menuId + ': aligned to its chip leading edge');
  is(mb.top >= cb.bottom - 1, true, menuId + ': opening downward, away from the nearest edge');
  is(m.querySelectorAll('.mi').length, rows, menuId + ': holding all of its rows');
  /* **The kinds are the one MULTI-select group here, so their rows are checkboxes.** Every other
     menu holds one answer in one string. This one holds a set, and `PREFS.layers` is a map of
     booleans. A radio group there could not draw two kinds at once. */
  const kinds = menuId === 'kindMenu';
  is(m.querySelectorAll(kinds ? 'input[type="checkbox"]' : 'input[type="radio"]').length, rows,
     menuId + (kinds ? ': every row is a checkbox, because kinds are a set'
                     : ': every row is a radio, so the browser keeps the group exclusive'));
  if (kinds) { m.hidePopover(); await wait(200); continue; }
  /* The selected row's check holds its box whether or not it draws. A check that took the row's own
     space only while it was on would shift every label sideways on a press. */
  const on = [...m.querySelectorAll('.mi')].find(r => r.querySelector('input').checked);
  is(!!on, true, menuId + ': one row is selected');
  is(w.getComputedStyle(on.querySelector('.mcheck')).visibility, 'visible',
     menuId + ': and its check draws');
  const off = [...m.querySelectorAll('.mi')].find(r => !r.querySelector('input').checked);
  is(w.getComputedStyle(off.querySelector('.mcheck')).visibility, 'hidden',
     menuId + ': while an unselected row hides its own');
  is(Math.round(off.querySelector('.mcheck').getBoundingClientRect().width), 18,
     menuId + ': keeping its 18px box, so no label shifts on a press');
  m.hidePopover();
  await wait(200);
}

// --- the three station chips leave with the station layer ---------------------------------------
/* The heatmap and the two filters answer about the station layer. Weather takes the map and there
   is nothing left for any of them to act on. A `:has()` rule does it, so no script can get it wrong
   and nothing has to be written on the poll. */
{
  el('wxLayer').closest('label').click();
  await wait(600);
  is(el('layerChipLabel').textContent.trim(), 'Weather', 'picking Weather writes the layer chip');
  for (const id of ['heatChip', 'kindChip', 'alertChip', 'favChip'])
    is(cs(id).display, 'none', id + ' leaves the map with the station layer');
  is(cs('layerChip').display !== 'none', true, 'and the layer chip stays, or there is no way back');
  el('stations').closest('label').click();
  await wait(600);
  for (const id of ['heatChip', 'kindChip', 'alertChip', 'favChip'])
    is(cs(id).display !== 'none', true, id + ' comes back with it');
}

/* **The sensor kinds are MULTI-select, and the chip states how much of the set is off.** That count
   was the drawer section's own `<summary>` before 2026-08-25. `Sensors` alone means every kind
   draws, which needs no number.
   **`.on` sits beside `:has(input:checked)` on these rows too.** Chromium does not restyle a
   `:has()` subject when a script changes the checkedness, and these boxes come from `PREFS.layers`.
   Without the class a kind switched off still drew its row lit. */
{
  const rows = [...el('kindMenu').querySelectorAll('.kindrow')];
  is(rows.length, 5, 'five sensor kinds');
  is(rows.every(r => r.querySelector('.glyph') && r.querySelector('b')), true,
     'each carrying its own glyph and its own count');
  is(el('kindChipLabel').textContent.trim(), 'Sensors', 'with every kind on, the chip states no count');
  rows[0].click();
  await wait(500);
  is(rows[0].querySelector('input').checked, false, 'a press turns one kind off');
  is(rows[0].classList.contains('on'), false, 'and the row stops reading as selected');
  is(el('kindChipLabel').textContent.trim(), 'Sensors · 1 off', 'and the chip states the count');
  rows[0].click();
  await wait(500);
  is(el('kindChipLabel').textContent.trim(), 'Sensors', 'a second press puts it back');
  is(rows[0].classList.contains('on'), true, 'and the row with it');
}
/* Two radios and no empty value, so both-on is unrepresentable in the markup. A pair of checkboxes
   holds it, and this repo has already paid for that shape once — see syncHeat(). */
{
  const g = [...d.querySelectorAll('input[name="pinfilter"]')];
  is(g.length, 2, 'the filter is two chips');
  is(g.every(i => i.type === 'radio'), true, 'both radios, so two can never be on at once');
  is(g.map(i => i.value).sort().join('|'), 'alert|fav', 'each carrying its own preference value');
  /* **A checkbox in a filter group is what this refuses, not a checkbox on the row.** The sensor
     kinds ARE a set and their menu holds five. Every OTHER group here holds one answer in one
     string, and a pair of checkboxes can hold both-on — the shape this repo already paid for once,
     see syncHeat(). So the test names the three single-answer groups. */
  for (const name of ['maplayer', 'heatlayer', 'pinfilter'])
    is(d.querySelector(`#mapchips input[name="${name}"][type="checkbox"]`), null,
       name + ': no checkbox, so both-on is unrepresentable in the markup');
  is(d.querySelectorAll('#kindMenu input[type="checkbox"]').length, 5,
     'while the sensor kinds are five checkboxes, because a kind set is not one answer');
}
/* Every group is one string, never a pair of booleans. */
{
  const prefs = JSON.parse(w.localStorage.getItem('prefs') || '{}');
  is(typeof prefs.mapLayer, 'string', 'mapLayer is one string');
  is(['stations', 'weather'].includes(prefs.mapLayer), true, 'holding one of the two layers');
  is('wx' in prefs, false, 'the old wx boolean is migrated away');
  is('stations' in prefs, false, 'and the old stations boolean with it');
}

// --- the row does not land on anything else -----------------------------------------------------
/* **Nothing else in this app could see this fault.** A box that is correct against the pane, correct
   against the window and correct against the card is still wrong if it lands on its neighbour. */
for (const id of ['legend', 'pills', 'credit', 'locate', 'mapfoot']) {
  const o = el(id); if (!o) continue;
  const b = o.getBoundingClientRect();
  if (!b.width || !b.height || w.getComputedStyle(o).visibility === 'hidden') continue;
  is(rb.left < b.right && b.left < rb.right && rb.top < b.bottom && b.top < rb.bottom, false,
     'the chip row does not overlap #' + id);
}
{
  const z = d.querySelector('.leaflet-control-zoom').getBoundingClientRect();
  is(rb.left < z.right && z.left < rb.right && rb.top < z.bottom && z.top < rb.bottom, false,
     'nor the zoom control');
}
/* **The toast and the docked search both dock where this row now is, so both start under it.**
   `--top-chips` is one constant, because the row is exactly one chip tall at every width those two
   draw at. Asserted as a relation, never as a number: a token that drifts from the row height is
   invisible until the two boxes touch. */
{
  const t = el('toast');
  is(Math.round(parseFloat(w.getComputedStyle(t).top)) >= Math.round(rb.bottom - map.top), true,
     'the toast starts under the chip row');
  const fb = el('railFind');
  if (fb) {
    fb.click();
    await wait(700);
    const fp = el('findpane').getBoundingClientRect();
    is(fp.top >= rb.bottom - 1, true, 'and so does the docked search card');
    is(rb.left < fp.right && fp.left < rb.right && rb.top < fp.bottom && fp.top < rb.bottom, false,
       'so the two never overlap');
    el('findBack').click();
    await wait(500);
  }
}

// --- the drawer keeps the kinds and nothing else --------------------------------------------------
/* **The drawer holds the districts and the ignored list, and nothing about the map's paint.** The
   sensor kinds were the last section to leave, on 2026-08-25. */
is(el('layersect'), null, 'the drawer has no layers section');
is(el('kinds'), null, 'nor a sensor-kinds section');
is(el('layers').closest('#kindMenu')?.id, 'kindMenu', 'the kinds live in the map chip menu instead');
is(!!el('districts'), true, 'and the drawer keeps the district picker');

// --- a filter chip clears itself on a second press -----------------------------------------------
/* **There is no `All` chip, and that is M3's own filter-chip behaviour.** Pressing a selected chip
   clears it, so "every pin" is the state with neither on. A radio fires no `change` when it is
   already checked, so js/ui.js catches the `click` — and that is exactly what this drives. Without
   it a reader can filter the map and never get back.
   **`preventDefault()` is what broke this once.** A cancelled click restores the checkedness the
   radio had BEFORE the click, which on a second press is checked. So the chip went straight back on
   and undid the line above it. Nothing needs cancelling, and this asserts the state after both
   presses rather than the handler's own shape.
   **The live payload usually has nothing starred, so this stars a station first.** `syncPins()`
   disables a filter with no members AND clears the preference when one empties, so enabling the box
   by hand is not enough: the press turns the filter on and the render behind it turns it straight
   back off. That is correct behaviour, and a scenario test reads it as a failure.
   **The chip is also asserted in RENDERED pixels from a fresh load, never after a scripted click.**
   Chromium does not restyle a `:has(input:checked)` subject when a script changes that checkedness.
   `matches()` answers true and `getComputedStyle` still hands back the unchecked value, measured on
   this build. A page that LANDS with the filter on has the state at first paint, so the checkmark
   and the M3 leading padding can be read there and nowhere else. */
{
  /* One real station id out of the payload. It has to be an id this app actually holds: syncPins()
     counts `state.data.filter(isFav)`, so a made-up one leaves the filter with nothing to match. */
  const payload = await (await fetch('/api.php')).json();
  const seed = extra => {
    const p0 = JSON.parse(w.localStorage.getItem('prefs') || '{}');
    Object.assign(p0, { favs: [payload.stations[0].id] }, extra);
    w.localStorage.setItem('prefs', JSON.stringify(p0));
  };
  /* Wait for the app to have DRAWN, not for a clock. `render()` is what writes every box and every
     chip label in this panel, and it cannot run before the first payload lands. */
  /* **Switch transitions off again after every reload.** The `noAnim` style at the top of this file
     belongs to the document that reloaded away. Without it the chip's padding and its checkmark are
     measured MID-TRANSITION, and the start values are exactly the unchecked ones: 16px and a width
     of 0. That read as a styling fault, one run in four, on markup that is right. */
  const reload = async () => {
    f.contentWindow.location.reload();
    await new Promise(r => f.addEventListener('load', r, { once: true }));
    await until(() => f.contentDocument.querySelectorAll('#map .pin').length > 0);
    const s2 = f.contentDocument.createElement('style');
    s2.textContent = '*{transition:none !important;animation:none !important}';
    f.contentDocument.head.appendChild(s2);
    await wait(400);
  };
  /* Landing with the filter ON. This is the only place the selected chip can be measured. */
  seed({ pinFilter: 'fav' });
  await reload();
  let df = f.contentDocument, wf = f.contentWindow;
  let ef = id => df.getElementById(id), cf = id => wf.getComputedStyle(ef(id));
  /* **Read every value in ONE pass, then assert.** A poll lands between two `getComputedStyle` calls
     and `render()` rewrites these boxes, so three separate reads can describe three different
     moments. That is what made this block flake. */
  {
    const lab = ef('favChip'), st = cf('favChip');
    const snap = {
      checked: ef('favOnly').checked,
      cls: lab.className,
      pref: JSON.parse(wf.localStorage.getItem('prefs')).pinFilter,
      chk: Math.round(lab.querySelector('.chipcheck').getBoundingClientRect().width),
      pad: st.paddingLeft,
      edge: st.borderTopColor,
    };
    is(snap.checked + '|' + snap.cls + '|' + snap.pref, 'true|chip on|fav',
       'landing with the filter on draws the chip selected');
    is(snap.chk, 18, 'M3: its checkmark draws at 18px');
    is(snap.pad, '8px', 'M3: and the chip pads 8px on the edge that check sits on');
    is(snap.edge, 'rgba(0, 0, 0, 0)',
       'M3: a selected filter chip drops its outline, which separates it from an assist chip');
  }
  /* And landing with it off, which is the other half of the same measurement. */
  seed({ pinFilter: '' });
  await reload();
  df = f.contentDocument; wf = f.contentWindow;
  ef = id => df.getElementById(id); cf = id => wf.getComputedStyle(ef(id));
  is(ef('favOnly').checked, false, 'landing with it off draws the chip unselected');
  is(Math.round(ef('favChip').querySelector('.chipcheck').getBoundingClientRect().width), 0,
     'M3: with no checkmark taking any width');
  is(cf('favChip').paddingLeft, '16px', 'M3: and the chip back to 16px with no leading icon');
  is(cf('favChip').borderTopWidth, '1px', 'M3: keeping its 1px outline');
  /* Now the behaviour. Two presses, and the state after each. */
  is(ef('favOnly').disabled, false, 'with a station starred, the favorites chip is live');
  ef('favChip').click();
  await wait(400);
  is(ef('favOnly').checked, true, 'a first press turns the filter on');
  is(JSON.parse(wf.localStorage.getItem('prefs')).pinFilter, 'fav', 'and writes the preference');
  ef('favChip').click();
  await wait(400);
  is(ef('favOnly').checked, false, 'a second press clears it, rather than doing nothing');
  is(ef('risingOnly').checked, false, 'leaving neither chip on, which is every pin');
  is(JSON.parse(wf.localStorage.getItem('prefs')).pinFilter, '',
     'and the preference holds the empty string, never a stale filter');
}

// --- phone width ---------------------------------------------------------------------------------
/* Reloaded at this width rather than resized to it. A phone LANDS here, and landing is the path that
   leaves the drawer shut. */
f.style.width = '360px';
f.contentWindow.location.reload();
await new Promise(r => f.addEventListener('load', r, { once: true }));
await until(() => f.contentDocument.querySelectorAll('#map .pin').length > 0);
{
  const s3 = f.contentDocument.createElement('style');
  s3.textContent = '*{transition:none !important;animation:none !important}';
  f.contentDocument.head.appendChild(s3);
}
await wait(600);
const pd = f.contentDocument, pw = f.contentWindow;
const pel = id => pd.getElementById(id);
const pbox = id => pel(id).getBoundingClientRect();
pd.body.classList.add('rising');          // the state that puts #risebadge on screen
await wait(300);
is(pd.body.classList.contains('drawer'), false, 'phone: lands with the drawer shut');

/* **Four chips need about 440px and a compact map is 360, so the row WRAPS.** A row that scrolled
   sideways would hide the chips past its edge with nothing on screen to say they exist. */
const prow = pel('mapchips'), prb = pbox('mapchips');
const pmap = pd.getElementById('map').getBoundingClientRect();
is(prb.left >= pmap.left && prb.right <= pmap.right, true, 'phone: the row stays inside the map');
is(prow.scrollWidth <= prow.clientWidth, true, 'phone: and never scrolls sideways');
is(Math.round(prb.height) > 32, true, 'phone: it wrapped, rather than cutting a chip off the edge');
{
  const tops = [...pd.querySelectorAll('#mapchips .chip')]
    .map(c => Math.round(c.getBoundingClientRect().top));
  is(new Set(tops).size, 2, 'phone: onto exactly two rows');
  for (const c of pd.querySelectorAll('#mapchips .chip')) {
    const b = c.getBoundingClientRect();
    is(b.left >= pmap.left - 1 && b.right <= pmap.right + 1, true,
       'phone: ' + (c.id || '?') + ' stays inside the map');
    is(Math.round(b.height), 32, 'phone: ' + (c.id || '?') + ' is still the 32px M3 chip');
  }
}
/* **`#locate` took the slot the layers button held**, above the zoom box. With one button left on
   the map there is one slot, and nothing else in this app reads that geometry. */
const pr = pbox('locate');
const pz = pd.querySelector('.leaflet-control-zoom').getBoundingClientRect();
is(pr.bottom <= pz.top, true, 'phone: the locate button sits ABOVE the zoom box');
is(Math.round(pz.top - pr.bottom) <= 12, true, 'phone: and up against it, not adrift');
is(Math.round(pr.right), Math.round(pz.right), 'phone: sharing its right edge');
const plg = pbox('legend');
is(pr.left < plg.right && plg.left < pr.right && pr.top < plg.bottom && plg.top < pr.bottom, false,
   'phone: and clear of the legend, which takes the width beside the zoom buttons');
/* The chip row is at the top and the button cluster is at the bottom, so these two can only meet on
   a very short screen. Asserted anyway: that is exactly the screen a reader has. */
for (const id of ['locate', 'legend', 'credit', 'pills']) {
  const o = pel(id); if (!o) continue;
  const b = o.getBoundingClientRect();
  if (!b.width || !b.height) continue;
  is(prb.left < b.right && b.left < prb.right && prb.top < b.bottom && b.top < prb.bottom, false,
     'phone: the chip row does not overlap #' + id);
}
/* The menu opens at this width too, and the placement handler clamps it on screen. */
{
  pel('layerChip').click();
  await wait(400);
  const m = pel('layerMenu'), mb = m.getBoundingClientRect();
  is(m.matches(':popover-open'), true, 'phone: the layer menu opens');
  is(mb.left >= 0 && mb.right <= pw.innerWidth, true, 'phone: clamped inside the window');
  m.hidePopover();
}

lines.push(bad ? 'FAIL: ' + bad : 'PASS');
/* Without this the page stays on "running..." and says nothing about why. A check that can fail
   silently is not a check. */
} catch (e) { bad++; lines.push('THREW: ' + ((e && e.stack) || e)); lines.push('FAIL: ' + bad); }
out.textContent = lines.join('\n');
</script>
