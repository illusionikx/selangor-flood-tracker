<!doctype html>
<meta charset="utf-8">
<title>paint chooser check</title>
<!--
  The paint chooser is a map control holding six boxes in two groups. What it guards is rendered
  pixels, which `php -l`, `node --check` and any query over .cache.json all miss.

  **It took three tries to sit right, and both failures were about the same thing.** First it drew
  the active layer's glyph — the water drop, the rain cloud — on a `--surface` plate, alone in the
  top-left corner among pins carrying those exact shapes. A reader called it indistinguishable from
  a map icon. Then it became an accent-filled FAB with a label, still alone in that corner, and it
  stood out too much. A control on its own in the middle of a map has to shout to read as a control.

  It sits in the zoom control's cluster now and wears the zoom control's look, so it needs to do
  neither. The check asserts the layers glyph, the shared look, and the adjacency in rendered pixels
  at both widths — beside the zoom box on a desktop, above it on a phone.

  Run:
  "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --disable-gpu \
    --ignore-certificate-errors --virtual-time-budget=30000 --window-size=1600,1000 --dump-dom \
    https://flood-exp.test/paint-check.html | perl -0777 -ne 'print $1 if /<pre id="out">(.*?)<\/pre>/s'
-->
<style>html, body { margin: 0 } iframe { width: 1536px; height: 900px; border: 0 }</style>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html"></iframe>
<script type="module">
const out = document.getElementById('out'), lines = [];
let bad = 0;
/* Painted after every assertion, not once at the end. A check that reports only on completion
   reports nothing at all when it hangs, and this one hung. */
const is = (got, want, name) => {
  const ok = got === want; if (!ok) bad++;
  lines.push((ok ? 'ok  ' : 'FAIL') + '  ' + name + '  -> ' + JSON.stringify(got)
    + (ok ? '' : '  want ' + JSON.stringify(want)));
  out.textContent = lines.join('\n');
};
const wait = ms => new Promise(r => setTimeout(r, ms));

try {
const f = document.getElementById('f');
await new Promise(r => f.addEventListener('load', r, { once: true }));
await wait(4000);
const w = f.contentWindow, d = f.contentDocument;
const el = id => d.getElementById(id);

/* **Headless virtual time does not run CSS transitions faithfully**, so nothing here can measure one
   mid-flight. Reading the branch at 120ms returned a value that then stuck at 0 for the rest of the
   run, on markup that works in a real browser. So the animation is asserted as a DECLARATION, once,
   and then transitions come out of the way and every state below is measured settled.
   Assert the declaration BEFORE the override, or the override is what gets read. */
{
  const t = w.getComputedStyle(d.querySelector('.subgrp')).transitionProperty;
  is(t.includes('grid-template-rows'), true, 'the branch animates its collapse');
  is(t.includes('visibility'), true, 'and carries visibility, which holds the tab order');
  /* One press switches the whole map layer, and the glyph is the same at every state. So the press
     answers for itself here, rather than leaving the map to answer somewhere else. */
  is(w.getComputedStyle(el('paint')).transitionProperty.includes('transform'), true,
     'the button answers a press, because what the press changes is somewhere else');
  /* The selected button growing into a pill is the connected group's signature, so the radius is
     on the transition list with M3's own spring. */
  const bt = w.getComputedStyle(d.querySelector('#paintmenu .btngrp label')).transitionProperty;
  is(bt.includes('background-color'), true, 'a button group fades its fill rather than snapping it');
  is(bt.includes('border-radius'), true, 'and animates the shape change, which is the M3 signature');
}
const noAnim = d.createElement('style');
noAnim.textContent = '*{transition:none !important}';
d.head.appendChild(noAnim);

const btn = el('paint'), menu = el('paintmenu');
if (!btn || !menu) {
  out.textContent = 'FAIL  the paint chooser did not render at all';
  throw new Error('no control');
}
/* `getPropertyValue` hands back the substituted value, never the `var(...)` that was written. So
   the expected side has to be the same token resolved off :root, or every rung reports a mismatch
   between two spellings of one correct answer. */
const glyph = () => w.getComputedStyle(btn, '::before').getPropertyValue('--i').trim();
const token = n => w.getComputedStyle(d.documentElement).getPropertyValue('--i-' + n).trim();
const ink = () => w.getComputedStyle(btn).color;

// --- the control -------------------------------------------------------------------------------

is(menu.hasAttribute('popover'), true, 'the panel is a popover, so Escape and light dismiss are free');
is(btn.getAttribute('popovertarget'), 'paintmenu', 'the button is the popover invoker');
is(menu.classList.contains('menu'), true, 'it carries .menu, which is what places it under the button');

// --- it opens, and the shared placement handler catches it -------------------------------------
/* The handler in js/ui.js keys on `.menu` and on a `[popovertarget]` pointing back at the box. Miss
   either and the popover still opens, at the UA's own centred position, over the middle of the map. */
btn.click();
await wait(200);
is(menu.matches(':popover-open'), true, 'the button opens the panel');
const mb = menu.getBoundingClientRect(), bb = btn.getBoundingClientRect();
/* The button sits 36px off the bottom edge, so a menu opened downward is clamped up over the button
   it came from. A button in the bottom half opens UPWARD. It is a position test and never a space
   test — see the handler's own comment for the fault that distinction avoids. */
is(bb.top > w.innerHeight / 2, true, 'the button is in the bottom half of the viewport');
is(mb.bottom <= bb.top && bb.top - mb.bottom < 16, true, 'so the panel opens upward from it');
is(mb.bottom < bb.top, true, 'and never over the button it came from');
is(mb.left >= 8, true, 'and clamped onto the screen rather than off its left edge');
/* Away from the nearest edge. This button sits in the bottom-RIGHT cluster now, so the menu aligns
   the right edges. It spent one revision on the left, where the same rule aligned the left edges —
   the handler decides from the button's own position, so neither placement is written down twice. */
is(bb.left > w.innerWidth / 2, true, 'the button is in the right half of the viewport');
is(Math.abs(mb.right - bb.right) < 2, true, 'so its menu aligns the right edges');
is(mb.width > 0 && mb.height > 0, true, 'it has a size, so the three segmented tracks laid out');
// A press inside must not dismiss it: three mutually-exclusive choices means trying another one.
el('favOnly').closest('label').click();
await wait(120);
is(menu.matches(':popover-open'), true, 'picking a layer leaves the panel open to pick another');
el('pinAll').checked = true;
menu.hidePopover();
await wait(120);
is(menu.matches(':popover-open'), false, 'and it closes again');

// --- hover opens it on a pointer device, and only a mouse does -------------------------------
/* `popovertarget` keeps the press path for touch and the keyboard. Hover only adds a way in. A tap
   fires `pointerenter` too, so the handler tests `pointerType` as well as the media query — without
   that test a phone reporting `hover: hover` opens the panel under the finger before the press. */
const ptr = (type, node, kind) =>
  node.dispatchEvent(new w.PointerEvent(type, { pointerType: kind }));
if (menu.matches(':popover-open')) menu.hidePopover();
await wait(200);
for (const kind of ['touch', 'pen']) {
  ptr('pointerenter', btn, kind);
  await wait(250);
  is(menu.matches(':popover-open'), false, `a ${kind} pointer does not open it`);
}
ptr('pointerenter', btn, 'mouse');
await wait(250);
is(menu.matches(':popover-open'), true, 'a mouse pointer does');
/* The pointer crosses a 4px gap on the way to a segment. Leaving the button must not shut the panel
   the reader is reaching for. */
ptr('pointerleave', btn, 'mouse');
ptr('pointerenter', menu, 'mouse');
await wait(400);
is(menu.matches(':popover-open'), true, 'and it survives the gap between button and panel');
ptr('pointerleave', menu, 'mouse');
await wait(500);
is(menu.matches(':popover-open'), false, 'leaving both closes it');
btn.click();
await wait(200);
is(menu.matches(':popover-open'), true, 'and the press path still works');

// --- and with the panel already open under the pointer, the press switches the layer -----------
/* Hover is what makes the press free on a pointer device. A tap and a keyboard press keep the
   native toggle, because neither one has a way to open the panel without it. */
const layer = () => (el('wxLayer').checked ? 'weather' : 'stations');
ptr('pointerenter', btn, 'mouse');
await wait(250);
const was = layer();
btn.click();
await wait(2500);   // picking weather awaits a deferred module
is(layer() !== was, true, 'a press with the pointer on the button switches the layer');
is(menu.matches(':popover-open'), true, 'and never shuts the panel it switched in');
btn.click();
await wait(2500);
is(layer(), was, 'so the next press switches back');
ptr('pointerleave', btn, 'mouse');
await wait(500);

// --- the panel never scrolls with nothing to scroll --------------------------------------------
/* `.menu` is `overflow-y: auto`, so anything that leaks into its scroll height draws a scrollbar
   down a box that fits. The collapsed branch did exactly that: 157px tall, 352px claimed. */
const fits = () => menu.scrollHeight <= menu.clientHeight + 1;
const gutter = () => menu.offsetWidth - menu.clientWidth;

// --- the three choices moved, and none of them is in two places --------------------------------

const BOXES = ['heatOff', 'heat', 'rainHeat', 'stations', 'wxLayer',
               'pinAll', 'favOnly', 'risingOnly'];
is(d.querySelectorAll(BOXES.map(i => '#' + i).join(', ')).length, BOXES.length,
   'every segment exists exactly once');
for (const id of BOXES)
  is(el(id).closest('#paintmenu') !== null, true, id + ' is in the map panel');
is(el('bar').contains(el('heat')), false, 'and no copy is left in the drawer');
is(!!el('layersect'), false, '#layersect is gone');
is(!!el('layerN'), false, '#layerN is gone with the summary it fed');

// --- the drawer keeps the kinds and nothing else -----------------------------------------------

is(el('bar').contains(el('risingOnly')), false, 'on alert left the drawer');
is(el('bar').contains(el('favOnly')), false, 'favorites left the drawer');
is(d.querySelector('#kinds input[data-kind]') !== null, true, 'the sensor kinds stayed');
is(d.querySelector('#kinds hr'), null, 'and the rule that split them went with them');

// --- placement, in rendered pixels -------------------------------------------------------------

const r = btn.getBoundingClientRect();
const zoom = d.querySelector('.leaflet-control-zoom').getBoundingClientRect();
const zbtn = d.querySelector('.leaflet-control-zoom a').getBoundingClientRect();
/* Beside the zoom box, on its baseline, at the same size. The offsets in chrome.css are derived
   from Leaflet's own margins, so a change to either drifts the two apart on screen and nowhere
   else. These assert the result rather than the arithmetic. */
is(Math.round(r.bottom), Math.round(zoom.bottom), 'desktop: shares the zoom control baseline');
is(r.right < zoom.left, true, 'desktop: sits to the LEFT of the zoom box');
is(Math.round(zoom.left - r.right) <= 12, true, 'desktop: and up against it, not adrift');
/* **As high as the zoom box, and asserted against that box rather than against a number.** It sat
   at M3's 56 first, 4px shorter than the 60 beside it, and a mismatch of one shade or one pixel
   reads as a mistake at that distance. It is still larger than a zoom BUTTON, which is the point:
   it opens the map's own settings and is the one control in the cluster that is not a zoom. It
   stands out by size, never by colour — a reader cut the accent fill that tried the other way. */
is(Math.round(r.height), Math.round(zoom.height), 'desktop: as high as the zoom box beside it');
is(Math.round(r.width), Math.round(r.height), 'desktop: and square');
is(r.width > zbtn.width, true, 'desktop: larger than a zoom button, which is the point');
/* M3's FAB is a 16px radius on a 56px box carrying a 24px glyph, which is 2/7 and 3/7 of it. One
   `--fab` and two `calc()`s hold those ratios at any size, so a breakpoint moves one number. */
const px = (node, prop) => parseFloat(w.getComputedStyle(node)[prop]);
is(Math.abs(px(btn, 'borderTopLeftRadius') / r.height - 2 / 7) < 0.01, true,
   'desktop: the radius holds the M3 FAB ratio, 2/7 of the box');
is(Math.abs(px(btn.querySelector('.i'), 'fontSize') / r.height - 3 / 7) < 0.01, true,
   'desktop: and the glyph holds its 3/7');
// Nothing else floats here. An overlap is a control a reader cannot press.
for (const id of ['legend', 'pills', 'toast', 'credit', 'bar', 'ticker']) {
  const o = el(id); if (!o) continue;
  const b = o.getBoundingClientRect();
  if (!b.width || !b.height || w.getComputedStyle(o).visibility === 'hidden') continue;
  is(r.left < b.right && b.left < r.right && r.top < b.bottom && b.top < r.bottom, false,
     `does not overlap #${id}`);
}
is(r.left < zoom.left && r.top < zoom.bottom && r.bottom > zoom.top
   && r.right > zoom.left, false, 'and it does not overlap the zoom control itself');

// --- the button is a control, not a pin ------------------------------------------------------
/* The fault this replaced: the glyph followed the active layer, so it drew `water_drop` or `rainy`
   - the river and rainfall PIN glyphs - beside real pins carrying the same shape. And the plate was
   `--surface`, which on the dark theme is the tone of the basemap under it. */
const ico = btn.querySelector('.i');
is(!!ico, true, 'the button carries a glyph element');
is(ico.classList.contains('i-layers'), true, 'and it is the layers glyph');
is(/water_drop|rainy|sunny/.test(ico.className), false, 'never a station-pin glyph');
is(w.getComputedStyle(ico).maskImage !== 'none', true, 'the glyph is masked, so it paints');

const me = w.getComputedStyle(btn);
const zc = w.getComputedStyle(d.querySelector('.leaflet-control-zoom'));
const za = w.getComputedStyle(d.querySelector('.leaflet-control-zoom a'));
is(btn.textContent.trim(), '', 'it carries no text — the glyph and the panel do the talking');
is(me.backgroundColor !== 'rgba(0, 0, 0, 0)' && me.backgroundColor !== 'transparent', true,
   'the plate is opaque');
/* It stands against the zoom box, so a mismatch of one shade or one pixel reads as a mistake. Two
   rules in two files paint them, because Leaflet's sheet needs beating and this does not. */
is(me.backgroundColor, za.backgroundColor, 'it wears the zoom control fill');
is(me.color, za.color, 'and its ink');
is(me.boxShadow, zc.boxShadow, 'and its elevation');
/* NOT its radius. This one is a FAB, so it takes M3's 16px against the control strip's 8px. That
   difference is deliberate and the assertion above pins the number. */
is(me.borderTopLeftRadius !== zc.borderTopLeftRadius, true, 'but its own FAB radius');

/* The glyph holds whatever paints. That is the whole point of the change. */
const seen = new Set();
for (const [h, r, x] of [[1, 0, 0], [0, 1, 0], [0, 0, 1], [0, 0, 0]]) {
  el(h ? 'heat' : r ? 'rainHeat' : 'heatOff').checked = true;
  el(x ? 'wxLayer' : 'stations').checked = true;
  await wait(50);
  seen.add(w.getComputedStyle(ico).maskImage);
}
is(seen.size, 1, 'the glyph holds at all four states, so it can never name a layer');

// --- two layers at the top, and everything else is a choice about one of them --------------------
/* There are no headings over the top level. Stations and Weather are the two things this map can
   draw, and every other control in the panel answers a question ABOUT the station layer, so it
   lives inside it. */
const sub = menu.querySelector('.subgrp');
is(!!sub, true, 'Stations carries a branch');
for (const id of ['heatOff', 'heat', 'rainHeat', 'pinAll', 'favOnly', 'risingOnly'])
  is(el(id).closest('.subgrp') === sub, true, id + ' is inside that branch');
is(el('stations').closest('.subgrp'), null, 'Stations itself is not — it is the parent');
is(el('wxLayer').closest('.subgrp'), null, 'and Weather is a layer of its own, not a child');
/* The two layers share ONE track, so the branch cannot sit between them any more. It follows the
   track instead, and the track has to come first or the indent points at nothing above it. */
const rows = [...menu.querySelectorAll('.btngrp, .subgrp')];
is(el('wxLayer').closest('.btngrp'), el('stations').closest('.btngrp'),
   'both layers are buttons of one group');
is(rows.indexOf(el('stations').closest('.btngrp')), 0, 'that group is drawn first');
is(rows.indexOf(sub) > 0, true, 'and the branch under it');

// --- every segment names itself, and the layer track names what it measures --------------------
/* The label names the control. A segment has no right edge of its own to spare, so the note moved
   under the layer track and names whichever layer is on. The `:has()` pair in chrome.css does the
   swap, so there is no JS to keep in step with the preference.
   Every control here carried a sentence under its label for four revisions. A reader cut all of
   them, and the segmented track has room for fewer words still. */
is(menu.querySelector('small'), null, 'nothing carries a line of flavour text any more');
for (const id of BOXES)
  is(el(id).closest('label').textContent.trim().length > 0, true, id + ' still names itself');

/* Measured with the panel OPEN: a closed popover is `display: none`, so every rect inside it reads
   zero and a visibility test reads a working line as hidden. */
if (!menu.matches(':popover-open')) menu.showPopover();
await wait(150);
/* **Nothing names what a layer measures any more.** `Hydrological Measurement` and `Nowcasting` sat
   under the group and a reader cut both on 2026-08-21: the two buttons above already name the
   layers, and naming what each one measures is a second look at one fact. */
is(menu.querySelector('.note'), null, 'no layer names the discipline it measures');
/* **`#wxHint` is not that, and it stays.** Every caller that writes it reports a failure, so the
   line it sits in must draw nothing at all on a healthy poll. An empty `.hint` leaves the line, and
   `:has()` then takes the whole paragraph, or the panel keeps a blank strip under its layer group
   for ever. */
const hintLine = el('wxHint').closest('.mnote');
el('wxHint').textContent = '';
await wait(50);
is(w.getComputedStyle(el('wxHint')).display, 'none', 'an empty hint takes no room, not even its gap');
is(w.getComputedStyle(hintLine).display, 'none', 'and the line it sits in goes with it');
el('wxHint').textContent = 'could not load';
await wait(50);
is(w.getComputedStyle(hintLine).display !== 'none', true, 'a failure brings that line back');
is(hintLine.getBoundingClientRect().height > 0, true, 'with a box to read it in');
el('wxHint').textContent = '';
await wait(50);

/* The count a pin filter holds rides INSIDE its own button. A button has no right edge to spare. */
is(el('favHint').closest('label').contains(el('favOnly')), true,
   'the favorites count rides in the favorites button');

// --- an M3 connected button group, transcribed rather than approximated ------------------------
/* M3 Expressive retired the segmented button and replaced it with the connected button group. Real
   radios under it, clipped rather than hidden, so the browser keeps the group exclusive, walks it
   with the arrow keys and reads each label out. None of that comes free with a row of buttons. */
/* Every number below is the component set's own, from `ButtonGroup/button-group.css` and
   `Button/button.css`: size xs, shape round, variant filled with `data-selected`. Read them back
   off the live element rather than trusting the rule applied — that is the `.leaflet-touch` lesson.
   **`.seg` must never be what answers here.** That class is this app's own sunken track, written
   for the theme picker and the lightbox ranges, and it matches no M3 component. */
is(menu.querySelector('.seg'), null, 'no .seg is left in this panel, because it is not an M3 component');
/* **M3's 24px inline body padding, taken at both widths.** This app declined it while every row was
   a `.chip` bringing 14px of its own. The rows are button groups now, which pad 2px and paint their
   fill to that edge, so the two no longer stack. A reader called the old 6px too close to the
   border on 2026-08-21. */
is(w.getComputedStyle(menu).paddingLeft, '24px', 'M3: the panel pads 24px inline');
is(w.getComputedStyle(menu).paddingRight, '24px', 'M3: on both edges');
/* 2px between connected buttons at every size. The 2px of GROUP padding is xs and sm alone, so the
   map layer group at size lg takes none. */
for (const grp of menu.querySelectorAll('.btngrp')) {
  const cs = w.getComputedStyle(grp);
  const lg = grp.parentElement === menu;
  is(cs.gap, '2px', 'M3: 2px between connected buttons, at every size');
  is(cs.paddingLeft, lg ? '0px' : '2px',
     lg ? 'M3: and no group padding at lg' : 'M3: and 2px of group padding at xs');
}

/* **Two shapes in one panel, and each is asserted as its own.** The Stations and Weather pair takes
   the stacked form a reader asked for on 2026-08-25: 56px, glyph over label. The Heatmap and Icon
   groups keep M3's transcribed xs row at 32px. The scope is a `>` in `css/chrome.css`, so a bare
   descendant selector takes all three, which is what shipped for one run. Read the two apart, or
   nothing here can see that. The outer radius follows the height either way, because the component
   states the end of a group as `height / 2` and nothing restates the number. */
const LAYERS = ['stations', 'wxLayer'];
const big = id => LAYERS.includes(id);
for (const id of BOXES) {
  const b = el(id).closest('label'), cs = w.getComputedStyle(b);
  is(!!b.closest('.btngrp'), true, id + ' sits in a connected button group');
  is(Math.round(b.getBoundingClientRect().height), big(id) ? 56 : 32,
     id + (big(id) ? ': M3 size md is 56px tall' : ': M3 size xs is 32px tall'));
  is(cs.fontSize, big(id) ? '16px' : '14px',
     id + (big(id) ? ': title-medium, which is size md' : ': label-large, which is size xs'));
  is(cs.paddingLeft, big(id) ? '24px' : '12px',
     id + (big(id) ? ': and M3 pads a md button 24px inline' : ': M3 xs pads 12px inline'));
  is(cs.flexDirection, big(id) ? 'column' : 'row',
     id + (big(id) ? ': glyph over label' : ': label on one row, the transcribed shape'));
  is(Math.round(parseFloat(cs.minWidth)), big(id) ? 0 : 48,
     id + (big(id) ? ': and takes no 48px floor, which M3 states for xs and sm alone'
                   : ': M3 floors a connected xs button at 48px'));
  is(Math.round(parseFloat(cs.minWidth)) >= 0, true, id + ': sizes to its own label');
  /* The button is the hit area, not the radio inside it. A filter with nothing to match is
     `disabled`, and M3 takes the pointer off it rather than changing the cursor. */
  is(cs.pointerEvents, el(id).disabled ? 'none' : 'auto',
     id + ': the button is the hit area, and a dead one takes no pointer at all');
}
/* **M3 grows the TARGET where a 32px button is under the 48px pointer minimum.** The stacked button
   is 56px and clears it on its own, so the rule must give back nothing. `min(0px, ...)` is what
   holds both cases: the bare expression is +4 here, which is 4px of dead edge top and bottom on a
   button that was already big enough. */
{
  const a = w.getComputedStyle(el('stations').closest('label'), '::after');
  is(a.content !== 'none', true, 'M3: the button carries a pointer target of its own');
  is(Math.round(parseFloat(a.top)), 0, 'M3: and a 56px button keeps its whole height, never less');
  const x = w.getComputedStyle(el('heat').closest('label'), '::after');
  is(Math.round(parseFloat(x.top)), -8, 'M3: while a 32px one is still grown to 48, and no further');
}
/* **The two ends of a group are a pill and every corner a neighbour touches is 4px.** The selected
   button then goes fully round, which is the whole signature of this component. */
{
  const R = 16;                    // the Heatmap group is the transcribed 32px row
  const first = el('heatOff').closest('label'), mid = el('heat').closest('label'),
        last = el('rainHeat').closest('label');
  const rad = (e, prop) => Math.round(parseFloat(w.getComputedStyle(e)[prop]));
  el('rainHeat').checked = true;              // so the two probed below are both unselected
  await wait(50);
  is(rad(first, 'borderTopLeftRadius'), R, 'M3: the leading end of the group is a pill');
  is(rad(first, 'borderTopRightRadius'), 4, 'M3: and its inner corner is corner-extra-small');
  is(rad(mid, 'borderTopLeftRadius') + '|' + rad(mid, 'borderTopRightRadius'), '4|4',
     'M3: a middle button is the inner radius on every corner');
  is(rad(last, 'borderTopLeftRadius'), R, 'M3: and the selected button goes fully round');
  is(rad(last, 'borderTopRightRadius'), R, 'M3: on both of its own corners');
}
/* **Every title in this panel is an M3 token, and the two group headings were this app's own.** They
   drew at 11px, 500, uppercase and tracked, which is the drawer's section-heading language. A reader
   asked for M3 on all of them on 2026-08-25. M3 states a list subheader as `title-small`, 14px on 20
   at 500, in `on-surface-variant`.
   **The uppercase transform is the half that fails silently.** A heading at the right size and still
   transformed reads as a deliberate style rather than as a rule that was missed. Compare the colour
   against the RESOLVED bridge in `css/base.css`, never against a literal: this app holds one surface
   tone and bridges M3's roles onto it. */
{
  const heads = [...menu.querySelectorAll('.mgroup')];
  is(heads.length, 2, 'M3: two group headings, Heatmap and Icon');
  const probe = d.createElement('span');
  probe.style.color = 'var(--md-sys-color-on-surface-variant)';
  menu.appendChild(probe);
  const want = w.getComputedStyle(probe).color;
  for (const h of heads) {
    const cs = w.getComputedStyle(h);
    const nm = h.textContent.trim();
    is(cs.fontSize, '14px', nm + ': M3 title-small, which is the list subheader');
    is(cs.fontWeight, '500', nm + ': at 500');
    is(cs.lineHeight, '20px', nm + ': on a 20px line');
    is(cs.textTransform, 'none', nm + ': in sentence case, never an uppercase transform');
    is(cs.color, want, nm + ': in on-surface-variant, off the bridge');
  }
  probe.remove();
}

   size md the connected group states an 8px inner corner and a 16px outer one, against the round
   shape's `height / 2`. The selected button still goes fully round at 48, which is that group's own
   rule at every size and in both shapes. So the shape shows on the two buttons that are OFF, and a
   square group reverting to round is invisible on whichever one is on. */

{

    menu.appendChild(e); const v = w.getComputedStyle(e).color; e.remove(); return v; };

/* **Every group fills the panel between its own padding.** That is the one divergence from the
   spec's shape, which sizes a group to its buttons. Each group is one row of this panel and a row
   spans it. Asserted against the panel's own content box, never a constant: `.menu` carries a 1px
   border as well as `#paintmenu`'s padding, so the content box is four pixels under the rect. */
{
  const mc = w.getComputedStyle(menu), mb = menu.getBoundingClientRect();
  const inner = mb.width - parseFloat(mc.paddingLeft) - parseFloat(mc.paddingRight)

   is `1 1 0`. A zero basis makes every button start at nothing and take an equal share, and the
   explicit `min-width: 48px` M3 states for a connected xs button REPLACES `min-width: auto`, so the
   content floor that would have saved it is gone. Measured at a 320px window: three buttons of 77px
   each with `Water level` drawing about 100px of `nowrap` text over its neighbour. It did that at
   every width, and it changed no `scrollWidth`, so only this assertion sees it. */
{
  const wid = id => el(id).closest('label').getBoundingClientRect().width;
  is(wid('heat') > wid('heatOff'), true, 'a longer label takes a wider button');
  is(wid('rainHeat') > wid('heatOff'), true, 'and a middling one lands between the two');
  for (const id of BOXES) {

       id + ': its label fits inside its own fill');

   own assertion: it is the one row where a reader meets the two halves side by side. */
{

  const b = el('wxLayer').closest('label').getBoundingClientRect();

is(menu.scrollWidth <= menu.clientWidth, true, 'no group overflows the panel');

   mask from its class, which is the rule `#paint::before` shipped broken once: a pseudo-element
   that sets `--i` and never joins the list in `css/icons.css` draws an empty box. Read `mask-image`
   rather than the token, because a resolved `--i` is not evidence that anything painted. */
const maskOf = cls => { const e = d.createElement('i'); e.className = 'i ' + cls;

  /* A mask resolves to a data URI, so the icon's NAME is nowhere in the computed value. Compare
     against a probe carrying the same class, the way the colour block compares against the bridge.
     A resolved `--i` is not evidence that anything painted, which is the fault `#paint::before`
     shipped with, so this reads `mask-image` on both sides. */
  is(g && w.getComputedStyle(g).maskImage, maskOf(name), id + ': drawing the ' + name + ' mask');

  is(g.compareDocumentPosition(el(id).closest('label').querySelector('span'))

pd.getElementById('paintmenu').showPopover();

  const bd = pw.getComputedStyle(pd.getElementById('paintmenu'), '::backdrop');
  is(bd.transitionProperty.includes('opacity'), true, 'phone: the scrim fades on a transition of its own');
  is(bd.transitionProperty.includes('display'), true, 'phone: which it also has to hold through the exit');
}
/* The exit is the half that shipped broken, so drive it. `hidePopover()` leaves the box on screen
   for the whole travel, and only `allow-discrete` on `display` can do that. */
{
  const pmx = pd.getElementById('paintmenu');
  pmx.hidePopover();
  await wait(60);
  is(pw.getComputedStyle(pmx).display !== 'none', true,
     'phone: the sheet is still on screen mid-exit, rather than gone in one frame');
  await wait(400);
  is(pw.getComputedStyle(pmx).display, 'none', 'phone: and gone once the travel ends');
  pmx.showPopover(); await wait(400);
}

pd.head.insertAdjacentHTML('beforeend',
  '<style>*{transition:none !important;animation:none !important}</style>');
await wait(120);
const pm = pd.getElementById('paintmenu'), pmr = pm.getBoundingClientRect();
/* Anchored to the bottom edge and centred, at M3's own width. Under 640dp there is no window left
   over to inset, so the sheet spans it. That is why only the top corners are rounded. */
is(Math.round(pmr.bottom), pw.innerHeight, 'phone: the sheet sits on the bottom edge');
is(Math.round(pmr.width), Math.min(640, pw.innerWidth), 'phone: M3 min(640, 100%), no side inset');
is(Math.round(pmr.left), Math.round(pw.innerWidth - pmr.right), 'phone: and centred');
is(pmCs.borderTopLeftRadius + ' ' + pmCs.borderBottomLeftRadius, '28px 0px',
   'phone: M3 28dp on the TOP corners only, because the bottom one has no edge to round');
/* The placement handler must not have written an inline anything. Inline beats the sheet's rule,
   so a menu placed on a wide screen and rotated to a narrow one would stay pinned to its button. */
is(pm.style.left + '|' + pm.style.top + '|' + pm.style.bottom, '||',
   'phone: js/ui.js wrote no placement, which would beat the stylesheet');
/* No group may sit wider than the sheet. Three buttons of text inside a 328px sheet, at M3's 24px
   of body padding, is where one extra word or a font change lands first. It reads as a spacing
   mistake rather than as an overflow. The desktop block asserts the same against the floating
   panel. Measured across five widths from 1100 down to 320, with a two-digit count on the favorites
   button: the tightest row is the Icon group at a 320px window, which lands on 240 of 240. */
is(pm.scrollWidth <= pm.clientWidth, true, 'phone: no button group overflows the sheet');
for (const id of ['stations', 'heat', 'rainHeat', 'favOnly', 'risingOnly']) {
  const b = pd.getElementById(id).closest('label').getBoundingClientRect();
  is(b.left >= pmr.left - 1 && b.right <= pmr.right + 1, true,
     'phone: ' + id + ' stays inside the sheet');
}
/* **The stacked form is the MAP LAYER pair's, and the two groups under it keep M3's 32px row.** A
   reader asked for the glyph over the label on 2026-08-25, for Stations and Weather alone. The scope
   is a `>` in `css/chrome.css`. A bare descendant selector takes all three groups and looks
   deliberate on screen, so both shapes are read here. There is no size override at either width:
   the same two rules answer, and the `::after` carries the 48px pointer target for the short one. */
for (const id of ['stations', 'wxLayer']) {
  const lab = pd.getElementById(id).closest('label');
  const gl = lab.querySelector('.i');
  is(Math.round(lab.getBoundingClientRect().height), 56, 'phone: ' + id + ' is the 56px size-md box');
  is(!!gl, true, 'phone: ' + id + ' carries a glyph');
  is(/url\(/.test(pw.getComputedStyle(gl).maskImage || ''), true,
     'phone: ' + id + ' paints that glyph, rather than an empty box at the right size');
  is(Math.round(gl.getBoundingClientRect().bottom) <= Math.round(
       lab.querySelector('span').getBoundingClientRect().top) + 1, true,
     'phone: ' + id + ' puts the glyph over the label, never beside it');
}
/* The two groups under it keep the transcribed row, and carry no glyph at all. */
for (const id of ['heatOff', 'heat', 'rainHeat', 'pinAll', 'favOnly', 'risingOnly']) {
  const lab = pd.getElementById(id).closest('label');
  is(Math.round(lab.getBoundingClientRect().height), 32, 'phone: ' + id + ' is M3 xs at 32px');
  is(lab.querySelector('.i'), null, 'phone: ' + id + ' carries no glyph');
}
/* A 56px button is already past the 48px pointer minimum, so the `::after` must give nothing back.
   A 32px one is still grown. `min(0px, ...)` is what holds both, and the bare expression is +4 on
   the tall one, which is 4px of dead edge top and bottom. */
{
  const t = id => pw.getComputedStyle(pd.getElementById(id).closest('label'), '::after').top;
  is(t('stations'), '0px', 'phone: a 56px button keeps its whole height as the target');
  is(Math.round(parseFloat(t('heat'))), -8, 'phone: and a 32px one is still grown to 48');
}
/* No group may overflow. The tightest row is the Icon group with a two-digit count on Favorites. */
is(pm.scrollWidth <= pm.clientWidth, true, 'phone: no group overflows the sheet');
/* M3's 24px inline body padding, the same number the panel takes above 600px. */
is(pw.getComputedStyle(pm).paddingLeft, '24px', 'phone: M3 pads the sheet body 24px inline');

/* **A tap that dismisses the sheet must not also act on the map under it.** Light dismiss closes the
   popover and lets the same press through, so a pin behind the sheet opened its card. Drive the real
   pointer path against a listener standing where Leaflet's marker listener stands, on a child of
   `#map` in the bubble phase. Two states, because the guard is worth nothing if it eats every press:
   the click is swallowed while the sheet is open and delivered once it is shut. */
{
  const mapEl = pd.getElementById('map');
  const probe = mapEl.querySelector('.leaflet-marker-pane') || mapEl.firstElementChild;
  let hits = 0;
  probe.addEventListener('click', () => hits++);
  const press = () => {
    probe.dispatchEvent(new pw.PointerEvent('pointerdown', { bubbles: true }));
    probe.dispatchEvent(new pw.MouseEvent('click', { bubbles: true, cancelable: true }));
  };
  is(!!probe, true, 'phone: there is a box inside the map to press');
  is(pm.matches(':popover-open'), true, 'phone: the sheet is open, so a press has something to shut');
  press();
  is(hits, 0, 'phone: a press behind the open sheet never reaches the map');
  pm.hidePopover(); await wait(60);
  press();
  is(hits, 1, 'phone: and reaches it again once the sheet is shut');
  pm.showPopover(); await wait(120);
}

/* The handle, and the gesture it promises. A handle drawn over a swipe nobody wired up is a
   promise the panel does not keep, so both halves are asserted together. */
const pg = pd.querySelector('#paintmenu .grab');
is(Math.round(pg.getBoundingClientRect().height), 48, 'phone: M3 48dp drag handle row');
const ind = pw.getComputedStyle(pg, '::before');
is(ind.width + ' ' + ind.height, '32px 4px', 'phone: holding M3 32 x 4 indicator');
is(pw.getComputedStyle(pg).touchAction, 'none',
   'phone: which never scrolls under the finger that grabs it');
/* Drive the real touch path. Past 90px the sheet closes; the guard is that it was open first. */
is(pm.matches(':popover-open'), true, 'phone: the sheet is open, so the drag has something to shut');
const touch = (type, y) => pm.dispatchEvent(new pw.TouchEvent(type, {
  bubbles: true, touches: type === 'touchend' ? [] : [new pw.Touch({ identifier: 1, target: pm, clientY: y, clientX: 180 })],
}));
touch('touchstart', 300); touch('touchmove', 320); touch('touchmove', 460); touch('touchend', 460);
await wait(120);
is(pm.matches(':popover-open'), false, 'phone: a drag down past the threshold dismisses it');
/* And a short drag does NOT: a sheet that closes on any downward twitch is unusable while reading.
   `translate` is cleared on release either way, or the sheet stays parked where the finger left it. */
pm.showPopover(); await wait(120);
touch('touchstart', 300); touch('touchmove', 320); touch('touchmove', 350); touch('touchend', 350);
await wait(120);
is(pm.matches(':popover-open'), true, 'phone: a short drag lets go and comes back');
is(pm.style.translate, '', 'phone: and leaves no inline offset behind');
pm.hidePopover();

lines.push(bad ? `FAIL: ${bad}` : 'PASS');
/* Without this the page stays on "running..." and says nothing about why. A check that can
   fail silently is not a check. */
} catch (e) { bad++; lines.push('THREW: ' + ((e && e.stack) || e)); lines.push('FAIL: ' + bad); }
out.textContent = lines.join('\n');
</script>
