<!doctype html>
<meta charset="utf-8">
<title>paint chooser check</title>
<!--
  The paint chooser is a FAB on the map holding five controls in two groups. What it guards is
  rendered pixels, which `php -l`, `node --check` and any query over .cache.json all miss.

  The button must not read as a map pin. It did: it drew the water drop and the rain cloud, which
  are the glyphs the river and rainfall pins draw, on a `--surface` plate the same tone as the dark
  basemap under it. So it asserts the layers glyph, a real label, and a fill that is neither the
  surface behind it nor any status hue.

  The rest is placement. Nothing else floats in that corner, at either width.

  Run:
  "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --disable-gpu \
    --ignore-certificate-errors --virtual-time-budget=30000 --window-size=1600,1000 --dump-dom \
    https://flood-exp.test/paint-check.html | perl -0777 -ne 'print $1 if /<pre id="out">(.*?)<\/pre>/s'
-->
<style>html, body { margin: 0 } iframe { width: 1536px; height: 900px; border: 0 }</style>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html"></iframe>
<script type="module">
const out = document.getElementById('out'), lines = [];
let bad = 0;
const is = (got, want, name) => {
  const ok = got === want; if (!ok) bad++;
  lines.push((ok ? 'ok  ' : 'FAIL') + '  ' + name + '  -> ' + JSON.stringify(got)
    + (ok ? '' : '  want ' + JSON.stringify(want)));
};
const wait = ms => new Promise(r => setTimeout(r, ms));

const f = document.getElementById('f');
await new Promise(r => f.addEventListener('load', r, { once: true }));
await wait(4000);
const w = f.contentWindow, d = f.contentDocument;
const el = id => d.getElementById(id);

const btn = el('paint'), menu = el('paintmenu');
if (!btn || !menu) {
  out.textContent = 'FAIL  the paint chooser did not render at all';
  throw new Error('no control');
}
/* `getPropertyValue` hands back the substituted value, never the `var(...)` that was written. So
   the expected side has to be the same token resolved off :root, or every rung reports a mismatch
   between two spellings of one correct answer. */
const glyph = () => w.getComputedStyle(btn, '::before').getPropertyValue('--i').trim();
const token = n => w.getComputedStyle(d.documentElement).getPropertyValue('--i-' + n).trim();
const ink = () => w.getComputedStyle(btn).color;

// --- the control -------------------------------------------------------------------------------

is(menu.hasAttribute('popover'), true, 'the panel is a popover, so Escape and light dismiss are free');
is(btn.getAttribute('popovertarget'), 'paintmenu', 'the button is the popover invoker');
is(menu.classList.contains('menu'), true, 'it carries .menu, which is what places it under the button');

// --- it opens, and the shared placement handler catches it -------------------------------------
/* The handler in js/ui.js keys on `.menu` and on a `[popovertarget]` pointing back at the box. Miss
   either and the popover still opens, at the UA's own centred position, over the middle of the map. */
btn.click();
await wait(200);
is(menu.matches(':popover-open'), true, 'the button opens the panel');
const mb = menu.getBoundingClientRect(), bb = btn.getBoundingClientRect();
is(mb.top >= bb.bottom && mb.top - bb.bottom < 16, true, 'the panel is placed just under the button');
is(mb.left >= 8, true, 'and clamped onto the screen rather than off its left edge');
/* A FAB on the left edge opens its menu rightward. Right-aligned, a 236px menu grew leftward from a
   64px button across the drawer, and read as the drawer's menu. */
is(Math.abs(mb.left - bb.left) < 2, true, 'a left-edge button opens its menu to the right');
is(mb.width > 0 && mb.height > 0, true, 'it has a size, so the three chips laid out');
// A press inside must not dismiss it: three mutually-exclusive choices means trying another one.
el('favOnly').closest('label').click();
await wait(120);
is(menu.matches(':popover-open'), true, 'picking a layer leaves the panel open to pick another');
el('favOnly').checked = false;
menu.hidePopover();
await wait(120);
is(menu.matches(':popover-open'), false, 'and it closes again');

// --- the three choices moved, and none of them is in two places --------------------------------

const BOXES = ['heat', 'rainHeat', 'favOnly', 'wxLayer', 'risingOnly'];
is(d.querySelectorAll(BOXES.map(i => '#' + i).join(', ')).length, 5, 'all five boxes exist once');
for (const id of BOXES)
  is(el(id).closest('#paintmenu') !== null, true, id + ' is in the map panel');
is(el('bar').contains(el('heat')), false, 'and no copy is left in the drawer');
is(!!el('layersect'), false, '#layersect is gone');
is(!!el('layerN'), false, '#layerN is gone with the summary it fed');

// --- the drawer keeps the kinds and nothing else -----------------------------------------------

is(el('bar').contains(el('risingOnly')), false, 'on alert left the drawer');
is(el('bar').contains(el('favOnly')), false, 'favorites left the drawer');
is(d.querySelector('#kinds input[data-kind]') !== null, true, 'the sensor kinds stayed');
is(d.querySelector('#kinds hr'), null, 'and the rule that split them went with them');

// --- placement, in rendered pixels -------------------------------------------------------------

const r = btn.getBoundingClientRect();
const hdr = parseFloat(w.getComputedStyle(d.documentElement).getPropertyValue('--hdr'));
is(Math.round(r.top - hdr), 12, 'the top edge clears the app bar by the gutter');
is(r.width >= 44 && r.height >= 44, true, 'the button clears the 44px touch target');
// The desktop drawer opens by default, and the button rides its shift the way #legend does.
const drawerOpen = d.body.classList.contains('drawer');
const shift = drawerOpen ? parseFloat(w.getComputedStyle(d.documentElement).getPropertyValue('--drawer')) : 0;
is(Math.round(r.left - shift), 12, 'the left edge is the map gutter, plus the drawer shift if open');
// Nothing else floats in this corner. An overlap here is a control a reader cannot press.
for (const id of ['legend', 'pills', 'toast', 'credit', 'bar']) {
  const o = el(id); if (!o) continue;
  const b = o.getBoundingClientRect();
  if (!b.width || !b.height || w.getComputedStyle(o).visibility === 'hidden') continue;
  is(r.left < b.right && b.left < r.right && r.top < b.bottom && b.top < r.bottom, false,
     `does not overlap #${id}`);
}

// --- the button is a control, not a pin ------------------------------------------------------
/* The fault this replaced: the glyph followed the active layer, so it drew `water_drop` or `rainy`
   - the river and rainfall PIN glyphs - beside real pins carrying the same shape. And the plate was
   `--surface`, which on the dark theme is the tone of the basemap under it. */
const ico = btn.querySelector('.i');
is(!!ico, true, 'the button carries a glyph element');
is(ico.classList.contains('i-layers'), true, 'and it is the layers glyph');
is(/water_drop|rainy|sunny/.test(ico.className), false, 'never a station-pin glyph');
is(w.getComputedStyle(ico).maskImage !== 'none', true, 'the glyph is masked, so it paints');
const label = btn.querySelector('b');
is(!!label && label.textContent.trim().length > 0, true, 'it carries a text label');
is(label.textContent.trim(), 'Layers', 'and the label names the control');

const fab = w.getComputedStyle(btn);
const surface = w.getComputedStyle(d.getElementById('legend')).backgroundColor;
is(fab.backgroundColor !== 'rgba(0, 0, 0, 0)' && fab.backgroundColor !== 'transparent', true,
   'the plate is opaque');
is(fab.backgroundColor !== surface, true, 'and it is not the surface tone the basemap sits under');
is(parseFloat(fab.borderTopLeftRadius) >= 12, true, 'FAB corner radius');
is(fab.boxShadow !== 'none', true, 'and it is elevated off the map');

/* The glyph holds whatever paints. That is the whole point of the change. */
const seen = new Set();
for (const [h, r, x] of [[1, 0, 0], [0, 1, 0], [0, 0, 1], [0, 0, 0]]) {
  el('heat').checked = !!h; el('rainHeat').checked = !!r; el('wxLayer').checked = !!x;
  await wait(50);
  seen.add(w.getComputedStyle(ico).maskImage);
}
is(seen.size, 1, 'the glyph holds at all four states, so it can never name a layer');

// --- the two groups ----------------------------------------------------------------------------

const groups = [...menu.querySelectorAll('.mgroup')].map(g => g.firstChild.textContent.trim());
is(groups.length, 2, 'the panel is two labelled groups');
is(groups[0], 'Heatmap', 'the wash group comes first');
is(groups[1], 'Icons', 'then the group that changes what draws');
is(el('heat').closest('.mgrp') === el('rainHeat').closest('.mgrp'), true,
   'the two heat layers share a group');
for (const id of ['favOnly', 'wxLayer', 'risingOnly'])
  is(el(id).closest('.mgrp') !== el('heat').closest('.mgrp'), true, id + ' is in the icon group');

/* Weather leaves PREFS.heatLayer alone, so syncHeat() leaves the heat chips checked while it runs.
   Without the dim and the caption the group claims a wash that is not on the map. */
el('heat').checked = true; el('wxLayer').checked = false;
await wait(60);
const hg = menu.querySelector('.heatgrp');
is(w.getComputedStyle(hg).opacity, '1', 'the heatmap group is live with weather off');
is(w.getComputedStyle(hg.querySelector('.mhint')).display, 'none', 'and says nothing');
el('wxLayer').checked = true;
await wait(60);
is(parseFloat(w.getComputedStyle(hg).opacity) < 1, true, 'weather on -> the heatmap group dims');
is(w.getComputedStyle(hg.querySelector('.mhint')).display !== 'none', true, 'and says why');
is(el('heat').checked, true, 'and the chip stays checked, because the preference is what returns');
el('wxLayer').checked = false;
el('heat').checked = true; el('rainHeat').checked = false;
await wait(60);

// --- phone width -------------------------------------------------------------------------------
/* 360px, the width the app bar is measured against. Two claims. The button grows to the touch
   target the zoom buttons already take. And #pills clears it with nothing moved for it: that strip
   is centred on the viewport and #risebadge measures 180px here, so it runs 90 to 270 against a
   button ending at 56. The clearance is 34px and it is measured rather than assumed — an earlier
   revision pushed the whole strip down 48px on an estimate that was 76px too wide. */
/* Reloaded at this width rather than resized to it. A phone LANDS here, and landing is the path
   that leaves the drawer shut — resizing an open one only exercises the breakpoint listener. */
f.style.width = '360px';
f.contentWindow.location.reload();
await new Promise(r => f.addEventListener('load', r, { once: true }));
await wait(4000);
const pd = f.contentDocument, pbtn = pd.getElementById('paint');
pd.body.classList.add('rising');          // the state that puts #risebadge on screen
await wait(300);

is(pd.body.classList.contains('drawer'), false, 'phone: lands with the drawer shut');
const pr = pbtn.getBoundingClientRect();
is(pr.width >= 44 && pr.height >= 44, true, 'phone: the button clears the touch target unchanged');
is(Math.round(pr.left), 12, 'phone: still the map gutter — the drawer is shut at this width');

const pb = pd.getElementById('pills').getBoundingClientRect();
is(pb.width > 0, true, 'phone: the rising pill is on screen, so there is something to clear');
is(pr.left < pb.right && pb.left < pr.right && pr.top < pb.bottom && pb.top < pr.bottom, false,
   'phone: the rising pill clears the button');
// Named rather than left implicit: 34px is the whole margin, and a pill 68px wider takes it.
lines.push(`      (clearance: ${Math.round(pb.left - pr.right)}px, pill ${Math.round(pb.width)}px)`);

lines.push(bad ? `FAIL: ${bad}` : 'PASS');
out.textContent = lines.join('\n');
</script>
